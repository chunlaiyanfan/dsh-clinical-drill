<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="临床速练">
<title>临床速练 · 考研冲刺</title>
<style>
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --surface-2: #eef2f4;
  --fg: #16181a;
  --fg-2: #5c666d;
  --line: #dfe4e7;
  --brand: #0f6e6a;
  --ok: #1a7f45;
  --bad: #b4322c;
  --radius: 14px;
  --pad: 14px;
  --font: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101416;
    --surface: #171d20;
    --surface-2: #212a2e;
    --fg: #e8eef0;
    --fg-2: #9aa7ad;
    --line: #2b3539;
    --brand: #4fd1c5;
    --ok: #5ed48c;
    --bad: #ff8a80;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: var(--font);
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.app { max-width: 780px; margin: 0 auto; padding: 0 0 env(safe-area-inset-bottom); }

.hd {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}

.hd-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 12px var(--pad) 6px;
}

.brand { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
.brand small { font-weight: 400; color: var(--fg-2); font-size: 12px; margin-left: 6px; }
.dday { margin-left: auto; color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 var(--pad) 10px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  border-radius: 999px;
  padding: 7px 14px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.tab.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

@media (prefers-color-scheme: dark) {
  .tab.on { color: #06201e; }
}

.main { padding: var(--pad) var(--pad) 64px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  display: inline-block;
  background: var(--surface-2);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12.5px;
}
.badge {
  display: inline-block;
  border: 1px solid var(--brand);
  color: var(--brand);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 12px;
  font-weight: 600;
}

.hint { color: var(--fg-2); font-size: 13.5px; margin: 0 0 10px; }
.q { font-size: 16.5px; line-height: 1.75; margin: 0 0 12px; white-space: pre-wrap; }
.stem { font-size: 16px; line-height: 1.8; margin: 0 0 12px; }

.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  margin-bottom: 8px;
  font: inherit;
  font-size: 15px;
  line-height: 1.5;
  cursor: pointer;
  min-height: 44px;
}
.opt.correct { border-color: var(--ok); border-width: 2px; background: var(--surface-2); font-weight: 600; }
.opt.wrong { border-color: var(--bad); border-width: 2px; background: var(--surface-2); }
.opt:active { transform: scale(0.995); }

.verdict { font-weight: 700; font-size: 15px; margin: 6px 0; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.ansline { font-size: 14px; color: var(--fg-2); margin-bottom: 10px; }

.plain {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 10px 0 12px;
}
.plain b { display: block; color: var(--brand); font-size: 12.5px; letter-spacing: 0.4px; margin-bottom: 4px; }
.plain p { margin: 0; font-size: 16px; line-height: 1.8; }

.sec { border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 12px; }
.sec h4 {
  margin: 0 0 4px;
  font-size: 12.5px;
  letter-spacing: 0.4px;
  color: var(--fg-2);
}
.sec p { margin: 0; font-size: 15.5px; line-height: 1.8; }

.quote {
  border-left: 3px solid var(--brand);
  padding-left: 10px;
  font-size: 15px;
  line-height: 1.85;
  color: var(--fg);
}

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
.bar .grow { flex: 1 1 auto; }
.count { color: var(--fg-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }

.btn {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  border-radius: 10px;
  padding: 9px 14px;
  font: inherit;
  font-size: 14.5px;
  cursor: pointer;
  min-height: 44px;
}
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #06201e; } }
.btn.ghost { background: transparent; color: var(--fg-2); border-color: transparent; }
.btn:active { transform: scale(0.985); }

.big { font-size: 34px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kv { display: flex; gap: 10px; margin-top: 8px; font-size: 15px; }
.kv .k { color: var(--fg-2); flex: 0 0 auto; min-width: 64px; }
.kv .v { flex: 1 1 auto; }

.row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  background: transparent;
  border: 0;
  color: var(--fg);
  font: inherit;
  font-size: 15.5px;
  text-align: left;
  padding: 10px 0;
  cursor: pointer;
  min-height: 44px;
}
.box {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  line-height: 20px;
  text-align: center;
  font-size: 13px;
  color: transparent;
}
.box.on { background: var(--brand); border-color: var(--brand); color: #fff; }
@media (prefers-color-scheme: dark) { .box.on { color: #06201e; } }
.row .name { flex: 0 0 auto; min-width: 80px; font-weight: 500; }
.row .ask { flex: 1 1 auto; color: var(--fg-2); font-size: 14.5px; }

.word { font-size: 28px; font-weight: 700; letter-spacing: 0.4px; }
.wordline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ipa { font-family: ui-monospace, Consolas, Menlo, monospace; color: var(--fg-2); font-size: 15px; margin: 6px 0; }
.zh { font-size: 16px; }
.colloc { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 15px; }
.colloc b { display: block; color: var(--fg-2); font-size: 12.5px; margin-bottom: 3px; }

.flipcard { cursor: pointer; }

.foot { color: var(--fg-2); font-size: 12.5px; text-align: center; padding: 8px 0 0; line-height: 1.7; }

@media (min-width: 700px) {
  :root { --font: 16px; --pad: 20px; }
  .card { padding: 18px 20px; }
  .q { font-size: 17px; }
}

</style>
</head>

l/min","75 ml/min","125 ml/min","200 ml/min"],"a":3,"e":"GFR ≈ 125 ml/min，滤过分数 = GFR / 肾血浆流量 ≈ 19%。GFR 下降是评价肾功能最早、最敏感的指标之一。"},{"id":"x4","k":"生理","q":"突触前抑制产生的主要机制是","o":["突触后膜超极化","突触后膜去极化","突触前末梢递质释放减少","递质被酶降解","突触后膜受体下调"],"a":2,"e":"轴突-轴突式突触使突触前末梢部分去极化，动作电位幅度减小，Ca²⁺ 内流减少，递质释放量下降。与突触后抑制（IPSP）区别开。"},{"id":"x5","k":"生化","q":"糖酵解途径的关键限速酶是","o":["己糖激酶","磷酸果糖激酶-1","丙酮酸激酶","醛缩酶","乳酸脱氢酶"],"a":1,"e":"三个关键酶是己糖激酶、PFK-1、丙酮酸激酶，其中 PFK-1 最重要：被 ATP、柠檬酸抑制，被 AMP、果糖-2,6-二磷酸激活。"},{"id":"x6","k":"生化","q":"三羧酸循环中发生底物水平磷酸化的反应是","o":["柠檬酸→异柠檬酸","异柠檬酸→α-酮戊二酸","α-酮戊二酸→琥珀酰 CoA","琥珀酰 CoA→琥珀酸","苹果酸→草酰乙酸"],"a":3,"e":"琥珀酰 CoA 合成酶催化，生成 GTP（能量上等同 ATP）。其余三步是氧化脱羧或脱氢，生成 NADH/FADH₂。"},{"id":"x7","k":"生化","q":"尿素合成的主要器官及限速酶是","o":["肝，氨甲酰磷酸合成酶Ⅰ","肝，氨甲酰磷酸合成酶Ⅱ","肾，谷氨酰胺酶","肌肉，转氨酶","脑，谷氨酸脱氢酶"],"a":0,"e":"鸟氨酸循环在肝细胞进行。CPS-Ⅰ 位于线粒体、需 N-乙酰谷氨酸激活，是限速酶；CPS-Ⅱ 参与嘧啶合成，别混。"},{"id":"x8","k":"生化","q":"酮体合成的部位和利用的部位分别是","o":["肝、肝","肝、肝外组织","肝外组织、肝","肾、肝","肌肉、肝"],"a":1,"e":"肝缺乏琥珀酰 CoA 转硫酶，只能生成酮体不能利用，是\"肝生酮、肝外用酮\"的酶学基础。酮体 = 乙酰乙酸 + β-羟丁酸 + 丙酮。"},{"id":"x9","k":"病理","q":"细胞水肿最主要的机制是","o":["细胞内蛋白质分解","细胞膜钠泵功能障碍","细胞内脂肪堆积","溶酶体破裂","细胞骨架断裂"],"a":1,"e":"缺氧、感染、中毒使 ATP 减少，Na⁺-K⁺-ATP 酶功能下降，细胞内 Na⁺ 和水增多。是 reversible injury 最早的表现。"},{"id":"x10","k":"病理","q":"肉芽组织的主要成分是","o":["胶原纤维和成纤维细胞","新生毛细血管、成纤维细胞和炎细胞","上皮样细胞和朗汉斯巨细胞","淋巴细胞和浆细胞","平滑肌细胞和弹性纤维"],"a":1,"e":"肉芽组织 = 新生毛细血管 + 成纤维细胞 + 炎细胞（以巨噬细胞为主），无神经末梢，后期机化为瘢痕。"},{"id":"x11","k":"病理","q":"血栓形成最重要的条件是","o":["血流缓慢","涡流形成","心血管内膜损伤","血液黏稠度增加","血小板数量增多"],"a":2,"e":"Virchow 三要素中，内膜损伤最重要也最常见：暴露内皮下胶原，启动血小板黏附与聚集。"},{"id":"x12","k":"病理","q":"下列器官的梗死属于出血性梗死的是","o":["心","肾","脾","肺","肝"],"a":3,"e":"肺、肠组织疏松且有双重血供，梗死时血液渗入坏死组织 → 出血性梗死；心、肾、脾组织致密 → 贫血性梗死。"},{"id":"x13","k":"内科","q":"诊断 COPD 的金标准是","o":["胸片见肺气肿","血气 PaO₂ \u003c 60 mmHg","吸入支气管扩张剂后 FEV₁/FVC \u003c 70%","残气量增加","弥散功能下降"],"a":2,"e":"持续气流受限是诊断的必需条件。GOLD 分级再按 FEV₁ 占预计值百分比分 1—4 级，两者别混。"},{"id":"x14","k":"内科","q":"支气管哮喘急性发作时首选的缓解药物是","o":["口服茶碱","吸入短效 β₂ 受体激动剂","吸入糖皮质激素","白三烯受体拮抗剂","色甘酸钠"],"a":1,"e":"SABA（沙丁胺醇）起效最快，属缓解药；ICS 是控制药，不能用于急救。这是\"缓解 vs 控制\"最经典的考点。"},{"id":"x15","k":"内科","q":"急性心肌梗死时最早升高的血清标志物是","o":["CK-MB","肌红蛋白","肌钙蛋白 I","乳酸脱氢酶","天门冬氨酸氨基转移酶"],"a":1,"e":"肌红蛋白 2 小时即升高但特异性差；cTnI 3—4 小时升高、持续 7—14 天，是确诊首选。考\"最早\"选肌红蛋白，考\"最特异\"选 cTnI。"},{"id":"x16","k":"内科","q":"高血压合并糖尿病患者的首选降压药是","o":["噻嗪类利尿剂","β 受体阻滞剂","ACEI 或 ARB","α 受体阻滞剂","中枢性降压药"],"a":2,"e":"ACEI/ARB 兼具降压与肾保护，是糖尿病合并高血压、尤其有蛋白尿者的首选。用药后监测血钾与肌酐。"},{"id":"x17","k":"内科","q":"消化性溃疡最主要的病因是","o":["胃酸分泌过多","幽门螺杆菌感染","NSAIDs","吸烟","精神应激"],"a":1,"e":"Hp 感染是胃溃疡和十二指肠溃疡最主要的病因，根除 Hp 可显著降低复发率。NSAIDs 是第二位。"},{"id":"x18","k":"内科","q":"肝硬化最常见的并发症是","o":["肝性脑病","上消化道出血","自发性细菌性腹膜炎","肝肾综合征","原发性肝癌"],"a":1,"e":"最常见并发症是上消化道出血（食管胃底静脉曲张破裂）；最常见死因是肝性脑病。两个\"最\"要分开记。"},{"id":"x19","k":"内科","q":"下列哪项不属于肾病综合征的诊断标准","o":["尿蛋白 > 3.5 g/d","血浆白蛋白 \u003c 30 g/L","水肿","高脂血症","血尿"],"a":4,"e":"四条标准：大量蛋白尿、低白蛋白血症（前两条为必备）、水肿、高脂血症。血尿提示肾炎综合征，不是诊断标准。"},{"id":"x20","k":"内科","q":"甲状腺功能亢进症最常见的病因是","o":["毒性多结节性甲状腺肿","Graves 病","亚急性甲状腺炎","垂体 TSH 瘤","碘甲亢"],"a":1,"e":"Graves 病占甲亢 80%—85%，由 TRAb 刺激 TSH 受体所致，伴弥漫性肿大和血管杂音，可有突眼。"},{"id":"x21","k":"内科","q":"糖尿病诊断标准中，空腹血糖的切点是","o":["≥ 6.1 mmol/L","≥ 7.0 mmol/L","≥ 7.8 mmol/L","≥ 11.1 mmol/L","≥ 13.9 mmol/L"],"a":1,"e":"空腹 ≥7.0，OGTT 2h 或随机 ≥11.1，HbA1c ≥6.5%。6.1—7.0 是空腹血糖受损，属于糖尿病前期。"},{"id":"x22","k":"内科","q":"缺铁性贫血最可靠的实验室指标是","o":["血清铁降低","总铁结合力升高","血清铁蛋白降低","转铁蛋白饱和度降低","小细胞低色素"],"a":2,"e":"铁蛋白反映储存铁，\u003c12—15 μg/L 可诊断缺铁；骨髓铁染色是金标准但有创。血清铁易受日内波动和炎症影响。"},{"id":"x23","k":"外科","q":"休克晚期微循环的变化是","o":["微动脉收缩","毛细血管前括约肌收缩","微血栓形成、DIC","动静脉短路开放","毛细血管网缺血"],"a":2,"e":"休克三期：微循环收缩期（代偿）→ 扩张期（淤血、回心血量减少）→ 衰竭期（DIC、细胞损伤、多器官衰竭）。"},{"id":"x24","k":"外科","q":"治疗等渗性缺水首选","o":["5% 葡萄糖","10% 葡萄糖","平衡盐溶液","5% 碳酸氢钠","3% 氯化钠"],"a":2,"e":"等渗性缺水补等渗液，平衡盐溶液（乳酸钠林格液）最接近细胞外液。只补 5% 葡萄糖会把细胞外液稀释成低钠血症。"},{"id":"x25","k":"外科","q":"急性阑尾炎最常见的病因是","o":["阑尾腔阻塞","细菌直接侵入","阑尾血运障碍","胃肠道功能紊乱","遗传因素"],"a":0,"e":"管腔阻塞（粪石、淋巴滤泡增生）→ 分泌物潴留、腔内压升高、血运障碍 → 继发感染，这是发病链条的起点。"},{"id":"x26","k":"外科","q":"乳腺癌最常见的转移途径是","o":["血道转移","淋巴道转移","种植转移","直接蔓延","沿神经鞘转移"],"a":1,"e":"癌多经淋巴道转移，最先到腋窝淋巴结，这也是腋窝淋巴结清扫和分期的依据；肉瘤多经血道。"},{"id":"x27","k":"外科","q":"甲状腺手术后最危急的并发症是","o":["喉返神经损伤","手足抽搐","呼吸困难和窒息","甲状腺危象","切口感染"],"a":2,"e":"术后 48 小时内切口内出血形成血肿压迫气管，可迅速窒息致死，必须床旁立即拆线、清除血肿。其余并发症不立即致命。"},{"id":"x28","k":"外科","q":"股骨颈骨折最常见的晚期并发症是","o":["创伤性关节炎","股骨头缺血性坏死","骨化性肌炎","髋关节脱位","坐骨神经损伤"],"a":1,"e":"股骨头血供主要来自旋股内侧动脉，骨折（尤其囊内型、移位型）易破坏血供 → 缺血坏死与不愈合，这也是高龄移位型直接做置换的理由。"},{"id":"x29","k":"外科","q":"张力性气胸的急救首选","o":["胸腔闭式引流","立即患侧锁骨中线第 2 肋间穿刺排气","气管插管","开胸探查","高流量吸氧"],"a":1,"e":"张力性气胸是\"先救命后诊断\"，穿刺排气几秒内可缓解；闭式引流是后续确定性处理，不能等。"},{"id":"x30","k":"人文","q":"医师进行临床试验、人体实验性治疗时，最重要的伦理要求是","o":["经科室主任批准","取得患者本人或家属的知情同意","不收取费用","由高年资医师操作","事后向患者说明"],"a":1,"e":"知情同意是人体实验的核心伦理要求，须经伦理委员会批准并取得书面同意，且患者有权随时退出。"},{"id":"x31","k":"内科","src":"restore","q":"急性 ST 段抬高型心梗发病 12 小时内，预计 PCI 延迟超过 120 分钟，应选择","o":["立即溶栓（无禁忌）","继续等待 PCI","仅药物保守治疗","急诊冠脉搭桥","主动脉内球囊反搏"],"a":0,"e":"再灌注时间决定心肌存活，\"时间就是心肌\"。溶栓后仍应尽快转运至 PCI 中心；有溶栓禁忌或心源性休克时优先转运。"},{"id":"x32","k":"内科","src":"restore","q":"支气管哮喘长期控制的首选药物是","o":["沙丁胺醇","吸入糖皮质激素","口服茶碱","白三烯受体拮抗剂","色甘酸钠"],"a":1,"e":"ICS 是控制药，需长期规律吸入；SABA 是缓解药，只在发作时用。把缓解药当控制药用是考试与临床的双重高频错。"},{"id":"x33","k":"外科","src":"restore","q":"急性化脓性梗阻性胆管炎（AOSC）最关键的治疗是","o":["大剂量抗生素","解痉止痛","紧急胆道减压引流","保肝治疗","输血"],"a":2,"e":"Charcot 三联征（腹痛、寒战高热、黄疸）+ 休克 + 意识障碍 = Reynolds 五联征。核心是解除梗阻、引流胆道，抗生素只是辅助。"},{"id":"x34","k":"外科","src":"restore","q":"甲状腺大部切除术后 24 小时内出现呼吸困难，最常见的原因是","o":["喉头水肿","切口内出血形成血肿","气管塌陷","双侧喉返神经损伤","痰液堵塞"],"a":1,"e":"术后 48 小时内的窒息多由血肿压迫所致，必须床旁立即拆线、清除血肿；气管塌陷多见于巨大甲状腺肿长期压迫气管软化者。"},{"id":"x35","k":"生理","src":"restore","q":"血浆胶体渗透压升高时，肾小球滤过率如何变化","o":["升高","降低","不变","先升后降","无法判断"],"a":1,"e":"有效滤过压 = 肾小球毛细血管血压 −（血浆胶体渗透压 + 囊内压）。胶体渗透压升高 → 有效滤过压下降 → GFR 降低。"},{"id":"x36","k":"病理","src":"restore","q":"判断肿瘤良恶性最重要的组织学依据是","o":["肿瘤大小","生长速度","有无包膜","异型性","有无转移"],"a":3,"e":"异型性是组织学判断良恶性的基础；转移是恶性最可靠的生物学证据，但属行为学而非组织学。题目问\"组织学依据\"就选异型性。"},{"id":"x37","k":"生化","src":"restore","q":"体内氨的主要去路是","o":["合成尿素","合成谷氨酰胺","合成非必需氨基酸","生成铵盐排出","参与嘌呤合成"],"a":0,"e":"肝内鸟氨酸循环合成尿素是氨的主要去路；谷氨酰胺是氨的运输形式与脑/肌肉的解毒方式，不是主要终产物。"},{"id":"x38","k":"内科","src":"restore","q":"2 型糖尿病患者，无禁忌证时首选的口服降糖药是","o":["二甲双胍","磺脲类","胰岛素","α-糖苷酶抑制剂","DPP-4 抑制剂"],"a":0,"e":"二甲双胍为一线首选，尤其超重/肥胖者；不增加体重、低血糖风险小。eGFR\u003c30 禁用，造影前后需停用。"},{"id":"x39","k":"生理","q":"肺牵张反射（Hering-Breuer 反射）的传入神经是","o":["迷走神经","交感神经","膈神经","肋间神经","舌咽神经"],"a":0,"e":"肺扩张时兴奋肺牵张感受器，经迷走神经传入，抑制吸气、使吸气转为呼气；肺缩小则相反。"},{"id":"x40","k":"外科","q":"腹股沟斜疝与直疝鉴别最可靠的体征是","o":["患者年龄","疝块形状","是否进入阴囊","压迫内环后疝块是否突出","是否容易嵌顿"],"a":3,"e":"斜疝经内环突出，压迫内环后不再突出；直疝从直疝三角突出，压迫内环仍可突出。这是解剖决定的，最可靠。"}],"ENQ":[{"id":"e1","k":"词汇","q":"The new policy is intended to ___ small businesses, not to burden them.","o":["constrain","facilitate","exaggerate","undermine"],"a":1,"e":"facilitate 促进、使便利，与 burden 形成对照；constrain（限制）和 undermine（削弱）都与\"not to burden\"矛盾。"},{"id":"e2","k":"词汇","q":"His argument sounds ___ but collapses under close examination.","o":["plausible","prevalent","reluctant","indifferent"],"a":0,"e":"plausible 貌似合理的，正好与\"经不起细看\"呼应；prevalent 是\"普遍的\"，不修饰论证的可信度。"},{"id":"e3","k":"词汇","q":"The report's conclusions were ___ by later studies, which found the opposite.","o":["reinforced","undermined","facilitated","sustained"],"a":1,"e":"后半句 \"found the opposite\" 是解题钥匙：结论被推翻，选 undermined。reinforce 是加强，方向相反。"},{"id":"e4","k":"词汇","q":"Access to clean water remains ___ in many rural areas.","o":["inevitable","substantial","scarce","legitimate"],"a":2,"e":"scarce 稀缺，与 access（可及性）搭配自然；inevitable 和 legitimate 都不描述供应量。"},{"id":"e5","k":"词汇","q":"She was ___ to admit that her initial assumption had been wrong.","o":["reluctant","vulnerable","profound","prevalent"],"a":0,"e":"be reluctant to do 是固定搭配，意为\"不情愿做某事\"；vulnerable 后接 to 时意为\"易受……伤害\"，语义不通。"},{"id":"e6","k":"词汇","q":"The two witnesses gave ___ accounts of the accident, so the police could not determine what had happened.","o":["identical","contradictory","plausible","substantial"],"a":1,"e":"后半句\"无法确定发生了什么\"说明两份陈述互相矛盾，选 contradictory；identical 恰好相反。"},{"id":"e7","k":"阅读","src":"restore","q":"The assumption that longer working hours inevitably produce more output has been repeated so often that it has acquired the status of common sense. Yet the evidence points elsewhere: beyond a certain threshold, additional hours yield diminishing returns, and the errors introduced by fatigue can offset whatever extra work is done.\n\n— The author’s attitude toward the \"common sense\" is best described as","o":["enthusiastic endorsement","qualified skepticism","complete indifference","open hostility"],"a":1,"e":"Yet 转折 + diminishing returns + can offset 三个信号词叠加，说明作者并不全盘否定、但明显保留 → qualified skepticism（有保留的怀疑）。"},{"id":"e8","k":"阅读","src":"restore","q":"In the same passage, \"offset\" is closest in meaning to","o":["cancel out","increase","postpone","expose"],"a":0,"e":"offset = 抵消、弥补。句意是\"疲劳带来的错误会抵消多干的那部分活\"，与 cancel out 最近。"},{"id":"e9","k":"词汇","q":"The committee’s decision was ___ by the discovery of new evidence.","o":["reversed","reinforced","postponed","overlooked"],"a":0,"e":"新证据使原决定被推翻，选 reversed；reinforced 是\"加强\"，与语义方向相反，是典型干扰项。"},{"id":"e10","k":"词汇","q":"Despite the ___ of the task, she finished it ahead of schedule.","o":["complexity","simplicity","brevity","clarity"],"a":0,"e":"Despite 表让步，前后必须相反：任务复杂却提前完成。simplicity 会让让步关系失去意义。"}],"DAILY":[{"q":"肺泡表面活性物质由哪种细胞分泌？主要成分是什么？","a":"Ⅱ型肺泡上皮细胞；主要成分为二棕榈酰卵磷脂（DPPC），可降低肺泡表面张力、防止肺泡萎陷。","s":"《生理学》第9版·呼吸"},{"q":"肾小球滤过膜由哪三层构成？主要屏障是哪一层？","a":"内皮细胞、基膜、足细胞足突（裂孔膜）；基膜是主要屏障，其上的负电荷也参与阻止蛋白滤过。","s":"《生理学》第9版·尿的生成和排出"},{"q":"血浆与红细胞内最重要的缓冲对各是什么？","a":"血浆为 NaHCO₃/H₂CO₃；红细胞内为 Hb/HHb（血红蛋白缓冲对）。","s":"《生理学》第9版·血液"},{"q":"视杆细胞与视锥细胞各含什么视色素、各负责什么？","a":"视杆细胞含视紫红质，感受弱光；视锥细胞含视紫蓝质，感受强光与色觉。","s":"《生理学》第9版·神经系统的功能"},{"q":"突触后抑制有哪两种形式？","a":"传入侧支性抑制（交互抑制）与回返性抑制；两者都通过抑制性中间神经元释放 GABA 产生 IPSP。","s":"《生理学》第9版·神经系统的功能"},{"q":"体温的昼夜节律中，最低和最高分别出现在什么时候？","a":"清晨 2—6 时最低，午后 1—6 时最高；下丘脑视交叉上核是节律中枢。","s":"《生理学》第9版·能量代谢与体温"},{"q":"肾血浆流量增加时，肾小球滤过率与滤过分数如何变化？","a":"GFR 增加，但滤过分数（GFR/肾血浆流量）下降——因为血浆流量增加的比例大于 GFR 增加的比例。","s":"《生理学》第9版·尿的生成和排出"},{"q":"DNA 的 Tm 值与 G-C 含量是什么关系？","a":"正相关。G-C 含量越高，氢键越多，Tm 越高；每增加 1% GC，Tm 约升高 0.4℃。","s":"《生物化学与分子生物学》第9版·核酸的结构与功能"},{"q":"竞争性抑制剂与非竞争性抑制剂对 Km 和 Vmax 的影响有何不同？","a":"竞争性：Km 增大、Vmax 不变；非竞争性：Km 不变、Vmax 降低。","s":"《生物化学与分子生物学》第9版·酶"},{"q":"mRNA 的 5′ 端与 3′ 端各有什么修饰？","a":"5′ 端为 m⁷GpppNm 帽子结构；3′ 端为 polyA 尾（约 20—200 个腺苷酸）。","s":"《生物化学与分子生物学》第9版·基因信息的传递"},{"q":"尿素循环中两个氮原子分别来自哪里？","a":"第一个来自氨（生成氨甲酰磷酸），第二个来自天冬氨酸。","s":"《生物化学与分子生物学》第9版·氨基酸代谢"},{"q":"一碳单位由什么载体携带？主要来自哪些氨基酸？","a":"由四氢叶酸（THF）携带；主要来自丝氨酸、甘氨酸、组氨酸、色氨酸。","s":"《生物化学与分子生物学》第9版·氨基酸代谢"},{"q":"胆固醇合成的限速酶是什么？","a":"HMG-CoA 还原酶，位于内质网；他汀类即抑制此酶。","s":"《生物化学与分子生物学》第9版·脂质代谢"},{"q":"长期饥饿时脑组织的主要能源物质是什么？","a":"酮体。可减少葡萄糖消耗、保护蛋白质不被大量分解。","s":"《生物化学与分子生物学》第9版·物质代谢的整合与调节"},{"q":"心肌梗死最早出现的肉眼改变大约在梗死后多久？","a":"12—18 小时出现苍白（凝固性坏死）区；镜下 12—24 小时可见凝固性坏死伴中性粒细胞浸润。","s":"《病理学》第9版·心血管系统疾病"},{"q":"化生最常见的类型是什么？举两个典型部位。","a":"柱状上皮→鳞状上皮化生；如支气管假复层纤毛柱状上皮、宫颈柱状上皮。","s":"《病理学》第9版·细胞和组织的适应与损伤"},{"q":"干酪样坏死属于哪一类坏死？最常见于什么病？","a":"属于凝固性坏死的一种特殊类型，是结核病的特征性病变。","s":"《病理学》第9版·炎症"},{"q":"风湿小体（Aschoff 小体）由哪些成分构成？","a":"中央纤维素样坏死、成纤维细胞（Anitschkow 细胞）及少量淋巴细胞。","s":"《病理学》第9版·心血管系统疾病"},{"q":"慢性肺淤血时肺泡腔内的\"心衰细胞\"是什么？","a":"吞噬了含铁血黄素的巨噬细胞，提示慢性左心衰。","s":"《病理学》第9版·局部血液循环障碍"},{"q":"肝细胞脂肪变性最常发生在肝小叶的哪个带？为什么？","a":"中央区（Ⅲ带），因该区距血窦最远、缺氧最明显，脂蛋白合成障碍。","s":"《病理学》第9版·消化系统疾病"},{"q":"COPD 患者长期家庭氧疗（LTOT）的指征是什么？","a":"PaO₂ ≤55 mmHg 或 SaO₂ ≤88%；或 PaO₂ 55—60 mmHg 伴肺动脉高压、右心衰、红细胞增多。每天 ≥15 小时。","s":"《内科学》第9版·呼吸系统疾病"},{"q":"肝硬化腹水利尿治疗时，螺内酯与呋塞米的常用比例是多少？","a":"100:40。保钾与排钾联用，既增强利尿又减少低钾风险。","s":"《内科学》第9版·消化系统疾病"},{"q":"肾病综合征高凝状态的重要原因之一是什么？","a":"抗凝血酶Ⅲ等抗凝物质随尿丢失，同时肝脏合成凝血因子增加、血液浓缩。","s":"《内科学》第9版·泌尿系统疾病"},{"q":"缺铁性贫血时血小板计数可有什么变化？","a":"常反应性增多（也可正常），是容易忽略的一个伴随表现。","s":"《内科学》第9版·血液系统疾病"},{"q":"甲亢患者血常规的典型改变是什么？","a":"白细胞总数可减少，但淋巴细胞比例与绝对值增多——这与感染时的中性粒细胞升高相反。","s":"《内科学》第9版·内分泌系统疾病"},{"q":"糖尿病酮症酸中毒时血淀粉酶可以升高吗？意义是什么？","a":"可以升高，但不等于合并胰腺炎；需结合腹痛部位、影像和脂肪酶判断。","s":"《内科学》第9版·内分泌系统疾病"},{"q":"肺结核\"原发综合征\"由哪三部分构成？","a":"原发病灶、淋巴管炎、肺门淋巴结肿大，三者构成哑铃状影像。","s":"《内科学》第9版·呼吸系统疾病"},{"q":"休克指数的定义与临床意义？","a":"休克指数 = 脉率 / 收缩压；正常约 0.5，>1.0 提示失血约 1000—1500 ml，>2.0 提示严重休克。","s":"《外科学》第9版·外科总论"},{"q":"成人烧伤九分法中，双下肢（含臀部）占体表面积的多少？","a":"46%（双下肢 41% + 臀部 5%）。女性臀部与双足比例略有调整。","s":"《外科学》第9版·外科总论"},{"q":"甲状腺手术中，喉上神经内支与外支损伤分别表现为什么？","a":"内支损伤→误咽、饮水呛咳（感觉支）；外支损伤→声调降低（运动支）。","s":"《外科学》第9版·普通外科"},{"q":"胆囊三角（Calot 三角）由什么构成？内含什么重要结构？","a":"胆囊管、肝总管、肝下缘；内含胆囊动脉，是胆囊切除术的关键解剖区。","s":"《外科学》第9版·普通外科"},{"q":"乳腺癌\"橘皮样\"改变的机制是什么？","a":"癌细胞阻塞皮下淋巴管，淋巴回流受阻致真皮水肿，毛囊处凹陷形成橘皮样外观。","s":"《外科学》第9版·普通外科"},{"q":"急性阑尾炎时腰大肌试验阳性提示阑尾位于何处？","a":"盲肠后位（腹膜后），炎症刺激腰大肌所致。","s":"《外科学》第9版·普通外科"},{"q":"骨折的三项专有体征是什么？","a":"畸形、反常活动、骨擦音或骨擦感。具备其一即可临床诊断骨折。","s":"《外科学》第9版·骨科"},{"q":"二尖瓣狭窄时\"开瓣音\"提示什么？","a":"瓣膜弹性尚好、活动度可，是经皮球囊二尖瓣成形术的有利条件；瓣膜钙化僵硬时开瓣音消失。","s":"《诊断学》第9版·体格检查"},{"q":"心包积液的 Ewart 征是什么？","a":"左肩胛下角区叩诊浊音、语颤增强，可闻及支气管呼吸音——大量心包积液压迫左下肺所致。","s":"《诊断学》第9版·体格检查"},{"q":"\"梨形心\"与\"靴形心\"分别对应什么病变？","a":"梨形心=二尖瓣狭窄（左房、右室增大）；靴形心=主动脉瓣关闭不全（左室增大）。","s":"《诊断学》第9版·体格检查"},{"q":"阿司匹林对血小板的抑制为什么能持续 7—10 天？","a":"它不可逆地乙酰化 COX-1，而血小板无细胞核、不能重新合成酶，须待新血小板生成才能恢复。","s":"《药理学》第9版·解热镇痛抗炎药"},{"q":"肝素过量与华法林过量分别用什么拮抗？","a":"肝素→鱼精蛋白；华法林→维生素 K₁（出血严重时输注凝血酶原复合物）。","s":"《药理学》第9版·抗凝血药"},{"q":"张力性气胸的紧急穿刺排气部位在哪里？","a":"患侧锁骨中线第 2 肋间（或腋前线第 4—5 肋间），先救命后诊断。","s":"《外科学》第9版·胸心外科"}],"WORDS":[["sustain","/səˈsteɪn/","维持；遭受（损失）","sustain growth 保持增长｜sustain an injury 受伤"],["undermine","/ˌʌndəˈmaɪn/","削弱；暗中破坏","undermine confidence 削弱信心｜undermine authority 削弱权威"],["compelling","/kəmˈpelɪŋ/","令人信服的；不可抗拒的","a compelling argument 有力的论证｜compelling evidence 确凿证据"],["ambiguous","/æmˈbɪɡjuəs/","模棱两可的","an ambiguous answer 含糊的回答｜deliberately ambiguous 故意含糊"],["advocate","/ˈædvəkeɪt/ 动；/ˈædvəkət/ 名","提倡；拥护者","advocate reform 主张改革｜a strong advocate of 坚决拥护者"],["diminish","/dɪˈmɪnɪʃ/","减少；贬低","diminishing returns 收益递减｜diminish the role 贬低作用"],["inevitable","/ɪnˈevɪtəbl/","不可避免的","an inevitable consequence 必然结果｜it is inevitable that… 不可避免"],["profound","/prəˈfaʊnd/","深刻的；深远的","a profound impact 深远影响｜profound changes 深刻变化"],["prevalent","/ˈprevələnt/","普遍的；流行的","a prevalent view 普遍看法｜increasingly prevalent 日益普遍"],["reluctant","/rɪˈlʌktənt/","不情愿的","be reluctant to do 不愿做｜a reluctant agreement 勉强同意"],["scrutiny","/ˈskruːtəni/","仔细审查","under scrutiny 受到审查｜close scrutiny 严密审视"],["consensus","/kənˈsensəs/","共识","reach a consensus 达成共识｜scientific consensus 科学共识"],["incentive","/ɪnˈsentɪv/","激励；动机","financial incentive 经济激励｜an incentive to do 做某事的动力"],["constrain","/kənˈstreɪn/","限制；约束","constrain growth 抑制增长｜be constrained by 受制于"],["exaggerate","/ɪɡˈzædʒəreɪt/","夸大","exaggerate the risk 夸大风险｜grossly exaggerated 严重夸大"],["facilitate","/fəˈsɪlɪteɪt/","促进；使便利","facilitate communication 促进沟通｜facilitate the process 简化流程"],["indifferent","/ɪnˈdɪfrənt/","漠不关心的","be indifferent to 对……漠然｜indifferent to criticism 不在乎批评"],["legitimate","/lɪˈdʒɪtɪmət/","合法的；合理的","a legitimate concern 合理担忧｜legitimate business 合法生意"],["notion","/ˈnəʊʃn/","观念；概念","the notion that… ……的观念｜reject the notion 否定这一说法"],["perceive","/pəˈsiːv/","察觉；认为","perceive A as B 把 A 看作 B｜be perceived as 被视为"],["plausible","/ˈplɔːzəbl/","貌似合理的","a plausible explanation 说得通的解释｜sound plausible 听着有理"],["reinforce","/ˌriːɪnˈfɔːs/","加强；强化","reinforce the view 强化观点｜mutually reinforcing 相辅相成"],["substantial","/səbˈstænʃl/","大量的；实质的","a substantial increase 大幅增长｜substantial evidence 充分证据"],["vulnerable","/ˈvʌlnərəbl/","脆弱的；易受伤的","be vulnerable to 易受……影响｜vulnerable groups 弱势群体"],["deteriorate","/dɪˈtɪəriəreɪt/","恶化；变坏","deteriorate rapidly 迅速恶化｜health deteriorated 健康恶化"],["alleviate","/əˈliːvieɪt/","缓解；减轻","alleviate pain 缓解疼痛｜alleviate the burden 减轻负担"],["attribute","/əˈtrɪbjuːt/","把……归因于","attribute A to B 把 A 归因于 B｜be attributed to 被归因于"],["comprehensive","/ˌkɒmprɪˈhensɪv/","全面的；综合的","a comprehensive review 全面综述｜comprehensive reform 全面改革"],["controversy","/ˈkɒntrəvɜːsi/","争议","spark controversy 引发争议｜beyond controversy 无可争议"],["illustrate","/ˈɪləstreɪt/","说明；举例说明","illustrate the point 说明这一点｜as illustrated above 如上所示"]],"SENTS":[["It is not difficult to see why the young man, who had been raised in a household where books were treated as sacred objects, developed such a reverence for the written word.","It is not difficult to see why ...（形式主语句型）","who 引导定语从句修饰 the young man，从句里又套了一个 where 定语从句；reverence for 是名词化表达，比\"respect\"更书面。"],["What the researchers found, after tracking more than 5,000 subjects over a decade, was that those who slept fewer than six hours a night were nearly twice as likely to develop the condition.","What ... was that ...（主语从句 + 表语从句）","after tracking 是插入状语，先跳过它抓主干；twice as likely to 是比较结构，翻译成\"可能性是……的两倍\"。"],["So accustomed have we become to the convenience of instant communication that we rarely pause to consider what is lost when a letter is replaced by an email.","we have become so accustomed to ... that ...（so...that 倒装）","so 提前引起部分倒装，是强调句式；what is lost 是 consider 的宾语从句，when 从句再嵌套。"],["The assumption that economic growth will automatically translate into improved well-being, an assumption that has underpinned public policy for decades, is now being questioned by a growing number of economists.","The assumption ... is now being questioned（主谓被长插入语隔开）","第一个 that 是同位语从句，破折号式的 an assumption that... 是同位语复指；translate into 意为\"转化为\"。"],["Rather than viewing failure as a verdict on their ability, resilient people treat it as information — a signal that the strategy, not the self, needs adjusting.","resilient people treat it as information","Rather than 引导状语，含义是\"而不是\"；破折号后是 information 的同位语，not the self 是插入的对比成分。"],["Had the committee anticipated how strongly the proposal would be opposed, it might have chosen a different moment to release it.","it might have chosen ...（主句）","省略 if 的虚拟条件句，Had 提前引起倒装；how strongly 引导宾语从句，would be opposed 是过去将来被动。"],["There is no shortage of explanations for why the practice persists, but few of them withstand the scrutiny that a careful reading of the evidence demands.","There is no shortage ..., but few withstand ...（并列句）","why 从句作介词 for 的宾语；that 引导定语从句修饰 scrutiny，demands 的主语是 a careful reading。"],["What makes the finding remarkable is not merely its size but the fact that it held across every age group and income bracket examined.","What makes ... is not merely ... but ...（主语从句 + 表语）","not merely...but 是\"不仅……而且\"；that 引导同位语从句解释 fact；examined 是后置定语。"],["The extent to which early exposure shapes later preferences remains a matter of debate, but few would deny that it leaves some mark.","The extent ... remains a matter of debate, but few would deny that ...（并列句）","to which 引导定语从句修饰 extent；a matter of debate 是\"有待商榷\"的地道表达；deny that 后接同位语式宾语从句。"],["Not until the findings had been replicated in three independent cohorts did the researchers feel confident enough to publish them.","the researchers did feel ...（主句倒装）","Not until 置于句首引起部分倒装，助动词 did 提前；had been replicated 是过去完成时的被动，表示\"在此之前的重复验证\"。"]],"MSE":[{"id":"general","name":"一般表现","ask":"现在几点？这里是哪里？我是谁？——看意识、定向力、接触与合作"},{"id":"perception","name":"感知觉","ask":"有没有听到别人听不到的声音？有没有看到别人看不到的东西？"},{"id":"form","name":"思维形式","ask":"听语速和连贯性：是否跳跃、答非所问、句子之间还有没有逻辑"},{"id":"content","name":"思维内容","ask":"有没有觉得有人要害你、议论你？有没有反复冒出来甩不掉的想法？"},{"id":"affect","name":"情感","ask":"最近心情怎么样？有没有提不起兴趣、什么都高兴不起来？"},{"id":"will","name":"意志与行为","ask":"有没有不想动、不想说话？有没有做过别人觉得奇怪的事？"},{"id":"cognition","name":"认知功能","ask":"100 连续减 7；回忆刚才让你记的那三个词"},{"id":"insight","name":"自知力","ask":"你觉得自己是生病了吗？需要治疗吗？"},{"id":"risk","name":"风险评估","ask":"有没有想过不想活了？有没有具体的计划或准备？"},{"id":"body","name":"躯体与辅助检查","ask":"生命体征、神经系统查体；甲功、电解质、头颅影像排除器质性"}],"CASES":[{"id":"stemi","dept":"内科·循环","stem":"男，58 岁。突发胸骨后压榨性疼痛 2 小时，伴大汗、恶心。BP 100/70 mmHg，心率 52 次/分。心电图：Ⅱ、Ⅲ、aVF 导联 ST 段抬高 0.3 mV。","dx":{"answer":"急性下壁 ST 段抬高型心肌梗死（罪犯血管多为右冠状动脉）","why":["中年男性 + 突发压榨性胸痛持续 2 小时不缓解 + 大汗：先把范围锁到\"急性冠脉综合征\"，而不是\"胸痛待查\"。","Ⅱ、Ⅲ、aVF 导联 ST 抬高：三个下壁导联同时抬高，定位就是下壁。","抬高幅度 Ⅲ > Ⅱ，且 aVL 出现镜像压低：右冠状动脉闭塞的典型图形；若 Ⅱ > Ⅲ 且 aVL 抬高，更像回旋支。","心率 52 + 血压偏低：窦房结/房室结缺血，进一步支持右冠近端病变——这解释了他为什么心率慢、血压低。","疼痛 >20 分钟 + ST 抬高：已不满足\"心绞痛\"的定义，是透壁性坏死，处理级别直接升到再灌注。"]},"diff":[["主动脉夹层","撕裂样痛、向背部放射、双上肢血压差 >20 mmHg、D-二聚体显著升高；两者可并存，PCI 前若高度怀疑需先 CTA"],["肺栓塞","突发呼吸困难 + 低氧、右心负荷表现（SⅠQⅢTⅢ、右室扩大）；胸痛多为胸膜性、与呼吸相关"],["急性心包炎","疼痛随体位/呼吸变化、广泛导联 ST 凹面向上抬高伴 PR 段压低、无镜像改变"],["自发性气胸","突发一侧胸痛 + 呼吸困难，查体患侧呼吸音消失、叩诊鼓音"]],"exam":[["心肌肌钙蛋白 I","0—3 小时动态升高是心肌坏死的必要条件，但它是\"确认\"而非\"决定再灌注\"的依据，心电图已够"],["18 导联心电图（含 V3R—V5R、V7—V9）","下壁心梗必须加做右胸和后壁导联：有无右室受累，直接决定补液还是利尿"],["床旁超声心动图","看室壁运动异常、右室是否扩大、有无心包积液与机械并发症"],["急诊冠脉造影","诊断与治疗一体，造影结果直接决定 PCI 策略"]],"tx":[["再灌注（首要）","首选急诊 PCI，目标 door-to-balloon \u003c90 分钟；无条件转运时 30 分钟内溶栓"],["抗栓","阿司匹林 + P2Y12 抑制剂双联负荷，加肝素抗凝，进导管室前给完"],["二级预防起始","他汀、β 受体阻滞剂；本例心率 52，用 β 阻滞剂前先评估有无房室传导阻滞"],["陷阱：右室梗死","合并右室梗死时依赖前负荷，硝酸酯和利尿剂会把血压打崩；此时要扩容（生理盐水），而不是\"心梗一律利尿\""]]},{"id":"aecopd","dept":"内科·呼吸","stem":"男，65 岁，吸烟 40 年。咳嗽咳痰 20 年，气促加重 3 天，痰黄稠，今晨嗜睡。血气（未吸氧）：pH 7.28，PaCO₂ 70 mmHg，PaO₂ 50 mmHg。","dx":{"answer":"COPD 急性加重（AECOPD）合并Ⅱ型呼吸衰竭、肺性脑病","why":["老年男性 + 吸烟 40 年 + 慢性咳痰喘 20 年：基础病先成立，后面所有症状都往 COPD 上归因。","气促加重 + 痰量增多 + 痰变黄稠：AECOPD 三个加重指标全中，且提示感染性诱因。","PaO₂ 50（\u003c60）+ PaCO₂ 70（>50）：Ⅱ型呼衰，说明肺泡通气不足，不只是氧合问题。","pH 7.28：失代偿性呼吸性酸中毒，代偿还没跟上——这是\"要不要上无创通气\"的分界线。","嗜睡：CO₂ 潴留导致肺性脑病，是呼吸衰竭的神经系统表现，不是\"年纪大犯困\"。"]},"diff":[["支气管哮喘急性发作","多有过敏史、发作性呼气性呼吸困难、双肺弥漫哮鸣音；COPD 为持续进展、桶状胸、呼吸音减弱"],["急性左心衰","端坐呼吸、粉红泡沫痰、双肺底湿啰音、BNP 明显升高"],["重症肺炎","发热、局部湿啰音、影像斑片影；AECOPD 常由感染诱发，两者可重叠"],["自发性气胸","突发一侧胸痛 + 呼吸音消失 + 气管偏移；COPD 是气胸高危人群，必须拍片排除"]],"exam":[["动脉血气（未吸氧）","判断呼衰类型和酸中毒程度，是分型与是否上机的直接依据"],["胸部 CT","排除气胸、肺炎、肺栓塞这三个会立刻改变处理方向的诊断"],["痰培养 + 药敏","指导抗生素，反复加重、近期用过抗生素者尤其需要"],["血常规、CRP、BNP、心电图","区分\"感染为主\"还是\"心衰为主\"，决定要不要利尿和强心"]],"tx":[["氧疗（最容易错的一步）","控制性低流量 1—2 L/min，目标 SpO₂ 88%—92%；高浓度吸氧会抑制低氧驱动、加重 CO₂ 潴留"],["支气管扩张","短效 β₂ 激动剂 + 抗胆碱能雾化，是缓解气流受限最快的手段"],["糖皮质激素","全身用 5—7 天，缩短恢复时间、改善肺功能"],["无创正压通气","pH\u003c7.35 且 PaCO₂ 明显升高时首选；意识障碍加重、不能配合则改有创"],["禁忌","禁用镇静剂——会直接抑制呼吸驱动，把Ⅱ型呼衰推向不可逆"]]},{"id":"ugib","dept":"内科·消化","stem":"男，45 岁。上腹隐痛 5 年，近 2 天黑便，起身时头晕。BP 90/60 mmHg，Hb 75 g/L，BUN 18 mmol/L。","dx":{"answer":"消化性溃疡并上消化道出血、失血性休克","why":["上腹隐痛 5 年：慢性溃疡病史，先给出\"出血来源在胃十二指肠\"的先验概率。","黑便而不是便血：出血点在 Treitz 韧带以上，血液在肠道停留足够久被细菌作用——定位上消化道的经典依据。","BP 90/60 + 起身头晕：体位性低血压 + 休克，提示失血量已达 800—1000 mL 以上。","BUN 18 升高而肌酐正常：肠道内血液被吸收导致尿素氮升高，BUN/Cr 比值升高是特征性线索。","Hb 75 要留个心眼：急性出血早期血液浓缩，Hb 可能\"还没掉下来\"。"]},"diff":[["食管胃底静脉曲张破裂
