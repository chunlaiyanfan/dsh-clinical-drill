<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6e6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="临床速练">
<title>临床速练 · 考研冲刺</title>
<style>
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --surface-2: #eef2f4;
  --fg: #16181a;
  --fg-2: #5c666d;
  --line: #dfe4e7;
  --brand: #0f6e6a;
  --ok: #1a7f45;
  --bad: #b4322c;
  --radius: 14px;
  --pad: 14px;
  --font: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101416;
    --surface: #171d20;
    --surface-2: #212a2e;
    --fg: #e8eef0;
    --fg-2: #9aa7ad;
    --line: #2b3539;
    --brand: #4fd1c5;
    --ok: #5ed48c;
    --bad: #ff8a80;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: var(--font);
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}

.app { max-width: 780px; margin: 0 auto; padding: 0 0 env(safe-area-inset-bottom); }

.hd {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}

.hd-top {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 12px var(--pad) 6px;
}

.brand { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
.brand small { font-weight: 400; color: var(--fg-2); font-size: 12px; margin-left: 6px; }
.dday { margin-left: auto; color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 var(--pad) 10px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  border-radius: 999px;
  padding: 7px 14px;
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
.tab.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

@media (prefers-color-scheme: dark) {
  .tab.on { color: #06201e; }
}

.main { padding: var(--pad) var(--pad) 64px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip {
  display: inline-block;
  background: var(--surface-2);
  color: var(--fg-2);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12.5px;
}
.badge {
  display: inline-block;
  border: 1px solid var(--brand);
  color: var(--brand);
  border-radius: 999px;
  padding: 1px 9px;
  font-size: 12px;
  font-weight: 600;
}

.hint { color: var(--fg-2); font-size: 13.5px; margin: 0 0 10px; }
.q { font-size: 16.5px; line-height: 1.75; margin: 0 0 12px; white-space: pre-wrap; }
.stem { font-size: 16px; line-height: 1.8; margin: 0 0 12px; }

.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  margin-bottom: 8px;
  font: inherit;
  font-size: 15px;
  line-height: 1.5;
  cursor: pointer;
  min-height: 44px;
}
.opt.correct { border-color: var(--ok); border-width: 2px; background: var(--surface-2); font-weight: 600; }
.opt.wrong { border-color: var(--bad); border-width: 2px; background: var(--surface-2); }
.opt:active { transform: scale(0.995); }

.verdict { font-weight: 700; font-size: 15px; margin: 6px 0; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.ansline { font-size: 14px; color: var(--fg-2); margin-bottom: 10px; }

.plain {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 10px 0 12px;
}
.plain b { display: block; color: var(--brand); font-size: 12.5px; letter-spacing: 0.4px; margin-bottom: 4px; }
.plain p { margin: 0; font-size: 16px; line-height: 1.8; }

.sec { border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 12px; }
.sec h4 {
  margin: 0 0 4px;
  font-size: 12.5px;
  letter-spacing: 0.4px;
  color: var(--fg-2);
}
.sec p { margin: 0; font-size: 15.5px; line-height: 1.8; }

.quote {
  border-left: 3px solid var(--brand);
  padding-left: 10px;
  font-size: 15px;
  line-height: 1.85;
  color: var(--fg);
}

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
.bar .grow { flex: 1 1 auto; }
.count { color: var(--fg-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }

.btn {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  border-radius: 10px;
  padding: 9px 14px;
  font: inherit;
  font-size: 14.5px;
  cursor: pointer;
  min-height: 44px;
}
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #06201e; } }
.btn.ghost { background: transparent; color: var(--fg-2); border-color: transparent; }
.btn:active { transform: scale(0.985); }

.big { font-size: 34px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kv { display: flex; gap: 10px; margin-top: 8px; font-size: 15px; }
.kv .k { color: var(--fg-2); flex: 0 0 auto; min-width: 64px; }
.kv .v { flex: 1 1 auto; }

.row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  background: transparent;
  border: 0;
  color: var(--fg);
  font: inherit;
  font-size: 15.5px;
  text-align: left;
  padding: 10px 0;
  cursor: pointer;
  min-height: 44px;
}
.box {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  margin-top: 2px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  line-height: 20px;
  text-align: center;
  font-size: 13px;
  color: transparent;
}
.box.on { background: var(--brand); border-color: var(--brand); color: #fff; }
@media (prefers-color-scheme: dark) { .box.on { color: #06201e; } }
.row .name { flex: 0 0 auto; min-width: 80px; font-weight: 500; }
.row .ask { flex: 1 1 auto; color: var(--fg-2); font-size: 14.5px; }

.word { font-size: 28px; font-weight: 700; letter-spacing: 0.4px; }
.wordline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ipa { font-family: ui-monospace, Consolas, Menlo, monospace; color: var(--fg-2); font-size: 15px; margin: 6px 0; }
.zh { font-size: 16px; }
.colloc { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; font-size: 15px; }
.colloc b { display: block; color: var(--fg-2); font-size: 12.5px; margin-bottom: 3px; }

.flipcard { cursor: pointer; }

.foot { color: var(--fg-2); font-size: 12.5px; text-align: center; padding: 8px 0 0; line-height: 1.7; }

@media (min-width: 700px) {
  :root { --font: 16px; --pad: 20px; }
  .card { padding: 18px 20px; }
  .q { font-size: 17px; }
}


/* 教材依据：引用块 + 原文高亮 */
.cite {
  display: block;
  margin-top: 12px;
  padding: 10px 12px;
  border-left: 3px solid var(--brand);
  background: var(--surface-2);
  border-radius: 0 10px 10px 0;
  font-size: 0.94em;
  line-height: 1.65;
  color: var(--fg-2);
}
.cite .quote {
  color: var(--fg);
  font-weight: 700;
  background: color-mix(in srgb, var(--brand) 14%, transparent);
  padding: 1px 4px;
  border-radius: 4px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
</style>
</head>

 ml/min","50 ml/min","25 ml/min","75 ml/min"],"a":1,"e":"GFR ≈ 125 ml/min，滤过分数 = GFR / 肾血浆流量 ≈ 19%。GFR 下降是评价肾功能最早、最敏感的指标之一。"},{"id":"x4","k":"生理","q":"突触前抑制产生的主要机制是","o":["突触后膜去极化","突触后膜超极化","突触前末梢递质释放减少","突触后膜受体下调","递质被酶降解"],"a":2,"e":"轴突-轴突式突触使突触前末梢部分去极化，动作电位幅度减小，Ca²⁺ 内流减少，递质释放量下降。与突触后抑制（IPSP）区别开。"},{"id":"x5","k":"生化","q":"糖酵解途径的关键限速酶是","o":["己糖激酶","丙酮酸激酶","醛缩酶","乳酸脱氢酶","磷酸果糖激酶-1"],"a":4,"e":"三个关键酶是己糖激酶、PFK-1、丙酮酸激酶，其中 PFK-1 最重要：被 ATP、柠檬酸抑制，被 AMP、果糖-2,6-二磷酸激活。"},{"id":"x6","k":"生化","q":"三羧酸循环中发生底物水平磷酸化的反应是","o":["苹果酸→草酰乙酸","异柠檬酸→α-酮戊二酸","柠檬酸→异柠檬酸","琥珀酰 CoA→琥珀酸","α-酮戊二酸→琥珀酰 CoA"],"a":3,"e":"琥珀酰 CoA 合成酶催化，生成 GTP（能量上等同 ATP）。其余三步是氧化脱羧或脱氢，生成 NADH/FADH₂。"},{"id":"x7","k":"生化","q":"尿素合成的主要器官及限速酶是","o":["肾，谷氨酰胺酶","脑，谷氨酸脱氢酶","肌肉，转氨酶","肝，氨甲酰磷酸合成酶Ⅱ","肝，氨甲酰磷酸合成酶Ⅰ"],"a":4,"e":"鸟氨酸循环在肝细胞进行。CPS-Ⅰ 位于线粒体、需 N-乙酰谷氨酸激活，是限速酶；CPS-Ⅱ 参与嘧啶合成，别混。"},{"id":"x8","k":"生化","q":"酮体合成的部位和利用的部位分别是","o":["肝、肝外组织","肝外组织、肝","肝、肝","肌肉、肝","肾、肝"],"a":0,"e":"肝缺乏琥珀酰 CoA 转硫酶，只能生成酮体不能利用，是\"肝生酮、肝外用酮\"的酶学基础。酮体 = 乙酰乙酸 + β-羟丁酸 + 丙酮。"},{"id":"x9","k":"病理","q":"细胞水肿最主要的机制是","o":["细胞骨架断裂","细胞膜钠泵功能障碍","溶酶体破裂","细胞内蛋白质分解","细胞内脂肪堆积"],"a":1,"e":"缺氧、感染、中毒使 ATP 减少，Na⁺-K⁺-ATP 酶功能下降，细胞内 Na⁺ 和水增多。是 reversible injury 最早的表现。"},{"id":"x10","k":"病理","q":"肉芽组织的主要成分是","o":["平滑肌细胞和弹性纤维","新生毛细血管、成纤维细胞和炎细胞","淋巴细胞和浆细胞","上皮样细胞和朗汉斯巨细胞","胶原纤维和成纤维细胞"],"a":1,"e":"肉芽组织 = 新生毛细血管 + 成纤维细胞 + 炎细胞（以巨噬细胞为主），无神经末梢，后期机化为瘢痕。"},{"id":"x11","k":"病理","q":"血栓形成最重要的条件是","o":["心血管内膜损伤","血液黏稠度增加","血流缓慢","涡流形成","血小板数量增多"],"a":0,"e":"Virchow 三要素中，内膜损伤最重要也最常见：暴露内皮下胶原，启动血小板黏附与聚集。"},{"id":"x12","k":"病理","q":"下列器官的梗死属于出血性梗死的是","o":["脾","肝","心","肺","肾"],"a":3,"e":"肺、肠组织疏松且有双重血供，梗死时血液渗入坏死组织 → 出血性梗死；心、肾、脾组织致密 → 贫血性梗死。"},{"id":"x13","k":"内科","q":"诊断 COPD 的金标准是","o":["吸入支气管扩张剂后 FEV₁/FVC < 70%","弥散功能下降","残气量增加","血气 PaO₂ < 60 mmHg","胸片见肺气肿"],"a":0,"e":"持续气流受限是诊断的必需条件。GOLD 分级再按 FEV₁ 占预计值百分比分 1—4 级，两者别混。"},{"id":"x14","k":"内科","q":"支气管哮喘急性发作时首选的缓解药物是","o":["吸入短效 β₂ 受体激动剂","白三烯受体拮抗剂","口服茶碱","色甘酸钠","吸入糖皮质激素"],"a":0,"e":"SABA（沙丁胺醇）起效最快，属缓解药；ICS 是控制药，不能用于急救。这是\"缓解 vs 控制\"最经典的考点。"},{"id":"x15","k":"内科","q":"急性心肌梗死时最早升高的血清标志物是","o":["肌钙蛋白 I","CK-MB","乳酸脱氢酶","天门冬氨酸氨基转移酶","肌红蛋白"],"a":4,"e":"肌红蛋白 2 小时即升高但特异性差；cTnI 3—4 小时升高、持续 7—14 天，是确诊首选。考\"最早\"选肌红蛋白，考\"最特异\"选 cTnI。"},{"id":"x16","k":"内科","q":"高血压合并糖尿病患者的首选降压药是","o":["α 受体阻滞剂","β 受体阻滞剂","噻嗪类利尿剂","ACEI 或 ARB","中枢性降压药"],"a":3,"e":"ACEI/ARB 兼具降压与肾保护，是糖尿病合并高血压、尤其有蛋白尿者的首选。用药后监测血钾与肌酐。"},{"id":"x17","k":"内科","q":"消化性溃疡最主要的病因是","o":["精神应激","NSAIDs","幽门螺杆菌感染","胃酸分泌过多","吸烟"],"a":2,"e":"Hp 感染是胃溃疡和十二指肠溃疡最主要的病因，根除 Hp 可显著降低复发率。NSAIDs 是第二位。"},{"id":"x18","k":"内科","q":"肝硬化最常见的并发症是","o":["上消化道出血","肝性脑病","自发性细菌性腹膜炎","原发性肝癌","肝肾综合征"],"a":0,"e":"最常见并发症是上消化道出血（食管胃底静脉曲张破裂）；最常见死因是肝性脑病。两个\"最\"要分开记。"},{"id":"x19","k":"内科","q":"下列哪项不属于肾病综合征的诊断标准","o":["水肿","血浆白蛋白 < 30 g/L","血尿","高脂血症","尿蛋白 > 3.5 g/d"],"a":2,"e":"四条标准：大量蛋白尿、低白蛋白血症（前两条为必备）、水肿、高脂血症。血尿提示肾炎综合征，不是诊断标准。"},{"id":"x20","k":"内科","q":"甲状腺功能亢进症最常见的病因是","o":["亚急性甲状腺炎","垂体 TSH 瘤","毒性多结节性甲状腺肿","碘甲亢","Graves 病"],"a":4,"e":"Graves 病占甲亢 80%—85%，由 TRAb 刺激 TSH 受体所致，伴弥漫性肿大和血管杂音，可有突眼。"},{"id":"x21","k":"内科","q":"糖尿病诊断标准中，空腹血糖的切点是","o":["≥ 13.9 mmol/L","≥ 7.0 mmol/L","≥ 6.1 mmol/L","≥ 7.8 mmol/L","≥ 11.1 mmol/L"],"a":1,"e":"空腹 ≥7.0，OGTT 2h 或随机 ≥11.1，HbA1c ≥6.5%。6.1—7.0 是空腹血糖受损，属于糖尿病前期。"},{"id":"x22","k":"内科","q":"缺铁性贫血最可靠的实验室指标是","o":["小细胞低色素","血清铁降低","转铁蛋白饱和度降低","总铁结合力升高","血清铁蛋白降低"],"a":4,"e":"铁蛋白反映储存铁，<12—15 μg/L 可诊断缺铁；骨髓铁染色是金标准但有创。血清铁易受日内波动和炎症影响。"},{"id":"x23","k":"外科","q":"休克晚期微循环的变化是","o":["微血栓形成、DIC","毛细血管网缺血","动静脉短路开放","毛细血管前括约肌收缩","微动脉收缩"],"a":0,"e":"休克三期：微循环收缩期（代偿）→ 扩张期（淤血、回心血量减少）→ 衰竭期（DIC、细胞损伤、多器官衰竭）。"},{"id":"x24","k":"外科","q":"治疗等渗性缺水首选","o":["3% 氯化钠","5% 葡萄糖","平衡盐溶液","10% 葡萄糖","5% 碳酸氢钠"],"a":2,"e":"等渗性缺水补等渗液，平衡盐溶液（乳酸钠林格液）最接近细胞外液。只补 5% 葡萄糖会把细胞外液稀释成低钠血症。"},{"id":"x25","k":"外科","q":"急性阑尾炎最常见的病因是","o":["胃肠道功能紊乱","细菌直接侵入","遗传因素","阑尾腔阻塞","阑尾血运障碍"],"a":3,"e":"管腔阻塞（粪石、淋巴滤泡增生）→ 分泌物潴留、腔内压升高、血运障碍 → 继发感染，这是发病链条的起点。"},{"id":"x26","k":"外科","q":"乳腺癌最常见的转移途径是","o":["沿神经鞘转移","直接蔓延","种植转移","血道转移","淋巴道转移"],"a":4,"e":"癌多经淋巴道转移，最先到腋窝淋巴结，这也是腋窝淋巴结清扫和分期的依据；肉瘤多经血道。"},{"id":"x27","k":"外科","q":"甲状腺手术后最危急的并发症是","o":["甲状腺危象","手足抽搐","切口感染","喉返神经损伤","呼吸困难和窒息"],"a":4,"e":"术后 48 小时内切口内出血形成血肿压迫气管，可迅速窒息致死，必须床旁立即拆线、清除血肿。其余并发症不立即致命。"},{"id":"x28","k":"外科","q":"股骨颈骨折最常见的晚期并发症是","o":["髋关节脱位","骨化性肌炎","创伤性关节炎","股骨头缺血性坏死","坐骨神经损伤"],"a":3,"e":"股骨头血供主要来自旋股内侧动脉，骨折（尤其囊内型、移位型）易破坏血供 → 缺血坏死与不愈合，这也是高龄移位型直接做置换的理由。"},{"id":"x29","k":"外科","q":"张力性气胸的急救首选","o":["高流量吸氧","开胸探查","胸腔闭式引流","气管插管","立即患侧锁骨中线第 2 肋间穿刺排气"],"a":4,"e":"张力性气胸是\"先救命后诊断\"，穿刺排气几秒内可缓解；闭式引流是后续确定性处理，不能等。"},{"id":"x30","k":"人文","q":"医师进行临床试验、人体实验性治疗时，最重要的伦理要求是","o":["不收取费用","事后向患者说明","经科室主任批准","由高年资医师操作","取得患者本人或家属的知情同意"],"a":4,"e":"知情同意是人体实验的核心伦理要求，须经伦理委员会批准并取得书面同意，且患者有权随时退出。"},{"id":"x31","k":"内科","src":"restore","q":"急性 ST 段抬高型心梗发病 12 小时内，预计 PCI 延迟超过 120 分钟，应选择","o":["继续等待 PCI","立即溶栓（无禁忌）","主动脉内球囊反搏","仅药物保守治疗","急诊冠脉搭桥"],"a":1,"e":"再灌注时间决定心肌存活，\"时间就是心肌\"。溶栓后仍应尽快转运至 PCI 中心；有溶栓禁忌或心源性休克时优先转运。"},{"id":"x32","k":"内科","src":"restore","q":"支气管哮喘长期控制的首选药物是","o":["吸入糖皮质激素","口服茶碱","白三烯受体拮抗剂","色甘酸钠","沙丁胺醇"],"a":0,"e":"ICS 是控制药，需长期规律吸入；SABA 是缓解药，只在发作时用。把缓解药当控制药用是考试与临床的双重高频错。"},{"id":"x33","k":"外科","src":"restore","q":"急性化脓性梗阻性胆管炎（AOSC）最关键的治疗是","o":["大剂量抗生素","保肝治疗","解痉止痛","紧急胆道减压引流","输血"],"a":3,"e":"Charcot 三联征（腹痛、寒战高热、黄疸）+ 休克 + 意识障碍 = Reynolds 五联征。核心是解除梗阻、引流胆道，抗生素只是辅助。"},{"id":"x34","k":"外科","src":"restore","q":"甲状腺大部切除术后 24 小时内出现呼吸困难，最常见的原因是","o":["气管塌陷","喉头水肿","切口内出血形成血肿","双侧喉返神经损伤","痰液堵塞"],"a":2,"e":"术后 48 小时内的窒息多由血肿压迫所致，必须床旁立即拆线、清除血肿；气管塌陷多见于巨大甲状腺肿长期压迫气管软化者。"},{"id":"x35","k":"生理","src":"restore","q":"血浆胶体渗透压升高时，肾小球滤过率如何变化","o":["不变","无法判断","升高","先升后降","降低"],"a":4,"e":"有效滤过压 = 肾小球毛细血管血压 −（血浆胶体渗透压 + 囊内压）。胶体渗透压升高 → 有效滤过压下降 → GFR 降低。"},{"id":"x36","k":"病理","src":"restore","q":"判断肿瘤良恶性最重要的组织学依据是","o":["肿瘤大小","有无转移","有无包膜","异型性","生长速度"],"a":3,"e":"异型性是组织学判断良恶性的基础；转移是恶性最可靠的生物学证据，但属行为学而非组织学。题目问\"组织学依据\"就选异型性。"},{"id":"x37","k":"生化","src":"restore","q":"体内氨的主要去路是","o":["生成铵盐排出","合成尿素","合成谷氨酰胺","参与嘌呤合成","合成非必需氨基酸"],"a":1,"e":"肝内鸟氨酸循环合成尿素是氨的主要去路；谷氨酰胺是氨的运输形式与脑/肌肉的解毒方式，不是主要终产物。"},{"id":"x38","k":"内科","src":"restore","q":"2 型糖尿病患者，无禁忌证时首选的口服降糖药是","o":["磺脲类","DPP-4 抑制剂","α-糖苷酶抑制剂","胰岛素","二甲双胍"],"a":4,"e":"二甲双胍为一线首选，尤其超重/肥胖者；不增加体重、低血糖风险小。eGFR<30 禁用，造影前后需停用。"},{"id":"x39","k":"生理","q":"肺牵张反射（Hering-Breuer 反射）的传入神经是","o":["迷走神经","交感神经","舌咽神经","肋间神经","膈神经"],"a":0,"e":"肺扩张时兴奋肺牵张感受器，经迷走神经传入，抑制吸气、使吸气转为呼气；肺缩小则相反。"},{"id":"x40","k":"外科","q":"腹股沟斜疝与直疝鉴别最可靠的体征是","o":["压迫内环后疝块是否突出","疝块形状","是否进入阴囊","是否容易嵌顿","患者年龄"],"a":0,"e":"斜疝经内环突出，压迫内环后不再突出；直疝从直疝三角突出，压迫内环仍可突出。这是解剖决定的，最可靠。"},{"k":"生理","q":"钠泵每分解 1 分子 ATP，可转运的离子数是","o":["3 个 Na⁺ 移出、2 个 K⁺ 移入","2 个 Na⁺ 移出、3 个 K⁺ 移入","3 个 Na⁺ 移入、2 个 K⁺ 移出","1 个 Na⁺ 移出、1 个 K⁺ 移入","2 个 Na⁺ 移出、2 个 K⁺ 移入"],"a":0,"e":"钠泵（Na⁺-K⁺-ATP 酶）每分解 1 分子 ATP，逆浓度梯度转运 3 个 Na⁺ 出细胞、2 个 K⁺ 入细胞，是生电性泵。","id":"x41"},{"k":"生理","q":"神经细胞静息电位的数值接近于","o":["Na⁺ 平衡电位","K⁺ 平衡电位","Cl⁻ 平衡电位","Ca²⁺ 平衡电位","Na⁺ 与 K⁺ 平衡电位之差"],"a":1,"e":"安静时膜主要对 K⁺ 通透，静息电位接近 K⁺ 平衡电位（约 -70 mV），略低于 E_K 是因少量 Na⁺ 内流。","id":"x42"},{"k":"生理","q":"神经纤维动作电位去极相的形成主要是由于","o":["K⁺ 外流","Na⁺ 内流","Cl⁻ 内流","Ca²⁺ 内流","Na⁺-K⁺ 泵活动增强"],"a":1,"e":"阈刺激使 Na⁺ 通道大量开放，Na⁺ 内流形成去极相（超射达 Na⁺ 平衡电位）；复极相靠 K⁺ 外流。","id":"x43"},{"k":"生理","q":"骨骼肌兴奋-收缩耦联中起关键作用的离子是","o":["Na⁺","K⁺","Ca²⁺","Cl⁻","Mg²⁺"],"a":2,"e":"动作电位沿 T 管传至三联管，触发肌浆网释放 Ca²⁺，与肌钙蛋白结合引起横桥摆动；舒张时 Ca²⁺ 被泵回肌浆网。","id":"x44"},{"k":"生理","q":"反映红细胞悬浮稳定性的指标是","o":["红细胞比容","红细胞沉降率","血红蛋白浓度","平均红细胞体积","网织红细胞计数"],"a":1,"e":"血沉（ESR）反映红细胞悬浮稳定性。血沉加快常见于活动性结核、风湿热、恶性肿瘤及妊娠。","id":"x45"},{"k":"生理","q":"血浆晶体渗透压的主要形成物质是","o":["白蛋白","球蛋白","Na⁺","葡萄糖","尿素"],"a":2,"e":"晶体渗透压主要由 Na⁺、Cl⁻ 等晶体物质形成，调节细胞内外水平衡；胶体渗透压主要由白蛋白形成，调节血管内外水平衡。","id":"x46"},{"k":"生理","q":"心室肌细胞动作电位平台期的形成主要与下列哪项有关","o":["Na⁺ 内流与 K⁺ 外流","Ca²⁺ 内流与 K⁺ 外流","Cl⁻ 内流","Na⁺-K⁺ 泵活动","Ca²⁺ 外流"],"a":1,"e":"平台期（2 期）由 L 型 Ca²⁺ 通道内流与 K⁺ 外流（I_K、I_K1）相对平衡形成，是心室肌不应期长、不发生强直收缩的基础。","id":"x47"},{"k":"生理","q":"窦房结细胞 4 期自动去极化的主要离子基础是","o":["I_f 进行性增强","I_K 进行性衰减","T 型 Ca²⁺ 通道开放","Na⁺ 背景电流","Na⁺-K⁺ 泵抑制"],"a":0,"e":"窦房结 P 细胞 4 期 If（funny current，主要 Na⁺ 内流）进行性增强，是自动节律性的主要原因；I_K 衰减和 T 型钙通道也参与。","id":"x48"},{"k":"生理","q":"心率加快时，心动周期缩短最明显的是","o":["心房收缩期","心室收缩期","等容收缩期","心室舒张期","快速射血期"],"a":3,"e":"心率加快时收缩期和舒张期均缩短，但舒张期缩短更明显，导致心室充盈时间减少，心输出量可下降。","id":"x49"},{"k":"生理","q":"心输出量等于","o":["搏出量 × 心率","搏出量 ÷ 心率","每分通气量 × 心率","射血分数 × 心率","心室舒张末期容积 × 心率"],"a":0,"e":"心输出量 = 每搏输出量 × 心率。健康成人安静时约 5 L/min。","id":"x50"},{"k":"生理","q":"正常成人的射血分数约为","o":["35%～45%","45%～55%","55%～65%","65%～75%","75%～85%"],"a":2,"e":"射血分数 = 搏出量/心室舒张末期容积，正常 55%～65%。它比搏出量更能反映心室泵血效率，心衰时降低。","id":"x51"},{"k":"生理","q":"动脉血压的压力感受性反射中，最重要的感受器位于","o":["主动脉弓","颈动脉窦","心肺感受器","肾小球旁器","化学感受器"],"a":1,"e":"颈动脉窦和主动脉弓压力感受器参与减压反射，其中颈动脉窦敏感性更高，是短时血压调节的主要环节。","id":"x52"},{"k":"生理","q":"肺泡表面活性物质的主要作用是","o":["增加肺泡表面张力","降低肺泡表面张力，防止肺不张","促进 O₂ 扩散","收缩支气管","增加肺顺应性以外的弹性阻力"],"a":1,"e":"表面活性物质由Ⅱ型肺泡上皮细胞分泌，主要成分是二棕榈酰卵磷脂（DPPC），降低表面张力，维持肺泡稳定性、防止肺水肿。","id":"x53"},{"k":"生理","q":"肺泡通气量的计算公式是","o":["潮气量 × 呼吸频率","（潮气量 - 无效腔气量）× 呼吸频率","肺活量 × 呼吸频率","（肺活量 - 残气量）× 呼吸频率","每分通气量 - 残气量"],"a":1,"e":"肺泡通气量 =（潮气量 - 无效腔气量）× 呼吸频率，是真正参与气体交换的通气量。浅快呼吸时肺泡通气量明显下降。","id":"x54"},{"k":"生理","q":"正常成人安静时的通气/血流比值约为","o":["0.48","0.64","0.84","1.24","1.84"],"a":2,"e":"VA/Q 正常约 0.84。比值增大相当于无效腔增大，减小相当于功能性分流，均影响气体交换效率。","id":"x55"},{"k":"生理","q":"氧解离曲线右移见于","o":["pH 升高","PCO₂ 降低","温度降低","2,3-DPG 增加","Hb 浓度升高"],"a":3,"e":"曲线右移（P50 增大）表示 Hb 对 O₂ 亲和力降低、释氧增加，见于 PCO₂↑、pH↓（Bohr 效应）、温度↑、2,3-DPG↑。","id":"x56"},{"k":"生理","q":"促进胃酸分泌的主要胃肠激素是","o":["促胰液素","缩胆囊素","胃泌素","抑胃肽","血管活性肠肽"],"a":2,"e":"胃泌素由 G 细胞分泌，刺激壁细胞分泌盐酸、促进胃蛋白酶原分泌和胃窦收缩。促胰液素和抑胃肽则抑制胃酸分泌。","id":"x57"},{"k":"生理","q":"消化液中消化力最强、能消化三大营养物质的是","o":["胃液","胰液","胆汁","小肠液","唾液"],"a":1,"e":"胰液含胰淀粉酶、胰脂肪酶、胰蛋白酶原等，能消化糖、脂肪和蛋白质，是消化力最强的消化液。","id":"x58"},{"k":"生理","q":"胆汁中参与脂肪消化吸收的主要成分是","o":["胆色素","胆固醇","胆盐","卵磷脂","黏蛋白"],"a":2,"e":"胆盐乳化脂肪，形成混合微胶粒促进脂肪和脂溶性维生素吸收；胆盐还能促进胆汁自身分泌（胆盐的肠肝循环）。","id":"x59"},{"k":"生理","q":"基础代谢率明显升高最常见于","o":["甲状腺功能亢进","肾上腺皮质功能减退","垂体前叶功能减退","肾病综合征","病态窦房结综合征"],"a":0,"e":"甲状腺激素是调节基础代谢率最重要的激素，甲亢时 BMR 可升高 25%～80%；甲减时降低。","id":"x60"},{"k":"生理","q":"正常成人肾糖阈约为","o":["80 mg/100 ml","100 mg/100 ml","180 mg/100 ml","280 mg/100 ml","360 mg/100 ml"],"a":2,"e":"肾糖阈约 180 mg/100 ml（10 mmol/L），即近端小管葡萄糖重吸收达极限时的血糖浓度，超过此值出现糖尿。","id":"x61"},{"k":"生理","q":"原尿中 65%～70% 的水和 Na⁺ 在下列哪一部位被重吸收","o":["近端小管","髓袢降支细段","髓袢升支粗段","远曲小管","集合管"],"a":0,"e":"近端小管重吸收约 65%～70% 的水和 Na⁺，是重吸收的主要部位，且为等渗性重吸收。","id":"x62"},{"k":"生理","q":"髓袢升支粗段对 NaCl 的重吸收方式主要是","o":["Na⁺ 单纯扩散","Na⁺-K⁺-2Cl⁻ 同向转运","Na⁺-H⁺ 交换","Na⁺-葡萄糖同向转运","Cl⁻-HCO₃⁻ 交换"],"a":1,"e":"升支粗段通过 Na⁺-K⁺-2Cl⁻ 同向转运体主动重吸收 NaCl，对水不通透，形成外髓高渗，是尿浓缩的基础；呋塞米即作用于该转运体。","id":"x63"},{"k":"生理","q":"抗利尿激素（ADH）的主要作用部位是","o":["近端小管","髓袢降支细段","髓袢升支粗段","远曲小管","集合管"],"a":4,"e":"ADH 作用于集合管 V₂ 受体，增加水通道 AQP2 插入，促进水重吸收。尿崩症即 ADH 缺乏或受体不敏感。","id":"x64"},{"k":"生理","q":"醛固酮的主要作用是","o":["保钠排钾","保钾排钠","促进水排泄","抑制 H⁺ 分泌","降低血压"],"a":0,"e":"醛固酮作用于远曲小管和集合管，促进 Na⁺ 重吸收、K⁺ 和 H⁺ 分泌（保钠排钾），并伴水重吸收增加。","id":"x65"},{"k":"生理","q":"突触后抑制产生的主要机制是","o":["突触后膜超极化产生 IPSP","突触前末梢去极化","突触前递质释放增加","突触后膜 Na⁺ 通道大量开放","突触前膜 Cl⁻ 通道开放"],"a":0,"e":"突触后抑制由抑制性中间神经元释放 GABA 或甘氨酸，使突触后膜 Cl⁻ 通道开放、产生 IPSP（超极化），分传入侧支性抑制和回返性抑制。","id":"x66"},{"k":"生理","q":"反射弧的五个组成部分不包括","o":["感受器","传入神经","神经中枢","效应器","突触"],"a":4,"e":"反射弧由感受器、传入神经、神经中枢、传出神经和效应器组成。突触是神经元间的连接结构，不是反射弧的独立组成部分。","id":"x67"},{"k":"生理","q":"促进骨骼生长的主要激素是","o":["生长激素","甲状腺激素","胰岛素","糖皮质激素","性激素"],"a":0,"e":"生长激素（GH）经 IGF-1 介导促进骨骺软骨增殖和骨生长；幼年 GH 缺乏致侏儒症，过多致巨人症。甲状腺激素和性激素也参与，但 GH 最关键。","id":"x68"},{"k":"生理","q":"胰岛素的生理作用不包括","o":["促进葡萄糖摄取和利用","促进糖原合成","抑制糖异生","促进脂肪合成","促进蛋白质分解"],"a":4,"e":"胰岛素促进糖、脂肪、蛋白质的合成与储存，抑制它们的分解（包括抑制蛋白质分解）。","id":"x69"},{"k":"生理","q":"女性月经周期中，排卵后形成黄体并分泌大量","o":["雌激素","孕激素","雄激素","促卵泡激素","催乳素"],"a":1,"e":"排卵后卵泡形成黄体，分泌孕激素和雌激素，以孕激素为主，使子宫内膜进入分泌期，为受精卵着床做准备。","id":"x70"},{"k":"病理","q":"脂肪变最常发生的器官是","o":["心","肝","脾","肺","脑"],"a":1,"e":"肝是脂肪代谢的重要场所，最常发生脂肪变（脂肪肝）。镜下肝细胞内出现脂滴空泡，重度时肝大、色黄、油腻感。","id":"x71"},{"k":"病理","q":"高血压患者脾中央动脉发生的玻璃样变属于","o":["细胞内玻璃样变","血管壁玻璃样变","结缔组织玻璃样变","淀粉样变","黏液样变"],"a":1,"e":"血管壁玻璃样变常见于高血压时的肾、脑、脾及视网膜细动脉，血浆蛋白渗入内膜下凝固，管壁增厚、腔窄，是高血压靶器官损伤的基础。","id":"x72"},{"k":"病理","q":"心肌梗死病灶的坏死类型是","o":["液化性坏死","凝固性坏死","干酪样坏死","纤维素样坏死","脂肪坏死"],"a":1,"e":"心肌梗死属凝固性坏死，坏死组织干燥、灰白或灰黄、质实，镜下细胞结构消失但组织轮廓可保留一段时间。","id":"x73"},{"k":"病理","q":"脑梗死病灶的坏死类型是","o":["凝固性坏死","液化性坏死","干酪样坏死","纤维素样坏死","脂肪坏死"],"a":1,"e":"脑组织含脂质多、蛋白少，坏死后易被溶解液化形成软化灶，属液化性坏死。脓肿也属液化性坏死。","id":"x74"},{"k":"病理","q":"结核病的典型坏死类型是","o":["凝固性坏死","液化性坏死","干酪样坏死","纤维素样坏死","脂肪坏死"],"a":2,"e":"干酪样坏死是结核病的特征性病变，坏死组织呈淡黄色、均匀细腻似奶酪，镜下为红染无结构颗粒状物。","id":"x75"},{"k":"病理","q":"风湿病和结节性多动脉炎的典型坏死类型是","o":["凝固性坏死","液化性坏死","干酪样坏死","纤维素样坏死","脂肪坏死"],"a":3,"e":"纤维素样坏死见于结缔组织病（风湿病、类风湿、SLE、结节性多动脉炎）和急进性高血压，镜下呈细丝状、颗粒状红染物，似纤维素。","id":"x76"},{"k":"病理","q":"凋亡与坏死相比，凋亡的特征是","o":["细胞肿胀破裂","凋亡小体形成、无炎症反应","核染色质边集伴膜破裂","常伴明显炎症","细胞器普遍肿胀"],"a":1,"e":"凋亡是程序性死亡：细胞皱缩、染色质凝聚、形成凋亡小体被吞噬，不引起炎症反应；坏死则细胞肿胀破裂、引发炎症。","id":"x77"},{"k":"病理","q":"长期吸烟者支气管黏膜上皮由假复层纤毛柱状上皮变为鳞状上皮，称为","o":["增生","肥大","化生","异型增生","萎缩"],"a":2,"e":"化生是一种分化成熟的上皮转变为另一种分化成熟的上皮（鳞状化生），是适应性反应，但可成为癌变基础。","id":"x78"},{"k":"病理","q":"慢性肝淤血时肝切面呈红黄相间的花纹状，称为","o":["脂肪肝","槟榔肝","肝硬化","淤血性脾肿大","肝细胞癌"],"a":1,"e":"慢性肝淤血时肝小叶中央区淤血呈暗红、周边区脂肪变呈黄色，红黄相间如槟榔切面，称槟榔肝。","id":"x79"},{"k":"病理","q":"慢性肺淤血时心衰细胞的主要成分是","o":["中性粒细胞","淋巴细胞","吞噬含铁血黄素的巨噬细胞","嗜酸性粒细胞","浆细胞"],"a":2,"e":"慢性肺淤血时红细胞漏出被巨噬细胞吞噬，血红蛋白分解为含铁血黄素，这种巨噬细胞称心衰细胞，见于左心衰竭。","id":"x80"},{"k":"病理","q":"混合血栓的组成成分是","o":["血小板小梁与红细胞交替","单纯血小板","单纯红细胞","纤维蛋白与白细胞","脂肪与钙盐"],"a":0,"e":"混合血栓由血小板小梁（白血栓部分）与红细胞（红血栓部分）交替构成，常见于静脉内延续性血栓的体部。","id":"x81"},{"k":"病理","q":"肺动脉栓塞最常见的栓子来源是","o":["下肢深静脉","左心房","主动脉粥样斑块","肠系膜静脉","门静脉"],"a":0,"e":"肺动脉栓塞 95% 以上来自下肢深静脉（股静脉、髂静脉），尤其陈旧性血栓；长期卧床是重要诱因。","id":"x82"},{"k":"病理","q":"下列器官的梗死属于贫血性梗死的是","o":["肺","肠","心、肾、脾","脑","阑尾"],"a":2,"e":"贫血性梗死发生在组织结构致密、侧支循环不丰富的器官，如心、肾、脾，梗死灶灰白。肺、肠因双重血供易发生出血性梗死。","id":"x83"},{"k":"病理","q":"炎症的基本病理变化不包括","o":["变质","渗出","增生","钙化","血管反应"],"a":3,"e":"炎症的基本病理变化是变质、渗出、增生。钙化属病理性钙盐沉积，不是炎症的基本环节。","id":"x84"},{"k":"病理","q":"区别渗出液与漏出液最重要的指标是","o":["外观颜色","蛋白含量与比重","pH 值","细胞数量","凝固性"],"a":1,"e":"渗出液蛋白含量高（>30 g/L）、比重大（>1.018）、细胞多、易凝固；漏出液蛋白低（<25 g/L）、比重小（<1.015），据此鉴别。","id":"x85"},{"k":"病理","q":"急性炎症早期浸润的主要炎细胞是","o":["淋巴细胞","浆细胞","中性粒细胞","嗜酸性粒细胞","巨噬细胞"],"a":2,"e":"急性炎症早期以中性粒细胞为主（6～24 小时达高峰），具有活跃的吞噬和杀菌能力；慢性炎症以淋巴细胞、浆细胞、巨噬细胞为主。","id":"x86"},{"k":"病理","q":"结核结节中的朗汉斯巨细胞主要来源于","o":["B 淋巴细胞","T 淋巴细胞","巨噬细胞融合","成纤维细胞","血管内皮细胞"],"a":2,"e":"朗汉斯巨细胞由多个巨噬细胞融合而成，核排列在胞质周边呈马蹄形，是结核性肉芽肿的特征，属慢性肉芽肿性炎。","id":"x87"},{"k":"病理","q":"蜂窝织炎的病变特点是","o":["局限性脓腔形成","弥漫性化脓性炎、与正常组织分界不清","肉芽肿形成","纤维素性炎","出血性炎"],"a":1,"e":"蜂窝织炎多由溶血性链球菌引起，透明质酸酶使炎症沿组织间隙弥漫扩散，常见于皮下、肌肉和阑尾，与正常组织分界不清。","id":"x88"},{"k":"病理","q":"判断肿瘤组织学类型的主要依据是","o":["肿瘤的大小","肿瘤的异型性","肿瘤的生长速度","肿瘤的分化方向","有无包膜"],"a":3,"e":"组织学类型依据肿瘤细胞的分化方向（如腺上皮→腺癌、鳞状上皮→鳞癌）；良恶性主要依据异型性，分级依据分化程度。","id":"x89"},{"k":"病理","q":"癌与肉瘤在转移途径上的主要区别是","o":["癌多经淋巴道转移，肉瘤多经血道转移","癌多经血道转移，肉瘤多经淋巴道","两者均只经淋巴道","两者均只经血道","癌不转移，肉瘤易转移"],"a":0,"e":"癌（上皮来源）多经淋巴道转移，肉瘤（间叶来源）多经血道转移。这是鉴别癌与肉瘤的重要线索之一。","id":"x90"},{"k":"病理","q":"下列属于癌前病变的是","o":["结肠腺瘤性息肉","急性阑尾炎","心肌梗死","肺气肿","肾小球肾炎"],"a":0,"e":"癌前病变包括黏膜白斑、结肠腺瘤性息肉、慢性萎缩性胃炎、子宫颈上皮内瘤变等，具有癌变潜在可能。","id":"x91"},{"k":"病理","q":"原位癌的定义是","o":["癌细胞突破基底膜浸润间质","癌细胞累及上皮全层但未突破基底膜","癌细胞转移至淋巴结","癌灶直径小于 1 cm","高分化癌"],"a":1,"e":"原位癌指上皮全层细胞异型增生、癌变，但未突破基底膜、无浸润和转移，属早期癌，预后好。","id":"x92"},{"k":"病理","q":"动脉粥样硬化的基本病变不包括","o":["脂纹","纤维斑块","粥样斑块","细小动脉纤维素样坏死","斑块内出血"],"a":3,"e":"动脉粥样硬化基本病变为脂纹、纤维斑块、粥样斑块及继发改变（出血、溃疡、钙化、血栓）。细小动脉纤维素样坏死见于急进性高血压。","id":"x93"},{"k":"病理","q":"良性高血压病最基本的病变是","o":["细动脉玻璃样变","大动脉粥样硬化","心肌肥大","脑出血","肾小球硬化"],"a":0,"e":"良性高血压的基本病变是全身细动脉玻璃样变（细小动脉硬化），进而引起心、脑、肾等靶器官损伤。","id":"x94"},{"k":"病理","q":"大叶性肺炎的典型病变分期依次为","o":["充血水肿期→红色肝样变期→灰色肝样变期→溶解消散期","充血水肿期→灰色肝样变期→红色肝样变期→消散期","渗出期→增生期→纤维化期","浆液期→化脓期→坏死期","充血期→坏死期→钙化期"],"a":0,"e":"大叶性肺炎由肺炎链球菌引起，分充血水肿期、红色肝样变期、灰色肝样变期、溶解消散期。红色肝样变期痰呈铁锈色。","id":"x95"},{"k":"病理","q":"肺癌中恶性程度最高、易早期转移的组织学类型是","o":["鳞状细胞癌","腺癌","小细胞癌","大细胞癌","类癌"],"a":2,"e":"小细胞癌属神经内分泌肿瘤，生长快、转移早、对化疗敏感但预后差，多位于肺门中央。","id":"x96"},{"k":"病理","q":"肝硬化时假小叶的结构特点是","o":["肝小叶结构完整","肝细胞排列成索、中央静脉缺如或偏位","汇管区结构正常","无纤维组织增生","肝细胞无异型"],"a":1,"e":"假小叶由纤维组织分割包绕肝细胞团形成，中央静脉缺如、偏位或有两个以上，肝细胞索排列紊乱，是肝硬化的特征性病变。","id":"x97"},{"k":"病理","q":"急进性肾小球肾炎的特征性病变是","o":["肾小球系膜增生","肾小球囊壁新月体形成","肾小球基底膜增厚","肾小管萎缩","肾间质纤维化"],"a":1,"e":"急进性肾小球肾炎（新月体性肾炎）特征是肾小球囊壁上皮细胞增生形成新月体，压迫毛细血管丛，临床表现为快速进展的肾衰竭。","id":"x98"},{"k":"病理","q":"慢性支气管炎并发肺气肿时，肺泡壁的主要改变是","o":["肺泡壁增厚","肺泡壁变薄、肺泡腔扩大","肺泡内渗出","肺泡壁纤维化","肺泡上皮增生"],"a":1,"e":"慢性支气管炎引起细支气管不完全阻塞，呼气时气体排出困难，肺泡内压升高，肺泡壁变薄、破裂融合，形成肺气肿。","id":"x99"},{"k":"病理","q":"急性炎症时血管通透性升高的主要机制是","o":["血管收缩","内皮细胞收缩和间隙增宽","淋巴回流受阻","血浆胶体渗透压升高","组织液静水压下降"],"a":1,"e":"急性炎症时组胺、缓激肽等使内皮细胞收缩、细胞间隙增宽，通透性升高，富含蛋白的液体渗出，形成渗出液。","id":"x100"},{"k":"病理","q":"肉芽肿性炎的主要细胞成分是","o":["中性粒细胞","上皮样细胞和多核巨细胞","浆细胞","嗜酸性粒细胞","肥大细胞"],"a":1,"e":"肉芽肿由巨噬细胞及其演化的上皮样细胞和多核巨细胞（朗汉斯巨细胞、异物巨细胞）构成，常见于结核、结节病、异物反应。","id":"x101"},{"k":"内科","q":"慢性心力衰竭患者，提示心室壁张力增高的血浆标志物是","o":["肌钙蛋白 I","BNP 或 NT-proBNP","D-二聚体","C 反应蛋白","降钙素原"],"a":1,"e":"心室壁张力增高时心肌细胞分泌 BNP/NT-proBNP，用于心衰的诊断、分级和预后判断；NT-proBNP 半衰期更长、更稳定。","id":"x102"},{"k":"内科","q":"非瓣膜性房颤患者预防血栓栓塞，目前推荐首选的口服抗凝药是","o":["阿司匹林","氯吡格雷","华法林","新型口服抗凝药（如利伐沙班）","低分子肝素"],"a":3,"e":"非瓣膜性房颤优先选用新型口服抗凝药（DOAC，如利伐沙班、达比加群），较华法林颅内出血风险低、无需监测 INR。机械瓣或中重度二尖瓣狭窄仍需华法林。","id":"x103"},{"k":"内科","q":"社区获得性肺炎最常见的病原体是","o":["肺炎链球菌","金黄色葡萄球菌","铜绿假单胞菌","肺炎克雷伯菌","军团菌"],"a":0,"e":"社区获得性肺炎（CAP）最常见病原体为肺炎链球菌。医院获得性肺炎则以革兰阴性杆菌（铜绿假单胞菌、克雷伯菌）和金黄色葡萄球菌多见。","id":"x104"},{"k":"内科","q":"抗结核治疗的原则是","o":["早期、联合、适量、规律、全程","早期、单药、足量、短程","中期、联合、大剂量、长程","症状缓解即可停药","仅用异烟肼全程"],"a":0,"e":"抗结核治疗强调早期、联合、适量、规律、全程，标准方案为 2HRZE/4HR（异烟肼、利福平、吡嗪酰胺、乙胺丁醇）。","id":"x105"},{"k":"内科","q":"Ⅱ 型呼吸衰竭患者氧疗的原则是","o":["高浓度吸氧（>50%）","低浓度持续吸氧（<35%）","间断高浓度吸氧","纯氧吸入","不需吸氧"],"a":1,"e":"Ⅱ 型呼衰伴 CO₂ 潴留，高浓度吸氧会抑制呼吸中枢、加重 CO₂ 潴留，应低浓度（<35%）、低流量持续吸氧，使 PaO₂ 维持在 60 mmHg 左右。","id":"x106"},{"k":"内科","q":"急性肺血栓栓塞症筛检常用的血浆指标是","o":["D-二聚体","肌钙蛋白","BNP","降钙素原","乳酸"],"a":0,"e":"D-二聚体对肺栓塞有很高的阴性预测价值，阴性可基本排除；阳性需进一步行 CTPA 确诊。","id":"x107"},{"k":"内科","q":"上消化道出血最常见的病因是","o":["食管胃底静脉曲张破裂","急性糜烂出血性胃炎","消化性溃疡","胃癌","食管贲门黏膜撕裂"],"a":2,"e":"上消化道出血最常见病因为消化性溃疡（尤其十二指肠球部溃疡），其次为食管胃底静脉曲张破裂、急性胃黏膜病变和胃癌。","id":"x108"},{"k":"内科","q":"急性胰腺炎诊断中最常用的血清酶学指标是","o":["碱性磷酸酶","淀粉酶和脂肪酶","转氨酶","肌酸激酶","乳酸脱氢酶"],"a":1,"e":"血清淀粉酶和脂肪酶升高是急性胰腺炎的重要诊断依据，脂肪酶特异性更高、持续时间更长。淀粉酶升高程度与病情严重度不平行。","id":"x109"},{"k":"内科","q":"克罗恩病与溃疡性结肠炎鉴别，最具特征性的病变是","o":["病变连续性分布","病变呈节段性、全层炎","仅累及直肠","黏膜弥漫性溃疡","无肉芽肿形成"],"a":1,"e":"克罗恩病为节段性、透壁性炎症，可有非干酪性肉芽肿、裂隙状溃疡、鹅卵石样改变；溃疡性结肠炎病变连续、局限于黏膜层、自直肠向近端蔓延。","id":"x110"},{"k":"内科","q":"肝硬化患者发生肝性脑病最常见的诱因是","o":["上消化道出血","高蛋白饮食","感染","便秘","低钾性碱中毒"],"a":0,"e":"上消化道出血是肝性脑病最常见的诱因：血液在肠道分解产氨，同时低血容量加重肝肾功能损害。其他诱因包括高蛋白饮食、感染、便秘、低钾碱中毒。","id":"x111"},{"k":"内科","q":"急性肾损伤最常见的病理类型是","o":["急性肾小管坏死","急进性肾小球肾炎","急性间质性肾炎","肾动脉栓塞","肾皮质坏死"],"a":0,"e":"急性肾损伤（AKI）以急性肾小管坏死（ATN）最多见，常由缺血或肾毒性物质引起，表现为少尿、肌酐升高、尿钠增高。","id":"x112"},{"k":"内科","q":"慢性肾脏病患者发生肾性贫血的主要机制是","o":["铁摄入不足","促红细胞生成素（EPO）减少","叶酸缺乏","溶血","失血"],"a":1,"e":"肾脏是 EPO 的主要产生器官，慢性肾病时 EPO 生成减少导致肾性贫血，治疗用重组人 EPO 联合铁剂。","id":"x113"},{"k":"内科","q":"急性单纯性下尿路感染的首选治疗药物是","o":["万古霉素","喹诺酮类或第三代头孢","甲硝唑","阿昔洛韦","异烟肼"],"a":1,"e":"急性单纯性膀胱炎常用喹诺酮类（如左氧氟沙星）或第三代头孢，疗程 3～7 天；复杂或上尿路感染需延长疗程并根据药敏调整。","id":"x114"},{"k":"内科","q":"再生障碍性贫血的典型血象特点是","o":["全血细胞减少、网织红细胞降低","红细胞增多","白细胞增多","血小板增多","仅贫血"],"a":0,"e":"再障表现为全血细胞减少（贫血、感染、出血），网织红细胞绝对值降低，骨髓增生低下、脂肪化。","id":"x115"},{"k":"内科","q":"急性早幼粒细胞白血病（APL）的特异性融合基因是","o":["BCR-ABL","PML-RARA","AML1-ETO","MLL-AF9","NPM1"],"a":1,"e":"APL（M3）具有 t(15;17) 形成 PML-RARA 融合基因，全反式维甲酸（ATRA）和砷剂可诱导分化，治愈率高。BCR-ABL 见于慢粒。","id":"x116"},{"k":"内科","q":"霍奇金淋巴瘤的特征性细胞是","o":["R-S 细胞","小淋巴细胞","浆细胞","中性粒细胞","嗜酸性粒细胞"],"a":0,"e":"R-S 细胞（Reed-Sternberg 细胞）是霍奇金淋巴瘤的特征性肿瘤细胞，双核呈镜影状，CD15、CD30 阳性。","id":"x117"},{"k":"内科","q":"多发性骨髓瘤的典型临床表现不包括","o":["骨痛和溶骨性损害","贫血","肾功能损害","高钙血症","红细胞增多"],"a":4,"e":"多发性骨髓瘤的 CRAB 表现：高钙血症（C）、肾功能不全（R）、贫血（A）、骨病变（B）。不会出现红细胞增多。","id":"x118"},{"k":"内科","q":"原发性甲状腺功能减退症的首选治疗是","o":["左甲状腺素（L-T4）替代","抗甲状腺药物","放射性碘","甲状腺次全切除","碘剂"],"a":0,"e":"原发性甲减用左甲状腺素替代治疗，从小剂量开始、逐渐加量，老年及冠心病患者更需缓慢，定期监测 TSH 调整剂量。","id":"x119"},{"k":"内科","q":"库欣综合征最常用的定位检查是","o":["肾上腺 CT/MRI 及垂体 MRI","甲状腺超声","胸片","骨扫描","PET-CT"],"a":0,"e":"库欣综合征先定性（血皮质醇节律、小剂量地塞米松抑制试验），再定位：肾上腺 CT/MRI 查肾上腺病变，垂体 MRI 查垂体瘤（库欣病）。","id":"x120"},{"k":"内科","q":"原发性醛固酮增多症的典型表现是","o":["高血压伴低血钾","低血压伴高血钾","高血压伴高血钾","低血压伴低血钾","血压血钾均正常"],"a":0,"e":"原醛症因醛固酮过多导致保钠排钾，表现为高血压伴低血钾（肌无力、周期性麻痹），血浆醛固酮/肾素比值升高。","id":"x121"},{"k":"内科","q":"糖尿病酮症酸中毒治疗中，补钾的时机是","o":["立即补钾","尿量恢复后、血钾低于正常时补钾","全程不补钾","仅口服补钾","血钾高于 5.5 时补钾"],"a":1,"e":"DKA 时总体钾缺乏但血钾可正常或偏高，补液和胰岛素使钾向细胞内转移，故在尿量恢复（>40 ml/h）、血钾 <5.5 mmol/L 时开始补钾，<3.3 时先补钾后胰岛素。","id":"x122"},{"k":"内科","q":"低血糖症的 Whipple 三联征不包括","o":["低血糖症状","发作时血糖低于 2.8 mmol/L","供糖后症状迅速缓解","空腹血糖高于 7.0 mmol/L","症状与血糖水平相关"],"a":3,"e":"Whipple 三联征：①低血糖症状；②发作时血糖 <2.8 mmol/L；③供糖后症状迅速缓解。用于确认低血糖症。","id":"x123"},{"k":"内科","q":"急性痛风性关节炎发作时，首选的治疗药物是","o":["别嘌醇","非布司他","秋水仙碱或 NSAIDs","苯溴马隆","糖皮质激素口服长期"],"a":2,"e":"急性痛风发作首选秋水仙碱或 NSAIDs（如依托考昔），也可用糖皮质激素。降尿酸药（别嘌醇、非布司他、苯溴马隆）在急性期不开始，待缓解后使用。","id":"x124"},{"k":"内科","q":"类风湿关节炎最具诊断价值的自身抗体是","o":["抗 CCP 抗体","抗 dsDNA 抗体","抗 Sm 抗体","ANCA","抗线粒体抗体"],"a":0,"e":"抗环瓜氨酸肽（抗 CCP）抗体对类风湿关节炎特异性高（约 95%），可早期诊断；抗 dsDNA 和抗 Sm 抗体见于 SLE。","id":"x125"},{"k":"内科","q":"系统性红斑狼疮的标志性抗体是","o":["抗 Sm 抗体","抗 CCP 抗体","ANCA","抗 SSA 抗体","抗 Jo-1 抗体"],"a":0,"e":"抗 Sm 抗体是 SLE 的标志性抗体（特异性高但敏感性低）；抗 dsDNA 抗体与疾病活动度相关；抗 SSA/SSB 见于干燥综合征。","id":"x126"},{"k":"内科","q":"有机磷农药中毒时，能恢复胆碱酯酶活性的解毒药是","o":["阿托品","碘解磷定（解磷定）","纳洛酮","亚甲蓝","氟马西尼"],"a":1,"e":"阿托品阻断 M 受体、缓解毒蕈碱样症状；碘解磷定等肟类复能剂使胆碱酯酶复活，两者联合使用。","id":"x127"},{"k":"内科","q":"一氧化碳中毒时，血液中碳氧血红蛋白（COHb）升高，其最主要危害是","o":["携氧能力下降和组织缺氧","红细胞破坏","血小板减少","白细胞减少","凝血障碍"],"a":0,"e":"CO 与 Hb 亲和力约为 O₂ 的 240 倍，形成 COHb 使携氧能力下降，同时抑制细胞色素氧化酶，导致组织缺氧，脑和心肌最敏感。","id":"x128"},{"k":"内科","q":"成人高质量心肺复苏时，胸外按压的深度和频率应为","o":["2～3 cm，60～80 次/分","5～6 cm，100～120 次/分","6～7 cm，80～100 次/分","3～4 cm，120～140 次/分","4～5 cm，60 次/分"],"a":1,"e":"成人 CPR：按压深度 5～6 cm，频率 100～120 次/分，按压与通气比 30:2，每次按压后让胸廓充分回弹。","id":"x129"},{"k":"内科","q":"感染性休克早期（暖休克）的血流动力学特点是","o":["心输出量增加、外周阻力降低","心输出量降低、外周阻力升高","心输出量和外周阻力均降低","心输出量和外周阻力均升高","心输出量正常、外周阻力正常"],"a":0,"e":"感染性休克早期为分布性休克：炎症介质使外周血管扩张、阻力降低，心输出量代偿性增加（暖休克）；晚期可转为低动力型（冷休克）。","id":"x130"},{"k":"外科","q":"低钾血症典型的心电图改变是","o":["T 波高尖","U 波明显、T 波低平","P 波消失","QRS 增宽","ST 段抬高"],"a":1,"e":"低钾血症心电图表现为 T 波低平、ST 段下移、U 波明显（>0.1 mV）。高钾血症则 T 波高尖、QRS 增宽、P 波消失。","id":"x131"},{"k":"外科","q":"血钾 7.2 mmol/L 伴心电图改变，最紧急的处理是","o":["口服钾剂","静脉推注葡萄糖酸钙","静脉输注大量生理盐水","利尿","血液透析前先补钾"],"a":1,"e":"高钾血症危及生命时，首选 10% 葡萄糖酸钙静注稳定心肌膜电位，再用胰岛素+葡萄糖、碳酸氢钠促钾内移，必要时透析。","id":"x132"},{"k":"外科","q":"输血最严重的并发症是","o":["发热反应","过敏反应","溶血反应","循环超负荷","枸橼酸中毒"],"a":2,"e":"溶血反应是最严重的输血并发症，多因 ABO 血型不合，表现为寒战、高热、腰背痛、血红蛋白尿、休克和急性肾衰，应立即停止输血并抢救。","id":"x133"},{"k":"外科","q":"破伤风治疗的关键措施不包括","o":["彻底清创、切开引流","注射破伤风抗毒素中和游离毒素","大剂量青霉素杀灭病原菌","控制和解除痉挛","常规使用糖皮质激素"],"a":4,"e":"破伤风治疗：清创、TAT 中和游离毒素、青霉素杀菌、镇静解痉、防治并发症。糖皮质激素不是常规用药。","id":"x134"},{"k":"外科","q":"气性坏疽的致病菌主要是","o":["金黄色葡萄球菌","化脓性链球菌","产气荚膜梭菌","铜绿假单胞菌","大肠埃希菌"],"a":2,"e":"气性坏疽由产气荚膜梭菌等厌氧菌引起，表现为伤肢剧痛、肿胀、捻发音、恶臭，进展迅速，治疗以彻底清创（必要时截肢）+ 大剂量青霉素为主。","id":"x135"},{"k":"外科","q":"成人烧伤面积估计的九分法中，双下肢（含臀部）占体表面积的","o":["18%","27%","36%","46%","9%"],"a":3,"e":"中国九分法：头颈 9%，双上肢 18%，躯干 27%，双下肢含臀部 46%（成年男性），会阴 1%。","id":"x136"},{"k":"外科","q":"成人烧伤补液公式（第一个 24 小时）中，晶胶体总量通常按每 1% 烧伤面积每公斤体重计算","o":["0.5 ml","1.5 ml","2.5 ml","3.5 ml","5 ml"],"a":1,"e":"国内常用公式：第一个 24 小时补液量 = 烧伤面积（%）× 体重（kg）× 1.5 ml（晶胶体）+ 基础水分 2000 ml；前 8 小时输入半量。","id":"x137"},{"k":"外科","q":"甲亢患者术前服用碘剂的主要目的是","o":["抑制甲状腺激素合成","抑制甲状腺激素释放、减少腺体血供","增强麻醉效果","预防术后甲减","促进甲状腺激素合成"],"a":1,"e":"碘剂（复方碘化钾）抑制甲状腺激素释放，使腺体缩小变硬、血供减少，利于手术、减少出血；不能单独用于甲亢治疗。","id":"x138"},{"k":"外科","q":"甲状腺大部切除术后出现手足抽搐，最可能损伤的是","o":["喉返神经","喉上神经","甲状旁腺","气管","颈交感神经"],"a":2,"e":"甲状旁腺损伤导致低钙血症，表现为手足抽搐、Chvostek 征和 Trousseau 征阳性，治疗补充钙剂和维生素 D。","id":"x139"},{"k":"外科","q":"乳腺癌出现「橘皮样」改变的原因是","o":["癌细胞侵犯 Cooper 韧带","皮下淋巴管被癌栓阻塞致淋巴水肿","皮肤坏死","肿瘤内出血","脂肪坏死"],"a":1,"e":"癌细胞阻塞皮下淋巴管致淋巴回流障碍、真皮水肿，毛囊处凹陷形成橘皮样；Cooper 韧带受侵则形成「酒窝征」。","id":"x140"},{"k":"外科","q":"腹部闭合性损伤怀疑脾破裂时，最简便有效的诊断方法是","o":["腹部 CT","诊断性腹腔穿刺","腹部 X 线","B 超","血淀粉酶"],"a":1,"e":"诊断性腹腔穿刺简便、快速，抽出不凝血提示腹腔内出血，是腹部闭合性损伤的重要诊断手段；血流动力学稳定者可行 CT 明确。","id":"x141"},{"k":"外科","q":"机械性肠梗阻最重要的鉴别点是","o":["有无腹痛","有无呕吐","有无腹胀","有无肛门排气排便及肠绞窄征象","有无发热"],"a":3,"e":"肠梗阻鉴别关键是判断有无绞窄（肠管血运障碍）：持续剧痛、腹膜刺激征、血性腹水、发热、白细胞升高提示绞窄，需急诊手术。","id":"x142"},{"k":"外科","q":"胃癌最主要的转移途径是","o":["直接蔓延","淋巴道转移","血道转移","腹腔种植","神经束膜转移"],"a":1,"e":"胃癌以淋巴道转移为主，左锁骨上淋巴结（Virchow 淋巴结）转移有诊断意义；血道转移常见于肝，腹腔种植可形成 Krukenberg 瘤。","id":"x143"},{"k":"外科","q":"结直肠癌最常用的肿瘤标志物是","o":["AFP","CEA","CA19-9","PSA","CA125"],"a":1,"e":"CEA 对结直肠癌的辅助诊断、疗效监测和复发判断有价值，但特异性不高。AFP 用于肝癌，CA19-9 用于胰腺癌，PSA 用于前列腺癌。","id":"x144"},{"k":"外科","q":"胆囊结石引起胆绞痛的特点是","o":["右上腹持续性剧痛伴发热黄疸","饱餐或夜间突发右上腹阵发性绞痛、向右肩背放射","全腹压痛反跳痛","转移性右下腹痛","腰背部束带样疼痛"],"a":1,"e":"胆绞痛多在饱餐或夜间发作，右上腹阵发性绞痛、向右肩背部放射，可伴恶心呕吐；合并感染时出现发热、黄疸（Charcot 三联征）。","id":"x145"},{"k":"外科","q":"原发性肝癌最有诊断价值的血清标志物是","o":["CEA","AFP","CA19-9","PSA","CA125"],"a":1,"e":"AFP > 400 μg/L 持续 4 周或 >200 μg/L 持续 8 周，结合影像学可诊断肝癌；AFP 阴性者约占 30%。","id":"x146"},{"k":"外科","q":"胰头癌最典型的临床表现是","o":["无痛性进行性黄疸","转移性右下腹痛","呕血","腹泻","低血糖"],"a":0,"e":"胰头癌压迫胆总管致无痛性、进行性黄疸（ Courvoisier 征：胆囊肿大而无压痛），伴消瘦、腹痛、陶土样便。","id":"x147"},{"k":"外科","q":"输尿管结石急性发作的典型表现是","o":["无痛性肉眼血尿","腰部绞痛向会阴部放射伴血尿","尿频尿急尿痛","排尿困难","发热寒战"],"a":1,"e":"输尿管结石典型表现为肾绞痛（腰部绞痛向下腹、会阴部放射）伴镜下或肉眼血尿，可伴恶心呕吐。","id":"x148"},{"k":"外科","q":"良性前列腺增生最早出现的症状是","o":["尿频，尤其是夜尿增多","尿潴留","血尿","尿失禁","肾功能不全"],"a":0,"e":"良性前列腺增生最早出现的症状是尿频（夜间明显），随后出现进行性排尿困难、尿线变细、尿潴留。","id":"x149"},{"k":"外科","q":"肾癌的典型三联征是","o":["血尿、疼痛、肿块","发热、消瘦、贫血","高血压、低血钾、肥胖","尿频、尿急、尿痛","水肿、蛋白尿、高血压"],"a":0,"e":"肾癌典型三联征为血尿、腰痛、肿块（腹部包块），但三者同时出现多属晚期；肾癌可分泌 EPO、PTHrP 等引起副肿瘤综合征。","id":"x150"},{"k":"外科","q":"骨折愈合过程中，连接骨折端的主要组织是","o":["血肿","纤维骨痂和骨性骨痂","瘢痕组织","软骨","脂肪组织"],"a":1,"e":"骨折愈合经血肿炎症机化期、原始骨痂形成期（纤维骨痂→骨性骨痂）、骨痂改造塑形期，最终恢复骨的连续性和力学强度。","id":"x151"},{"k":"外科","q":"腰椎间盘突出症最有诊断价值的体征是","o":["直腿抬高试验及加强试验阳性","巴宾斯基征阳性","膝反射亢进","病理征阳性","足下垂"],"a":0,"e":"直腿抬高试验（<60° 出现放射痛）及加强试验阳性是腰椎间盘突出症的典型体征，提示神经根受压。","id":"x152"},{"k":"外科","q":"骨肉瘤最具特征性的 X 线表现是","o":["Codman 三角和日光射线征","骨折线","骨质增生","关节间隙狭窄","骨囊肿"],"a":0,"e":"骨肉瘤好发于青少年股骨远端、胫骨近端，X 线见 Codman 三角（骨膜反应）和日光射线征、软组织肿块，肺转移常见。","id":"x153"},{"k":"外科","q":"超急性排斥反应发生的时间是","o":["移植后数分钟至 24 小时内","移植后 1 周","移植后 1 个月","移植后 1 年","移植后 5 年"],"a":0,"e":"超急性排斥由受者体内预存抗体（ABO 血型抗体、抗 HLA 抗体）介导，移植后数分钟至 24 小时内发生，表现为移植器官迅速坏死、无功能，无法逆转，需切除。","id":"x154"},{"k":"外科","q":"椎管内麻醉（腰麻）最常见的并发症是","o":["头痛","截瘫","感染","硬膜外血肿","全脊髓麻醉"],"a":0,"e":"腰麻后头痛（低颅压性头痛）最常见，因脑脊液漏出所致，平卧可缓解，预防用细针、术后去枕平卧 6 小时。","id":"x155"},{"k":"外科","q":"成人择期手术前禁食、禁饮的目的是","o":["防止术中呕吐误吸","减轻疼痛","降低血压","预防感染","促进伤口愈合"],"a":0,"e":"术前禁食 8 小时、禁饮 2 小时，防止麻醉时呕吐物误吸导致吸入性肺炎或窒息。","id":"x156"},{"k":"外科","q":"清洁切口（Ⅰ 类切口）是指","o":["手术未进入感染炎症区、未进入呼吸道消化道泌尿道","手术进入呼吸道但无特殊污染","手术进入污染区但无感染","手术已有感染","化脓性手术"],"a":0,"e":"切口分三类：Ⅰ 类清洁切口（如甲状腺、乳腺手术）、Ⅱ 类清洁-污染切口（如胃、肠道手术）、Ⅲ 类污染切口（如阑尾穿孔、脓肿切开）。","id":"x157"},{"k":"外科","q":"预防术后深静脉血栓最有效的物理措施是","o":["早期下床活动和使用间歇充气加压装置","卧床休息","抬高患肢","冷敷","按摩下肢"],"a":0,"e":"术后 DVT 预防以早期活动、间歇充气加压（IPC）、梯度压力袜为主，高危患者联合低分子肝素抗凝。","id":"x158"},{"k":"外科","q":"急性化脓性阑尾炎的手术原则是","o":["阑尾切除术","保守治疗","仅引流","肠切除吻合","抗生素治愈"],"a":0,"e":"急性化脓性阑尾炎确诊后应尽早行阑尾切除术；阑尾周围脓肿形成者先抗感染，3 个月后择期手术。","id":"x159"},{"k":"生化","q":"蛋白质二级结构 α-螺旋的稳定主要依靠","o":["肽键","氢键","二硫键","疏水作用","离子键"],"a":1,"e":"α-螺旋是二级结构，靠肽键中 N-H 与 C=O 之间形成的氢键维持；三级结构靠疏水作用、氢键、离子键和二硫键。一级结构是肽键。","id":"x160"},{"k":"生化","q":"米氏常数（Km）的意义是","o":["酶的最大反应速度","酶与底物亲和力的指标，Km 越小亲和力越大","酶的浓度","酶的分子量","激活剂的浓度"],"a":1,"e":"Km 是反应速度达最大速度一半时的底物浓度，反映酶与底物的亲和力：Km 小则亲和力大。Km 与酶浓度无关。","id":"x161"},{"k":"生化","q":"竞争性抑制作用的特点是","o":["Km 增大，Vmax 不变","Km 减小，Vmax 增大","Km 和 Vmax 均不变","Km 不变，Vmax 降低","Km 和 Vmax 均降低"],"a":0,"e":"竞争性抑制剂与底物竞争活性中心，Km 增大（亲和力降低），但增大底物浓度可达到原 Vmax，故 Vmax 不变；非竞争性抑制 Vmax 降低、Km 不变。","id":"x162"},{"k":"生化","q":"糖酵解途径中，1 分子葡萄糖净生成 ATP 的数量是","o":["0","2","4","6","8"],"a":1,"e":"糖酵解消耗 2 ATP（己糖激酶、磷酸果糖激酶-1），生成 4 ATP（底物水平磷酸化两次），净生成 2 ATP；无氧时丙酮酸还原为乳酸。","id":"x163"},{"k":"生化","q":"糖异生的关键限速酶不包括","o":["丙酮酸羧化酶","磷酸烯醇式丙酮酸羧激酶","果糖二磷酸酶-1","葡萄糖-6-磷酸酶","磷酸果糖激酶-1"],"a":4,"e":"糖异生关键酶：丙酮酸羧化酶、PEPCK、果糖二磷酸酶-1、葡萄糖-6-磷酸酶。磷酸果糖激酶-1 是糖酵解的关键酶，方向相反。","id":"x164"},{"k":"生化","q":"糖原分解的关键酶是","o":["糖原磷酸化酶","糖原合酶","己糖激酶","丙酮酸激酶","葡萄糖激酶"],"a":0,"e":"糖原磷酸化酶催化糖原分解为葡萄糖-1-磷酸，是限速酶；糖原合酶是糖原合成的关键酶。","id":"x165"},{"k":"生化","q":"脂肪酸 β 氧化前，长链脂肪酸进入线粒体需要","o":["肉碱转运","简单扩散","钠泵","钙通道","葡萄糖转运体"],"a":0,"e":"长链脂肪酸在胞质活化生成脂酰 CoA，需肉碱-脂酰转移酶Ⅰ转运进入线粒体才能 β 氧化；该酶是脂肪酸氧化的限速步骤。","id":"x166"},{"k":"生化","q":"胆固醇合成的关键限速酶是","o":["HMG-CoA 还原酶","HMG-CoA 合酶","AST","ALT","脂蛋白脂肪酶"],"a":0,"e":"HMG-CoA 还原酶是胆固醇合成的限速酶，他汀类药物即通过抑制该酶降低胆固醇。","id":"x167"},{"k":"生化","q":"转氨酶的辅酶是","o":["维生素 B1（TPP）","磷酸吡哆醛（维生素 B6）","FAD","NAD⁺","生物素"],"a":1,"e":"转氨酶（ALT、AST）以磷酸吡哆醛（维生素 B6 的活性形式）为辅酶，催化氨基酸与 α-酮酸的氨基转移。","id":"x168"},{"k":"生化","q":"急性肝炎时升高最明显的酶是","o":["ALT","AST","ALP","GGT","CK"],"a":0,"e":"ALT 主要分布于肝细胞胞质，急性肝炎时升高最明显；AST 在线粒体较多，心肌梗死、肝炎均可升高。ALP、GGT 升高提示胆道梗阻。","id":"x169"},{"k":"生化","q":"嘌呤核苷酸分解代谢的终产物是","o":["尿素","尿酸","氨","肌酐","胆红素"],"a":1,"e":"人类嘌呤分解终产物是尿酸，尿酸生成过多或排泄减少可致高尿酸血症和痛风。","id":"x170"},{"k":"生化","q":"DNA 复制中，催化 RNA 引物合成的酶是","o":["DNA 聚合酶Ⅲ","引物酶","解旋酶","连接酶","拓扑异构酶"],"a":1,"e":"DNA 复制需引物酶先合成 RNA 引物，DNA 聚合酶Ⅲ 才能在其 3'-OH 端延伸 DNA 链；复制方向 5'→3'。","id":"x171"},{"k":"生化","q":"真核生物 mRNA 的转录由下列哪种 RNA 聚合酶催化","o":["RNA 聚合酶Ⅰ","RNA 聚合酶Ⅱ","RNA 聚合酶Ⅲ","逆转录酶","端粒酶"],"a":1,"e":"真核生物 RNA 聚合酶Ⅰ 合成 rRNA，Ⅱ 合成 mRNA（hnRNA），Ⅲ 合成 tRNA 和 5S rRNA。","id":"x172"},{"k":"生化","q":"真核生物 mRNA 转录的启动子核心序列是","o":["TATA 盒","CCAAT 盒","GC 盒","增强子","沉默子"],"a":0,"e":"TATA 盒位于转录起始点上游约 -25～-30 bp，是 RNA 聚合酶Ⅱ 转录起始的核心启动元件，结合 TBP。","id":"x173"},{"k":"生化","q":"遗传密码的简并性是指","o":["一个密码子决定多个氨基酸","多个密码子编码同一氨基酸","密码子不重叠","密码子连续阅读","密码子通用性"],"a":1,"e":"简并性指一种氨基酸可由多个密码子编码（如亮氨酸有 6 个），可减少突变危害；一个密码子只决定一种氨基酸。","id":"x174"},{"k":"生化","q":"蛋白质生物合成中，催化肽键形成的酶活性存在于","o":["核糖体大亚基（肽酰转移酶）","tRNA","起始因子","延伸因子","氨酰-tRNA 合成酶"],"a":0,"e":"核糖体大亚基的 rRNA 具有肽酰转移酶活性，催化肽键形成。某些抗生素（氯霉素、红霉素）即抑制此过程。","id":"x175"},{"k":"生化","q":"PCR 反应的基本步骤依次是","o":["变性→退火→延伸","退火→变性→延伸","延伸→变性→退火","变性→延伸→退火","退火→延伸→变性"],"a":0,"e":"PCR 循环：高温变性（解链，94～95℃）→ 低温退火（引物结合，50～60℃）→ 适温延伸（Taq 酶合成，72℃），反复循环扩增。","id":"x176"},{"k":"生化","q":"检测特异性 RNA 的分子生物学技术是","o":["Southern blot","Northern blot","Western blot","PCR-SSCP","ELISA"],"a":1,"e":"Southern 检测 DNA，Northern 检测 RNA，Western 检测蛋白质。三者分别对应 DNA、RNA、蛋白。","id":"x177"},{"k":"生化","q":"维生素 B1 的活性形式是","o":["TPP（焦磷酸硫胺素）","FAD","NAD⁺","磷酸吡哆醛","辅酶 A"],"a":0,"e":"维生素 B1 的活性形式 TPP 是 α-酮酸氧化脱羧（丙酮酸脱氢酶、α-酮戊二酸脱氢酶）和转酮醇酶的辅酶；缺乏可致脚气病、Wernicke 脑病。","id":"x178"},{"k":"生化","q":"维生素 B2 的活性形式是","o":["TPP","FAD/FMN","NAD⁺","磷酸吡哆醛","四氢叶酸"],"a":1,"e":"维生素 B2（核黄素）形成 FAD 和 FMN，是氧化还原反应的辅酶（如琥珀酸脱氢酶、黄素蛋白）。","id":"x179"},{"k":"生化","q":"维生素 PP（烟酸）的活性形式是","o":["NAD⁺/NADP⁺","FAD","TPP","辅酶 A","生物素"],"a":0,"e":"维生素 PP 形成 NAD⁺ 和 NADP⁺，是多种脱氢酶（如乳酸脱氢酶、异柠檬酸脱氢酶）的辅酶，参与氧化还原反应。","id":"x180"},{"k":"生化","q":"一碳单位代谢中，四氢叶酸的载体功能与下列哪种维生素有关","o":["维生素 B12","维生素 C","维生素 D","维生素 E","维生素 K"],"a":0,"e":"叶酸以四氢叶酸形式携带一碳单位；维生素 B12 参与四氢叶酸的再生（甲基转移），B12 缺乏可致叶酸缺乏和巨幼细胞贫血。","id":"x181"},{"k":"生化","q":"血红素合成的关键限速酶是","o":["ALA 合酶","胆色素原脱氨酶","亚铁螯合酶","血红素加氧酶","尿卟啉原合酶"],"a":0,"e":"ALA（δ-氨基-γ-酮戊酸）合酶是血红素合成的限速酶，受血红素反馈抑制，铅中毒可抑制该酶及亚铁螯合酶。","id":"x182"},{"k":"生化","q":"未结合胆红素的特点不包括","o":["脂溶性","不能经肾排出","与白蛋白结合运输","能透过血脑屏障","水溶性、可经尿排出"],"a":4,"e":"未结合胆红素脂溶性、与白蛋白结合、不能经尿排出、可透过血脑屏障（核黄疸）；结合胆红素水溶性、可经尿排出。","id":"x183"},{"k":"生化","q":"乳酸脱氢酶同工酶中，心肌含量最丰富的是","o":["LDH1","LDH2","LDH3","LDH4","LDH5"],"a":0,"e":"LDH1（H₄）主要存在于心肌和红细胞，心肌梗死时 LDH1 升高且 LDH1/LDH2 > 1（翻转）；LDH5 主要存在于肝和骨骼肌。","id":"x184"},{"k":"生化","q":"肌酸激酶同工酶中，对心肌梗死诊断特异性最高的是","o":["CK-MM","CK-MB","CK-BB","CK-MB 和 CK-MM","CK-BB 和 CK-MM"],"a":1,"e":"CK-MB 主要存在于心肌，心肌梗死 4～6 小时升高、24 小时达峰，特异性高于总 CK；CK-MM 主要存在于骨骼肌，CK-BB 在脑。","id":"x185"},{"k":"生化","q":"血浆脂蛋白中，含甘油三酯最多、密度最低的是","o":["CM（乳糜微粒）","VLDL","LDL","HDL","Lp(a)"],"a":0,"e":"乳糜微粒含甘油三酯约 90%，密度最低，运输外源性甘油三酯；VLDL 运输内源性甘油三酯；LDL 运输胆固醇；HDL 逆向转运胆固醇。","id":"x186"},{"k":"生化","q":"核苷酸抗代谢物中，5-氟尿嘧啶（5-FU）的作用机制是","o":["抑制胸苷酸合酶","抑制二氢叶酸还原酶","抑制嘌呤合成","抑制核糖核苷酸还原酶","抑制 DNA 聚合酶"],"a":0,"e":"5-FU 转化为 FdUMP 抑制胸苷酸合酶，阻断 dTMP 合成；甲氨蝶呤抑制二氢叶酸还原酶；6-巯基嘌呤抑制嘌呤合成。","id":"x187"},{"k":"生化","q":"体内氨的主要运输形式是","o":["丙氨酸和谷氨酰胺","尿素","游离氨","谷氨酸","天冬氨酸"],"a":0,"e":"氨以丙氨酸（肌肉-肝循环）和谷氨酰胺（脑、肌肉运至肝、肾）形式运输，毒性低；尿素是氨的终产物。","id":"x188"},{"k":"病理","q":"细胞水肿（水样变性）最常见的病因是","o":["缺血缺氧、感染和中毒","遗传性酶缺陷","维生素缺乏","放射线照射","免疫损伤"],"a":0,"e":"细胞水肿最常见于缺血、缺氧、感染和中毒，因 ATP 生成减少、钠泵功能下降，细胞内水钠潴留。","id":"x189"},{"k":"病理","q":"骨折后长期卧床导致患肢肌肉体积缩小，属于","o":["肥大","增生","废用性萎缩","化生","变性"],"a":2,"e":"废用性萎缩指器官或组织长期功能活动减少（如骨折固定、长期卧床）导致的萎缩。","id":"x190"},{"k":"病理","q":"高血压时左心室壁增厚属于","o":["增生","肥大","化生","萎缩","变性"],"a":1,"e":"高血压导致左心室压力负荷增加，心肌细胞体积增大（肥大），形成向心性肥大。","id":"x191"},{"k":"病理","q":"干性坏疽最常发生的部位是","o":["四肢末端","肺","肠","子宫","阑尾"],"a":0,"e":"干性坏疽多发生于四肢末端（动脉阻塞而静脉回流仍通畅），坏死组织干燥皱缩、呈黑褐色、与健康组织分界清楚。","id":"x192"},{"k":"病理","q":"湿性坏疽最常见于","o":["四肢末端","肺、肠、子宫等内脏器官","皮肤表面","骨骼","脑"],"a":1,"e":"湿性坏疽多见于肺、肠、子宫等与外界相通的内脏，坏死组织含水多、腐败菌感染重、肿胀恶臭、与健康组织分界不清。","id":"x193"},{"k":"病理","q":"肉芽组织的主要功能不包括","o":["抗感染及保护创面","填补伤口及其他组织缺损","机化或包裹坏死组织、血栓、异物","形成瘢痕组织","分泌激素调节代谢"],"a":4,"e":"肉芽组织具有抗感染保护创面、填补缺损、机化或包裹坏死物及异物、最终形成瘢痕的功能，不分泌激素。","id":"x194"},{"k":"病理","q":"一期愈合的伤口特点是","o":["创缘整齐、无感染、愈合时间短、瘢痕小","创缘不整、有感染、愈合时间长","需大量肉芽组织填充","瘢痕组织多","常需二期缝合"],"a":0,"e":"一期愈合见于组织缺损少、创缘整齐、无感染、经粘合或缝合后对合严密的伤口，愈合快、瘢痕小。","id":"x195"},{"k":"病理","q":"长期慢性淤血可导致器官","o":["淤血性硬化","萎缩性硬化","代偿性肥大","坏死后钙化","淀粉样变"],"a":0,"e":"长期慢性淤血使实质细胞萎缩、变性甚至死亡，间质纤维组织增生、网状纤维胶原化，器官变硬，出现淤血性硬化。","id":"x196"},{"k":"病理","q":"体循环动脉栓塞最常见的栓子来源是","o":["左心腔及主动脉粥样斑块","右心房","下肢深静脉","门静脉","肠系膜静脉"],"a":0,"e":"体循环动脉栓塞的栓子多来自左心腔（如房颤、心梗附壁血栓）和主动脉粥样斑块；右心和静脉系统栓子引起肺栓塞。","id":"x197"},{"k":"病理","q":"长骨骨折后可能发生的栓塞是","o":["血栓栓塞","脂肪栓塞","气体栓塞","羊水栓塞","细菌栓塞"],"a":1,"e":"长骨骨折时骨髓脂肪滴进入破裂的静脉窦，可造成脂肪栓塞，表现为呼吸困难、意识障碍和皮肤瘀点。","id":"x198"},{"k":"病理","q":"潜水员从深水快速上浮后发生的栓塞是","o":["脂肪栓塞","气体栓塞（氮气）","血栓栓塞","羊水栓塞","瘤细胞栓塞"],"a":1,"e":"深水作业后快速上浮，溶解在血液中的氮气迅速游离形成气泡，造成气体栓塞（减压病）。","id":"x199"},{"k":"病理","q":"产妇分娩过程中突然出现呼吸困难、休克、DIC，最可能的栓塞是","o":["血栓栓塞","脂肪栓塞","气体栓塞","羊水栓塞","细菌栓塞"],"a":3,"e":"羊水栓塞发生在分娩过程中，羊水成分进入母体血循环，引起过敏性休克、DIC 和急性呼吸循环衰竭，死亡率高。","id":"x200"},{"k":"病理","q":"肺和肠的梗死属于","o":["贫血性梗死","出血性梗死","液化性坏死","干酪样坏死","脂肪坏死"],"a":1,"e":"肺和肠有双重血液供应，梗死时侧支血管血液涌入坏死区，形成出血性（红色）梗死。","id":"x201"},{"k":"病理","q":"急性炎症中使血管通透性升高的最重要的化学介质是","o":["组胺","前列腺素","白三烯","缓激肽","补体 C5a"],"a":0,"e":"组胺由肥大细胞、嗜碱性粒细胞释放，使细动脉扩张、内皮细胞收缩、间隙增宽，是急性炎症早期血管通透性升高的主要介质。","id":"x202"},{"k":"病理","q":"急性炎症最重要的早期血管反应是","o":["血管收缩","细动脉扩张和血管通透性升高","纤维组织增生","肉芽肿形成","钙化"],"a":1,"e":"急性炎症早期先有短暂细动脉收缩，随后细动脉扩张、血流加速，同时血管通透性升高、富含蛋白的液体渗出。","id":"x203"},{"k":"病理","q":"结核结节属于","o":["急性化脓性炎","慢性肉芽肿性炎","纤维素性炎","出血性炎","浆液性炎"],"a":1,"e":"结核结节是由上皮样细胞、朗汉斯巨细胞和淋巴细胞构成的肉芽肿，属于慢性肉芽肿性炎。","id":"x204"},{"k":"病理","q":"金黄色葡萄球菌感染最常引起的炎症类型是","o":["蜂窝织炎","脓肿","肉芽肿性炎","纤维素性炎","浆液性炎"],"a":1,"e":"金黄色葡萄球菌产生血浆凝固酶，使炎症局限化形成脓肿；溶血性链球菌产生透明质酸酶，易引起蜂窝织炎。","id":"x205"},{"k":"病理","q":"大叶性肺炎的炎症类型是","o":["浆液性炎","纤维素性炎","化脓性炎","出血性炎","肉芽肿性炎"],"a":1,"e":"大叶性肺炎是肺泡内弥漫性纤维素渗出为主的炎症，属于纤维素性炎。","id":"x206"},{"k":"病理","q":"炭疽引起的炎症类型是","o":["浆液性炎","纤维素性炎","化脓性炎","出血性炎","肉芽肿性炎"],"a":3,"e":"炭疽、鼠疫等烈性传染病可引起出血性炎，血管损伤严重、渗出物中含大量红细胞。","id":"x207"},{"k":"病理","q":"肿瘤组织结构的异型性是指","o":["肿瘤细胞与正常细胞的差异","肿瘤组织空间排列方式与正常组织的差异","肿瘤体积的大小","肿瘤生长速度的快慢","肿瘤有无包膜"],"a":1,"e":"结构异型性指肿瘤组织在空间排列方式（极性、层次、器官样结构）上与正常组织的差异；细胞异型性指细胞形态的差异。","id":"x208"},{"k":"病理","q":"恶性肿瘤最主要的生长方式是","o":["膨胀性生长","外生性生长","浸润性生长","囊性生长","推移性生长"],"a":2,"e":"恶性肿瘤多呈浸润性生长，破坏周围组织、界限不清；良性肿瘤多呈膨胀性生长，有包膜、界限清楚。","id":"x209"},{"k":"病理","q":"胃癌细胞转移至卵巢形成的肿瘤称为","o":["Virchow 淋巴结","Krukenberg 瘤","Aschoff 小体","R-S 细胞","印戒细胞"],"a":1,"e":"胃癌细胞经腹腔种植转移至卵巢，形成双侧、实性的 Krukenberg 瘤。","id":"x210"},{"k":"病理","q":"下列属于癌前病变的是","o":["慢性萎缩性胃炎伴肠上皮化生","急性胃炎","胃溃疡愈合","胃平滑肌瘤","胃憩室"],"a":0,"e":"慢性萎缩性胃炎伴肠上皮化生是胃癌的癌前病变；胃溃疡、胃平滑肌瘤、胃憩室不属于癌前病变。","id":"x211"},{"k":"病理","q":"交界性肿瘤是指","o":["良性肿瘤恶变","组织形态和生物学行为介于良恶性之间的肿瘤","转移性肿瘤","原位癌","早期癌"],"a":1,"e":"交界性肿瘤的组织形态和生物学行为介于良性与恶性之间，如卵巢交界性浆液性囊腺瘤，易复发但很少转移。","id":"x212"},{"k":"病理","q":"动脉瘤是指","o":["动脉壁的肿瘤","动脉壁局部薄弱后形成的永久性异常扩张","动脉内膜的脂质沉积","动脉血栓形成","动脉痉挛"],"a":1,"e":"动脉瘤是动脉壁局部薄弱、在血流压力下形成的永久性异常扩张，不是真性肿瘤。","id":"x213"},{"k":"病理","q":"风湿性心脏病的特征性病变是","o":["Aschoff 小体","R-S 细胞","Krukenberg 瘤","新月体","假小叶"],"a":0,"e":"风湿性心脏病心肌间质内出现 Aschoff 小体（风湿小体），由纤维素样坏死、成团的风湿细胞和淋巴细胞构成，是风湿病的特征性病变。","id":"x214"},{"k":"病理","q":"亚急性感染性心内膜炎最常累及的瓣膜是","o":["二尖瓣和主动脉瓣","三尖瓣","肺动脉瓣","心内膜壁","心包"],"a":0,"e":"亚急性感染性心内膜炎最常累及二尖瓣和主动脉瓣，瓣膜上形成含细菌的赘生物，易脱落造成栓塞。","id":"x215"},{"k":"病理","q":"病毒性肝炎时肝细胞最常见的变性是","o":["脂肪变","细胞水肿（气球样变）","玻璃样变","黏液样变","淀粉样变"],"a":1,"e":"病毒性肝炎时肝细胞最常见水样变性，严重时细胞肿大、胞质疏松呈气球样（气球样变），进而可发生溶解性坏死。","id":"x216"},{"k":"病理","q":"肝硬化门脉高压的表现不包括","o":["脾大","侧支循环形成","腹水","食管胃底静脉曲张","红细胞增多"],"a":4,"e":"门脉高压表现为脾大、侧支循环形成（食管胃底静脉曲张、腹壁静脉曲张、痔静脉曲张）、腹水，不会引起红细胞增多。","id":"x217"},{"k":"病理","q":"我国食管癌最常见的组织学类型是","o":["鳞状细胞癌","腺癌","小细胞癌","未分化癌","类癌"],"a":0,"e":"我国食管癌以鳞状细胞癌最常见，多发生于食管中段；腺癌多见于食管下段（Barrett 食管）。","id":"x218"},{"k":"生理","q":"O₂ 和 CO₂ 通过细胞膜的转运方式是","o":["单纯扩散","易化扩散","原发性主动转运","继发性主动转运","出胞和入胞"],"a":0,"e":"O₂、CO₂ 等脂溶性小分子顺浓度梯度通过细胞膜，属于单纯扩散，不需要载体和能量。","id":"x219"},{"k":"生理","q":"葡萄糖进入红细胞的方式是","o":["单纯扩散","易化扩散","原发性主动转运","继发性主动转运","出胞"],"a":1,"e":"葡萄糖进入红细胞通过葡萄糖转运体（GLUT1）顺浓度梯度转运，属于易化扩散（经载体、不耗能）。","id":"x220"},{"k":"生理","q":"细胞膜上钠泵的活动属于","o":["单纯扩散","易化扩散","原发性主动转运","继发性主动转运","出胞"],"a":2,"e":"钠泵（Na⁺-K⁺-ATP 酶）直接分解 ATP 供能，逆浓度转运离子，属于原发性主动转运。","id":"x221"},{"k":"生理","q":"能引起细胞产生动作电位的最小刺激强度称为","o":["阈强度","阈电位","基强度","最大刺激","时值"],"a":0,"e":"阈强度（阈值）是引起组织兴奋的最小刺激强度；阈电位是能触发动作电位的膜电位临界值。","id":"x222"},{"k":"生理","q":"局部电位的特点不包括","o":["呈等级性","可发生时间总和","可发生空间总和","呈“全或无”式","可电紧张扩布"],"a":3,"e":"局部电位呈等级性、可总和、可电紧张扩布、无不应期；动作电位才具有“全或无”特点。","id":"x223"},{"k":"生理","q":"骨骼肌收缩时，横桥与下列哪种物质结合","o":["肌动蛋白","肌钙蛋白","原肌球蛋白","肌浆网","ATP 酶"],"a":0,"e":"Ca²⁺ 与肌钙蛋白结合后，原肌球蛋白移位暴露肌动蛋白上的结合位点，横桥与肌动蛋白结合并摆动，引起肌丝滑行。","id":"x224"},{"k":"生理","q":"血浆白蛋白的主要功能是","o":["形成血浆胶体渗透压","运输氧气","参与凝血","免疫防御","调节体温"],"a":0,"e":"白蛋白分子量小、数量多，血浆胶体渗透压的 75%～80% 由白蛋白形成，对维持血管内外水平衡至关重要。","id":"x225"},{"k":"生理","q":"促进红细胞生成的主要激素是","o":["促红细胞生成素（EPO）","睾酮","甲状腺激素","生长激素","糖皮质激素"],"a":0,"e":"EPO 主要由肾间质细胞产生，促进红系祖细胞增殖分化；缺氧是刺激 EPO 分泌的最主要因素。","id":"x226"},{"k":"生理","q":"血小板的生理功能不包括","o":["参与生理性止血","促进凝血","维持血管内皮完整性","运输氧气","参与炎症反应"],"a":3,"e":"血小板参与止血、凝血、维持血管内皮完整性和炎症反应；运输氧气是红细胞的功能。","id":"x227"},{"k":"生理","q":"参与凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ 合成需要","o":["维生素 A","维生素 B12","维生素 C","维生素 D","维生素 K"],"a":4,"e":"凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ 的合成需要维生素 K 参与 γ-羧化，缺乏可引起出血倾向。","id":"x228"},{"k":"生理","q":"心脏正常起搏点是","o":["窦房结","房室结","房室束","浦肯野纤维","心房肌"],"a":0,"e":"窦房结自律性最高（约 100 次/分），是正常起搏点；房室结和浦肯野纤维自律性较低，为潜在起搏点。","id":"x229"},{"k":"生理","q":"兴奋在房室交界传导速度最慢的生理意义是","o":["保证心室不发生过早收缩","使心室收缩更有力","增加心率","加快心房收缩","促进静脉回流"],"a":0,"e":"房室交界传导慢（约 0.02 m/s），形成房室延搁，保证心房收缩完毕后心室才开始收缩，有利于心室充盈。","id":"x230"},{"k":"生理","q":"形成动脉血压的最主要因素是","o":["心脏射血和外周阻力","血管长度","血液黏度","血管弹性","静脉回流"],"a":0,"e":"动脉血压的形成需要两个基本条件：心脏射血提供动能，外周阻力使血流不能过快流出动脉，从而维持动脉压。","id":"x231"},{"k":"生理","q":"微循环中进行物质交换的主要部位是","o":["微动脉","后微动脉","毛细血管前括约肌","真毛细血管","微静脉"],"a":3,"e":"真毛细血管壁薄、血流慢、通透性大，是血液与组织之间物质交换的主要场所。","id":"x232"},{"k":"生理","q":"肺活量是指","o":["潮气量 + 补吸气量","潮气量 + 补吸气量 + 补呼气量","潮气量 + 补呼气量","深吸气量 + 残气量","补吸气量 + 补呼气量"],"a":1,"e":"肺活量 = 潮气量 + 补吸气量 + 补呼气量，即最大吸气后再用力呼出的最大气量。","id":"x233"},{"k":"生理","q":"肺顺应性降低见于","o":["肺气肿","肺纤维化","肺充血","运动","深呼吸"],"a":1,"e":"肺纤维化使肺组织弹性阻力增大、顺应性降低，患者需更大努力才能吸气；肺气肿时顺应性升高。","id":"x234"},{"k":"生理","q":"血液中 CO₂ 的主要运输形式是","o":["物理溶解","碳氧血红蛋白","碳酸氢盐","氨基甲酰血红蛋白","碳酸"],"a":2,"e":"CO₂ 主要以碳酸氢盐（HCO₃⁻）形式运输，约占 70%；其次为氨基甲酰血红蛋白和物理溶解。","id":"x235"},{"k":"生理","q":"调节呼吸最重要的中枢化学感受器位于","o":["延髓腹外侧","颈动脉体","主动脉体","脑桥","下丘脑"],"a":0,"e":"延髓腹外侧的中枢化学感受器对脑脊液 H⁺ 浓度变化敏感，是调节呼吸最重要的化学感受器；缺氧主要通过外周感受器。","id":"x236"},{"k":"生理","q":"胃排空的原动力是","o":["胃蠕动","胃内压","幽门括约肌活动","十二指肠负压","胃液分泌"],"a":0,"e":"胃排空通过胃蠕动完成，胃蠕动使胃内压升高，推动食糜进入十二指肠；幽门括约肌起限制作用。","id":"x237"},{"k":"生理","q":"促进胰液分泌碳酸氢盐的主要激素是","o":["促胰液素","促胃液素","缩胆囊素","抑胃肽","胃动素"],"a":0,"e":"促胰液素作用于胰腺导管细胞，促进水和碳酸氢盐分泌；缩胆囊素主要促进胰酶分泌。","id":"x238"},{"k":"生理","q":"人体体温调节的基本中枢位于","o":["大脑皮质","下丘脑","延髓","中脑","脊髓"],"a":1,"e":"下丘脑视前区-下丘脑前部（PO/AH）是体温调节的基本中枢，能整合温度信息并调节产热和散热。","id":"x239"},{"k":"生理","q":"肾小球滤过膜中起主要机械屏障作用的是","o":["毛细血管内皮细胞","基膜","足细胞裂孔膜","系膜细胞","肾小囊上皮"],"a":1,"e":"滤过膜由内皮细胞、基膜和足细胞裂孔膜构成，其中基膜是主要的机械屏障，能阻挡大分子蛋白质。","id":"x240"},{"k":"生理","q":"近端小管对葡萄糖的重吸收方式是","o":["单纯扩散","易化扩散","原发性主动转运","继发性主动转运","入胞"],"a":3,"e":"葡萄糖通过 Na⁺-葡萄糖耦联转运体（SGLT）重吸收，依赖钠泵建立的 Na⁺ 浓度梯度，属于继发性主动转运。","id":"x241"},{"k":"生理","q":"球-管平衡是指","o":["近端小管重吸收率始终占滤过率的 65%～70%","肾小球滤过率恒定不变","肾小管分泌率恒定","集合管重吸收恒定","肾血流量恒定"],"a":0,"e":"球-管平衡指近端小管对滤过液的重吸收率始终占肾小球滤过率的 65%～70%，使尿量不随滤过率波动而剧烈变化。","id":"x242"},{"k":"生理","q":"神经-骨骼肌接头处，触发突触囊泡释放的离子是","o":["Na⁺","K⁺","Ca²⁺","Cl⁻","Mg²⁺"],"a":2,"e":"动作电位传到接头前膜，电压门控 Ca²⁺ 通道开放，Ca²⁺ 内流触发突触囊泡与前膜融合，释放乙酰胆碱。","id":"x243"},{"k":"生理","q":"内脏器官病变引起体表特定部位疼痛的现象称为","o":["牵涉痛","放射痛","幻肢痛","丘脑痛","灼性神经痛"],"a":0,"e":"牵涉痛指内脏疾病引起体表特定部位发生疼痛或痛觉过敏，如心绞痛放射至左肩和左上肢内侧。","id":"x244"},{"k":"生理","q":"甲状腺激素对代谢的主要作用是","o":["降低基础代谢率","增加产热","促进糖原合成","抑制蛋白质合成","降低血糖"],"a":1,"e":"甲状腺激素提高组织耗氧量、增加产热（产热效应），使基础代谢率升高；甲亢患者怕热多汗。","id":"x245"},{"k":"生理","q":"甲状旁腺激素的主要作用是","o":["升高血钙、降低血磷","降低血钙、升高血磷","升高血钙和血磷","降低血钙和血磷","仅降低血钙"],"a":0,"e":"甲状旁腺激素促进骨钙释放、肾小管重吸收钙、促进 1,25-(OH)₂-D₃ 生成，使血钙升高、血磷降低。","id":"x246"},{"k":"生理","q":"糖皮质激素在应激反应中的主要作用是","o":["提高机体对有害刺激的耐受力","降低血糖","抑制蛋白质分解","减少红细胞","抑制胃酸分泌"],"a":0,"e":"应激时糖皮质激素大量分泌，提高机体对有害刺激的耐受力，同时升高血糖、促进蛋白质分解、抑制免疫和炎症。","id":"x247"},{"k":"生理","q":"促进精子生成的激素主要是","o":["卵泡刺激素（FSH）","黄体生成素（LH）","催乳素","雌二醇","孕激素"],"a":0,"e":"FSH 作用于睾丸支持细胞促进精子生成；LH 作用于间质细胞促进睾酮分泌。","id":"x248"},{"k":"内科","q":"慢性心力衰竭患者改善预后的基石药物不包括","o":["ACEI/ARB 或 ARNI","β 受体拮抗剂","醛固酮受体拮抗剂","SGLT2 抑制剂","洋地黄类"],"a":4,"e":"心衰预后改善的四大基石：ACEI/ARB/ARNI、β 受体拮抗剂、醛固酮受体拮抗剂、SGLT2 抑制剂。洋地黄改善症状但不改善预后。","id":"x249"},{"k":"内科","q":"急性心力衰竭伴明显肺水肿时，最常用的利尿剂是","o":["氢氯噻嗪","呋塞米（袢利尿剂）","螺内酯","乙酰唑胺","甘露醇"],"a":1,"e":"急性心衰肺水肿首选静脉袢利尿剂（呋塞米），快速减轻容量负荷、缓解肺淤血。","id":"x250"},{"k":"内科","q":"心房颤动药物复律最常用的药物是","o":["胺碘酮","美托洛尔","地高辛","维拉帕米","阿司匹林"],"a":0,"e":"房颤复律常用胺碘酮（尤其合并器质性心脏病者）；β 受体拮抗剂、地高辛主要用于控制心室率。","id":"x251"},{"k":"内科","q":"稳定型心绞痛发作时首选的缓解药物是","o":["硝酸甘油舌下含服","阿司匹林","美托洛尔","阿托伐他汀","硝苯地平口服"],"a":0,"e":"心绞痛发作时首选硝酸甘油舌下含服，快速扩张冠脉和静脉、降低心肌耗氧；β 受体拮抗剂用于长期预防。","id":"x252"},{"k":"内科","q":"急性心肌梗死溶栓治疗的绝对禁忌证是","o":["近期活动性出血或出血倾向","年龄大于 65 岁","高血压控制良好","既往心肌梗死","糖尿病"],"a":0,"e":"溶栓绝对禁忌证包括活动性出血、近期脑血管事件、主动脉夹层等；年龄、既往心梗、糖尿病不是绝对禁忌。","id":"x253"},{"k":"内科","q":"我国高血压分级中，2 级高血压的血压范围是","o":["140～159/90～99 mmHg","160～179/100～109 mmHg","≥180/≥110 mmHg","120～139/80～89 mmHg","<120/80 mmHg"],"a":1,"e":"1 级 140～159/90～99；2 级 160～179/100～109；3 级 ≥180/≥110 mmHg。","id":"x254"},{"k":"内科","q":"主动脉夹层最典型的临床表现是","o":["突发撕裂样剧烈胸背痛","压榨性胸骨后痛","转移性右下腹痛","夜间阵发性呼吸困难","咯血"],"a":0,"e":"主动脉夹层典型表现为突发撕裂样、刀割样剧烈胸背痛，可向腹部、下肢放射，伴血压双侧不对称。","id":"x255"},{"k":"内科","q":"肺炎链球菌肺炎的典型痰液性状是","o":["铁锈色痰","粉红色泡沫痰","砖红色胶冻样痰","大量脓臭痰","白色黏液痰"],"a":0,"e":"肺炎链球菌肺炎典型表现为铁锈色痰（红细胞被肺泡内渗出物破坏所致）；粉红色泡沫痰见于急性肺水肿。","id":"x256"},{"k":"内科","q":"吸入性肺脓肿最常见的病原体是","o":["厌氧菌","肺炎链球菌","金黄色葡萄球菌","铜绿假单胞菌","军团菌"],"a":0,"e":"吸入性肺脓肿多由厌氧菌（消化链球菌、梭形杆菌等）引起，常继发于误吸、醉酒、脑血管病后。","id":"x257"},{"k":"内科","q":"支气管扩张最常见的临床表现是","o":["慢性咳嗽、大量脓痰和反复咯血","进行性呼吸困难","干咳伴低热","胸痛伴咯血","夜间阵发性呼吸困难"],"a":0,"e":"支气管扩张典型表现为慢性咳嗽、大量脓痰（晨起明显）和反复咯血，可有杵状指。","id":"x258"},{"k":"内科","q":"异烟肼最常见的不良反应是","o":["周围神经炎","视神经炎","耳毒性","肾损害","骨髓抑制"],"a":0,"e":"异烟肼常见不良反应为周围神经炎（补充维生素 B6 可预防）、肝损害；乙胺丁醇可致视神经炎。","id":"x259"},{"k":"内科","q":"肺癌患者出现杵状指、关节痛，最可能是","o":["副肿瘤综合征","骨转移","类风湿关节炎","感染性关节炎","痛风"],"a":0,"e":"肺癌（尤其鳞癌、小细胞癌）可产生副肿瘤综合征，表现为杵状指、肥大性骨关节病、SIADH、Cushing 综合征等。","id":"x260"},{"k":"内科","q":"张力性气胸的紧急处理是","o":["立即胸腔穿刺排气","吸氧观察","抗生素治疗","镇咳","胸腔闭式引流后观察"],"a":0,"e":"张力性气胸危及生命，应立即胸腔穿刺排气减压，随后行胸腔闭式引流。","id":"x261"},{"k":"内科","q":"胃食管反流病最典型的症状是","o":["烧心和反流","上腹痛","呕血","吞咽困难","腹泻"],"a":0,"e":"胃食管反流病典型症状为烧心（胸骨后烧灼感）和反流，餐后、平卧时加重。","id":"x262"},{"k":"内科","q":"幽门螺杆菌根除治疗目前推荐","o":["四联疗法（PPI+铋剂+两种抗生素）","单用 PPI","单用阿莫西林","三联疗法（PPI+两种抗生素）","铋剂单用"],"a":0,"e":"目前推荐含铋剂四联疗法（PPI + 铋剂 + 两种抗生素）10～14 天；三联疗法因耐药率上升已少用。","id":"x263"},{"k":"内科","q":"肝硬化腹水患者首选利尿剂是","o":["螺内酯联合呋塞米","氢氯噻嗪","甘露醇","乙酰唑胺","托拉塞米单用"],"a":0,"e":"肝硬化腹水首选螺内酯（保钾）联合呋塞米（排钾），比例常为 100:40，监测体重和电解质。","id":"x264"},{"k":"内科","q":"肝性脑病降低血氨最常用的药物是","o":["乳果糖","谷氨酸钠","精氨酸","左旋多巴","氟马西尼"],"a":0,"e":"乳果糖在结肠被细菌分解为乳酸和乙酸，酸化肠道、减少氨吸收，是肝性脑病的一线治疗。","id":"x265"},{"k":"内科","q":"急性胰腺炎早期最重要的治疗措施是","o":["禁食、胃肠减压和液体复苏","立即手术","抗生素预防感染","生长抑素","镇痛"],"a":0,"e":"急性胰腺炎早期治疗以禁食、胃肠减压、积极液体复苏、镇痛为主；坏死感染时才需手术。","id":"x266"},{"k":"内科","q":"轻中度溃疡性结肠炎的首选治疗药物是","o":["柳氮磺吡啶或美沙拉嗪","糖皮质激素口服","硫唑嘌呤","英夫利西单抗","环孢素"],"a":0,"e":"轻中度溃疡性结肠炎首选 5-氨基水杨酸（柳氮磺吡啶/美沙拉嗪）；中重度或急性发作可用糖皮质激素。","id":"x267"},{"k":"内科","q":"急性链球菌感染后肾小球肾炎的典型表现是","o":["血尿、蛋白尿、水肿、高血压","大量蛋白尿、低蛋白血症","少尿、无尿、氮质血症","发热、腰痛、尿频","肉眼血尿伴肾绞痛"],"a":0,"e":"急性链球菌感染后肾炎表现为血尿、蛋白尿、水肿、高血压（肾炎综合征），多在链球菌感染后 1～3 周发生。","id":"x268"},{"k":"内科","q":"原发性肾病综合征的首选治疗是","o":["糖皮质激素","环磷酰胺","他克莫司","ACEI","利尿剂"],"a":0,"e":"原发性肾病综合征（尤其微小病变型）首选糖皮质激素，无效或依赖者加用免疫抑制剂。","id":"x269"},{"k":"内科","q":"无症状性菌尿需要治疗的人群是","o":["孕妇和准备泌尿外科手术者","所有老年女性","所有糖尿病患者","所有留置导尿管者","所有儿童"],"a":0,"e":"无症状性菌尿一般不需治疗，但孕妇和拟行泌尿外科手术者需治疗，以减少肾盂肾炎和术后感染。","id":"x270"},{"k":"内科","q":"慢性肾脏病非透析患者蛋白质摄入建议是","o":["低蛋白饮食（0.6～0.8 g/kg·d）","高蛋白饮食","正常蛋白饮食无需限制","极低蛋白饮食（<0.3 g/kg·d）","仅限制脂肪"],"a":0,"e":"CKD 非透析患者推荐低蛋白饮食（0.6～0.8 g/kg·d），以减轻肾小球高滤过、延缓肾功能恶化。","id":"x271"},{"k":"内科","q":"缺铁性贫血的铁剂治疗，血红蛋白恢复正常后仍需继续服用","o":["3～6 个月以补足贮存铁","立即停药","1 周","1 个月","终身服用"],"a":0,"e":"缺铁性贫血补铁后血红蛋白先恢复，但贮存铁仍缺乏，需继续服用 3～6 个月（或至铁蛋白正常）。","id":"x272"},{"k":"内科","q":"巨幼细胞贫血最常见的病因是","o":["叶酸或维生素 B12 缺乏","铁缺乏","慢性失血","骨髓衰竭","溶血"],"a":0,"e":"巨幼细胞贫血由叶酸或维生素 B12 缺乏引起 DNA 合成障碍，表现为大细胞性贫血、中性粒细胞分叶过多。","id":"x273"},{"k":"内科","q":"免疫性血小板减少症（ITP）的一线治疗是","o":["糖皮质激素","脾切除","利妥昔单抗","血小板输注","环孢素"],"a":0,"e":"ITP 一线治疗为糖皮质激素（或 IVIG），二线包括促血小板生成药、利妥昔单抗、脾切除。","id":"x274"},{"k":"内科","q":"抗甲状腺药物（甲巯咪唑）最严重的不良反应是","o":["粒细胞缺乏","皮疹","肝功能异常","关节痛","脱发"],"a":0,"e":"抗甲状腺药物最严重的不良反应是粒细胞缺乏，用药期间出现发热、咽痛应立即查血常规并停药。","id":"x275"},{"k":"内科","q":"糖尿病酮症酸中毒治疗中，首要的措施是","o":["补液","立即静脉推注大剂量胰岛素","补碱","补钾","利尿"],"a":0,"e":"DKA 治疗首要措施是快速补液（生理盐水），恢复血容量和组织灌注，随后小剂量胰岛素、补钾、必要时补碱。","id":"x276"},{"k":"内科","q":"骨质疏松症抗骨吸收治疗的一线药物是","o":["双膦酸盐","钙剂单用","维生素 D 单用","雌激素","降钙素"],"a":0,"e":"骨质疏松一线抗骨吸收药物为双膦酸盐（阿仑膦酸钠等），需同时补充钙剂和维生素 D。","id":"x277"},{"k":"内科","q":"痛风患者降尿酸治疗的一线药物是","o":["别嘌醇或非布司他","秋水仙碱","NSAIDs","糖皮质激素","苯溴马隆"],"a":0,"e":"痛风降尿酸一线为抑制尿酸生成的别嘌醇或非布司他；苯溴马隆促尿酸排泄，用于尿酸排泄减少型。","id":"x278"},{"k":"外科","q":"创伤后失血性休克属于","o":["低血容量性休克","心源性休克","分布性休克","梗阻性休克","感染性休克"],"a":0,"e":"失血性休克因有效循环血量减少，属于低血容量性休克；治疗关键是止血和快速补充血容量。","id":"x279"},{"k":"外科","q":"反映右心前负荷和血容量的指标是","o":["中心静脉压（CVP）","平均动脉压","心率","尿量","血乳酸"],"a":0,"e":"中心静脉压（CVP）反映右心房和胸腔内大静脉的压力，是判断血容量和右心功能的常用指标。","id":"x280"},{"k":"外科","q":"高钾血症典型的心电图改变是","o":["T 波高尖、QRS 增宽","U 波明显","ST 段抬高","P 波增高","T 波低平"],"a":0,"e":"高钾血症早期 T 波高尖、基底变窄，加重时 QRS 增宽、P 波低平甚至消失，可致室颤；低钾则是 U 波明显。","id":"x281"},{"k":"外科","q":"代谢性酸中毒时补充碳酸氢钠的指征是","o":["pH 明显降低或 HCO₃⁻ 显著下降","所有代谢性酸中毒","轻度酸中毒","呼吸性酸中毒","碱中毒"],"a":0,"e":"代谢性酸中毒以病因治疗为主，仅在 pH <7.2 或 HCO₃⁻ 明显降低时补充碳酸氢钠，避免过度纠酸。","id":"x282"},{"k":"外科","q":"外科营养支持的原则是","o":["能肠内则肠内，肠内不足则肠外补充","首选全肠外营养","禁食是首选","肠外营养优于肠内","不需要营养支持"],"a":0,"e":"营养支持原则：只要肠道有功能就应优先肠内营养（保护肠黏膜、减少并发症），不足时联合肠外营养。","id":"x283"},{"k":"外科","q":"脓毒症的快速筛查常用","o":["qSOFA 评分","APACHE II","GCS","Child-Pugh","MELD"],"a":0,"e":"qSOFA（呼吸频率≥22、意识改变、收缩压≤100 mmHg）用于脓毒症的快速床旁筛查，符合 2 项提示预后不良。","id":"x284"},{"k":"外科","q":"破伤风主动免疫制剂是","o":["破伤风类毒素","破伤风抗毒素（TAT）","破伤风免疫球蛋白","抗生素","糖皮质激素"],"a":0,"e":"破伤风类毒素是主动免疫制剂（疫苗），用于预防；TAT 和免疫球蛋白是被动免疫，用于紧急中和游离毒素。","id":"x285"},{"k":"外科","q":"痈与疖的主要区别是","o":["痈是多个相邻毛囊及其周围组织的化脓性感染","痈是单个毛囊感染","疖是多个毛囊感染","两者相同","痈是病毒性感染"],"a":0,"e":"疖是单个毛囊及其周围组织的急性化脓性感染；痈是多个相邻毛囊及其周围组织同时发生的化脓性感染，范围大、症状重。","id":"x286"},{"k":"外科","q":"急性乳腺炎最常见的致病菌是","o":["金黄色葡萄球菌","链球菌","大肠埃希菌","铜绿假单胞菌","厌氧菌"],"a":0,"e":"急性乳腺炎多由金黄色葡萄球菌（少数链球菌）引起，多见于产后哺乳期妇女，乳汁淤积和乳头皲裂是诱因。","id":"x287"},{"k":"外科","q":"甲状腺癌最常见的病理类型是","o":["乳头状癌","滤泡状癌","髓样癌","未分化癌","淋巴瘤"],"a":0,"e":"甲状腺癌以乳头状癌最常见（约 60%～70%），恶性程度低、预后好；滤泡状癌次之；髓样癌来自 C 细胞；未分化癌恶性度最高。","id":"x288"},{"k":"外科","q":"甲亢术后甲状腺危象的处理不包括","o":["应用丙硫氧嘧啶和碘剂","使用 β 受体阻滞剂","糖皮质激素","降温、补液","立即再次手术"],"a":4,"e":"甲状腺危象处理：PTU 抑制合成、碘剂抑制释放、β 受体阻滞剂控制心率、糖皮质激素、降温补液、镇静；不再次手术。","id":"x289"},{"k":"外科","q":"判断乳腺癌激素治疗敏感的指标是","o":["ER 和 PR 受体状态","HER-2","Ki-67","肿瘤大小","淋巴结转移"],"a":0,"e":"ER/PR 阳性提示激素依赖性，适合内分泌治疗（他莫昔芬、芳香化酶抑制剂）；HER-2 阳性适合靶向治疗。","id":"x290"},{"k":"外科","q":"胃大部切除术中，BillrothⅠ式是指","o":["胃残端与十二指肠吻合","胃残端与空肠吻合","胃与食管吻合","胃与结肠吻合","仅切除不吻合"],"a":0,"e":"BillrothⅠ式是胃残端直接与十二指肠吻合（胃十二指肠吻合），BillrothⅡ式是胃残端与空肠吻合。","id":"x291"},{"k":"外科","q":"胃癌根治术要求切除范围包括","o":["肿瘤及足够切缘，并清扫相应区域淋巴结","仅切除肿瘤","仅切除胃大部","仅清扫淋巴结","全胃切除即可"],"a":0,"e":"胃癌根治术要求整块切除肿瘤及足够切缘（距肿瘤边缘 ≥5 cm），并清扫相应区域淋巴结（D2 清扫为进展期标准）。","id":"x292"},{"k":"外科","q":"成人肠梗阻最常见的病因是","o":["粘连性肠梗阻","肿瘤","疝嵌顿","肠扭转","肠套叠"],"a":0,"e":"成人肠梗阻最常见病因为腹部手术后肠粘连；儿童以肠套叠多见。","id":"x293"},{"k":"外科","q":"右半结肠癌与左半结肠癌相比，更常见的表现是","o":["贫血、腹部肿块、全身症状","肠梗阻","便血","排便习惯改变","里急后重"],"a":0,"e":"右半结肠腔大、粪便稀，以贫血、腹部肿块、乏力消瘦等全身症状为主；左半结肠腔窄，以肠梗阻、便血、排便习惯改变为主。","id":"x294"},{"k":"外科","q":"肛裂的典型症状是","o":["排便时剧痛、便后滴血、便秘","无痛性便血","肛门肿物脱出","排便习惯改变","里急后重"],"a":0,"e":"肛裂典型表现为排便时肛门剧痛（周期性疼痛）、便后少量滴血和便秘，三者常形成恶性循环。","id":"x295"},{"k":"外科","q":"内痔的主要症状是","o":["无痛性便血和痔核脱出","剧烈疼痛","发热","排便困难","里急后重"],"a":0,"e":"内痔位于齿状线以上，主要症状为无痛性便血和痔核脱出；血栓性外痔或嵌顿痔才表现为剧痛。","id":"x296"},{"k":"外科","q":"阿米巴肝脓肿的典型脓液是","o":["巧克力色脓液","黄色脓液","血性脓液","脓臭","清亮液体"],"a":0,"e":"阿米巴肝脓肿脓液呈巧克力色（棕褐色），由阿米巴滋养体溶解肝组织、陈旧性出血所致；细菌性肝脓肿为黄白色脓液。","id":"x297"},{"k":"外科","q":"急性胆囊炎查体最常见的阳性体征是","o":["Murphy 征阳性","麦氏点压痛","移动性浊音","板状腹","肝浊音界消失"],"a":0,"e":"急性胆囊炎时右上腹压痛、Murphy 征阳性（检查者按压右上腹，嘱病人深吸气时因疼痛而屏气）。","id":"x298"},{"k":"外科","q":"胆总管结石梗阻合并感染时出现的 Charcot 三联征是","o":["腹痛、寒战高热、黄疸","腹痛、呕吐、腹胀","黄疸、腹水、脾大","发热、贫血、出血","腹痛、血尿、黄疸"],"a":0,"e":"Charcot 三联征为腹痛、寒战高热、黄疸，提示急性胆管炎；合并休克和意识障碍则为 Reynolds 五联征。","id":"x299"},{"k":"外科","q":"评估急性胰腺炎严重程度的 Ranson 评分不包括","o":["年龄和白细胞计数","血糖和血钙","LDH 和 AST","血淀粉酶高低","液体丢失量"],"a":3,"e":"Ranson 评分包括入院时年龄、白细胞、血糖、LDH、AST，以及 48 小时内血钙、PaO₂、碱缺失、液体丢失、BUN 等；血淀粉酶水平与病情严重程度不平行。","id":"x300"},{"k":"外科","q":"腹外疝发生嵌顿后，最关键的处理是","o":["急诊手术","手法复位后观察","热敷","抗生素治疗","止痛"],"a":0,"e":"疝嵌顿后若不能手法复位或已出现血运障碍（绞窄），应急诊手术，防止肠坏死和穿孔。","id":"x301"},{"k":"外科","q":"闭合性腹部损伤最易破裂的实质脏器是","o":["脾","肝","肾","胰","肾上腺"],"a":0,"e":"闭合性腹部损伤中脾破裂最常见（脾质地脆、被膜薄），其次为肝破裂；表现为腹腔内出血和失血性休克。","id":"x302"},{"k":"外科","q":"输尿管上段结石直径小于 1 cm 的首选治疗是","o":["体外冲击波碎石","开放手术","输尿管切开取石","肾切除","药物排石即可"],"a":0,"e":"输尿管上段结石 <1 cm 首选体外冲击波碎石（ESWL）；较大、嵌顿或碎石失败者可选输尿管镜碎石。","id":"x303"},{"k":"外科","q":"膀胱癌最常见的临床表现是","o":["无痛性肉眼血尿","尿频尿急尿痛","排尿困难","腰痛","发热"],"a":0,"e":"膀胱癌典型表现为无痛性、间歇性肉眼血尿，可伴血块；尿频尿急尿痛见于膀胱炎。","id":"x304"},{"k":"外科","q":"前列腺癌筛查和随访最常用的肿瘤标志物是","o":["PSA","CEA","AFP","CA19-9","CA125"],"a":0,"e":"PSA（前列腺特异性抗原）是前列腺癌筛查、疗效监测和复发判断的常用指标；确诊需前列腺穿刺活检。","id":"x305"},{"k":"外科","q":"骨筋膜室综合征最早、最重要的临床表现是","o":["患肢剧烈疼痛，被动牵拉痛","患肢麻木","皮肤苍白","脉搏消失","肌肉瘫痪"],"a":0,"e":"骨筋膜室综合征最早表现为与损伤程度不符的剧烈疼痛和被动牵拉痛（被动伸直手指/足趾时剧痛），是早期诊断的关键；晚期才出现苍白、麻木、无脉、瘫痪。","id":"x306"},{"k":"外科","q":"肩关节前脱位的典型体征是","o":["Dugas 征阳性","Thomas 征阳性","浮髌试验阳性","直腿抬高试验阳性","Hoffmann 征阳性"],"a":0,"e":"肩关节前脱位时 Dugas 征阳性（患侧手掌搭在对侧肩部时肘部不能贴近胸壁），方肩畸形、关节盂空虚。","id":"x307"},{"k":"外科","q":"急性血源性骨髓炎最常见的致病菌是","o":["金黄色葡萄球菌","溶血性链球菌","铜绿假单胞菌","大肠埃希菌","结核分枝杆菌"],"a":0,"e":"急性血源性骨髓炎多由金黄色葡萄球菌引起，好发于儿童长骨干骺端（股骨远端、胫骨近端），表现为高热、局部红肿热痛。","id":"x308"},{"k":"生化","q":"蛋白质一级结构中连接氨基酸的化学键是","o":["肽键","氢键","二硫键","离子键","疏水作用"],"a":0,"e":"一级结构是氨基酸的排列顺序，靠肽键（酰胺键）连接；氢键维持二级结构，二硫键和疏水作用维持三级结构。","id":"x309"},{"k":"生化","q":"蛋白质变性后，下列哪项被破坏","o":["空间结构","一级结构","肽键","氨基酸组成","分子量"],"a":0,"e":"蛋白质变性是空间结构（二、三、四级）被破坏，一级结构（肽键、氨基酸序列）不变，因此分子量和组成不变，但生物学活性丧失。","id":"x310"},{"k":"生化","q":"酶活性中心的作用是","o":["结合底物并催化反应","维持酶的空间结构","决定酶的分子量","参与酶的合成","储存能量"],"a":0,"e":"酶活性中心由结合部位和催化部位组成，负责与底物结合并催化反应；活性中心外的结构维持酶的空间构象。","id":"x311"},{"k":"生化","q":"酶原激活的本质是","o":["肽键断裂导致构象改变、形成活性中心","酶被磷酸化","酶被甲基化","酶与辅酶结合","酶被降解"],"a":0,"e":"酶原激活通过特定位点肽键断裂，使酶原构象改变、形成或暴露活性中心（如胰蛋白酶原被肠激酶激活为胰蛋白酶）。","id":"x312"},{"k":"生化","q":"1 分子葡萄糖有氧氧化净生成 ATP 的数量约为","o":["30～32","2","12","18","38"],"a":0,"e":"1 分子葡萄糖有氧氧化净生成约 30～32 ATP（依 NADH 穿梭方式不同）；糖酵解净生成 2 ATP。","id":"x313"},{"k":"生化","q":"糖原合成中葡萄糖的活性供体是","o":["UDPG","GDP-葡萄糖","ADP-葡萄糖","葡萄糖-1-磷酸","葡萄糖-6-磷酸"],"a":0,"e":"糖原合成以 UDPG（尿苷二磷酸葡萄糖）为活性供体，由糖原合酶催化加到糖原引物非还原端。","id":"x314"},{"k":"生化","q":"磷酸戊糖途径的主要生理意义是","o":["生成 NADPH 和核糖-5-磷酸","生成 ATP","生成乳酸","合成糖原","分解脂肪酸"],"a":0,"e":"磷酸戊糖途径生成 NADPH（供还原性合成和抗氧化）和核糖-5-磷酸（核苷酸合成原料），不生成 ATP。","id":"x315"},{"k":"生化","q":"体内氨的主要来源是","o":["氨基酸脱氨基作用","肠道吸收","肾脏泌氨","肌肉分解","嘌呤分解"],"a":0,"e":"体内氨的主要来源是氨基酸脱氨基作用（氧化脱氨基、转氨基、联合脱氨基），其次为肠道吸收和肾小管泌氨。","id":"x316"},{"k":"生化","q":"一碳单位的载体是","o":["四氢叶酸","S-腺苷甲硫氨酸","生物素","辅酶 A","NAD⁺"],"a":0,"e":"一碳单位由四氢叶酸（THF）携带和转运，参与嘌呤、嘧啶合成；S-腺苷甲硫氨酸是甲基的直接供体。","id":"x317"},{"k":"生化","q":"甲硫氨酸循环中，甲基的直接供体是","o":["S-腺苷甲硫氨酸（SAM）","四氢叶酸","维生素 B12","叶酸","同型半胱氨酸"],"a":0,"e":"S-腺苷甲硫氨酸（SAM）是体内最重要的甲基直接供体，参与 DNA、RNA、蛋白质的甲基化；转甲基后生成同型半胱氨酸。","id":"x318"},{"k":"生化","q":"嘌呤核苷酸从头合成的起始物是","o":["PRPP（磷酸核糖焦磷酸）","尿酸","IMP","AMP","GMP"],"a":0,"e":"嘌呤从头合成以 PRPP 为起始物，经一系列反应生成 IMP，再转变为 AMP 和 GMP；限速酶是 PRPP 酰胺转移酶。","id":"x319"},{"k":"生化","q":"嘧啶核苷酸从头合成的关键中间产物是","o":["UMP","IMP","AMP","GMP","PRPP"],"a":0,"e":"嘧啶从头合成先形成 UMP，再转变为 UTP、CTP；关键酶是氨甲酰磷酸合成酶Ⅱ（CPS-Ⅱ）。","id":"x320"},{"k":"生化","q":"脱氧核苷酸的生成由下列哪种酶催化","o":["核糖核苷酸还原酶","胸苷酸合酶","二氢叶酸还原酶","嘧啶磷酸核糖转移酶","核苷酸酶"],"a":0,"e":"核糖核苷酸还原酶催化 NDP 还原为 dNDP，是脱氧核苷酸生成的限速酶，其活性受 ATP/dATP 调节。","id":"x321"},{"k":"生化","q":"DNA 复制的特点是","o":["半保留复制","全保留复制","不连续复制（仅一条链）","单向复制","无引物复制"],"a":0,"e":"DNA 复制是半保留复制（每条子链含一条亲代链）、双向复制、半不连续复制（前导链连续、后随链不连续）。","id":"x322"},{"k":"生化","q":"着色性干皮病的发病机制是","o":["DNA 损伤修复缺陷","DNA 复制错误","RNA 转录异常","蛋白质合成障碍","维生素缺乏"],"a":0,"e":"着色性干皮病由 DNA 损伤修复（核苷酸切除修复）缺陷引起，紫外线损伤不能修复，易患皮肤癌。","id":"x323"},{"k":"生化","q":"原核生物 RNA 转录终止的因子是","o":["ρ 因子","σ 因子","TFⅡD","TBP","CAP"],"a":0,"e":"原核生物转录终止分依赖 ρ 因子和不依赖 ρ 因子两种；σ 因子参与起始，TFⅡD、TBP 是真核转录因子。","id":"x324"},{"k":"生化","q":"蛋白质生物合成的起始密码子是","o":["AUG","UAA","UAG","UGA","GUA"],"a":0,"e":"AUG 是起始密码子（编码甲硫氨酸），UAA、UAG、UGA 是终止密码子。","id":"x325"},{"k":"生化","q":"镰状细胞贫血的分子基础是","o":["β 珠蛋白基因点突变","染色体缺失","基因扩增","RNA 剪接异常","蛋白质降解"],"a":0,"e":"镰状细胞贫血由 β 珠蛋白基因第 6 位密码子点突变（GAG→GTG），谷氨酸被缬氨酸取代，属于分子病。","id":"x326"},{"k":"生化","q":"基因工程中切割 DNA 的工具酶是","o":["限制性核酸内切酶","DNA 连接酶","DNA 聚合酶","逆转录酶","Taq 酶"],"a":0,"e":"限制性核酸内切酶识别特定序列并切割 DNA，是基因工程的\"分子剪刀\"；DNA 连接酶负责连接。","id":"x327"},{"k":"生化","q":"维生素 A 的活性形式中，参与视觉的是","o":["11-顺视黄醛","视黄醇","视黄酸","β-胡萝卜素","视黄酯"],"a":0,"e":"11-顺视黄醛与视蛋白结合形成视紫红质，参与暗视觉；缺乏维生素 A 可致夜盲症、干眼病。","id":"x328"},{"k":"生化","q":"维生素 C 缺乏导致坏血病，其机制是","o":["胶原蛋白羟化障碍","钙吸收减少","凝血因子合成障碍","神经髓鞘合成障碍","DNA 合成障碍"],"a":0,"e":"维生素 C 是脯氨酸、赖氨酸羟化酶的辅因子，缺乏时胶原蛋白羟化障碍、血管脆性增加，导致坏血病（牙龈出血、皮下瘀斑）。","id":"x329"},{"k":"生化","q":"维生素 D 的活性形式是","o":["1,25-(OH)₂-D₃","25-(OH)-D₃","维生素 D₂","维生素 D₃","7-脱氢胆固醇"],"a":0,"e":"维生素 D 经肝 25-羟化、肾 1α-羟化生成 1,25-(OH)₂-D₃（骨化三醇），促进肠钙吸收、骨钙动员和肾小管重吸收钙。","id":"x330"},{"k":"生化","q":"维生素 E 的主要生理功能是","o":["抗氧化，保护生物膜","促进钙吸收","参与凝血","参与视觉","参与胶原合成"],"a":0,"e":"维生素 E 是脂溶性抗氧化剂，保护生物膜中的不饱和脂肪酸免受自由基损伤；缺乏可致溶血性贫血。","id":"x331"},{"k":"生化","q":"维生素 K 参与合成的凝血因子是","o":["Ⅱ、Ⅶ、Ⅸ、Ⅹ","Ⅰ、Ⅱ、Ⅲ","Ⅷ、Ⅸ、Ⅺ","Ⅴ、Ⅷ、Ⅹ","Ⅻ、Ⅺ、Ⅸ"],"a":0,"e":"维生素 K 参与凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ 的 γ-羧化，使其能与 Ca²⁺ 结合发挥凝血活性。","id":"x332"},{"k":"生化","q":"呼吸链中电子传递的最终受氢体是","o":["氧","NAD⁺","FAD","细胞色素 c","辅酶 Q"],"a":0,"e":"呼吸链电子传递最终将电子传给氧，氧与质子结合生成水；NAD⁺、FAD、CoQ、Cyt c 是中间递电子体。","id":"x333"},{"k":"生化","q":"氧化磷酸化中 ATP 合成的关键酶是","o":["ATP 合酶","细胞色素氧化酶","NADH 脱氢酶","琥珀酸脱氢酶","腺苷酸激酶"],"a":0,"e":"ATP 合酶（复合体Ⅴ）利用质子电化学梯度驱动 ADP 与 Pi 合成 ATP，是氧化磷酸化的关键酶。","id":"x334"},{"k":"生化","q":"2,4-二硝基苯酚（DNP）的作用是","o":["解偶联剂，使氧化与磷酸化脱节","呼吸链抑制剂","ATP 合酶抑制剂","电子传递链激活剂","磷酸化促进剂"],"a":0,"e":"DNP 是解偶联剂，使质子梯度不经过 ATP 合酶而直接漏回基质，氧化仍在进行但 ATP 不能合成，能量以热形式释放。","id":"x335"},{"k":"生化","q":"血浆中含量最多的蛋白质是","o":["白蛋白","球蛋白","纤维蛋白原","载脂蛋白","凝血酶原"],"a":0,"e":"白蛋白占血浆总蛋白的 50%～60%，是血浆中含量最多的蛋白质，维持胶体渗透压并运输多种物质。","id":"x336"},{"k":"生化","q":"血红素分解代谢的终产物是","o":["胆红素","胆绿素","尿胆原","粪胆原","胆素"],"a":0,"e":"血红素在血红素加氧酶作用下生成胆绿素，再还原为胆红素（游离胆红素），是血红素分解的终产物。","id":"x337"},{"k":"生化","q":"肝生物转化的主要作用是","o":["使非营养物质极性增强、便于排出","合成蛋白质","合成尿素","储存糖原","分泌胆汁"],"a":0,"e":"肝生物转化通过氧化、还原、水解和结合反应，使脂溶性非营养物质极性增强、便于随胆汁或尿排出，起到解毒作用。","id":"x338"}],"ENQ":[{"id":"e1","k":"词汇","q":"The new policy is intended to ___ small businesses, not to burden them.","o":["constrain","facilitate","exaggerate","undermine"],"a":1,"e":"facilitate 促进、使便利，与 burden 形成对照；constrain（限制）和 undermine（削弱）都与\"not to burden\"矛盾。"},{"id":"e2","k":"词汇","q":"His argument sounds ___ but collapses under close examination.","o":["plausible","prevalent","reluctant","indifferent"],"a":0,"e":"plausible 貌似合理的，正好与\"经不起细看\"呼应；prevalent 是\"普遍的\"，不修饰论证的可信度。"},{"id":"e3","k":"词汇","q":"The report's conclusions were ___ by later studies, which found the opposite.","o":["reinforced","undermined","facilitated","sustained"],"a":1,"e":"后半句 \"found the opposite\" 是解题钥匙：结论被推翻，选 undermined。reinforce 是加强，方向相反。"},{"id":"e4","k":"词汇","q":"Access to clean water remains ___ in many rural areas.","o":["inevitable","substantial","scarce","legitimate"],"a":2,"e":"scarce 稀缺，与 access（可及性）搭配自然；inevitable 和 legitimate 都不描述供应量。"},{"id":"e5","k":"词汇","q":"She was ___ to admit that her initial assumption had been wrong.","o":["reluctant","vulnerable","profound","prevalent"],"a":0,"e":"be reluctant to do 是固定搭配，意为\"不情愿做某事\"；vulnerable 后接 to 时意为\"易受……伤害\"，语义不通。"},{"id":"e6","k":"词汇","q":"The two witnesses gave ___ accounts of the accident, so the police could not determine what had happened.","o":["identical","contradictory","plausible","substantial"],"a":1,"e":"后半句\"无法确定发生了什么\"说明两份陈述互相矛盾，选 contradictory；identical 恰好相反。"},{"id":"e7","k":"阅读","src":"restore","q":"The assumption that longer working hours inevitably produce more output has been repeated so often that it has acquired the status of common sense. Yet the evidence points elsewhere: beyond a certain threshold, additional hours yield diminishing returns, and the errors introduced by fatigue can offset whatever extra work is done.\n\n— The author’s attitude toward the \"common sense\" is best described as","o":["enthusiastic endorsement","qualified skepticism","complete indifference","open hostility"],"a":1,"e":"Yet 转折 + diminishing returns + can offset 三个信号词叠加，说明作者并不全盘否定、但明显保留 → qualified skepticism（有保留的怀疑）。"},{"id":"e8","k":"阅读","src":"restore","q":"In the same passage, \"offset\" is closest in meaning to","o":["cancel out","increase","postpone","expose"],"a":0,"e":"offset = 抵消、弥补。句意是\"疲劳带来的错误会抵消多干的那部分活\"，与 cancel out 最近。"},{"id":"e9","k":"词汇","q":"The committee’s decision was ___ by the discovery of new evidence.","o":["reversed","reinforced","postponed","overlooked"],"a":0,"e":"新证据使原决定被推翻，选 reversed；reinforced 是\"加强\"，与语义方向相反，是典型干扰项。"},{"id":"e10","k":"词汇","q":"Despite the ___ of the task, she finished it ahead of schedule.","o":["complexity","simplicity","brevity","clarity"],"a":0,"e":"Despite 表让步，前后必须相反：任务复杂却提前完成。simplicity 会让让步关系失去意义。"}],"DAILY":[{"q":"肺泡表面活性物质由哪种细胞分泌？主要成分是什么？","a":"Ⅱ型肺泡上皮细胞；主要成分为二棕榈酰卵磷脂（DPPC），可降低肺泡表面张力、防止肺泡萎陷。","s":"《生理学》第9版·呼吸"},{"q":"肾小球滤过膜由哪三层构成？主要屏障是哪一层？","a":"内皮细胞、基膜、足细胞足突（裂孔膜）；基膜是主要屏障，其上的负电荷也参与阻止蛋白滤过。","s":"《生理学》第9版·尿的生成和排出"},{"q":"血浆与红细胞内最重要的缓冲对各是什么？","a":"血浆为 NaHCO₃/H₂CO₃；红细胞内为 Hb/HHb（血红蛋白缓冲对）。","s":"《生理学》第9版·血液"},{"q":"视杆细胞与视锥细胞各含什么视色素、各负责什么？","a":"视杆细胞含视紫红质，感受弱光；视锥细胞含视紫蓝质，感受强光与色觉。","s":"《生理学》第9版·神经系统的功能"},{"q":"突触后抑制有哪两种形式？","a":"传入侧支性抑制（交互抑制）与回返性抑制；两者都通过抑制性中间神经元释放 GABA 产生 IPSP。","s":"《生理学》第9版·神经系统的功能"},{"q":"体温的昼夜节律中，最低和最高分别出现在什么时候？","a":"清晨 2—6 时最低，午后 1—6 时最高；下丘脑视交叉上核是节律中枢。","s":"《生理学》第9版·能量代谢与体温"},{"q":"肾血浆流量增加时，肾小球滤过率与滤过分数如何变化？","a":"GFR 增加，但滤过分数（GFR/肾血浆流量）下降——因为血浆流量增加的比例大于 GFR 增加的比例。","s":"《生理学》第9版·尿的生成和排出"},{"q":"DNA 的 Tm 值与 G-C 含量是什么关系？","a":"正相关。G-C 含量越高，氢键越多，Tm 越高；每增加 1% GC，Tm 约升高 0.4℃。","s":"《生物化学与分子生物学》第9版·核酸的结构与功能"},{"q":"竞争性抑制剂与非竞争性抑制剂对 Km 和 Vmax 的影响有何不同？","a":"竞争性：Km 增大、Vmax 不变；非竞争性：Km 不变、Vmax 降低。","s":"《生物化学与分子生物学》第9版·酶"},{"q":"mRNA 的 5′ 端与 3′ 端各有什么修饰？","a":"5′ 端为 m⁷GpppNm 帽子结构；3′ 端为 polyA 尾（约 20—200 个腺苷酸）。","s":"《生物化学与分子生物学》第9版·基因信息的传递"},{"q":"尿素循环中两个氮原子分别来自哪里？","a":"第一个来自氨（生成氨甲酰磷酸），第二个来自天冬氨酸。","s":"《生物化学与分子生物学》第9版·氨基酸代谢"},{"q":"一碳单位由什么载体携带？主要来自哪些氨基酸？","a":"由四氢叶酸（THF）携带；主要来自丝氨酸、甘氨酸、组氨酸、色氨酸。","s":"《生物化学与分子生物学》第9版·氨基酸代谢"},{"q":"胆固醇合成的限速酶是什么？","a":"HMG-CoA 还原酶，位于内质网；他汀类即抑制此酶。","s":"《生物化学与分子生物学》第9版·脂质代谢"},{"q":"长期饥饿时脑组织的主要能源物质是什么？","a":"酮体。可减少葡萄糖消耗、保护蛋白质不被大量分解。","s":"《生物化学与分子生物学》第9版·物质代谢的整合与调节"},{"q":"心肌梗死最早出现的肉眼改变大约在梗死后多久？","a":"12—18 小时出现苍白（凝固性坏死）区；镜下 12—24 小时可见凝固性坏死伴中性粒细胞浸润。","s":"《病理学》第9版·心血管系统疾病"},{"q":"化生最常见的类型是什么？举两个典型部位。","a":"柱状上皮→鳞状上皮化生；如支气管假复层纤毛柱状上皮、宫颈柱状上皮。","s":"《病理学》第9版·细胞和组织的适应与损伤"},{"q":"干酪样坏死属于哪一类坏死？最常见于什么病？","a":"属于凝固性坏死的一种特殊类型，是结核病的特征性病变。","s":"《病理学》第9版·炎症"},{"q":"风湿小体（Aschoff 小体）由哪些成分构成？","a":"中央纤维素样坏死、成纤维细胞（Anitschkow 细胞）及少量淋巴细胞。","s":"《病理学》第9版·心血管系统疾病"},{"q":"慢性肺淤血时肺泡腔内的\"心衰细胞\"是什么？","a":"吞噬了含铁血黄素的巨噬细胞，提示慢性左心衰。","s":"《病理学》第9版·局部血液循环障碍"},{"q":"肝细胞脂肪变性最常发生在肝小叶的哪个带？为什么？","a":"中央区（Ⅲ带），因该区距血窦最远、缺氧最明显，脂蛋白合成障碍。","s":"《病理学》第9版·消化系统疾病"},{"q":"COPD 患者长期家庭氧疗（LTOT）的指征是什么？","a":"PaO₂ ≤55 mmHg 或 SaO₂ ≤88%；或 PaO₂ 55—60 mmHg 伴肺动脉高压、右心衰、红细胞增多。每天 ≥15 小时。","s":"《内科学》第9版·呼吸系统疾病"},{"q":"肝硬化腹水利尿治疗时，螺内酯与呋塞米的常用比例是多少？","a":"100:40。保钾与排钾联用，既增强利尿又减少低钾风险。","s":"《内科学》第9版·消化系统疾病"},{"q":"肾病综合征高凝状态的重要原因之一是什么？","a":"抗凝血酶Ⅲ等抗凝物质随尿丢失，同时肝脏合成凝血因子增加、血液浓缩。","s":"《内科学》第9版·泌尿系统疾病"},{"q":"缺铁性贫血时血小板计数可有什么变化？","a":"常反应性增多（也可正常），是容易忽略的一个伴随表现。","s":"《内科学》第9版·血液系统疾病"},{"q":"甲亢患者血常规的典型改变是什么？","a":"白细胞总数可减少，但淋巴细胞比例与绝对值增多——这与感染时的中性粒细胞升高相反。","s":"《内科学》第9版·内分泌系统疾病"},{"q":"糖尿病酮症酸中毒时血淀粉酶可以升高吗？意义是什么？","a":"可以升高，但不等于合并胰腺炎；需结合腹痛部位、影像和脂肪酶判断。","s":"《内科学》第9版·内分泌系统疾病"},{"q":"肺结核\"原发综合征\"由哪三部分构成？","a":"原发病灶、淋巴管炎、肺门淋巴结肿大，三者构成哑铃状影像。","s":"《内科学》第9版·呼吸系统疾病"},{"q":"休克指数的定义与临床意义？","a":"休克指数 = 脉率 / 收缩压；正常约 0.5，>1.0 提示失血约 1000—1500 ml，>2.0 提示严重休克。","s":"《外科学》第9版·外科总论"},{"q":"成人烧伤九分法中，双下肢（含臀部）占体表面积的多少？","a":"46%（双下肢 41% + 臀部 5%）。女性臀部与双足比例略有调整。","s":"《外科学》第9版·外科总论"},{"q":"甲状腺手术中，喉上神经内支与外支损伤分别表现为什么？","a":"内支损伤→误咽、饮水呛咳（感觉支）；外支损伤→声调降低（运动支）。","s":"《外科学》第9版·普通外科"},{"q":"胆囊三角（Calot 三角）由什么构成？内含什么重要结构？","a":"胆囊管、肝总管、肝下缘；内含胆囊动脉，是胆囊切除术的关键解剖区。","s":"《外科学》第9版·普通外科"},{"q":"乳腺癌\"橘皮样\"改变的机制是什么？","a":"癌细胞阻塞皮下淋巴管，淋巴回流受阻致真皮水肿，毛囊处凹陷形成橘皮样外观。","s":"《外科学》第9版·普通外科"},{"q":"急性阑尾炎时腰大肌试验阳性提示阑尾位于何处？","a":"盲肠后位（腹膜后），炎症刺激腰大肌所致。","s":"《外科学》第9版·普通外科"},{"q":"骨折的三项专有体征是什么？","a":"畸形、反常活动、骨擦音或骨擦感。具备其一即可临床诊断骨折。","s":"《外科学》第9版·骨科"},{"q":"二尖瓣狭窄时\"开瓣音\"提示什么？","a":"瓣膜弹性尚好、活动度可，是经皮球囊二尖瓣成形术的有利条件；瓣膜钙化僵硬时开瓣音消失。","s":"《诊断学》第9版·体格检查"},{"q":"心包积液的 Ewart 征是什么？","a":"左肩胛下角区叩诊浊音、语颤增强，可闻及支气管呼吸音——大量心包积液压迫左下肺所致。","s":"《诊断学》第9版·体格检查"},{"q":"\"梨形心\"与\"靴形心\"分别对应什么病变？","a":"梨形心=二尖瓣狭窄（左房、右室增大）；靴形心=主动脉瓣关闭不全（左室增大）。","s":"《诊断学》第9版·体格检查"},{"q":"阿司匹林对血小板的抑制为什么能持续 7—10 天？","a":"它不可逆地乙酰化 COX-1，而血小板无细胞核、不能重新合成酶，须待新血小板生成才能恢复。","s":"《药理学》第9版·解热镇痛抗炎药"},{"q":"肝素过量与华法林过量分别用什么拮抗？","a":"肝素→鱼精蛋白；华法林→维生素 K₁（出血严重时输注凝血酶原复合物）。","s":"《药理学》第9版·抗凝血药"},{"q":"张力性气胸的紧急穿刺排气部位在哪里？","a":"患侧锁骨中线第 2 肋间（或腋前线第 4—5 肋间），先救命后诊断。","s":"《外科学》第9版·胸心外科"}],"WORDS":[["sustain","/səˈsteɪn/","维持；遭受（损失）","sustain growth 保持增长｜sustain an injury 受伤"],["undermine","/ˌʌndəˈmaɪn/","削弱；暗中破坏","undermine confidence 削弱信心｜undermine authority 削弱权威"],["compelling","/kəmˈpelɪŋ/","令人信服的；不可抗拒的","a compelling argument 有力的论证｜compelling evidence 确凿证据"],["ambiguous","/æmˈbɪɡjuəs/","模棱两可的","an ambiguous answer 含糊的回答｜deliberately ambiguous 故意含糊"],["advocate","/ˈædvəkeɪt/ 动；/ˈædvəkət/ 名","提倡；拥护者","advocate reform 主张改革｜a strong advocate of 坚决拥护者"],["diminish","/dɪˈmɪnɪʃ/","减少；贬低","diminishing returns 收益递减｜diminish the role 贬低作用"],["inevitable","/ɪnˈevɪtəbl/","不可避免的","an inevitable consequence 必然结果｜it is inevitable that… 不可避免"],["profound","/prəˈfaʊnd/","深刻的；深远的","a profound impact 深远影响｜profound changes 深刻变化"],["prevalent","/ˈprevələnt/","普遍的；流行的","a prevalent view 普遍看法｜increasingly prevalent 日益普遍"],["reluctant","/rɪˈlʌktənt/","不情愿的","be reluctant to do 不愿做｜a reluctant agreement 勉强同意"],["scrutiny","/ˈskruːtəni/","仔细审查","under scrutiny 受到审查｜close scrutiny 严密审视"],["consensus","/kənˈsensəs/","共识","reach a consensus 达成共识｜scientific consensus 科学共识"],["incentive","/ɪnˈsentɪv/","激励；动机","financial incentive 经济激励｜an incentive to do 做某事的动力"],["constrain","/kənˈstreɪn/","限制；约束","constrain growth 抑制增长｜be constrained by 受制于"],["exaggerate","/ɪɡˈzædʒəreɪt/","夸大","exaggerate the risk 夸大风险｜grossly exaggerated 严重夸大"],["facilitate","/fəˈsɪlɪteɪt/","促进；使便利","facilitate communication 促进沟通｜facilitate the process 简化流程"],["indifferent","/ɪnˈdɪfrənt/","漠不关心的","be indifferent to 对……漠然｜indifferent to criticism 不在乎批评"],["legitimate","/lɪˈdʒɪtɪmət/","合法的；合理的","a legitimate concern 合理担忧｜legitimate business 合法生意"],["notion","/ˈnəʊʃn/","观念；概念","the notion that… ……的观念｜reject the notion 否定这一说法"],["perceive","/pəˈsiːv/","察觉；认为","perceive A as B 把 A 看作 B｜be perceived as 被视为"],["plausible","/ˈplɔːzəbl/","貌似合理的","a plausible explanation 说得通的解释｜sound plausible 听着有理"],["reinforce","/ˌriːɪnˈfɔːs/","加强；强化","reinforce the view 强化观点｜mutually reinforcing 相辅相成"],["substantial","/səbˈstænʃl/","大量的；实质的","a substantial increase 大幅增长｜substantial evidence 充分证据"],["vulnerable","/ˈvʌlnərəbl/","脆弱的；易受伤的","be vulnerable to 易受……影响｜vulnerable groups 弱势群体"],["deteriorate","/dɪˈtɪəriəreɪt/","恶化；变坏","deteriorate rapidly 迅速恶化｜health deteriorated 健康恶化"],["alleviate","/əˈliːvieɪt/","缓解；减轻","alleviate pain 缓解疼痛｜alleviate the burden 减轻负担"],["attribute","/əˈtrɪbjuːt/","把……归因于","attribute A to B 把 A 归因于 B｜be attributed to 被归因于"],["comprehensive","/ˌkɒmprɪˈhensɪv/","全面的；综合的","a comprehensive review 全面综述｜comprehensive reform 全面改革"],["controversy","/ˈkɒntrəvɜːsi/","争议","spark controversy 引发争议｜beyond controversy 无可争议"],["illustrate","/ˈɪləstreɪt/","说明；举例说明","illustrate the point 说明这一点｜as illustrated above 如上所示"]],"SENTS":[["It is not difficult to see why the young man, who had been raised in a household where books were treated as sacred objects, developed such a reverence for the written word.","It is not difficult to see why ...（形式主语句型）","who 引导定语从句修饰 the young man，从句里又套了一个 where 定语从句；reverence for 是名词化表达，比\"respect\"更书面。"],["What the researchers found, after tracking more than 5,000 subjects over a decade, was that those who slept fewer than six hours a night were nearly twice as likely to develop the condition.","What ... was that ...（主语从句 + 表语从句）","after tracking 是插入状语，先跳过它抓主干；twice as likely to 是比较结构，翻译成\"可能性是……的两倍\"。"],["So accustomed have we become to the convenience of instant communication that we rarely pause to consider what is lost when a letter is replaced by an email.","we have become so accustomed to ... that ...（so...that 倒装）","so 提前引起部分倒装，是强调句式；what is lost 是 consider 的宾语从句，when 从句再嵌套。"],["The assumption that economic growth will automatically translate into improved well-being, an assumption that has underpinned public policy for decades, is now being questioned by a growing number of economists.","The assumption ... is now being questioned（主谓被长插入语隔开）","第一个 that 是同位语从句，破折号式的 an assumption that... 是同位语复指；translate into 意为\"转化为\"。"],["Rather than viewing failure as a verdict on their ability, resilient people treat it as information — a signal that the strategy, not the self, needs adjusting.","resilient people treat it as information","Rather than 引导状语，含义是\"而不是\"；破折号后是 information 的同位语，not the self 是插入的对比成分。"],["Had the committee anticipated how strongly the proposal would be opposed, it might have chosen a different moment to release it.","it might have chosen ...（主句）","省略 if 的虚拟条件句，Had 提前引起倒装；how strongly 引导宾语从句，would be opposed 是过去将来被动。"],["There is no shortage of explanations for why the practice persists, but few of them withstand the scrutiny that a careful reading of the evidence demands.","There is no shortage ..., but few withstand ...（并列句）","why 从句作介词 for 的宾语；that 引导定语从句修饰 scrutiny，demands 的主语是 a careful reading。"],["What makes the finding remarkable is not merely its size but the fact that it held across every age group and income bracket examined.","What makes ... is not merely ... but ...（主语从句 + 表语）","not merely...but 是\"不仅……而且\"；that 引导同位语从句解释 fact；examined 是后置定语。"],["The extent to which early exposure shapes later preferences remains a matter of debate, but few would deny that it leaves some mark.","The extent ... remains a matter of debate, but few would deny that ...（并列句）","to which 引导定语从句修饰 extent；a matter of debate 是\"有待商榷\"的地道表达；deny that 后接同位语式宾语从句。"],["Not until the findings had been replicated in three independent cohorts did the researchers feel confident enough to publish them.","the researchers did feel ...（主句倒装）","Not until 置于句首引起部分倒装，助动词 did 提前；had been replicated 是过去完成时的被动，表示\"在此之前的重复验证\"。"]],"MSE":[{"id":"general","name":"一般表现","ask":"现在几点？这里是哪里？我是谁？——看意识、定向力、接触与合作"},{"id":"perception","name":"感知觉","ask":"有没有听到别人听不到的声音？有没有看到别人看不到的东西？"},{"id":"form","name":"思维形式","ask":"听语速和连贯性：是否跳跃、答非所问、句子之间还有没有逻辑"},{"id":"content","name":"思维内容","ask":"有没有觉得有人要害你、议论你？有没有反复冒出来甩不掉的想法？"},{"id":"affect","name":"情感","ask":"最近心情怎么样？有没有提不起兴趣、什么都高兴不起来？"},{"id":"will","name":"意志与行为","ask":"有没有不想动、不想说话？有没有做过别人觉得奇怪的事？"},{"id":"cognition","name":"认知功能","ask":"100 连续减 7；回忆刚才让你记的那三个词"},{"id":"insight","name":"自知力","ask":"你觉得自己是生病了吗？需要治疗吗？"},{"id":"risk","name":"风险评估","ask":"有没有想过不想活了？有没有具体的计划或准备？"},{"id":"body","name":"躯体与辅助检查","ask":"生命体征、神经系统查体；甲功、电解质、头颅影像排除器质性"}],"CASES":[{"id":"stemi","dept":"内科·循环","stem":"男，58 岁。突发胸骨后压榨性疼痛 2 小时，伴大汗、恶心。BP 100/70 mmHg，心率 52 次/分。心电图：Ⅱ、Ⅲ、aVF 导联 ST 段抬高 0.3 mV。","dx":{"answer":"急性下壁 ST 段抬高型心肌梗死（罪犯血管多为右冠状动脉）","why":["中年男性 + 突发压榨性胸痛持续 2 小时不缓解 + 大汗：先把范围锁到\"急性冠脉综合征\"，而不是\"胸痛待查\"。","Ⅱ、Ⅲ、aVF 导联 ST 抬高：三个下壁导联同时抬高，定位就是下壁。","抬高幅度 Ⅲ > Ⅱ，且 aVL 出现镜像压低：右冠状动脉闭塞的典型图形；若 Ⅱ > Ⅲ 且 aVL 抬高，更像回旋支。","心率 52 + 血压偏低：窦房结/房室结缺血，进一步支持右冠近端病变——这解释了他为什么心率慢、血压低。","疼痛 >20 分钟 + ST 抬高：已不满足\"心绞痛\"的定义，是透壁性坏死，处理级别直接升到再灌注。"]},"diff":[["主动脉夹层","撕裂样痛、向背部放射、双上肢血压差 >20 mmHg、D-二聚体显著升高；两者可并存，PCI 前若高度怀疑需先 CTA"],["肺栓塞","突发呼吸困难 + 低氧、右心负荷表现（SⅠQⅢTⅢ、右室扩大）；胸痛多为胸膜性、与呼吸相关"],["急性心包炎","疼痛随体位/呼吸变化、广泛导联 ST 凹面向上抬高伴 PR 段压低、无镜像改变"],["自发性气胸","突发一侧胸痛 + 呼吸困难，查体患侧呼吸音消失、叩诊鼓音"]],"exam":[["心肌肌钙蛋白 I","0—3 小时动态升高是心肌坏死的必要条件，但它是\"确认\"而非\"决定再灌注\"的依据，心电图已够"],["18 导联心电图（含 V3R—V5R、V7—V9）","下壁心梗必须加做右胸和后壁导联：有无右室受累，直接决定补液还是利尿"],["床旁超声心动图","看室壁运动异常、右室是否扩大、有无心包积液与机械并发症"],["急诊冠脉造影","诊断与治疗一体，造影结果直接决定 PCI 策略"]],"tx":[["再灌注（首要）","首选急诊 PCI，目标 door-to-balloon <90 分钟；无条件转运时 30 分钟内溶栓"],["抗栓","阿司匹林 + P2Y12 抑制剂双联负荷，加肝素抗凝，进导管室前给完"],["二级预防起始","他汀、β 受体阻滞剂；本例心率 52，用 β 阻滞剂前先评估有无房室传导阻滞"],["陷阱：右室梗死","合并右室梗死时依赖前负荷，硝酸酯和利尿剂会把血压打崩；此时要扩容（生理盐水），而不是\"心梗一律利尿\""]]},{"id":"aecopd","dept":"内科·呼吸","stem":"男，65 岁，吸烟 40 年。咳嗽咳痰 20 年，气促加重 3 天，痰黄稠，今晨嗜睡。血气（未吸氧）：pH 7.28，PaCO₂ 70 mmHg，PaO₂ 50 mmHg。","dx":{"answer":"COPD 急性加重（AECOPD）合并Ⅱ型呼吸衰竭、肺性脑病","why":["老年男性 + 吸烟 40 年 + 慢性咳痰喘 20 年：基础病先成立，后面所有症状都往 COPD 上归因。","气促加重 + 痰量增多 + 痰变黄稠：AECOPD 三个加重指标全中，且提示感染性诱因。","PaO₂ 50（<60）+ PaCO₂ 70（>50）：Ⅱ型呼衰，说明肺泡通气不足，不只是氧合问题。","pH 7.28：失代偿性呼吸性酸中毒，代偿还没跟上——这是\"要不要上无创通气\"的分界线。","嗜睡：CO₂ 潴留导致肺性脑病，是呼吸衰竭的神经系统表现，不是\"年纪大犯困\"。"]},"diff":[["支气管哮喘急性发作","多有过敏史、发作性呼气性呼吸困难、双肺弥漫哮鸣音；COPD 为持续进展、桶状胸、呼吸音减弱"],["急性左心衰","端坐呼吸、粉红泡沫痰、双肺底湿啰音、BNP 明显升高"],["重症肺炎","发热、局部湿啰音、影像斑片影；AECOPD 常由感染诱发，两者可重叠"],["自发性气胸","突发一侧胸痛 + 呼吸音消失 + 气管偏移；COPD 是气胸高危人群，必须拍片排除"]],"exam":[["动脉血气（未吸氧）","判断呼衰类型和酸中毒程度，是分型与是否上机的直接依据"],["胸部 CT","排除气胸、肺炎、肺栓塞这三个会立刻改变处理方向的诊断"],["痰培养 + 药敏","指导抗生素，反复加重、近期用过抗生素者尤其需要"],["血常规、CRP、BNP、心电图","区分\"感染为主\"还是\"心衰为主\"，决定要不要利尿和强心"]],"tx":[["氧疗（最容易错的一步）","控制性低流量 1—2 L/min，目标 SpO₂ 88%—92%；高浓度吸氧会抑制低氧驱动、加重 CO₂ 潴留"],["支气管扩张","短效 β₂ 激动剂 + 抗胆碱能雾化，是缓解气流受限最快的手段"],["糖皮质激素","全身用 5—7 天，缩短恢复时间、改善肺功能"],["无创正压通气","pH<7.35 且 PaCO₂ 明显升高时首选；意识障碍加重、不能配合则改有创"],["禁忌","禁用镇静剂——会直接抑制呼吸驱动，把Ⅱ型呼衰推向不可逆"]]},{"id":"ugib","dept":"内科·消化","stem":"男，45 岁。上腹隐痛 5 年，近 2 天黑便，起身时头晕。BP 90/60 mmHg，Hb 75 g/L，BUN 18 mmol/L。","dx":{"answer":"消化性溃疡并上消化道出血、失血性休克","why":["上腹隐痛 5 年：慢性溃疡病史，先给出\"出血来源在胃十二指肠\"的先验概率。","黑便而不是便血：出血点在 Treitz 韧带以上，血液在肠道停留足够久被细菌作用——定位上消化道的经典依据。","
