右髋部疼痛，不能站立。右下肢短缩、外旋畸形。X 线示右股骨颈骨折，Garden Ⅲ 型。","dx":{"answer":"右股骨颈骨折（Garden Ⅲ 型，囊内型）","why":["老年女性 + 低能量跌倒：骨质疏松性髋部骨折的典型人群。","右下肢短缩 + 外旋：髋部骨折的经典体征。外旋 45°—60° 提示股骨颈；外旋 >90° 更像转子间骨折或后脱位。","不能站立 + 髋部压痛 + 纵向叩击痛：骨折的临床确定征象。","Garden Ⅲ 型 = 完全骨折、部分移位：股骨头血供已受损，坏死和不愈合风险显著升高，直接决定术式。"]},"diff":[["股骨转子间骨折","外旋更明显（常 >90°）、肿胀瘀斑更重、骨折线在转子间"],["髋关节后脱位","屈曲、内收、内旋畸形，多有高能量外伤"],["骨盆骨折","不能坐起、骨盆挤压分离试验阳性，可能合并尿道膀胱损伤"],["病理性骨折","轻微外伤、有肿瘤史、X 线见骨质破坏"]],"exam":[["髋关节正侧位 X 线","首选，但隐匿骨折可漏诊；高度怀疑而 X 线阴性时不能就此排除"],["骨盆 CT","判断移位程度、粉碎情况、有无隐匿骨折，是术前规划依据"],["骨密度","评估骨质疏松程度，决定术后抗骨松方案"],["术前心肺评估 + 下肢静脉超声","老年手术风险分层，同时排除术前 DVT"]],"tx":[["手术时机","争取 48 小时内，拖延会显著增加卧床并发症和一年内死亡率"],["术式选择","65 岁以上移位型 → 人工股骨头或全髋置换；年轻或未移位 → 空心钉内固定"],["围手术期","抗凝防 DVT、防压疮、防肺部感染、充分镇痛"],["抗骨质疏松","钙 + 维生素 D + 双膦酸盐，防对侧再骨折——只做手术不管骨松，等于等下一次"]]},{"id":"depression","dept":"精神科","stem":"女，24 岁。情绪低落、兴趣减退 3 个月，早醒，食欲下降，体重减 5 kg，自述\"活着没意思\"，否认具体计划。HAMD 24 分。","dx":{"answer":"抑郁发作（中度，伴自杀观念）","why":["情绪低落 + 兴趣减退 + 精力下降：抑郁三大核心症状，且持续 3 个月，远超 2 周的时间标准。","早醒、食欲下降、体重减 5 kg：生物学症状。早醒是抑郁的特征性睡眠障碍，入睡困难更偏焦虑。","HAMD 24 分：中度偏重，量化了严重程度。","\"活着没意思\"但否认具体计划：有自杀观念、无计划无准备，决定处置层级是\"密切随访 + 限制手段\"，而非立即强制住院。"]},"diff":[["双相障碍抑郁相","追问有无轻躁狂史（精力旺盛、话多、冲动消费、睡眠需求减少）；漏诊会让抗抑郁药诱发转躁"],["甲减所致心境障碍","TSH 升高、畏寒、便秘、体重增加、反应迟钝"],["器质性 / 物质所致","脑卒中后抑郁、酒精、糖皮质激素；起病晚、有神经系统体征时要查"],["居丧反应","与丧失事件明确相关、随时间自限、自责不泛化"]],"exam":[["结构化自杀风险评估","观念—计划—手段—既往尝试—保护因素；这是精神科最优先的\"检查\""],["甲状腺功能、血常规、生化","排除器质性和物质所致"],["PHQ-9 / HAMD","建立基线评分，随访对比才有意义"],["必要时头颅影像","非典型表现、老年起病、有神经系统体征时"]],"tx":[["SSRI 一线","舍曲林、艾司西酞普兰；足量足疗程，起效需 2—4 周"],["心理治疗","CBT 对轻中度疗效确切，可与药物联合"],["危机干预","限制手段、家属陪护、加密随访，必要时住院"],["陷阱","25 岁以下用药初期自杀风险可能升高，需密切监测；一旦转躁立即停药并重新评估双相"]]},{"id":"schizophrenia","dept":"精神科","stem":"女，21 岁，由家属陪同。近 6 个月独处自语、疑人害己，称\"电视里在说我\"。交谈时情感平淡，应答尚切题，无自知力。","dx":{"answer":"精神分裂症（偏执型可能）","why":["\"电视里在说我\"：评论性/议论性幻听，典型的第一 rank 阳性症状。","疑人害己：被害妄想，与幻听构成同一症状群，互相印证。","情感平淡 + 意志减退：阴性症状，说明病程已不是最早期。","病程 6 个月（活动期 >1 个月 + 总体 ≥6 个月）：满足病程标准，短于此要考虑急性短暂性精神病性障碍。","无自知力：治疗依从性是最大障碍，也是必须让家属参与的理由。"]},"diff":[["妄想性障碍","妄想系统固定、人格与情感相对保留、无幻觉；社会功能损害较轻"],["双相障碍伴精神病性症状","有明确的心境发作，精神病性症状与心境同步"],["器质性精神障碍","头颅影像异常、神经系统体征、认知下降"],["物质所致","尿毒物筛查阳性，停药后症状消退"]],"exam":[["系统精神检查","重点是感知觉、思维内容、情感协调性、意志行为四项"],["PANSS","基线严重度和疗效评估，后续调药靠它"],["甲功、头颅 MRI、毒物筛查","排除器质性和物质所致，首次发病尤其不能省"],["风险评估","冲动、自伤、外走；有无命令性幻听是住院指征之一"]],"tx":[["第二代抗精神病药","奥氮平 / 利培酮 / 阿立哌唑，足量起始，急性期 4—6 周评估疗效"],["依从性","反复复发者优选长效针剂，比口服更能防复发"],["心理社会干预","家庭宣教（降低高情感表达）、社交技能训练、职业康复"],["维持治疗","首发需维持 1—2 年，反复发作者考虑终身；自行停药复发率 >70%"]]}],"WEEKDAYS":[{"day":"2026-10-21","label":"第 1 天","date":"10/21","theme":"呼吸① 肺炎 / 肺脓肿 / 支扩"},{"day":"2026-10-22","label":"第 2 天","date":"10/22","theme":"呼吸② COPD / 哮喘 / 肺癌"},{"day":"2026-10-23","label":"第 3 天","date":"10/23","theme":"呼吸③ 肺栓塞 / 胸水 / 气胸 / ARDS"},{"day":"2026-10-24","label":"第 4 天","date":"10/24","theme":"循环① 心衰 / 心律失常"},{"day":"2026-10-25","label":"第 5 天","date":"10/25","theme":"循环② 高血压 / 冠心病 + 周测"}],"WEEKQ":[{"id":"w1","day":"2026-10-21","k":"内科·呼吸","q":"社区获得性肺炎最常见的病原体是","o":["肺炎链球菌","金黄色葡萄球菌","肺炎克雷伯菌","铜绿假单胞菌","军团菌"],"a":0,"plain":"社区里得的肺炎，十有八九是肺炎链球菌干的；医院里得的才是革兰阴性菌和耐药菌的主场。","why":"社区获得性肺炎（CAP）最常见的病原体是肺炎链球菌，约占 30%—50%。它引起大叶性肺炎，起病急、高热寒战、铁锈色痰。判断\"社区\"还是\"医院\"是解题第一步：入院 48 小时后新发的肺炎才算医院获得性肺炎（HAP）。","others":"金黄色葡萄球菌多见于流感后、静脉吸毒者，易形成肺脓肿；肺炎克雷伯菌常见于酗酒者和老人，砖红色胶冻样痰；铜绿假单胞菌多见于支扩、机械通气、免疫抑制者；军团菌与空调水系统有关，常伴消化道症状和低钠血症。","trap":"一句话：社区=肺炎链球菌，医院=革兰阴性菌。题干出现\"入院 48 小时后\"就往 HAP 想。","cite":{"book":"内科学","ed":"第10版","page":"p77","quote":"大叶性（肺泡性）肺炎：病原体先在肺泡引起炎症，经肺泡间孔（Cohn孔）向其他肺泡扩散……致病菌多为肺炎链球菌。X线影像显示肺叶或肺段的实变阴影。"}},{"id":"w2","day":"2026-10-21","k":"内科·呼吸","q":"大叶性肺炎最具特征性的痰液是","o":["铁锈色痰","砖红色胶冻样痰","粉红色泡沫痰","大量脓臭痰","白色黏液痰"],"a":0,"plain":"铁锈色痰不是血，是红细胞被肺泡里的巨噬细胞\"消化\"后留下的含铁血黄素，所以呈锈色。","why":"大叶性肺炎典型者由肺炎链球菌引起，经典痰液是铁锈色痰。病理基础是肺泡内大量红细胞渗出、崩解，血红蛋白被分解成含铁血黄素，与痰混合后呈铁锈色。","others":"砖红色胶冻样痰是肺炎克雷伯菌；粉红色泡沫痰是急性左心衰肺水肿；大量脓臭痰是肺脓肿或支扩合并厌氧菌感染；白色黏液痰见于慢性支气管炎。","trap":"痰色是\"病原体指纹\"：铁锈色→肺炎链球菌，砖红胶冻→克雷伯，粉红泡沫→心衰，脓臭→厌氧菌。"},{"id":"w3","day":"2026-10-21","k":"内科·呼吸","q":"支气管扩张的典型表现是","o":["慢性咳嗽、大量脓痰、反复咯血","刺激性干咳、痰中带血","高热、胸痛、咳铁锈色痰","进行性呼吸困难、杵状指","夜间阵发性呼吸困难"],"a":0,"plain":"支扩就是支气管被反复感染撑成了\"永久性的宽管子\"，痰存在里面，所以一躺下就咳一大口。","why":"支气管扩张的典型表现是慢性咳嗽 + 大量脓痰 + 反复咯血。痰液静置后分层（上层泡沫、中层浑浊黏液、下层坏死组织）是特征性表现。好发部位是左下叶和左舌叶，因为左主支气管细长、与气管夹角大，引流较差。","others":"刺激性干咳见于肺癌早期、间质性肺病；高热胸痛铁锈色痰是大叶性肺炎；进行性呼吸困难是间质性肺病或肺气肿。","trap":"记住\"左下叶+舌叶\"和\"痰液分层\"两个细节，考试就考它们。干性支扩只咯血不咳痰，多见于结核后。"},{"id":"w4","day":"2026-10-21","k":"内科·呼吸","q":"肺脓肿最常见的感染途径是","o":["吸入性感染","血源性播散","邻近器官直接蔓延","淋巴道播散","外伤直接种植"],"a":0,"plain":"肺脓肿绝大多数是\"吸进去\"的——口腔分泌物、牙周细菌在睡觉、醉酒、麻醉时被吸进肺，所以都是厌氧菌。","why":"肺脓肿最常见的病因是吸入性感染，病原体以厌氧菌为主（约 90%）。好发于右肺下叶背段和后基底段，因为右主支气管较陡直，误吸物容易进入右侧。治疗核心是抗生素 + 体位引流，疗程 6—8 周。","others":"血源性肺脓肿多由金黄色葡萄球菌引起，表现为两肺多发小脓肿；继发性肺脓肿继发于支扩、肺癌阻塞；直接蔓延来自膈下脓肿或肝脓肿。","trap":"体位引流要求\"病侧在上\"，让脓肿里的痰靠重力流出来——别记反了。","cite":{"book":"内科学","ed":"第10版","page":"p99","quote":"原发性肺脓肿也称吸入性肺脓肿，主要由于吸入口鼻、咽部病原菌（厌氧菌为主）引起。"}},{"id":"w5","day":"2026-10-22","k":"内科·呼吸","q":"COPD 气流受限最主要的病理生理基础是","o":["小气道病变与肺气肿","支气管平滑肌痉挛","肺泡表面活性物质减少","肺间质纤维化","胸廓畸形"],"a":0,"plain":"COPD 不是\"肺变大了\"，是\"管子塌了\"——小气道失去弹性支撑，呼气时提前闭合，气出不来。","why":"COPD 的核心病理生理是持续气流受限，由两部分造成：小气道病变（炎症、纤维化、管壁增厚）和肺气肿（肺泡壁破坏、弹性回缩力下降）。呼气时小气道因失去周围组织牵拉而塌陷，形成呼气性呼吸困难和肺过度充气。","others":"支气管平滑肌痉挛是可逆的，属于哮喘特征；表面活性物质减少见于婴儿呼吸窘迫综合征；肺间质纤维化是限制性通气障碍；胸廓畸形也是限制性。","trap":"一句话：吸气不难、呼气费劲，所以病人常缩唇呼吸——增加气道内压防止小气道塌陷。"},{"id":"w6","day":"2026-10-22","k":"内科·呼吸","q":"支气管哮喘急性发作时最典型的肺部体征是","o":["双肺广泛哮鸣音，呼气相延长","双肺底湿啰音","局限性哮鸣音","吸气性喉鸣","患侧呼吸音消失"],"a":0,"plain":"哮喘发作时气道像被\"捏住的水管\"，空气挤过去就发出哨音，而且呼气比吸气更长。","why":"哮喘急性发作的典型体征是双肺可闻及广泛哮鸣音、呼气相延长。机制是支气管平滑肌痉挛 + 黏膜水肿 + 分泌物增多，使气道阻力在呼气时明显升高。严重发作时哮鸣音反而减弱甚至消失（\"寂静肺\"），提示气流几乎消失，是危象。","others":"双肺底湿啰音提示肺水肿或肺炎；局限性哮鸣音提示气道异物或肿瘤阻塞；吸气性喉鸣提示上气道梗阻（喉头水肿、肿瘤）。","trap":"\"哮鸣音消失\"不是好转，而是恶化——这个反直觉点考过很多次。"},{"id":"w7","day":"2026-10-22","k":"内科·呼吸","q":"目前我国肺癌发病率最高的组织学类型是","o":["腺癌","鳞状细胞癌","小细胞癌","大细胞癌","类癌"],"a":0,"plain":"吸烟最\"对口\"的是鳞癌和小细胞癌；不吸烟的女性得的多是腺癌——所以腺癌现在是发病率第一。","why":"我国肺癌发病率最高的组织学类型已由鳞癌转为腺癌，与筛查普及、吸烟模式变化有关。腺癌多为周围型，早期常无症状，易发生胸膜转移和远处转移。","others":"与吸烟关系最密切的是鳞状细胞癌和小细胞癌，两者多为中央型，常先经淋巴道转移；大细胞癌少见、恶性度高；类癌属神经内分泌肿瘤，低度恶性。","trap":"三个问法三种答案：问\"最常见\"答腺癌，问\"与吸烟最相关\"答鳞癌/小细胞癌，问\"中央型\"答鳞癌/小细胞癌。"},{"id":"w8","day":"2026-10-22","k":"内科·呼吸","q":"患者面颈部水肿、颈静脉怒张、胸壁静脉曲张，最可能的原因是","o":["上腔静脉受压","右心衰竭","心包填塞","甲状腺功能亢进","肾病综合征"],"a":0,"plain":"肿瘤长在纵隔把上腔静脉\"掐住\"，头和胳膊的血回不去，就脸肿、脖子粗、前胸静脉鼓起来。","why":"上腔静脉综合征表现为面颈部及上肢水肿、颈静脉怒张、胸壁静脉曲张，严重时呼吸困难、意识改变。最常见原因是肺癌（尤其小细胞癌）压迫或侵犯上腔静脉，其次为淋巴瘤。","others":"右心衰以双下肢水肿、肝大为主，面部水肿不突出；心包填塞有奇脉、低血压、心音遥远；甲亢是颈部肿大伴高代谢；肾病综合征水肿从眼睑开始且伴大量蛋白尿。","trap":"看到\"面部水肿+颈静脉怒张+胸壁静脉曲张\"三件套，先想上腔静脉受压，别先想心衰。"},{"id":"w9","day":"2026-10-23","k":"内科·呼吸","q":"肺栓塞最具特征性的心电图改变是","o":["SⅠQⅢTⅢ","Ⅱ、Ⅲ、aVF 导联 ST 抬高","V1—V6 广泛 ST 压低","P 波高尖","PR 间期延长"],"a":0,"plain":"肺栓塞的经典心电图口诀是 SⅠQⅢTⅢ——Ⅰ 导联 S 波深、Ⅲ 导联 Q 波和 T 波倒置，本质是右心被突然憋住。","why":"肺栓塞时右心室后负荷骤增，心电图可出现 SⅠQⅢTⅢ、完全或不完全性右束支传导阻滞、V1—V4 T 波倒置。确诊首选 CT 肺动脉造影（CTPA）；血流动力学不稳时可床旁超声。","others":"Ⅱ、Ⅲ、aVF ST 抬高是下壁心梗；V1—V6 广泛 ST 压低提示心内膜下缺血；P 波高尖是肺型 P 波（右房扩大）；PR 延长见于房室传导阻滞。","trap":"高危因素三件套：制动、手术/骨折、肿瘤。再加\"不明原因的呼吸困难+低氧\"，就要想到它。"},{"id":"w10","day":"2026-10-23","k":"内科·呼吸","q":"下列哪项支持胸腔积液为渗出液","o":["胸水蛋白/血清蛋白 > 0.5","胸水蛋白/血清蛋白 \u003c 0.5","胸水 LDH 低于血清正常上限的 2/3","胸水葡萄糖明显升高","胸水 pH 升高"],"a":0,"plain":"漏出液是\"水管压力不对\"漏出来的清水，渗出液是\"发炎\"渗出来的浑水，蛋白和 LDH 都高。","why":"鉴别靠 Light 标准，满足任一条即为渗出液：①胸水蛋白/血清蛋白 >0.5；②胸水 LDH/血清 LDH >0.6；③胸水 LDH > 血清正常上限的 2/3。渗出液常见于结核性胸膜炎、肺炎旁积液、肿瘤；漏出液见于心衰、肝硬化、肾病。","others":"心衰多为漏出液（但长期利尿后可变得像渗出液）；结核性以淋巴细胞为主、ADA 升高；肺炎旁积液以中性粒细胞为主，pH 和葡萄糖降低。","trap":"记三条比值就够：0.5、0.6、2/3。渗出液 pH 和糖是\"降低\"，不是升高。"},{"id":"w11","day":"2026-10-23","k":"外科·胸心","q":"张力性气胸最具鉴别意义的体征是","o":["气管向健侧移位","患侧呼吸音减弱","患侧叩诊鼓音","患侧胸廓饱满","呼吸困难"],"a":0,"plain":"胸腔里进了气又出不去，越积越多，把心脏和气管都推到对侧——这是急症，先扎针。","why":"张力性气胸的典型体征：患侧胸廓饱满、呼吸动度减弱、叩诊鼓音、呼吸音消失，气管和心尖搏动向健侧移位，常伴颈静脉怒张和低血压（回心血量减少）。其中气管移位最能提示\"张力性\"。","others":"闭合性气胸气管多居中；血胸叩诊浊音；胸腔积液呼吸音减弱但叩诊浊音、语音震颤减弱；肺不张气管向患侧移位。","trap":"\"气管移位方向\"是分水岭：向健侧=张力性气胸或大量胸腔积液；向患侧=肺不张或胸膜粘连。"},{"id":"w12","day":"2026-10-23","k":"内科·呼吸","q":"ARDS 的氧合指数（PaO₂/FiO₂）诊断界值是","o":["≤ 300 mmHg","≤ 400 mmHg","≤ 200 mmHg","≤ 100 mmHg","≤ 500 mmHg"],"a":0,"plain":"ARDS 就是肺泡里灌满了\"炎症汤\"，氧气过不去——不是心脏的问题，是肺自己漏了。","why":"ARDS 柏林定义的四条：急性起病（1 周内）、双肺斑片状浸润影不能完全用积液或肺不张解释、呼吸衰竭不能完全由心衰解释、氧合指数 PaO₂/FiO₂ ≤300（且 PEEP≥5 cmH₂O）。病理核心是弥漫性肺泡损伤、透明膜形成。","others":"≤200 是中度、≤100 是重度，用来分级不是诊断界值；≤400 和 ≤500 都不是标准。","trap":"一句话：ARDS 是\"非心源性肺水肿\"。PCWP 不高 + 双肺渗出 + 顽固低氧，就往它想。"},{"id":"w13","day":"2026-10-24","k":"内科·循环","q":"左心衰竭最早出现的症状是","o":["劳力性呼吸困难","夜间阵发性呼吸困难","端坐呼吸","咳粉红色泡沫痰","双下肢水肿"],"a":0,"plain":"左心衰最早不是喘得厉害，而是\"爬两层楼就喘\"——这叫劳力性呼吸困难。","why":"左心衰最早出现的症状是劳力性呼吸困难，机制是运动时回心血量增加、左房压升高、肺淤血加重。随病情进展依次出现夜间阵发性呼吸困难、端坐呼吸、急性肺水肿。","others":"夜间阵发性呼吸困难是左心衰的典型但非最早；端坐呼吸提示肺淤血更重；粉红泡沫痰是急性肺水肿；双下肢水肿是右心衰的表现。","trap":"顺序记：劳力性→夜间阵发性→端坐呼吸→肺水肿。问\"最早\"选第一个。"},{"id":"w14","day":"2026-10-24","k":"内科·循环","q":"右心衰竭最敏感的体征是","o":["颈静脉怒张","双下肢凹陷性水肿","肝大","腹水","双肺底湿啰音"],"a":0,"plain":"右心是\"把血送回肺\"的泵，它一衰，血堵在体循环——脖子上的静脉先鼓起来。","why":"右心衰的典型体征是体循环淤血：颈静脉怒张（最敏感）、肝大伴肝颈静脉回流征阳性、下肢凹陷性水肿、腹水。严重者出现心源性肝硬化。","others":"双下肢水肿出现较晚且受重力影响；肝大和腹水提示病程较长；双肺底湿啰音是左心衰的表现。","trap":"肝颈静脉回流征阳性是右心衰的\"招牌\"，比下肢水肿更可靠、更早。"},{"id":"w15","day":"2026-10-24","k":"内科·循环","q":"心房颤动的心电图特点是","o":["P 波消失，代之以 f 波，RR 间期绝对不齐","P 波消失，代之以锯齿状 F 波","提前出现的宽大畸形 QRS 波","PR 间期逐渐延长直至脱落","窦性 P 波，RR 间期规则"],"a":0,"plain":"房颤时心房在\"抖\"而不是\"收缩\"，所以看不见 P 波，只有细碎的 f 波，心室跳得毫无规律。","why":"房颤心电图三大特点：P 波消失、代之以大小形态不一的 f 波（350—600 次/分）；RR 间期绝对不规则；QRS 波形态正常（除非伴差异性传导或束支阻滞）。","others":"锯齿状 F 波是心房扑动；提前出现的宽大畸形 QRS 是室性期前收缩；PR 逐渐延长直至脱落是二度Ⅰ型房室传导阻滞；窦性 P 波且 RR 规则是正常窦性心律。","trap":"房颤最大的危险不是心悸，是左房血栓脱落导致脑栓塞——所以要看 CHA₂DS₂-VASc 评分决定抗凝。"},{"id":"w16","day":"2026-10-24","k":"内科·循环","q":"心室颤动最有效的治疗是","o":["立即非同步电除颤","同步电复律","静脉注射胺碘酮","临时心脏起搏","静脉注射阿托品"],"a":0,"plain":"室颤就是心脏在\"抖\"而不是\"泵\"，人已经没意识了——唯一救命动作是电除颤，越快越好。","why":"室颤的处理是立即非同步电除颤（双相波 120—200 J），同时持续心肺复苏。每延迟 1 分钟，存活率下降 7%—10%。可除颤心律有两个：室颤和无脉性室速。","others":"同步电复律用于房颤、房扑、室上速和有脉室速；胺碘酮是辅助用药，不能替代除颤；临时起搏用于高度房室传导阻滞；阿托品用于症状性心动过缓。","trap":"\"同步\"还是\"非同步\"是高频考点：有可辨认 QRS 才同步（复律），室颤没有 QRS，必须非同步（除颤）。"},{"id":"w17","day":"2026-10-25","k":"内科·循环","q":"高血压急症静脉降压首选药物之一是","o":["硝普钠","舌下含服硝苯地平","氢氯噻嗪","地高辛","阿托品"],"a":0,"plain":"血压高到把器官\"烧坏\"（脑、心、肾、眼底）才叫急症；只是数字高、人没事，那叫亚急症。","why":"高血压急症指血压急剧升高（常 >180/120 mmHg）伴靶器官损害，需静脉降压。常用静脉药：硝普钠（动静脉同时扩张、起效秒级）、乌拉地尔、尼卡地平、拉贝洛尔。原则是 1 小时内平均动脉压下降不超过 25%，24—48 小时降至目标水平。","others":"舌下含服硝苯地平已不推荐，降压过快可致脑缺血；氢氯噻嗪是口服降压药、起效慢；地高辛是强心药；阿托品用于心动过缓。","trap":"降压不能\"一步到位\"，降太猛会脑梗——这是最容易被考的反直觉点。"},{"id":"w18","day":"2026-10-25","k":"内科·循环","q":"稳定型心绞痛患者改善预后的基础用药是","o":["阿司匹林","硝酸甘油","硝苯地平","地尔硫䓬","曲美他嗪"],"a":0,"plain":"冠心病基础用药一句话：抗血小板 + 他汀 + β 阻滞剂 + ACEI。其中抗血小板的老大是阿司匹林。","why":"稳定型心绞痛患者只要无禁忌，均应长期服用阿司匹林 75—100 mg/d，抑制血小板聚集、减少血栓事件。不能耐受者改用氯吡格雷。他汀、β 阻滞剂、ACEI 同样改善预后。","others":"硝酸甘油、硝苯地平、地尔硫䓬主要缓解症状，不改善预后；曲美他嗪是辅助代谢药。","trap":"改善预后的是\"阿司匹林 + 他汀 + β 阻滞剂 + ACEI\"，缓解症状的是硝酸酯和钙拮抗剂。问\"改善预后\"别选硝酸酯。"},{"id":"w19","day":"2026-10-25","k":"内科·循环","q":"急性心肌梗死最常见的心律失常是","o":["室性期前收缩","心房颤动","心室颤动","房室传导阻滞","窦性心动过速"],"a":0,"plain":"心梗后心脏最常\"电路乱\"，最常见的是室性早搏，最致命的是室颤——一个论多，一个论要命。","why":"急性心肌梗死最常见的心律失常是室性心律失常，其中室性期前收缩最多见；最致命的是室颤，是院前猝死的主要原因。下壁心梗多见房室传导阻滞和窦性心动过缓（右冠供血），前壁心梗多见室性心律失常和束支阻滞。","others":"房颤在老年、心衰患者中多见；窦性心动过速常是疼痛、焦虑或心衰的代偿反应；房室传导阻滞以下壁心梗多见。","trap":"记\"下壁慢、前壁快\"：下壁心梗易缓慢性心律失常，前壁心梗易室性心律失常。"},{"id":"w20","day":"2026-10-25","k":"内科·循环","q":"急性心肌梗死发病 24 小时内，应避免使用的药物是","o":["洋地黄类","阿司匹林","β 受体阻滞剂","ACEI","他汀类"],"a":0,"plain":"心梗头 24 小时，心脏又缺血又缺氧，这时候用洋地黄（强心）等于\"鞭打病马\"，容易诱发心律失常。","why":"急性心梗 24 小时内尽量避免使用洋地黄类：缺血心肌对洋地黄敏感，易诱发室性心律失常，且增加心肌耗氧。仅在合并快速房颤或明确心衰且其他措施无效时谨慎使用。","others":"阿司匹林是基石，越早越好；β 阻滞剂在无禁忌（心率慢、传导阻滞、心衰）时可早期使用；ACEI 早期使用改善重构；他汀尽早启动。","trap":"心梗用药\"禁忌清单\"：24 小时内不用洋地黄、下壁或右室梗死不用硝酸酯、心源性休克不用 β 阻滞剂。"},{"id":"w21","day":"2026-10-21","k":"内科·呼吸","q":"大咯血最直接的致死原因是","o":["窒息","失血性休克","肺不张","继发感染","重度贫血"],"a":0,"plain":"大咯血死人，多半不是\"血流干了\"，而是血堵住气管——窒息。","why":"大咯血（24 小时 >500 ml 或一次 >100 ml）最危险的并发症是窒息，尤其在咳嗽反射弱、体位不当或来不及咳出时。处理第一位是保持气道通畅：患侧卧位（防止血液流入健侧）、及时吸引、必要时气管插管。","others":"失血性休克需要很大失血量才出现；肺不张是血块阻塞支气管的结果；感染是后期并发症；贫血是慢性过程。","trap":"大咯血\"先保气道、再止血\"，体位是患侧卧位——和体位引流\"病侧在上\"是同一个道理。"},{"id":"w22","day":"2026-10-21","k":"内科·呼吸","q":"肺炎链球菌肺炎的首选抗生素是","o":["青霉素 G","万古霉素","亚胺培南","阿奇霉素","甲硝唑"],"a":0,"plain":"肺炎链球菌对青霉素敏感时，青霉素 G 仍然是首选——老药、便宜、有效。","why":"肺炎链球菌肺炎首选青霉素 G（敏感菌株）。青霉素过敏或耐药时可选头孢曲松、呼吸喹诺酮（左氧氟沙星、莫西沙星）。","others":"万古霉素用于 MRSA；亚胺培南用于重症或耐药革兰阴性菌；阿奇霉素针对非典型病原体（支原体、衣原体、军团菌）；甲硝唑针对厌氧菌。","trap":"记\"球菌=青霉素，非典型=大环内酯/喹诺酮，厌氧=甲硝唑\"。","cite":{"book":"内科学","ed":"第10版","page":"p81","quote":"青壮年和无基础疾病的CAP病人，常用青霉素类、第一代头孢菌素等。"}},{"id":"w23","day":"2026-10-22","k":"内科·呼吸","q":"COPD 稳定期最重要、能延缓肺功能下降的措施是","o":["戒烟","长期家庭氧疗","吸入糖皮质激素","口服茶碱","长期预防性抗生素"],"a":0,"plain":"COPD 唯一能改变病程的措施就一条——戒烟。药都是缓解症状。","why":"戒烟是 COPD 稳定期最重要、也是唯一能延缓肺功能下降的措施。其次是支气管扩张剂（长效抗胆碱能药/LABA）、流感疫苗和肺康复。长期氧疗只用于符合指征（PaO₂≤55 mmHg）者。","others":"吸入激素仅用于反复急性加重且嗜酸粒细胞高者，不作常规；口服茶碱副作用大、疗效有限；抗生素不能长期预防性使用。","trap":"问\"最重要\"答戒烟，别被\"吸药\"带跑。"},{"id":"w24","day":"2026-10-22","k":"内科·呼吸","q":"小细胞肺癌最常引起的副肿瘤综合征是","o":["抗利尿激素分泌不当综合征（低钠血症）","高钙血症","库欣综合征","低血糖","男性乳房发育"],"a":0,"plain":"小细胞肺癌会\"乱分泌激素\"，最常见的是分泌 ADH，把血钠稀释低了。","why":"小细胞肺癌属神经内分泌肿瘤，最常见的副肿瘤综合征是 SIADH 所致的稀释性低钠血症；其次为异位 ACTH 导致的库欣综合征。","others":"高钙血症多见于鳞癌（分泌 PTHrP）；低血糖见于大细胞癌或胰岛素瘤；男性乳房发育见于绒毛膜癌等。","trap":"配对记：小细胞→低钠（SIADH）/库欣；鳞癌→高钙。"},{"id":"w25","day":"2026-10-23","k":"内科·呼吸","q":"急性肺栓塞的溶栓指征是","o":["血流动力学不稳定（休克或持续低血压）","所有确诊患者","D-二聚体升高","单纯低氧血症","胸痛明显"],"a":0,"plain":"肺栓塞先看\"人稳不稳\"：休克、低血压才溶栓；稳的人抗凝就够。","why":"高危（大面积）肺栓塞伴休克或持续低血压是溶栓指征；次大面积（右心功能不全但血压正常）以抗凝为主，病情恶化时再考虑溶栓。抗凝首选低分子肝素，长期用华法林或新型口服抗凝药。","others":"所有确诊者都溶栓会显著增加出血风险；D-二聚体只是筛查指标；低氧和胸痛都不是溶栓指征。","trap":"分层记：休克→溶栓；不休克但有右心功能不全→抗凝+密切观察；都没有→抗凝。"},{"id":"w26","day":"2026-10-23","k":"内科·呼吸","q":"结核性胸膜炎胸水最典型的特点是","o":["淋巴细胞为主，ADA 明显升高","中性粒细胞为主，ADA 降低","嗜酸性粒细胞为主","间皮细胞为主","以红细胞为主"],"a":0,"plain":"结核性胸水是\"慢性炎症\"，所以以淋巴细胞为主、ADA 高——这是它的指纹。","why":"结核性胸膜炎的胸水为渗出液，白细胞以淋巴细胞为主，ADA 明显升高（>40 U/L 支持结核），胸水葡萄糖降低、LDH 升高。","others":"肺炎旁积液以中性粒细胞为主、ADA 不高；恶性胸水间皮细胞增多、ADA 不高、CEA 可升高；嗜酸粒细胞增多见于寄生虫、药物、气胸后。","trap":"三件事一起看：淋巴细胞 + ADA 高 + 糖低 → 结核。"},{"id":"w27","day":"2026-10-24","k":"内科·循环","q":"慢性射血分数降低的心衰，能改善预后的\"金三角\"是","o":["ACEI/ARB + β 受体阻滞剂 + 醛固酮受体拮抗剂","利尿剂 + 洋地黄 + 硝酸酯","β 受体阻滞剂 + 钙拮抗剂 + 他汀","ACEI + 阿司匹林 + 他汀","洋地黄 + 胺碘酮 + 利尿剂"],"a":0,"plain":"心衰真正能\"延寿\"的三类药：ACEI/ARB、β 阻滞剂、醛固酮拮抗剂，合称金三角。利尿剂只治症状。","why":"慢性射血分数降低的心衰（HFrEF）改善预后的核心是\"金三角\"：ACEI/ARB（或 ARNI）、β 受体阻滞剂、醛固酮受体拮抗剂。利尿剂缓解淤血但不改善预后；SGLT2 抑制剂现已成为第四支柱。","others":"洋地黄改善症状、不降低死亡率；硝酸酯用于心绞痛；维拉帕米、地尔硫䓬在 HFrEF 中多禁用。","trap":"问\"改善预后\"→金三角；问\"缓解症状\"→利尿剂、洋地黄。"},{"id":"w28","day":"2026-10-24","k":"内科·循环","q":"阵发性室上性心动过速血流动力学稳定时，首选的处理是","o":["刺激迷走神经或静脉注射腺苷","立即电除颤","静脉注射阿托品","静脉注射肾上腺素","立即安装起搏器"],"a":0,"plain":"室上速是\"电路短路\"，先想办法让心跳重启——憋气用力（Valsalva）或推腺苷。","why":"阵发性室上性心动过速（PSVT）血流动力学稳定时，首选刺激迷走神经（Valsalva 动作、颈动脉窦按摩），无效则快速静推腺苷；仍无效可用维拉帕米、普罗帕酮或同步电复律。","others":"电除颤用于室颤/无脉室速；阿托品用于心动过缓；肾上腺素用于心脏骤停；起搏器用于传导阻滞。","trap":"血流动力学不稳才直接同步电复律；稳定者按\"迷走→腺苷→药物\"的顺序。"},{"id":"w29","day":"2026-10-25","k":"内科·循环","q":"按我国高血压分级标准，2 级高血压的血压范围是","o":["160—179/100—109 mmHg","140—159/90—99 mmHg","≥180/110 mmHg","120—139/80—89 mmHg","≥140/90 mmHg"],"a":0,"plain":"高血压分级就看两个数字：1 级 140-159/90-99，2 级 160-179/100-109，3 级 ≥180/110。","why":"我国高血压分级：1 级 140—159/90—99 mmHg；2 级 160—179/100—109 mmHg；3 级 ≥180/110 mmHg。收缩压和舒张压分属不同级别时，取较高的那一级。","others":"140—159 是 1 级；≥180/110 是 3 级；120—139/80—89 是正常高值；≥140/90 是诊断界值而非分级。","trap":"数字要背准。给 165/105 要能立刻判成 2 级。"},{"id":"w30","day":"2026-10-25","k":"内科·循环","q":"鉴别不稳定型心绞痛与急性非 ST 段抬高型心梗，最有价值的是","o":["心肌肌钙蛋白","心电图","胸痛性质","硝酸甘油缓解情况","白细胞计数"],"a":0,"plain":"心绞痛和心梗都胸痛，分水岭是\"心肌有没有坏死\"——肌钙蛋白升高就是坏死。","why":"不稳定型心绞痛与 NSTEMI 的区别就在于心肌损伤标志物：肌钙蛋白升高为心梗，不升高为心绞痛。心电图两者都可表现为 ST 段压低或 T 波倒置，不能单独区分。","others":"胸痛性质和硝酸甘油反应主观、不可靠；心电图敏感但不特异；白细胞升高见于炎症和应激。","trap":"一句话：心电图看\"缺血\"，肌钙蛋白看\"坏死\"。"},{"id":"w31","day":"2026-10-21","k":"内科·呼吸","q":"金黄色葡萄球菌肺炎的典型影像学表现是","o":["肺气囊肿（肺大疱）","大叶性实变伴支气管充气征","叶间裂下坠","双肺弥漫磨玻璃影","空洞内液平"],"a":0,"plain":"金葡菌会\"化腐为脓\"，把肺组织烂出一个个小气囊——片子上就是肺气囊肿。","why":"金黄色葡萄球菌肺炎的特点是易形成脓肿和肺气囊肿（肺大疱），多见于儿童、流感后、静脉吸毒者。X 线表现为肺内多发薄壁空洞或气囊，变化快（一天一个样）。","others":"大叶实变 + 支气管充气征是肺炎链球菌；叶间裂下坠是克雷伯菌；弥漫磨玻璃影是病毒性肺炎或 ARDS；空洞内液平是肺脓肿。","trap":"\"变化快 + 肺气囊肿\"是金葡菌的标签。流感后突然加重的肺炎，先想它。"},{"id":"w32","day":"2026-10-21","k":"内科·呼吸","q":"肺炎克雷伯菌肺炎最具特征性的表现是","o":["砖红色胶冻样痰、叶间裂下坠","铁锈色痰、支气管充气征","脓臭痰、空洞液平","干咳、双肺磨玻璃影","粉红色泡沫痰"],"a":0,"plain":"克雷伯菌肺炎的痰黏得像果冻，片子上的叶间裂被沉甸甸的渗出物压得往下坠。","why":"肺炎克雷伯菌肺炎多见于酗酒者、老年人、糖尿病者，典型表现为砖红色胶冻样痰，X 线见大叶实变、叶间裂下坠（因渗出物黏稠沉重）。","others":"铁锈色痰是肺炎链球菌；脓臭痰 + 液平是肺脓肿；磨玻璃影是病毒/间质病变；粉红泡沫痰是急性左心衰。","trap":"\"砖红色胶冻样痰 + 叶间裂下坠\"这一对出现，答案就是克雷伯菌。"},{"id":"w33","day":"2026-10-21","k":"内科·呼吸","q":"肺炎支原体肺炎的首选治疗药物是","o":["大环内酯类（阿奇霉素）","青霉素 G","头孢曲松","万古霉素","甲硝唑"],"a":0,"plain":"支原体没有细胞壁，青霉素这种\"拆墙\"的药对它没用——要用大环内酯。","why":"肺炎支原体没有细胞壁，因此 β-内酰胺类（青霉素、头孢）无效。首选大环内酯类（阿奇霉素、红霉素），疗程一般 2—3 周；耐药或成人也可用呼吸喹诺酮。","others":"青霉素 G 用于肺炎链球菌；头孢曲松用于敏感革兰阴性菌；万古霉素用于 MRSA；甲硝唑用于厌氧菌。","trap":"\"没有细胞壁 → 青霉素无效\"这条逻辑链，是支原体、衣原体、军团菌共同的特点。"},{"id":"w34","day":"2026-10-21","k":"内科·呼吸","q":"确诊支气管扩张最敏感的检查是","o":["高分辨率 CT（HRCT）","胸部平片","支气管造影","肺功能","痰培养"],"a":0,"plain":"支扩的\"宽管子\"只有高分辨率 CT 能看清楚，平片经常看不出来。","why":"高分辨率 CT（HRCT）是确诊支气管扩张的首选和\"金标准\"，可见\"轨道征\"\"印戒征\"、囊状扩张。胸部平片敏感性低，仅在重症时见双轨征或囊状影。","others":"支气管造影是有创检查、已基本淘汰；肺功能只能提示阻塞性通气障碍；痰培养用于找病原体。","trap":"记住\"HRCT = 支扩金标准\"，和\"FEV₁/FVC = COPD 金标准\"一起记。","cite":{"book":"内科学","ed":"第10版","page":"p73","quote":"胸部高分辨率CT扫描（HRCT）：HRCT可在横断面上清楚地显示扩张的支气管……现已成为支气管扩张症的主要诊断方法，尤其是层厚≤1mm的高分辨率CT。"}},{"id":"w35","day":"2026-10-22","k":"内科·呼吸","q":"提示支气管哮喘重度急性发作的指标是","o":["说话不成句、SpO₂ \u003c 90%","双肺哮鸣音","呼气相延长","心率 90 次/分","咳嗽加重"],"a":0,"plain":"哮喘重不重，看他\"能不能说整句话\"——说不成句、血氧掉到 90% 以下，就是重度。","why":"哮喘重度发作的指标包括：说话不成句（只能说单字）、呼吸 >30 次/分、心率 >120 次/分、SpO₂ \u003c90%、PEF \u003c50% 预计值、出现矛盾呼吸或嗜睡。","others":"哮鸣音和呼气相延长是所有发作共有的体征，不能区分轻重；心率 90 属正常范围；咳嗽加重是主观症状。","trap":"最危险的不是\"哮鸣音很响\"，而是\"哮鸣音消失 + 嗜睡\"——那是寂静肺，快要呼吸衰竭了。"},{"id":"w36","day":"2026-10-22","k":"内科·呼吸","q":"COPD 急性加重合并Ⅱ型呼衰，无创正压通气的主要指征是","o":["pH \u003c 7.35 且 PaCO₂ > 45—50 mmHg","PaO₂ \u003c 80 mmHg","咳嗽无力","痰量增多","双肺哮鸣音"],"a":0,"plain":"无创通气的门槛是\"酸了\"——pH 掉到 7.35 以下、二氧化碳往上走，就该上机。","why":"AECOPD 合并Ⅱ型呼衰时，无创正压通气（NIPPV）的指征是：pH \u003c7.35 且 PaCO₂ >45—50 mmHg，患者能配合、能保护气道。它可以显著降低插管率和死亡率。","others":"单纯低氧不是 NIPPV 的主要指征（需先排除其他原因）；咳嗽无力、痰多、意识障碍加重、不能配合者是禁忌或需改有创。","trap":"顺序记：先控制性吸氧 → 药物 → 无创 → 有创。pH 是决定\"上不上机\"的那把尺子。"},{"id":"w37","day":"2026-10-22","k":"内科·呼吸","q":"肺癌患者出现高钙血症，最可能的组织学类型是","o":["鳞状细胞癌","腺癌","小细胞癌","大细胞癌","类癌"],"a":0,"plain":"鳞癌会分泌\"甲状旁腺激素相关蛋白\"，把骨头里的钙挖出来，血钙就高了。","why":"鳞状细胞癌可分泌甲状旁腺激素相关蛋白（PTHrP），引起高钙血症，是肺癌中最典型的副肿瘤综合征之一；小细胞癌则多见 SIADH 低钠和异位 ACTH。","others":"腺癌少有这类内分泌表现；小细胞癌对应低钠/库欣；大细胞癌和类癌的相关性更低。","trap":"配对记：鳞癌→高钙；小细胞→低钠、库欣。这两对几乎每年都考。"},{"id":"w38","day":"2026-10-22","k":"内科·呼吸","q":"COPD 患者吸入支气管扩张剂后 FEV₁ 占预计值 55%，其气流受限分级为","o":["GOLD 2 级（中度）","GOLD 1 级（轻度）","GOLD 3 级（重度）","GOLD 4 级（极重度）","无法分级"],"a":0,"plain":"分级只看一个数：FEV₁ 占预计值的百分比。≥80 轻、50—79 中、30—49 重、\u003c30 极重。","why":"COPD 气流受限分级（GOLD 1—4）依据 FEV₁ 占预计值百分比：≥80% 为轻度，50%—79% 为中度，30%—49% 为重度，\u003c30% 为极重度。55% 落在 50—79 区间，故为 GOLD 2 级。","others":"80% 以上才是 1 级；30%—49% 是 3 级；低于 30% 是 4 级。","trap":"诊断看\"比值\"（FEV₁/FVC\u003c70%），分级看\"百分比\"。两个指标别搞混。"},{"id":"w39","day":"2026-10-23","k":"内科·呼吸","q":"急性肺栓塞抗凝治疗的首选起始药物是","o":["低分子肝素","阿司匹林","华法林单药起始","尿激酶","氯吡格雷"],"a":0,"plain":"抗凝不是抗血小板——肺栓塞要用\"抗凝血\"的药，起手就是低分子肝素。","why":"急性肺栓塞确诊后立即开始抗凝，首选低分子肝素（或普通肝素）皮下注射，同时重叠华法林 3—5 天，待 INR 达标后停肝素；也可直接用新型口服抗凝药。","others":"阿司匹林、氯吡格雷是抗血小板药，对静脉血栓无效；华法林单药起效慢（需 3—5 天），不能单独起始；尿激酶是溶栓药，仅用于高危。","trap":"\"抗血小板\"和\"抗凝\"是两条线：动脉血栓用抗血小板，静脉血栓用抗凝。"},{"id":"w40","day":"2026-10-23","k":"外科·胸心","q":"闭合性气胸，肺压缩约 40%，最恰当的处理是","o":["胸腔闭式引流","观察、吸氧","立即穿刺排气","开胸手术","胸膜固定术"],"a":0,"plain":"气胸超过 30%（或症状明显）就要\"插管引流\"，让气自己慢慢排出来。","why":"闭合性气胸肺压缩 \u003c20% 且无症状者可观察吸氧；压缩 >30% 或有明显呼吸困难者应行胸腔闭式引流，排气后复查胸片，漏气停止 24—48 小时可拔管。","others":"立即穿刺排气是张力性气胸的急救；开胸手术用于持续漏气、血气胸、复发；胸膜固定术用于复发性气胸。","trap":"把\"张力性\"和\"闭合性\"分开：张力性先扎针，闭合性放引流管。"},{"id":"w41","day":"2026-10-23","k":"内科·呼吸","q":"Light 标准中，判断渗出液的胸水 LDH 比值界值是","o":["> 0.6","> 0.3","> 0.5","> 0.8","> 0.2"],"a":0,"plain":"Light 标准三条：蛋白比 0.5、LDH 比 0.6、LDH 超过血清上限的 2/3。","why":"Light 标准：①胸水蛋白/血清蛋白 >0.5；②胸水 LDH/血清 LDH >0.6；③胸水 LDH > 血清正常上限的 2/3。满足任一条即为渗出液。","others":"0.5 是蛋白比值；0.3、0.2、0.8 都不是标准值。","trap":"三个数字按\"0.5、0.6、2/3\"顺序背，考哪个都不慌。"},{"id":"w42","day":"2026-10-23","k":"内科·呼吸","q":"Ⅰ型呼吸衰竭的血气特点是","o":["PaO₂ \u003c 60 mmHg，PaCO₂ 正常或降低","PaO₂ \u003c 60 mmHg，PaCO₂ > 50 mmHg","PaO₂ 正常，PaCO₂ > 50 mmHg","PaO₂ \u003c 80 mmHg，PaCO₂ 正常","PaO₂ 与 PaCO₂ 均升高"],"a":0,"plain":"Ⅰ型就是\"只缺氧、不憋气\"——氧低，二氧化碳不高；Ⅱ型是氧低 + 二氧化碳高。","why":"Ⅰ型呼吸衰竭：PaO₂ \u003c60 mmHg，PaCO₂ 正常或降低（过度通气所致），见于肺换气障碍，如肺炎、ARDS、肺栓塞。Ⅱ型：PaO₂ \u003c60 且 PaCO₂ >50，见于肺泡通气不足，如 COPD。","others":"PaCO₂ >50 是Ⅱ型的标准；PaO₂ 正常不符合呼衰；PaO₂ \u003c80 不是诊断界值。","trap":"记\"Ⅰ型换气、Ⅱ型通气\"：换气出问题只缺氧，通气出问题缺氧加二氧化碳潴留。"},{"id":"w43","day":"2026-10-24","k":"内科·循环","q":"洋地黄中毒最常见的心律失常是","o":["室性期前收缩（二联律）","心房颤动","心室颤动","窦性心动过速","完全性右束支传导阻滞"],"a":0,"plain":"洋地黄中毒最爱搞出\"室早二联律\"——一个正常跳、一个提前跳，交替出现。","why":"洋地黄中毒最常见的心律失常是室性期前收缩，尤其是二联律；也可出现房室传导阻滞、房速伴传导阻滞、室速。诱因包括低钾、低镁、肾功能不全。","others":"房颤是洋地黄的适应证而非中毒表现；室颤少见但致命；窦速不是典型表现。","trap":"看到\"洋地黄 + 恶心呕吐 + 黄视 + 室早二联律\"，四个一起出现就是中毒。"},{"id":"w44","day":"2026-10-24","k":"内科·循环","q":"非瓣膜性房颤患者，推荐启动抗凝治疗的 CHA₂DS₂-VASc 评分界值是","o":["男性 ≥2 分、女性 ≥3 分","所有患者均需抗凝","≥1 分","≥5 分","不需要评分"],"a":0,"plain":"房颤要不要抗凝，看评分：男的 2 分以上、女的 3 分以上，就该吃抗凝药。","why":"CHA₂DS₂-VASc 评分男性 ≥2、女性 ≥3 推荐口服抗凝；男性 1 分、女性 2 分可考虑；0 分（女 1 分）不推荐。首选新型口服抗凝药，机械瓣或中重度二尖瓣狭窄用华法林。","others":"所有患者抗凝会增加出血风险；≥1 分只是\"可考虑\"；≥5 分是极高危而非起始阈值。","trap":"注意性别差异：女性的 1 分本身不算独立指征，所以阈值比男性高 1 分。"},{"id":"w45","day":"2026-10-24","k":"内科·循环","q":"NYHA 心功能Ⅲ级的表现是","o":["低于日常活动即出现心衰症状","日常活动不受限","休息时也有症状","仅在剧烈活动时出现症状","完全不能活动"],"a":0,"plain":"Ⅲ级就是\"干点轻活就喘\"——走路、上楼这种日常活动明显受限。","why":"NYHA 分级：Ⅰ级日常活动不受限；Ⅱ级日常活动轻度受限（休息无症状，一般活动出现症状）；Ⅲ级明显受限（低于日常活动即有症状）；Ⅳ级休息时也有症状。","others":"\"不受限\"是Ⅰ级；\"剧烈活动才有\"是Ⅱ级；\"休息时也有\"是Ⅳ级。","trap":"Ⅱ级和Ⅲ级的区别在\"一般活动\"还是\"低于一般活动\"。题干里出现\"穿衣、洗漱就喘\"就是Ⅲ级。"},{"id":"w46","day":"2026-10-24","k":"内科·循环","q":"无器质性心脏病的偶发室性期前收缩，正确的处理是","o":["无症状者无需药物治疗","常规使用胺碘酮","立即射频消融","长期口服普罗帕酮","植入 ICD"],"a":0,"plain":"心脏没病、偶尔早搏、人也没感觉——不用吃药，别过度治疗。","why":"无器质性心脏病的偶发室早，若无症状一般无需治疗；有明显心悸症状者可先用 β 受体阻滞剂，无效再考虑其他抗心律失常药。关键是评估有无基础心脏病。","others":"胺碘酮副作用大，不作一线；射频消融用于频发、症状明显或特发性室速；ICD 用于猝死高危（EF\u003c35% 等）。","trap":"室早先看\"有没有器质性心脏病\"和\"有没有症状\"，两条都否定就不治。"},{"id":"w47","day":"2026-10-25","k":"内科·循环","q":"高血压患者需要联合用药时，优先推荐的组合是","o":["ACEI/ARB + 钙通道阻滞剂","ACEI + ARB","β 受体阻滞剂 + 非二氢吡啶类钙拮抗剂","利尿剂 + β 受体阻滞剂（首选）","两种 ACEI 合用"],"a":0,"plain":"联合降压讲究\"互补\"：ACEI/ARB 配钙拮抗剂或利尿剂，效果叠加、副作用抵消。","why":"常用优先联合方案：ACEI/ARB + CCB、ACEI/ARB + 噻嗪类利尿剂、CCB + 利尿剂。ACEI 与 ARB 不能联用（增加高钾和肾损）。","others":"ACEI + ARB 是禁忌组合；β 阻滞剂 + 非二氢吡啶类 CCB 会加重心动过缓和传导阻滞；两种同类药联用不合理。","trap":"\"ACEI 和 ARB 不能一起吃\"是高频考点，别被\"双重阻断更好\"误导。"},{"id":"w48","day":"2026-10-25","k":"内科·循环","q":"稳定型心绞痛 CCS 分级Ⅲ级的表现是","o":["日常活动明显受限，步行 1—2 个街区即发作","剧烈活动才发作","休息时也发作","日常活动轻度受限","完全不能活动"],"a":0,"plain":"Ⅲ级就是\"走一两百米、上一层楼就疼\"——日常活动明显受限。","why":"加拿大心血管学会（CCS）心绞痛分级：Ⅰ级剧烈活动才发作；Ⅱ级日常活动轻度受限（步行 >2 个街区或登楼 >1 层）；Ⅲ级日常活动明显受限（步行 1—2 个街区或登 1 层楼）；Ⅳ级休息时也发作。","others":"\"剧烈活动才发作\"是Ⅰ级；\"轻度受限\"是Ⅱ级；\"休息时发作\"是Ⅳ级。","trap":"NYHA 和 CCS 都是四级，但一个评\"心衰\"一个评\"心绞痛\"，别把两套标准混用。"},{"id":"w49","day":"2026-10-25","k":"内科·循环","q":"心电图 V1—V4 导联 ST 段抬高，提示心肌梗死部位是","o":["前间壁/前壁","下壁","侧壁","正后壁","右心室"],"a":0,"plain":"看哪个导联抬高就知道堵了哪根血管：V1—V4 是前壁，Ⅱ/Ⅲ/aVF 是下壁。","why":"V1—V4 对应前间壁和前壁（左前降支）；Ⅱ、Ⅲ、aVF 对应下壁（右冠状动脉或回旋支）；Ⅰ、aVL、V5、V6 对应侧壁（回旋支）；V7—V9 对应正后壁。","others":"下壁看 Ⅱ/Ⅲ/aVF；侧壁看 Ⅰ/aVL/V5/V6；正后壁看 V7—V9（V1—V3 出现高 R 波和 ST 压低为镜像）；右室看 V3R—V5R。","trap":"记\"导联—部位—血管\"三件套，考定位题就不会乱。"},{"id":"w50","day":"2026-10-25","k":"内科·循环","q":"急性冠脉综合征患者启动他汀治疗，推荐的 LDL-C 目标是","o":["\u003c 1.8 mmol/L","\u003c 2.6 mmol/L","\u003c 3.4 mmol/L","\u003c 4.1 mmol/L","无需设目标"],"a":0,"plain":"得过心梗的人属于\"极高危\"，低密度脂蛋白要压到 1.8 以下，比普通人严得多。","why":"急性冠脉综合征属极高危人群，LDL-C 目标 \u003c1.8 mmol/L（且较基线下降 ≥50%）；极高危患者可考虑 \u003c1.4 mmol/L。他汀应尽早、足量启动。","others":"2.6 是高危人群目标；3.4 是中危；4.1 是正常上限附近；\"无需目标\"错误。","trap":"危险分层决定目标值：极高危 1.8、高危 2.6、中危 3.4。"},{"id":"w51","day":"2026-10-21","k":"内科·呼吸","q":"CURB-65 评分不包括下列哪一项","o":["白细胞计数","意识障碍","血尿素氮 > 7 mmol/L","呼吸频率 ≥ 30 次/分","年龄 ≥ 65 岁"],"a":0,"plain":"CURB-65 是五个字母：意识、尿素、呼吸、血压、年龄——里面没有白细胞。","why":"CURB-65 五项：Confusion（意识障碍）、Urea >7 mmol/L、Respiratory rate ≥30、Blood pressure（收缩压 \u003c90 或舒张压 ≤60）、年龄 ≥65 岁。每项 1 分，0—1 分可门诊，2 分住院，≥3 分考虑 ICU。","others":"意识、尿素、呼吸频率、年龄都在评分内；白细胞计数虽然常规查，但不属于该评分。","trap":"评分助记靠首字母：C-U-R-B-65，五项背完就不会被\"白细胞\"骗。","cite":{"book":"内科学","ed":"第10版","page":"p79","quote":"CURB-65共五项指标……①意识障碍（confusion，C）；②尿素氮（uremia，U）＞7mmol/L；③呼吸频率（respiratory rate，R）≥30次/分；④血压（blood pressure，B），收缩压＜90mmHg或舒张压≤60mmHg；⑤年龄≥65岁。"}},{"id":"w52","day":"2026-10-21","k":"内科·呼吸","q":"吸入性肺脓肿最好发的部位是","o":["右肺下叶背段和后基底段","左肺上叶尖后段","右肺上叶前段","双肺弥漫分布","左肺下叶前基底段"],"a":0,"plain":"误吸的东西顺着重力走，右主支气管又直又陡，所以最容易落到右肺下叶的背段和后基底段。","why":"吸入性肺脓肿好发于右肺下叶背段和后基底段，原因是右主支气管较左侧陡直、管径粗，误吸物容易进入右侧；平卧时这些肺段处于最低位。","others":"左肺上叶尖后段是继发性肺结核的好发部位；右肺上叶前段不是典型误吸部位；双肺弥漫多见于血源性肺脓肿；左肺下叶前基底段相对少见。","trap":"\"误吸走右边，结核待上叶\"。两个好发部位别记串。","cite":{"book":"内科学","ed":"第10版","page":"p99","quote":"由于右主支气管较陡直，且管径较粗大，吸入物易进入右肺。仰卧位时，好发于上叶后段或下叶背段；坐位时好发于下叶后基底段。"}},{"id":"w53","day":"2026-10-21","k":"内科·呼吸","q":"支气管扩张大咯血时，首选的止血药物是","o":["垂体后叶素","维生素 K₁","氨甲环酸口服","鱼精蛋白","去甲肾上腺素静脉"],"a":0,"plain":"大咯血靠\"收缩血管\"来止血——垂体后叶素把肺小动脉收紧，血就少了。","why":"大咯血首选垂体后叶素（含加压素），使肺小动脉收缩、降低肺循环压力而止血。高血压、冠心病、妊娠、前列腺增生者禁用或慎用，可改用酚妥拉明。","others":"维生素 K₁ 用于华法林过量；氨甲环酸为辅助抗纤溶；鱼精蛋白拮抗肝素；去甲肾上腺素静脉用于升压，不是咯血用药。","trap":"垂体后叶素的两条红线：冠心病、孕妇。题干一出现这两个词就换药。"},{"id":"w54","day":"2026-10-21","k":"内科·呼吸","q":"肺炎链球菌肺炎治疗不及时，最常见的局部并发症是","o":["脓胸","肺气囊肿","支气管胸膜瘘","肺梗死","气胸"],"a":0,"plain":"肺炎拖久了，渗出液变成脓积在胸膜腔里，就是脓胸。","why":"肺炎链球菌肺炎若未及时治疗，炎症可累及胸膜，形成渗出液继而化脓，最常见的是脓胸（胸腔积液呈脓性、白细胞极高、pH 和糖降低）。","others":"肺气囊肿多见于金黄色葡萄球菌；支气管胸膜瘘见于坏死性肺炎或术后；肺梗死与肺栓塞相关；气胸多为肺大疱破裂。","trap":"脓胸的胸水特点：脓性、pH\u003c7.2、葡萄糖很低、LDH 很高——看到这组就想到它。"},{"id":"w55","day":"2026-10-21","k":"内科·呼吸","q":"医院获得性肺炎（HAP）的时间界定是","o":["入院 48 小时后新发生的肺炎","入院 24 小时后新发生的肺炎","入院 72 小时后新发生的肺炎","出院后 48 小时内发生的肺炎","机械通气 24 小时后发生的肺炎"],"a":0,"plain":"住院满 48 小时后才冒出来的肺炎才算\"医院获得性\"，之前的是社区带进来的。","why":"医院获得性肺炎指患者入院时不存在、也不处于潜伏期，入院 48 小时后新发生的肺炎；其中机械通气 48 小时后发生者称呼吸机相关性肺炎（VAP）。","others":"24 小时、72 小时都不是界定值；出院后发生的一般归为社区获得性；机械通气 24 小时不是 VAP 标准。","trap":"48 小时这个数字要记牢：HAP 是 48 小时，VAP 也是 48 小时（上机后）。"},{"id":"w56","day":"2026-10-22","k":"内科·呼吸","q":"哮喘急性发作时，沙丁胺醇首选的给药途径是","o":["雾化吸入","口服","静脉注射","肌内注射","皮下注射"],"a":0,"plain":"哮喘是气道的事，药直接吸进去最快——雾化几分钟就起效，口服要等半小时。","why":"哮喘急性发作首选雾化吸入短效 β₂ 受体激动剂（沙丁胺醇），起效快、局部浓度高、全身副作用小；中重度可联合异丙托溴铵雾化。","others":"口服起效慢、生物利用度低；静脉和皮下给药仅用于无法吸入的极重病例；肌注少用。","trap":"\"能吸就别打\"——吸入是哮喘给药的第一选择，这条原则在急救和长期控制里都成立。"},{"id":"w57","day":"2026-10-22","k":"内科·呼吸","q":"COPD 患者突发一侧胸痛、呼吸困难加重，最应先考虑","o":["自发性气胸","急性肺栓塞","肺炎","心绞痛","胸腔积液"],"a":0,"plain":"COPD 病人的肺像\"破了洞的气球\"，最容易突然漏气——一侧胸痛加呼吸困难，先拍片排除气胸。","why":"COPD 常合并肺大疱，是自发性气胸的高危人群。突发一侧胸痛、呼吸困难明显加重、患侧呼吸音减弱或消失，应首先考虑气胸并立即胸片或床旁超声确认。","others":"肺栓塞也有突发呼吸困难和胸痛，但多有 DVT 危险因素、低氧更突出；肺炎多有发热咳痰；心绞痛以压榨性胸痛为主；胸腔积液起病较缓。","trap":"COPD 急性加重\"突然变差\"，一定要先排除气胸——这是导致病情骤变最常见、也最容易被漏掉的原因。"},{"id":"w58","day":"2026-10-22","k":"内科·呼吸","q":"目前肺癌筛查推荐的首选检查是","o":["低剂量螺旋 CT","胸部 X 线平片","肿瘤标志物","痰脱落细胞学","PET-CT"],"a":0,"plain":"筛查肺癌现在用\"低剂量 CT\"——辐射比普通 CT 小，但能看见平片看不见的小结节。","why":"对高危人群（长期吸烟、年龄 50 岁以上等），低剂量螺旋 CT（LDCT）是唯一被证实能降低肺癌死亡率的筛查手段，可发现数毫米的肺结节。","others":"胸片敏感性低，早期小结节容易漏；肿瘤标志物不用于筛查；痰细胞学敏感性低；PET-CT 辐射大、费用高，用于诊断和分期而非筛查。","trap":"\"筛查用低剂量 CT，诊断分期用增强 CT/PET\"——两件事别混。"},{"id":"w59","day":"2026-10-22","k":"内科·呼吸","q":"局限期小细胞肺癌的治疗原则是","o":["化疗 + 胸部放疗为主，一般不首选手术","首选手术切除","仅观察随访","靶向治疗为主","免疫治疗单药"],"a":0,"plain":"小细胞肺癌长得快、早转移，开刀往往来不及——它对化疗放疗特别敏感，所以以化放疗为主。","why":"小细胞肺癌倍增时间短、早期即发生转移，但对放化疗高度敏感。局限期以化疗联合胸部放疗为主，完全缓解者可考虑预防性全脑照射；只有极少数早期（T1-2N0）可考虑手术。","others":"手术仅适用于极早期少数病例；观察随访不可取；靶向治疗在小细胞肺癌中证据有限；免疫治疗多与化疗联合，不作单药首选。","trap":"\"小细胞不手术\"是总体原则，但别忘了 T1-2N0 的极早期例外。"},{"id":"w60","day":"2026-10-22","k":"内科·呼吸","q":"中重度哮喘长期控制最常用的联合方案是","o":["吸入糖皮质激素 + 长效 β₂ 受体激动剂","单用短效 β₂ 受体激动剂","单用口服茶碱","口服糖皮质激素长期维持","单用白三烯受体拮抗剂"],"a":0,"plain":"哮喘控制要\"消炎 + 扩管\"两手抓：吸入激素负责消炎，长效 β₂ 激动剂负责保持气道通畅。","why":"中重度哮喘的标准控制方案是 ICS + LABA 联合吸入（如布地奈德/福莫特罗），两者协同：激素抑制气道炎症、减少急性发作，LABA 维持支气管舒张。","others":"单用 SABA 不能控制炎症；口服茶碱疗效有限、副作用大；长期口服激素副作用严重，仅用于难治性哮喘；白三烯受体拮抗剂为辅助用药。","trap":"LABA 不能单独用于哮喘（可增加死亡风险），必须与 ICS 联合——这是黑框警告级别的考点。"},{"id":"w61","day":"2026-10-23","k":"内科·呼吸","q":"肺栓塞的经典症状三联是","o":["呼吸困难、胸痛、咯血","发热、咳嗽、咳痰","心悸、水肿、肝大","晕厥、抽搐、偏瘫","盗汗、消瘦、低热"],"a":0,"plain":"肺栓塞的教科书三联是\"喘不上气 + 胸痛 + 咯血\"，但真正三个都占的病人不到两成。","why":"肺栓塞的经典三联为呼吸困难、胸痛、咯血，但三者同时出现者仅约 20%，临床上更多见的是不明原因的呼吸困难伴低氧。诊断依靠 Wells 评分、D-二聚体和 CTPA。","others":"发热咳嗽咳痰是肺炎；心悸水肿肝大是右心衰；晕厥抽搐偏瘫是神经系统事件；盗汗消瘦低热提示结核或肿瘤。","trap":"三联不齐不代表不是肺栓塞——\"不明原因呼吸困难 + 低氧 + 有危险因素\"就够警惕了。"},{"id":"w62","day":"2026-10-23","k":"内科·呼吸","q":"下列疾病最常引起漏出性胸腔积液的是","o":["充血性心力衰竭","结核性胸膜炎","肺炎旁积液","恶性肿瘤胸膜转移","系统性红斑狼疮"],"a":0,"plain":"漏出液是\"压力不对\"漏出来的水，心衰、肝硬化、肾病这三种全身性疾病最典型。","why":"漏出液的常见病因是充血性心力衰竭、肝硬化、肾病综合征，机制分别是毛细血管静水压升高、胶体渗透压降低、水钠潴留。","others":"结核性胸膜炎、肺炎旁积液、恶性肿瘤胸膜转移、SLE 都属于渗出液，以炎症或肿瘤导致毛细血管通透性增加为机制。","trap":"记忆法：漏出液=全身病（心、肝、肾），渗出液=局部病（感染、肿瘤、免疫）。"},{"id":"w63","day":"2026-10-23","k":"外科·胸心","q":"开放性气胸的现场急救措施是","o":["立即用无菌敷料封闭伤口，使其变为闭合性气胸","立即穿刺排气","立即胸腔闭式引流","立即气管插管","立即开胸探查"],"a":0,"plain":"胸口破了个洞，吸气时空气\"嘶嘶\"往里钻——先把这个洞堵上，把\"开放\"变成\"闭合\"。","why":"开放性气胸时胸膜腔与外界相通，呼吸时纵隔随呼吸摆动（纵隔扑动），严重影响循环。急救第一步是用无菌敷料（或凡士林纱布）覆盖伤口并密封包扎，使其变为闭合性气胸，再按闭合性气胸处理并尽快清创缝合。","others":"穿刺排气用于张力性气胸；闭式引流是后续处理；气管插管和开胸探查都不是现场第一步。","trap":"三种气胸的急救顺序要分清：开放→先封闭，张力→先穿刺，闭合→看压缩程度决定引流。"},{"id":"w64","day":"2026-10-23","k":"内科·呼吸","q":"ARDS 患者机械通气推荐采用的策略是","o":["小潮气量（约 6 ml/kg 理想体重）+ 适当 PEEP","大潮气量（12 ml/kg）保证通气","高频通气为唯一选择","不使用 PEEP","完全自主呼吸不支持"],"a":0,"plain":"ARDS 的肺像\"被水泡过的海绵\"，吹太猛会把好肺吹破——所以要小潮气量、给点压力撑开。","why":"ARDS 肺容积显著减少（\"婴儿肺\"），机械通气采用肺保护性策略：小潮气量 6 ml/kg 理想体重、限制平台压 \u003c30 cmH₂O、适当 PEEP 维持肺泡开放，可降低死亡率。","others":"大潮气量会导致容积伤和气压伤；高频通气不是唯一选择；不用 PEEP 易致肺泡反复塌陷；完全自主呼吸在重度 ARDS 常难以维持氧合。","trap":"\"小潮气量 + 合适 PEEP + 限制平台压\"是 ARDS 通气的三句话，考选择或案例都可能出现。"},{"id":"w65","day":"2026-10-23","k":"内科·呼吸","q":"慢性呼吸性酸中毒补碱的指征是","o":["pH \u003c 7.20 时谨慎补碱","pH \u003c 7.35 即应补碱","PaCO₂ > 50 mmHg 即补碱","所有Ⅱ型呼衰都要补碱","不需要补碱"],"a":0,"plain":"呼酸靠\"通气\"解决，不靠打碱——只有酸到 pH 7.2 以下、随时可能出问题时才少量补。","why":"慢性呼吸性酸中毒的治疗核心是改善通气（支气管扩张、无创通气），而不是补碱。仅当 pH \u003c7.20 且无法通过改善通气纠正时，才谨慎少量补碱（碳酸氢钠），并监测 PaCO₂。","others":"pH 7.35 只是轻度酸中毒；PaCO₂ 升高本身不是补碱指征；常规补碱会加重 CO₂ 潴留和氧解离曲线左移。","trap":"\"通气问题用通气解决\"——补碱在呼酸里是最后的、有限的手段，不是常规。"},{"id":"w66","day":"2026-10-24","k":"内科·循环","q":"急性左心衰竭患者应采取的体位是","o":["坐位，双腿下垂","平卧位","头低足高位","左侧卧位","俯卧位"],"a":0,"plain":"让病人坐起来、腿垂下去，血就往腿上跑，回心的血少了，肺里就没那么\"淹\"。","why":"急性左心衰时取坐位、双腿下垂，可利用重力使血液淤积于下肢，减少回心血量和肺循环血量，迅速缓解肺水肿；同时给予高流量吸氧、利尿、扩血管。","others":"平卧会加重回心血量和肺淤血；头低足高位更糟；左侧卧位无治疗意义；俯卧位用于 ARDS 而非急性肺水肿。","trap":"体位本身就是治疗——\"坐位腿下垂\"是急性肺水肿抢救的第一步，常被当成送分题。"},{"id":"w67","day":"2026-10-24","k":"内科·循环","q":"下列情况禁用洋地黄的是","o":["肥厚型梗阻性心肌病","扩张型心肌病伴心衰","心房颤动伴快速心室率","慢性心衰伴射血分数降低","室上速"],"a":0,"plain":"肥厚型梗阻性心肌病的心脏本来就\"出口窄\"，洋地黄让它收缩更猛，反而堵得更死。","why":"洋地黄增强心肌收缩力，会加重肥厚型梗阻性心肌病的流出道梗阻，属于禁忌。其他禁忌还包括预激综合征伴房颤、二度以上房室传导阻滞、洋地黄中毒。","others":"扩张型心肌病、房颤快速心室率、HFrEF、室上速都是洋地黄的适应证。","trap":"洋地黄\"三禁\"：肥厚梗阻、预激伴房颤、高度房室阻滞。三个都要能说出来。"},{"id":"w68","day":"2026-10-24","k":"内科·循环","q":"非瓣膜性房颤患者预防血栓栓塞最有效的措施是","o":["规范的抗凝治疗","抗血小板治疗","射频消融","控制心室率","戒烟限酒"],"a":0,"plain":"房颤最怕的不是心跳乱，是心房里的血块掉下来堵脑血管——所以抗凝才是保命的。","why":"房颤最大的危害是左心房血栓脱落导致缺血性卒中，规范抗凝（华法林 INR 2—3 或新型口服抗凝药）可使卒中风险下降约 60%—70%，是最有效的预防措施。","others":"抗血小板对房颤血栓预防效果远不如抗凝；射频消融可改善症状、部分恢复窦律，但不能完全替代抗凝；控制心室率改善症状；戒烟限酒是基础但非核心。","trap":"\"房颤抗凝看评分，抗血小板不能替代抗凝\"——这是房颤题里最常见的陷阱。"},{"id":"w69","day":"2026-10-24","k":"内科·循环","q":"支持宽 QRS 波心动过速为室性心动过速的依据是","o":["出现房室分离、夺获搏动或融合波","心室率 150 次/分","QRS 波增宽","既往有房颤史","血压下降"],"a":0,"plain":"室速和\"室上速伴差传\"长得像，关键看房和室还同不同步——房室分离、夺获搏动、融合波都是室速的身份证。","why":"宽 QRS 波心动过速中，房室分离、夺获搏动（capture beat）、融合波是室速的特异性依据；此外电轴极度偏移、胸导联同向性也支持室速。血流动力学不稳定时可直接同步电复律。","others":"心室率 150、QRS 增宽、血压下降在两者都可能出现；既往房颤史不能区分。","trap":"不确定宽 QRS 心动过速类型时，按室速处理——这是安全的默认策略。"},{"id":"w70","day":"2026-10-24","k":"内科·循环","q":"心衰患者出现利尿剂抵抗时，合理的处理不包括","o":["立即停用利尿剂","增加利尿剂剂量","联合不同作用部位的利尿剂","纠正低钠血症和低蛋白血症","改用静脉给药"],"a":0,"plain":"利尿剂\"不灵了\"不是停药，而是加量、换打法、把身体的内环境先纠正过来。","why":"利尿剂抵抗常见于长期使用、肾功能不全、低钠低蛋白、肠道水肿吸收差。处理包括：增加剂量、静脉给药、联合噻嗪类/螺内酯、纠正低钠和低蛋白、限制钠摄入。","others":"增加剂量、联合用药、纠正内环境、改静脉给药都是正确措施；立即停药会导致淤血加重。","trap":"低蛋白血症会让利尿剂\"到不了作用位点\"，补白蛋白有时比加利尿剂更有效。"},{"id":"w71","day":"2026-10-25","k":"内科·循环","q":"高血压急症与高血压亚急症的根本区别是","o":["有无急性靶器官损害","血压升高的幅度","是否有头痛","病程长短","对口服降压药的反应"],"a":0,"plain":"血压都很高，区别只有一条：器官有没有被\"烧坏\"。坏了叫急症，没坏叫亚急症。","why":"高血压急症指血压急剧升高同时伴急性靶器官损害（脑病、急性心衰、主动脉夹层、急性肾损伤、眼底出血等），需静脉降压；亚急症无急性靶器官损害，可口服药缓慢降压。","others":"血压幅度、头痛、病程都不能作为区分标准；对药物反应也不是定义依据。","trap":"关键不是\"多高\"，而是\"伤没伤到器官\"。同样的 220/130，有脑病就是急症。"},{"id":"w72","day":"2026-10-25","k":"内科·循环","q":"稳定型心绞痛发作的典型特点是","o":["劳力诱发、持续 3—5 分钟、休息或含服硝酸甘油缓解","静息时发作、持续 30 分钟以上","与活动无关、深呼吸加重","夜间发作、伴大汗","持续数秒的针刺样疼痛"],"a":0,"plain":"稳定型心绞痛有\"三个固定\"：固定的诱因（劳力）、固定的时长（几分钟）、固定的缓解方式（休息或含药）。","why":"稳定型心绞痛典型表现为劳力或情绪激动诱发，胸骨后压榨性疼痛，持续 3—5 分钟，休息或含服硝酸甘油 1—5 分钟缓解，发作频率和程度在 1—3 个月内相对稳定。","others":"静息发作、持续 30 分钟以上提示不稳定型心绞痛或心梗；与呼吸相关提示胸膜或心包；夜间发作伴大汗要警惕变异型心绞痛或心梗；数秒针刺样痛多为神经痛。","trap":"\"三个固定\"被打破（诱因变轻、时间变长、含药无效）就是不稳定型心绞痛，要按急症处理。"},{"id":"w73","day":"2026-10-25","k":"内科·循环","q":"急性心肌梗死后 3 天出现心尖部新发粗糙收缩期杂音，最可能的并发症是","o":["乳头肌功能不全或断裂","室间隔穿孔","心包炎","室壁瘤","左心室血栓"],"a":0,"plain":"心梗把乳头肌\"饿\"坏了，二尖瓣关不严，血往回漏——心尖部就出现新的杂音。","why":"急性心梗后乳头肌缺血、坏死或断裂，导致二尖瓣关闭不全，表现为心尖部新出现的收缩期杂音，可迅速进展为急性左心衰和肺水肿；床旁超声可确诊。","others":"室间隔穿孔表现为胸骨左缘粗糙全收缩期杂音伴震颤、右心衰；心包炎有胸膜性胸痛和心包摩擦音；室壁瘤表现为持续 ST 抬高和心影膨出；左室血栓多无症状、靠超声发现。","trap":"杂音位置是线索：心尖部→乳头肌/二尖瓣；胸骨左缘→室间隔穿孔。"},{"id":"w74","day":"2026-10-25","k":"内科·循环","q":"急性心肌梗死静脉溶栓的绝对禁忌证是","o":["既往有出血性卒中史","年龄 70 岁","血压 150/90 mmHg","心率 100 次/分","糖尿病史"],"a":0,"plain":"溶栓是\"化掉血栓\"，有出血性脑卒中史的人一溶就可能脑出血——绝对禁忌。","why":"溶栓绝对禁忌包括：既往任何时间出血性卒中、3 个月内缺血性卒中、已知颅内肿瘤或血管畸形、活动性出血、可疑主动脉夹层、近期大手术或创伤。","others":"年龄 70 岁不是禁忌（高龄只是相对禁忌）；血压 150/90 未达禁忌阈值（>180/110 为相对/绝对禁忌）；心率 100 和糖尿病史都不是禁忌。","trap":"记\"脑、血、夹层\"三类最硬的红线：脑血管事件、活动性出血、主动脉夹层。"},{"id":"w75","day":"2026-10-25","k":"内科·循环","q":"冠心病二级预防的 ABCDE 方案中，A 代表","o":["阿司匹林与 ACEI","抗心律失常药","抗生素","抗凝药","抗焦虑药"],"a":0,"plain":"ABCDE 是冠心病二级预防的口诀：A 抗血小板 + ACEI，B β 阻滞剂 + 血压，C 胆固醇 + 戒烟，D 糖尿病 + 饮食，E 教育 + 运动。","why":"A：Aspirin（抗血小板）与 ACEI；B：β blocker 与 Blood pressure 控制；C：Cholesterol（他汀）与 Cigarette（戒烟）；D：Diabetes（控糖）与 Diet；E：Education 与 Exercise。","others":"抗心律失常药、抗生素、抗凝药、抗焦虑药都不在 ABCDE 的核心条目里。","trap":"口诀要能默写，且知道每项背后的药：A 是阿司匹林，不是抗凝药。"},{"id":"w76","day":"2026-10-21","k":"内科·呼吸","q":"社区获得性肺炎最常见的非典型病原体是","o":["肺炎支原体","肺炎链球菌","金黄色葡萄球菌","铜绿假单胞菌","肺炎克雷伯菌"],"a":0,"plain":"非典型病原体里最常见的是支原体，尤其在年轻人、学校里成片发病的时候。","why":"社区获得性肺炎的非典型病原体包括肺炎支原体、肺炎衣原体、军团菌。其中肺炎支原体最常见，多见于儿童和青壮年，表现为干咳、低热、肺部体征轻而影像重。","others":"肺炎链球菌是典型的细菌性病原体（不是非典型）；金葡菌、铜绿假单胞菌、克雷伯菌都属于典型细菌。","trap":"\"症状重、体征轻、影像重\"是支原体肺炎的经典描述，配合\"大环内酯\"一起记。"},{"id":"w77","day":"2026-10-21","k":"内科·呼吸","q":"肺炎链球菌肺炎最典型的热型是","o":["稽留热","弛张热","间歇热","波状热","不规则热"],"a":0,"plain":"肺炎链球菌肺炎体温一路烧到 39—40℃，一天内波动不超过 1℃——这叫稽留热。","why":"肺炎链球菌肺炎起病急，典型热型为稽留热（体温恒定在 39—40℃，24 小时内波动 \u003c1℃），伴寒战、胸痛、咳嗽。","others":"弛张热（波动 >2℃）见于化脓性感染、败血症；间歇热见于疟疾；波状热见于布鲁菌病；不规则热见于结核、风湿热。","trap":"热型和病原体可以配对记：稽留热→肺炎链球菌，弛张热→脓肿/败血症。"},{"id":"w78","day":"2026-10-21","k":"病理","q":"小叶性肺炎的病变特点是","o":["以细支气管为中心的化脓性炎","肺泡内弥漫性纤维蛋白渗出","肺间质纤维化","肉芽肿形成","干酪样坏死"],"a":0,"plain":"小叶性肺炎是\"一个细支气管为中心烂一小片\"，所以病灶是斑片状的，不是整叶。","why":"小叶性肺炎（支气管肺炎）以细支气管为中心，向周围肺泡扩散形成化脓性炎症，病灶呈斑片状、可融合；多见于儿童、老年、久病卧床者。","others":"肺泡内弥漫纤维蛋白渗出是大叶性肺炎；肺间质纤维化是间质性肺病；肉芽肿见于结核、结节病；干酪样坏死是结核。","trap":"大叶性=整叶实变，小叶性=以细支气管为中心的斑片；一个累及肺泡，一个累及细支气管。"},{"id":"w79","day":"2026-10-21","k":"内科·呼吸","q":"病毒性肺炎最典型的影像学表现是","o":["双肺磨玻璃影、间质性改变","大叶性实变","厚壁空洞伴液平","肺门淋巴结钙化","胸腔积液"],"a":0,"plain":"病毒喜欢待在\"肺的支架\"里，所以影像上是毛玻璃样的间质改变，而不是一整块实变。","why":"病毒性肺炎以间质性炎症为主，影像表现为双肺弥漫磨玻璃影、网格状或小结节影，多位于胸膜下；重症可进展为 ARDS。","others":"大叶实变是细菌性肺炎；厚壁空洞伴液平是肺脓肿；肺门钙化提示陈旧性结核；胸腔积液不是病毒性肺炎的主要表现。","trap":"新冠、流感、巨细胞病毒的肺炎都走\"间质—磨玻璃\"这条路，和细菌的\"实变\"形成对照。"},{"id":"w80","day":"2026-10-21","k":"内科·呼吸","q":"判断重症肺炎的主要标准是","o":["需要有创机械通气或感染性休克需升压药","体温 > 39℃","白细胞 > 15×10⁹/L","双肺湿啰音","咳嗽剧烈"],"a":0,"plain":"重症不重症，看\"要不要插管\"和\"血压靠不靠药撑\"——这两个才是硬指标。","why":"重症肺炎的主要标准：需有创机械通气；感染性休克需用血管活性药。次要标准包括呼吸频率 ≥30、氧合指数 ≤250、多肺叶浸润、意识障碍、尿素氮升高、白细胞减少、血小板减少、低体温等。","others":"高热、白细胞升高、湿啰音、咳嗽都是普通肺炎表现，不能界定\"重症\"。","trap":"记住\"主要标准只有两条\"：上机、用升压药。其余都是次要标准，满足 3 条次要也算重症。"},{"id":"w81","day":"2026-10-21","k":"内科·呼吸","q":"社区获得性肺炎经验性抗感染治疗后，评估疗效的时间点是","o":["48—72 小时","12 小时","24 小时","7 天","2 周"],"a":0,"plain":"抗生素不是立竿见影的，一般要等 48—72 小时才看得出有没有效，别急着换药。","why":"肺炎经验性治疗后应在 48—72 小时评估：体温、白细胞、氧合、影像。若无效需考虑病原体覆盖不足、耐药、并发症（脓胸）、非感染性疾病。","others":"12、24 小时太早，容易误判为无效；7 天、2 周才评估会延误调整。","trap":"\"48—72 小时\"是抗感染治疗评估的通用节奏，不只肺炎——尿路感染、败血症也用它。"},{"id":"w82","day":"2026-10-21","k":"内科·呼吸","q":"肺脓肿患者痰液的典型特点是","o":["大量脓臭痰，静置后分层","铁锈色痰","砖红色胶冻样痰","粉红色泡沫痰","白色黏液痰"],"a":0,"plain":"肺脓肿的痰又脓又臭（厌氧菌的功劳），放一会儿会分三层。","why":"肺脓肿典型表现为大量脓臭痰（厌氧菌感染所致），每日可达数百毫升，静置后分三层：上层泡沫、中层浑浊黏液、下层坏死组织沉渣。","others":"铁锈色痰是肺炎链球菌；砖红色胶冻样是克雷伯菌；粉红泡沫痰是急性左心衰；白色黏液痰见于慢支。","trap":"\"脓臭痰 + 分层\"是肺脓肿的招牌；如果只是脓痰不臭，要想到其他化脓性感染。"},{"id":"w83","day":"2026-10-21","k":"内科·呼吸","q":"急性肺脓肿最典型的胸部影像表现是","o":["厚壁空洞伴气液平面","薄壁气囊","大叶性实变","弥漫磨玻璃影","双肺粟粒状结节"],"a":0,"plain":"脓腔里有脓也有气，片子上一站一躺，就形成\"液平\"——这是肺脓肿的标志。","why":"急性肺脓肿影像表现为大片浓密阴影中有圆形透亮区及气液平面（厚壁空洞），好发于右肺下叶背段和后基底段。","others":"薄壁气囊是金葡菌肺炎的肺气囊肿；大叶实变是肺炎链球菌；磨玻璃影是病毒；粟粒结节是血行播散型结核。","trap":"\"空洞 + 液平\"出现在下叶背段，基本就是肺脓肿；出现在上叶尖后段要警惕结核空洞。"},{"id":"w84","day":"2026-10-21","k":"内科·呼吸","q":"急性肺脓肿抗生素治疗的疗程一般为","o":["6—8 周","3—5 天","1—2 周","3 个月","6 个月"],"a":0,"plain":"脓腔要长好需要时间，抗生素一般要打 6—8 周，不能退烧就停。","why":"肺脓肿抗生素疗程一般 6—8 周，直至临床症状消失、影像上脓腔闭合或仅留少量纤维条索；过早停药易复发。","others":"3—5 天和 1—2 周都太短；3—6 个月是慢性肺脓肿或特殊病原体（放线菌、诺卡菌）的疗程。","trap":"疗程判断看\"影像\"而不只是\"体温\"——脓腔没闭合就停药，复发率很高。"},{"id":"w85","day":"2026-10-21","k":"外科·胸心","q":"肺脓肿需要手术治疗的指征不包括","o":["体温降至正常","内科治疗 3 个月无效","大咯血危及生命","支气管胸膜瘘","脓腔巨大难以闭合"],"a":0,"plain":"手术是\"内科搞不定\"时的后手：治不好、大出血、漏了，才开刀。体温正常是好事，不是手术理由。","why":"肺脓肿手术指征：内科治疗 3 个月以上无效、大咯血危及生命、支气管胸膜瘘、脓腔巨大难以闭合、怀疑癌性空洞。","others":"体温正常是治疗有效的表现，绝不是手术指征。","trap":"这类题常用\"正常现象\"做干扰项——看到\"体温正常\"\"白细胞下降\"就要警觉，它们不是手术理由。"},{"id":"w86","day":"2026-10-21","k":"内科·呼吸","q":"血源性肺脓肿最常见的病原体是","o":["金黄色葡萄球菌","肺炎链球菌","肺炎克雷伯菌","厌氧菌","铜绿假单胞菌"],"a":0,"plain":"血里带去的脓肿，元凶多是金葡菌——皮肤感染、静脉吸毒、导管感染都可能是源头。","why":"血源性肺脓肿多由金黄色葡萄球菌引起，常见于皮肤疖肿、静脉吸毒、中心静脉导管感染，表现为两肺多发小脓肿。","others":"厌氧菌是吸入性肺脓肿的主要病原；肺炎链球菌、克雷伯菌多为大叶性肺炎；铜绿假单胞菌多见于院内感染、免疫抑制。","trap":"\"吸入性→厌氧菌，血源性→金葡菌\"，两个途径两种病原，是这一章的固定搭配。"},{"id":"w87","day":"2026-10-21","k":"内科·呼吸","q":"我国支气管扩张最常见的病因是","o":["婴幼儿期下呼吸道感染（麻疹、百日咳、肺炎）","先天性软骨发育不全","α₁-抗胰蛋白酶缺乏","类风湿关节炎","吸入性损伤"],"a":0,"plain":"小时候得过麻疹、百日咳、重症肺炎，气道被反复破坏，长大后容易支扩——我国最常见的就是这条。","why":"我国支气管扩张最常见的病因是婴幼儿时期的下呼吸道感染（麻疹、百日咳、支气管肺炎），反复感染破坏支气管壁的弹性和软骨，形成永久性扩张。","others":"先天性因素（软骨发育不全、Kartagener 综合征）少见；α₁-抗胰蛋白酶缺乏主要导致肺气肿；类风湿等结缔组织病可继发；吸入性损伤是少见原因。","trap":"病因题要分国情：我国以\"感染后\"为主，欧美更强调囊性纤维化。"},{"id":"w88","day":"2026-10-21","k":"内科·呼吸","q":"Kartagener 综合征的三联征是","o":["内脏转位、鼻窦炎、支气管扩张","内脏转位、鼻窦炎、肺气肿","支气管扩张、咯血、杵状指","鼻窦炎、中耳炎、肺炎","内脏转位、先天性心脏病、无脾"],"a":0,"plain":"纤毛不动，脏东西排不出去：鼻子发炎、肺里支扩，连内脏都长反了——这三样凑齐就是 Kartagener。","why":"Kartagener 综合征是原发性纤毛运动障碍的一种，三联征为内脏转位、慢性鼻窦炎、支气管扩张，属于常染色体隐性遗传。","others":"肺气肿不是三联之一；咯血、杵状指是支扩的表现而非综合征定义；先心病、无脾是其他综合征（如 Ivemark）的特征。","trap":"\"内脏转位\"这个线索很显眼——胸片发现右位心，就要追问鼻窦炎和支扩。"},{"id":"w89","day":"2026-10-21","k":"内科·呼吸","q":"支气管扩张患者肺部听诊最典型的表现是","o":["下肺固定性湿啰音","双肺弥漫哮鸣音","局限性哮鸣音","胸膜摩擦音","呼气相延长"],"a":0,"plain":"支扩的痰老积在同一个地方，所以啰音\"固定\"——每次听都在下肺同一个位置。","why":"支气管扩张的典型体征是下肺、背部固定性湿啰音（中粗湿啰音），咳嗽后不消失，因为扩张的支气管内持续有分泌物。","others":"弥漫哮鸣音是哮喘；局限性哮鸣音提示气道异物或肿瘤；胸膜摩擦音见于胸膜炎；呼气相延长见于 COPD、哮喘。","trap":"\"固定\"两个字是关键词——体位改变、咳嗽后位置不变的湿啰音，才是支扩。"},{"id":"w90","day":"2026-10-21","k":"内科·呼吸","q":"支气管扩张患者痰液静置后的分层是","o":["上层泡沫、中层浑浊黏液、下层坏死组织","上层脓液、中层血清、下层红细胞","上层清亮、中层黏液、下层泡沫","不分层","上层油脂、下层水"],"a":0,"plain":"痰放一会儿会分三层：上面泡沫、中间浑浊的黏液、底下是烂掉的组织沉渣。","why":"支气管扩张的痰液静置后分三层：上层为泡沫，中层为浑浊黏液，下层为坏死组织沉淀物，反映气道内慢性化脓性炎症。","others":"其余分层描述都不符合；正常痰液或单纯黏液痰不分层。","trap":"这个\"三层\"和肺脓肿的\"三层\"是同一个现象，都可以用来支持化脓性气道疾病。"},{"id":"w91","day":"2026-10-21","k":"内科·呼吸","q":"支气管扩张患者进行体位引流时，正确的做法是","o":["病变部位在上，使痰液靠重力流出","病变部位在下","平卧位即可","头低足高、病变部位在下","必须在饭后立即进行"],"a":0,"plain":"哪边有病，就让哪边朝上——靠重力把痰\"倒\"出来。","why":"体位引流的原则是使病变部位处于高位，引流支气管开口向下，借助重力使痰液排出；每次 15—30 分钟，每日 2—3 次，宜在餐前进行，避免餐后引起呕吐误吸。","others":"\"病变在下\"方向反了；平卧无效；餐后立即引流易致呕吐和误吸。","trap":"体位引流的\"病侧在上\"和大咯血急救的\"患侧卧位\"容易混：前者为排痰，后者为防血液流入健侧。"},{"id":"w92","day":"2026-10-21","k":"内科·呼吸","q":"鉴别肺炎与肺结核最有价值的检查是","o":["痰涂片找抗酸杆菌","血常规","胸部 X 线","C 反应蛋白","血沉"],"a":0,"plain":"是不是结核，最直接的办法是\"在痰里找到结核菌\"——找到就是，找不到也不能完全排除。","why":"痰涂片抗酸染色找抗酸杆菌是鉴别肺结核与普通肺炎最直接、最有价值的检查；痰培养和分子检测（Xpert MTB/RIF）可进一步提高敏感性和耐药信息。","others":"血常规、CRP、血沉都不特异；胸片能提示好发部位（上叶尖后段）但不能定性。","trap":"\"上叶尖后段 + 空洞 + 低热盗汗\"提示结核，但确诊一定要靠病原学。"},{"id":"w93","day":"2026-10-21","k":"内科·呼吸","q":"中央型肺癌最常用的确诊方法是","o":["支气管镜 + 活检","CT 引导下经皮肺穿刺","痰脱落细胞学","PET-CT","开胸探查"],"a":0,"plain":"长在\"主干道\"上的肿瘤，支气管镜伸进去就能看见、还能夹一块下来化验。","why":"中央型肺癌（鳞癌、小细胞癌多见）位于段及以上支气管，支气管镜可直接观察并取活检，是确诊的首选方法，同时可评估手术范围。","others":"CT 引导穿刺适用于周围型病灶；痰细胞学敏感性低；PET-CT 用于分期；开胸探查已很少作为首选。","trap":"\"中央型→支气管镜，周围型→经皮穿刺\"，按病灶位置选检查。"},{"id":"w94","day":"2026-10-21","k":"内科·呼吸","q":"周围型肺癌最常用的确诊方法是","o":["CT 引导下经皮肺穿刺活检","支气管镜","痰脱落细胞学","纵隔镜","胸腔镜"],"a":0,"plain":"长在肺\"边上\"的结节，支气管镜够不着，就在 CT 引导下从胸壁扎一针取组织。","why":"周围型肺癌位于段支气管以下，支气管镜难以到达，首选 CT 引导下经皮肺穿刺活检；气胸和出血是主要并发症。","others":"支气管镜对周围型病灶阳性率低；痰细胞学敏感性低；纵隔镜用于纵隔淋巴结分期；胸腔镜用于胸膜病变或诊断性切除。","trap":"穿刺的常见并发症是气胸——题干里术后突发胸痛气促，先想这个。"},{"id":"w95","day":"2026-10-21","k":"内科·呼吸","q":"预防肺炎链球菌感染最有效的措施是","o":["接种肺炎链球菌疫苗","长期口服抗生素","每年拍胸片","补充维生素 C","戴口罩"],"a":0,"plain":"防肺炎链球菌，最实在的办法是打疫苗——尤其老人和慢性病患者。","why":"接种肺炎链球菌疫苗（23 价多糖疫苗、13 价结合疫苗）是预防肺炎链球菌感染最有效的措施，推荐 65 岁以上老人和慢性心肺疾病、糖尿病、免疫抑制者接种。","others":"长期口服抗生素会导致耐药；胸片是筛查不是预防；维生素 C 无确切预防作用；戴口罩可减少传播但不能替代疫苗。","trap":"\"预防题选疫苗\"是通用思路，但要知道 23 价覆盖广、13 价免疫原性更强。"},{"id":"w96","day":"2026-10-21","k":"内科·呼吸","q":"医院获得性肺炎最常见的病原体是","o":["革兰阴性杆菌","肺炎链球菌","肺炎支原体","结核分枝杆菌","流感病毒"],"a":0,"plain":"在医院里得的肺炎，主角换人了：不再是肺炎链球菌，而是铜绿假单胞菌、鲍曼不动杆菌这些革兰阴性菌。","why":"医院获得性肺炎以革兰阴性杆菌为主（铜绿假单胞菌、鲍曼不动杆菌、肺炎克雷伯菌），常为多重耐药菌；经验性治疗需覆盖这些病原并考虑当地耐药谱。","others":"肺炎链球菌、支原体是社区获得性肺炎的常见病原；结核需特殊培养；流感病毒在医院内也可暴发但非最常见。","trap":"\"社区看球菌，医院看杆菌\"——这一条决定了经验性用药的方向。"},{"id":"w97","day":"2026-10-21","k":"内科·呼吸","q":"预防呼吸机相关性肺炎最有效的措施是","o":["抬高床头 30°—45° 并加强口腔护理","常规使用抗生素预防","每日更换呼吸机管路","持续镇静","限制肠内营养"],"a":0,"plain":"让病人半躺着、把嘴里的细菌清理干净，比换管子管用得多。","why":"预防 VAP 的核心措施：抬高床头 30°—45°（减少误吸）、每日口腔护理、每日唤醒并评估脱机、声门下分泌物引流、严格手卫生。","others":"常规预防性抗生素会诱导耐药；管路不必每日更换（增加污染机会）；持续镇静延长上机时间；肠内营养应尽早而非限制。","trap":"\"抬高床头\"是成本最低、证据最强的一条，几乎每次考 VAP 预防都会出现。"},{"id":"w98","day":"2026-10-21","k":"内科·呼吸","q":"肺炎支原体肺炎使用大环内酯类的疗程一般为","o":["2—3 周","3 天","1 周","2 个月","6 个月"],"a":0,"plain":"支原体肺炎退烧慢、咳嗽拖得久，抗生素一般要吃 2—3 周，不能一周就停。","why":"肺炎支原体肺炎大环内酯类疗程一般 2—3 周，尤其是重症或有肺外表现者；疗程过短易复发。","others":"3 天、1 周偏短；2—6 个月没有必要。","trap":"支原体肺炎的特点是\"症状缓解慢、影像吸收更慢\"，疗程要按临床和影像综合判断。"},{"id":"w99","day":"2026-10-21","k":"内科·呼吸","q":"咯血与呕血的鉴别，支持咯血的是","o":["血呈鲜红色、泡沫状、伴咳嗽","血呈暗红色、伴食物残渣","血呈咖啡色、伴恶心","血液呈酸性","便后滴血"],"a":0,"plain":"从肺里咳出来的是鲜红带泡沫的；从胃里吐出来的是暗红、混着食物、还反酸。","why":"咯血：血鲜红、泡沫状、混有痰液、呈碱性、伴咳嗽，咯血后数日可有血痰；呕血：血暗红或咖啡色、混有食物残渣、呈酸性、伴恶心呕吐，常有黑便。","others":"暗红伴食物残渣、咖啡色、酸性都是呕血特点；便后滴血是下消化道出血。","trap":"急诊分不清时，先按咯血处理并保护气道——误吸窒息比失血更快致命。"},{"id":"w100","day":"2026-10-21","k":"内科·呼吸","q":"大咯血内科治疗无效时，首选的微创止血方法是","o":["支气管动脉栓塞术","支气管镜下滑石粉喷洒","双侧肺叶切除","气管切开","胸膜固定术"],"a":0,"plain":"大咯血止不住，介入医生把\"供血的那根动脉\"堵上——支气管动脉栓塞，创伤小、立竿见影。","why":"大咯血经药物和内镜止血无效时，首选支气管动脉栓塞术（BAE），可迅速控制出血，尤其适用于支气管扩张、结核后遗、肺癌所致咯血；失败再考虑手术。","others":"滑石粉喷洒用于胸膜固定；肺叶切除创伤大、需明确出血部位且肺功能允许；气管切开是保气道手段；胸膜固定术用于气胸复发。","trap":"大咯血的处理顺序：保气道 → 药物（垂体后叶素）→ 内镜 → 介入栓塞 → 手术。"},{"id":"w101","day":"2026-10-22","k":"内科·呼吸","q":"COPD 患者的肺功能典型表现是","o":["FEV₁/FVC 降低、残气量增加、弥散功能下降","FEV₁/FVC 正常、肺总量减少","FEV₁/FVC 升高、残气量减少","弥散功能正常、肺总量正常","最大通气量正常"],"a":0,"plain":"COPD 是\"呼气出不去\"，所以吹得快（FEV₁）掉得厉害、残气越积越多，肺泡坏了弥散也差。","why":"COPD 属阻塞性通气障碍：FEV₁/FVC 降低、FEV₁ 占预计值下降、残气量（RV）和肺总量（TLC）升高、一氧化碳弥散量（DLCO）降低。","others":"限制性通气障碍才是肺总量减少、FEV₁/FVC 正常或升高；弥散正常多见于哮喘。","trap":"阻塞性与限制性的分野：阻塞看\"比值低、残气多\"，限制看\"总量少、比值正常\"。"},{"id":"w102","day":"2026-10-22","k":"病理","q":"与吸烟关系最密切的肺气肿类型是","o":["小叶中央型","全小叶型","间隔旁型","不规则型","代偿性"],"a":0,"plain":"吸烟伤的是\"呼吸性细支气管\"，所以先从每个小叶的中央开始烂——这就是小叶中央型。","why":"小叶中央型肺气肿累及呼吸性细支气管，好发于上叶，与吸烟关系最密切；全小叶型累及整个肺小叶，好发于下叶，多见于 α₁-抗胰蛋白酶缺乏。","others":"全小叶型与 α₁-抗胰蛋白酶缺乏相关；间隔旁型常伴自发性气胸；不规则型伴瘢痕形成；代偿性为肺切除后剩余肺组织膨胀。","trap":"\"上叶中央型—吸烟，下叶全小叶—α₁-AT 缺乏\"，这是病理与临床的经典配对。"},{"id":"w103","day":"2026-10-22","k":"内科·呼吸","q":"COPD 稳定期首选的支气管扩张剂是","o":["长效抗胆碱能药（LAMA）","短效 β₂ 受体激动剂","口服茶碱","白三烯受体拮抗剂","吸入糖皮质激素单药"],"a":0,"plain":"稳定期要\"管一天\"，所以选长效的：LAMA（噻托溴铵）一天一次，比短效药更省事也更有效。","why":"COPD 稳定期以长效支气管扩张剂为基础治疗，首选长效抗胆碱能药（LAMA，如噻托溴铵）或 LABA，可单用或联合；能改善症状、减少急性加重。","others":"短效药（SABA）用于急性加重期；口服茶碱副作用大、为二线；白三烯受体拮抗剂主要用于哮喘；ICS 单药不用于 COPD。","trap":"哮喘的控制药是\"吸入激素\"，COPD 的控制药是\"长效支气管扩张剂\"——两个病的基础用药不同。"},{"id":"w104","day":"2026-10-22","k":"内科·呼吸","q":"COPD 患者发生肺动脉高压最主要的机制是","o":["缺氧性肺血管收缩","肺血管炎","左心衰致肺静脉压升高","肺栓塞反复发作","血容量过多"],"a":0,"plain":"长期缺氧让肺小动脉\"自动收紧\"，时间长了血管壁增厚、压力就上去了。","why":"COPD 相关肺动脉高压的主要机制是慢性缺氧引起肺血管收缩和重塑（缺氧性肺动脉高压），最终导致慢性肺源性心脏病、右心衰。","others":"肺血管炎见于结缔组织病；左心衰是\"后向性\"肺高压；反复肺栓塞是慢性血栓栓塞性肺高压；血容量过多是加重因素而非主因。","trap":"COPD→缺氧→肺血管收缩→肺动脉高压→肺心病→右心衰，这条链条要能顺着说出来。"},{"id":"w105","day":"2026-10-22","k":"内科·呼吸","q":"COPD 患者长期家庭氧疗的指征是","o":["PaO₂ ≤ 55 mmHg 或 SaO₂ ≤ 88%","PaO₂ ≤ 80 mmHg","PaCO₂ > 50 mmHg","每年急性加重 2 次","FEV₁ \u003c 80%"],"a":0,"plain":"不是\"喘就给氧\"，要看血氧数字：PaO₂ 掉到 55 以下（或 SaO₂≤88%）才够格长期家庭氧疗。","why":"长期家庭氧疗（LTOT）指征：PaO₂ ≤55 mmHg 或 SaO₂ ≤88%；或 PaO₂ 55—60 mmHg 伴肺动脉高压、右心衰、红细胞增多。每天 ≥15 小时才有生存获益。","others":"PaO₂ ≤80 是正常下限附近；PaCO₂ 升高不是氧疗指征；急性加重次数和 FEV₁ 程度不作为 LTOT 指征。","trap":"关键在\"每天 ≥15 小时\"——间断吸氧不能改善预后，这一点常被忽略。"},{"id":"w106","day":"2026-10-22","k":"内科·呼吸","q":"COPD 急性加重最常见的诱因是","o":["呼吸道感染","空气污染","停用支气管扩张剂","心力衰竭","肺栓塞"],"a":0,"plain":"COPD 突然加重，十次有七八次是\"感冒/感染\"惹的——病毒和细菌都算。","why":"COPD 急性加重最常见的诱因是呼吸道感染（病毒与细菌），其次为空气污染、气候突变、治疗依从性差；约 1/3 找不到明确诱因。","others":"空气污染是次要诱因；停药、心衰、肺栓塞都可能诱发，但不如感染常见。","trap":"诱因题选\"最常见\"，感染永远是第一位；心衰、肺栓塞是\"要考虑但不能解释大多数\"的鉴别。"},{"id":"w107","day":"2026-10-22","k":"内科·呼吸","q":"鉴别 COPD 与支气管哮喘最有价值的是","o":["气流受限的可逆性","吸烟史","咳嗽咳痰的时间","胸部影像","血嗜酸粒细胞"],"a":0,"plain":"哮喘的气道\"堵了能松\"，COPD 的堵是\"堵死了松不开\"——所以要看可逆性。","why":"哮喘的气流受限多为可逆（支气管舒张试验阳性、PEF 变异大），COPD 为持续、不完全可逆的气流受限。支气管舒张试验和 PEF 变异率是鉴别的关键。","others":"吸烟史、症状时间、影像都能提示但不能定性；血嗜酸粒细胞升高支持哮喘但也见于部分 COPD。","trap":"老年人可有\"哮喘-COPD 重叠（ACO）\"，两者不是非此即彼——题目若提\"长期吸烟 + 可逆\"，要想到重叠。"},{"id":"w108","day":"2026-10-22","k":"内科·呼吸","q":"α₁-抗胰蛋白酶缺乏所致肺气肿的特点是","o":["全小叶型，下叶为主","小叶中央型，上叶为主","间隔旁型，胸膜下为主","不规则型，瘢痕周围","代偿性，肺切除后"],"a":0,"plain":"α₁-抗胰蛋白酶是\"保护肺不被自己消化\"的，缺了它，整个小叶都烂——全小叶型，下叶最重。","why":"α₁-抗胰蛋白酶缺乏导致全小叶型肺气肿，好发于下叶，患者多为年轻人、不吸烟或轻度吸烟即出现明显肺气肿，常伴肝功能异常。","others":"小叶中央型与吸烟相关、上叶为主；间隔旁型易气胸；不规则型伴纤维化；代偿性是术后改变。","trap":"\"年轻人 + 下叶肺气肿 + 不吸烟\"要想到 α₁-抗胰蛋白酶缺乏，这是鉴别里的冷门但常考点。"},{"id":"w109","day":"2026-10-22","k":"内科·呼吸","q":"支气管哮喘的本质是","o":["慢性气道炎症","支气管平滑肌肿瘤","肺泡弹性纤维破坏","气道软骨软化","肺间质纤维化"],"a":0,"plain":"哮喘不是\"气管抽筋\"这么简单，根子是气道一直在发炎——所以要用激素消炎，不能只靠扩张剂。","why":"哮喘的本质是慢性气道炎症，以嗜酸粒细胞、肥大细胞、T 淋巴细胞浸润为特征，伴气道高反应性和可逆性气流受限；长期炎症可导致气道重塑。","others":"肺泡弹性破坏是肺气肿；软骨软化见于气管软化症；间质纤维化是间质性肺病。","trap":"\"本质是炎症\"这一条决定了治疗：控制药必须是抗炎的吸入激素，而不只是扩张支气管。"},{"id":"w110","day":"2026-10-22","k":"内科·呼吸","q":"支气管舒张试验阳性的判断标准是","o":["FEV₁ 增加 ≥12% 且 ≥200 ml","FEV₁ 增加 ≥5%","FEV₁/FVC 提高 ≥10%","PEF 增加 ≥5%","症状明显缓解"],"a":0,"plain":"吸完药再吹一次，FEV₁ 要\"涨 12% 以上、而且至少多 200 毫升\"，才算真的可逆。","why":"支气管舒张试验阳性标准：吸入短效 β₂ 激动剂后 FEV₁ 较用药前增加 ≥12%，且绝对值增加 ≥200 ml，提示气流受限可逆，支持哮喘。","others":"5% 的阈值太低；FEV₁/FVC 和 PEF 不是该试验的判定指标；症状缓解是主观感受。","trap":"\"12% 且 200 ml\"两个条件必须同时满足，只满足一个不算阳性。"},{"id":"w111","day":"2026-10-22","k":"内科·呼吸","q":"支气管激发试验主要用于检测","o":["气道高反应性","气道可逆性","肺弥散功能","呼吸肌力量","肺泡通气量"],"a":0,"plain":"激发试验就是\"故意惹一下气道\"，看它会不会过度收缩——测的是高反应性。","why":"支气管激发试验通过吸入组胺或乙酰甲胆碱，观察 FEV₁ 下降程度（下降 ≥20% 为阳性），用于检测气道高反应性，是哮喘的重要诊断依据，尤其适用于症状典型但肺功能正常者。","others":"可逆性靠舒张试验；弥散功能靠 DLCO；呼吸肌力量靠最大吸气压；肺泡通气量靠血气。","trap":"激发试验的禁忌是\"肺功能已经很差\"（FEV₁ \u003c70% 预计值）——有诱发严重支气管痉挛的风险。"},{"id":"w112","day":"2026-10-22","k":"内科·呼吸","q":"阿司匹林哮喘的发生机制是","o":["抑制 COX-1 使白三烯生成增多","直接刺激支气管平滑肌","IgE 介导的Ⅰ型变态反应","补体激活","抑制胆碱酯酶"],"a":0,"plain":"阿司匹林把\"另一条路\"堵了，花生四烯酸全跑去造白三烯，白三烯是强力支气管收缩剂。","why":"阿司匹林不可逆抑制 COX-1，使前列腺素合成减少、花生四烯酸转向 5-脂氧合酶途径，白三烯生成增多，引起支气管强烈收缩，属\"阿司匹林加重性呼吸系统疾病\"。","others":"不是 IgE 介导的过敏；不是直接刺激；不涉及补体或胆碱酯酶。","trap":"治疗要用白三烯受体拮抗剂（孟鲁司特），并避免所有 NSAIDs——不是\"换一种止痛药\"就行。"},{"id":"w113","day":"2026-10-22","k":"内科·呼吸","q":"哮喘危重发作需要气管插管的指征是","o":["意识障碍、呼吸肌疲劳、PaCO₂ 进行性升高","双肺哮鸣音明显","呼吸 28 次/分","心率 110 次/分","SpO₂ 93%"],"a":0,"plain":"哮喘病人如果开始\"犯困、二氧化碳往上走\"，说明他快没力气呼吸了——该插管了。","why":"哮喘危重发作的插管指征：意识障碍（嗜睡、昏迷）、呼吸肌疲劳（矛盾呼吸、胸腹反常运动）、PaCO₂ 进行性升高、心跳呼吸骤停。","others":"哮鸣音明显、呼吸 28 次、心率 110、SpO₂ 93% 都属中重度但未到插管程度。","trap":"哮喘加重时 PaCO₂ 本应降低（过度通气），一旦\"正常或升高\"就是危险信号——这是最容易被忽略的反转。"},{"id":"w114","day":"2026-10-22","k":"内科·呼吸","q":"鉴别支气管哮喘与急性左心衰\"心源性哮喘\"最有价值的是","o":["BNP/NT-proBNP 升高、粉红泡沫痰、心脏病史","双肺哮鸣音","呼吸困难","心率增快","端坐呼吸"],"a":0,"plain":"两个都喘、都有哮鸣音，但心衰的人脑钠肽高、痰是粉红的、还有心脏病史。","why":"心源性哮喘有心脏病史、咳粉红泡沫痰、双肺底湿啰音、BNP/NT-proBNP 显著升高、心脏扩大；支气管哮喘多有过敏史、哮鸣音为主、BNP 正常。","others":"哮鸣音、呼吸困难、心率快、端坐呼吸在两者都可出现，不能鉴别。","trap":"急诊分不清时，先按心衰试给利尿和扩血管——但如果真是哮喘，β 阻滞剂会要命，所以别急着用。"},{"id":"w115","day":"2026-10-22","k":"内科·呼吸","q":"肺癌最常见的血行转移部位是","o":["脑、骨、肝、肾上腺","脾、甲状腺","皮肤、肌肉","胃肠道","心脏"],"a":0,"plain":"肺癌的血行转移有固定\"落脚点\"：脑、骨、肝、肾上腺——这四个地方查分期必看。","why":"肺癌血行转移最常见的部位是脑、骨、肝和肾上腺；淋巴转移先至肺门、纵隔淋巴结，再至锁骨上。","others":"脾、甲状腺、皮肤肌肉、胃肠道、心脏都不是常见转移部位。","trap":"小细胞癌和腺癌血行转移早；鳞癌以局部侵犯和淋巴转移为主——分期检查的侧重不同。"},{"id":"w116","day":"2026-10-22","k":"内科·呼吸","q":"肺上沟瘤（Pancoast 瘤）最典型的临床表现是","o":["肩臂疼痛伴 Horner 综合征","刺激性干咳伴咯血","上腔静脉综合征","声音嘶哑","吞咽困难"],"a":0,"plain":"长在肺尖的瘤子会啃臂丛和交感神经——肩膀手臂痛，加上一只眼睑下垂、瞳孔缩小。","why":"Pancoast 瘤位于肺尖，侵犯臂丛神经引起肩臂疼痛和手部肌肉萎缩，侵犯颈交感神经节引起 Horner 综合征（同侧眼睑下垂、瞳孔缩小、眼球内陷、面部无汗）。","others":"干咳咯血是中央型肺癌的常见表现；上腔静脉综合征是纵隔淋巴结压迫；声音嘶哑是喉返神经受侵；吞咽困难是食管受压。","trap":"Horner 综合征 + 肩臂痛 + 肺尖阴影，三者一起出现就是 Pancoast 瘤。"},{"id":"w117","day":"2026-10-22","k":"内科·呼吸","q":"肺癌患者出现杵状指和长骨骨膜增生，提示","o":["肥大性肺性骨关节病（副肿瘤表现）","骨转移","类风湿关节炎","骨软化症","痛风"],"a":0,"plain":"杵状指加骨头末端疼，不一定是转移——这是肺癌\"分泌了某种因子\"引起的副肿瘤表现。","why":"肥大性肺性骨关节病是肺癌的肺外表现之一，表现为杵状指、长骨远端骨膜增生和关节疼痛，并非骨转移，切除肿瘤后症状可缓解。","others":"骨转移表现为局部骨痛、病理性骨折、碱性磷酸酶升高；类风湿有关节肿痛和晨僵；骨软化、痛风与肺癌无直接关系。","trap":"\"杵状指 + 骨痛\"别急着诊断转移——做骨扫描会发现没有转移灶，这是副肿瘤综合征。"},{"id":"w118","day":"2026-10-22","k":"内科·呼吸","q":"Lambert-Eaton 综合征最常见于哪种肺癌","o":["小细胞肺癌","鳞状细胞癌","腺癌","大细胞癌","类癌"],"a":0,"plain":"小细胞肺癌是神经内分泌肿瘤，会\"攻击\"神经肌肉接头——表现为近端无力，活动后反而好一点。","why":"Lambert-Eaton 肌无力综合征是小细胞肺癌最常见的神经系统副肿瘤综合征，由抗电压门控钙通道抗体介导，表现为近端肌无力、活动后肌力短暂改善、腱反射减弱。","others":"鳞癌多见高钙；腺癌少见副肿瘤表现；大细胞癌和类癌相关性低。","trap":"与重症肌无力鉴别：Lambert-Eaton 是\"活动后改善\"、近端为主；重症肌无力是\"活动后加重\"、眼肌受累早。"},{"id":"w119","day":"2026-10-22","k":"内科·呼吸","q":"小细胞肺癌的临床分期通常分为","o":["局限期与广泛期","Ⅰ—Ⅳ 期（TNM）","A、B、C 三级","早期、中期、晚期","高分化、低分化"],"a":0,"plain":"小细胞肺癌不用 TNM，只分两种：还在一个放疗野里叫局限期，跑出去了叫广泛期。","why":"小细胞肺癌因早期即广泛转移，临床上采用\"局限期/广泛期\"二分法：局限期指病变局限于一侧胸腔及区域淋巴结、可纳入一个放疗野；超出此范围（含恶性胸腔积液、对侧肺门、远处转移）为广泛期。","others":"TNM 主要用于非小细胞肺癌；A/B/C 分级、早中晚、分化程度都不是小细胞肺癌的分期体系。","trap":"分期体系要按病理类型分开记：非小细胞用 TNM，小细胞用局限/广泛。"},{"id":"w120","day":"2026-10-22","k":"内科·呼吸","q":"确诊恶性胸腔积液最有价值的方法是","o":["胸水脱落细胞学检查","胸水 ADA 测定","胸部 CT","胸水 pH 测定","血 CEA"],"a":0,"plain":"要在胸水里\"抓到肿瘤细胞\"，抓到就确诊——这是最直接的证据。","why":"胸水脱落细胞学检查找到癌细胞是确诊恶性胸腔积液最直接、最有价值的方法，反复送检可提高阳性率；胸膜活检（尤其是胸腔镜下）可进一步提高诊断率。","others":"ADA 用于结核；CT 显示胸膜结节或纵隔淋巴结可提示但不定性；胸水 pH 低提示预后差；血 CEA 只能辅助。","trap":"恶性胸水多为渗出液、LDH 高、CEA 可升高，但确诊必须靠细胞学或病理。"},{"id":"w121","day":"2026-10-22","k":"内科·呼吸","q":"中心型肺癌咯血的典型特点是","o":["反复痰中带血或少量咯血","一次大咯血为首发症状","咯血伴脓臭痰","咯血伴粉红泡沫痰","咯血伴胸痛发热"],"a":0,"plain":"肿瘤表面血管脆弱，咳的时候蹭破一点——所以多是\"痰里带血丝\"，量不大但反复。","why":"中心型肺癌因肿瘤侵犯支气管黏膜，典型表现为反复痰中带血或少量咯血，大咯血少见但可因侵犯大血管而致命。","others":"大咯血多见于支扩、结核空洞；脓臭痰提示肺脓肿；粉红泡沫痰是心衰；咯血伴发热胸痛提示肺炎。","trap":"\"40 岁以上、吸烟、反复痰中带血超过 2 周\"必须查支气管镜——这是肺癌的红旗症状。"},{"id":"w122","day":"2026-10-22","k":"内科·呼吸","q":"EGFR 酪氨酸激酶抑制剂（如吉非替尼）最可能获益的人群是","o":["不吸烟的女性腺癌患者","长期吸烟的鳞癌患者","小细胞肺癌患者","所有肺癌患者","仅有脑转移者"],"a":0,"plain":"靶向药不是人人有效，要先测基因——EGFR 突变多见于\"不吸烟、女性、腺癌\"这类人。","why":"EGFR 突变在亚裔、女性、不吸烟、腺癌患者中发生率最高（约 50%），这类患者使用 EGFR-TKI 客观缓解率高；用药前必须做基因检测。","others":"吸烟的鳞癌 EGFR 突变率低；小细胞肺癌无 EGFR 靶向指征；不能\"所有患者\"通用；脑转移不是选择标准。","trap":"\"先检测后用药\"是靶向治疗铁律——没测基因就上靶向药是错的。"},{"id":"w123","day":"2026-10-22","k":"内科·呼吸","q":"免疫检查点抑制剂（PD-1/PD-L1 单抗）的作用机制是","o":["解除肿瘤对 T 细胞的免疫抑制","直接杀伤肿瘤细胞","抑制肿瘤血管生成","阻断 EGFR 信号通路","诱导肿瘤细胞凋亡"],"a":0,"plain":"肿瘤会给 T 细胞\"踩刹车\"，免疫治疗就是把刹车松开，让自身的 T 细胞去杀肿瘤。","why":"PD-1/PD-L1 抑制剂阻断 PD-1 与 PD-L1 的结合，解除肿瘤微环境对 T 细胞的抑制，恢复 T 细胞的抗肿瘤活性；可发生免疫相关不良反应（肺炎、甲状腺炎、结肠炎等）。","others":"直接杀伤是化疗；抗血管生成是贝伐珠单抗；EGFR 通路是靶向药；诱导凋亡不是其主要机制。","trap":"免疫治疗的不良反应是\"过度免疫\"——免疫性肺炎、甲状腺功能异常，用激素处理，别当成感染。"},{"id":"w124","day":"2026-10-22","k":"内科·呼吸","q":"目前推荐进行肺癌筛查的高危人群是","o":["50 岁以上、吸烟 ≥20 包年","所有 40 岁以上人群","所有吸烟者","有肺癌家族史者即可","有慢性咳嗽者"],"a":0,"plain":"筛查不是人人都做，主要盯\"年纪大 + 烟龄长\"的人——吸烟 20 包年以上才算高危。","why":"肺癌筛查针对高危人群：年龄 50 岁以上、吸烟 ≥20 包年（或戒烟不足 15 年），推荐每年低剂量螺旋 CT；不推荐对全体人群普查。","others":"所有 40 岁以上、所有吸烟者范围过宽；家族史单独不足以定义高危；慢性咳嗽需按症状就诊而非筛查。","trap":"\"包年 = 每天包数 × 吸烟年数\"，20 包年可以是每天 1 包 20 年，也可以是每天 2 包 10 年。"},{"id":"w125","day":"2026-10-22","k":"内科·呼吸","q":"发现孤立的 6 mm 实性肺结节，下一步最恰当的处理是","o":["按指南定期 CT 随访","立即手术切除","立即经皮穿刺活检","立即放疗","无需随访"],"a":0,"plain":"小结节不等于癌，先别急着动刀——按大小和风险定期复查 CT，看它长不长。","why":"对于直径 ≤6 mm 的实性结节，恶性概率低，推荐按风险分层定期低剂量 CT 随访（如 12 个月后复查）；直径 6—8 mm 可 6—12 个月复查；>8 mm 或短期增大者才考虑 PET-CT、活检或手术。","others":"立即手术、穿刺、放疗都属过度治疗；完全不随访会漏掉早期肺癌。","trap":"结节处理的核心是\"大小 + 变化\"：看它长不长，比看它长什么样更可靠。"}],"WEEKKEY":{"2026-10-21":["肺炎链球菌：铁锈色痰、大叶性实变、首选青霉素 G。","大叶性肺炎病理四期：充血水肿→红色肝样变→灰色肝样变→溶解消散。","大咯血先保气道，取患侧卧位，防止血液流入健侧。"],"2026-10-22":["COPD：诊断看 FEV₁/FVC\u003c70%，分级看 FEV₁ 占预计值百分比。","哮喘用药：缓解药 SABA，控制药吸入激素，两条线别混。","副肿瘤综合征：小细胞癌→低钠/库欣；鳞癌→高钙。"],"2026-10-23":["肺栓塞：确诊靠 CTPA；只有休克/低血压才溶栓。","Light 标准三条比值：0.5、0.6、2/3，满足一条即渗出液。","ARDS：PaO₂/FiO₂ ≤300，非心源性肺水肿，PEEP≥5。"],"2026-10-24":["左心衰最早是劳力性呼吸困难；右心衰最敏感是颈静脉怒张。","房颤三大特征：P 波消失、f 波、RR 间期绝对不齐。","室颤用非同步除颤；有可辨认 QRS 才用同步复律。"],"2026-10-25":["高血压分级：1 级 140-159/90-99，2 级 160-179/100-109，3 级 ≥180/110。","心衰金三角：ACEI/ARB + β 阻滞剂 + 醛固酮受体拮抗剂。","心梗 24 小时内不用洋地黄；下壁/右室梗死不用硝酸酯。"]},"WEEKCASE":{"2026-10-21":{"id":"c-pneumonia","dept":"呼吸·肺炎","stem":"男，32 岁。受凉后高热、寒战、右侧胸痛 2 天，咳铁锈色痰。T 39.5℃，右下肺叩诊浊音、语颤增强、可闻及支气管呼吸音。WBC 18×10⁹/L，中性粒细胞 90%。","dx":{"answer":"肺炎链球菌肺炎（大叶性肺炎）","why":["受凉后急性起病 + 高热寒战 + 胸痛：细菌性肺炎的典型起病方式。","铁锈色痰：肺炎链球菌的特征性表现，提示肺泡内红细胞渗出崩解。","右下肺叩浊、语颤增强、支气管呼吸音：实变体征——肺泡被渗出物填满，声音传导反而变好。","WBC 18×10⁹ + 中性 90%：细菌感染的血象。"]},"diff":[["肺结核","起病缓、低热盗汗、痰找抗酸杆菌阳性，多位于上叶尖后段"],["肺癌阻塞性肺炎","年龄大、吸烟史、同一部位反复感染，CT 见肿块"],["肺栓塞","突发呼吸困难 + 低氧 + D-二聚体升高，无高热寒战"]],"exam":[["胸部 X 线 / CT","大叶性实变影，可见支气管充气征"],["痰涂片 + 培养","革兰阳性双球菌，可指导降阶梯治疗"],["血常规 + CRP/PCT","判断细菌感染与严重程度"]],"tx":[["抗感染","青霉素 G 首选（敏感株）；过敏者用头孢曲松或呼吸喹诺酮"],["对症","退热、补液、化痰，注意监测氧合"],["疗程","热退后 3—5 天停药，总疗程 5—7 天；重症或并发症延长"]]},"2026-10-22":{"id":"c-asthma","dept":"呼吸·哮喘","stem":"女，24 岁。接触花粉后突发喘息、胸闷 3 小时，不能平卧。既往\"过敏性鼻炎\"。查体：呼吸 32 次/分，双肺满布哮鸣音，呼气相延长，说话不成句，SpO₂ 90%。","dx":{"answer":"支气管哮喘急性重度发作","why":["接触过敏原后突发喘息：哮喘的典型诱因与起病方式。","双肺满布哮鸣音 + 呼气相延长：气道广泛痉挛，呼气阻力升高更明显。","说话不成句、呼吸 32 次/分、SpO₂ 90%：三条都是重度发作的指标。","过敏性鼻炎史：特应性体质，支持哮喘诊断。"]},"diff":[["急性左心衰","端坐呼吸、粉红泡沫痰、双肺底湿啰音、BNP 明显升高"],["气道异物","突发呛咳、单侧哮鸣音，呼气相可不延长"],["COPD 急性加重","年龄大、长期吸烟、桶状胸、活动后气促为主"]],"exam":[["动脉血气","判断低氧与 CO₂ 潴留，重度可正常甚至升高"],["峰流速（PEF）","客观评估气流受限程度与治疗反应"],["胸片","排除气胸、肺炎等并发症"]],"tx":[["氧疗","目标 SpO₂ 93%—95%，避免过度给氧"],["支气管扩张剂","SABA 雾化 + 异丙托溴铵，必要时连续雾化"],["糖皮质激素","全身用药（口服或静脉），越早越好"],["升级处理","硫酸镁静脉、无创通气；仍恶化则气管插管"],["禁用","镇静剂、非选择性 β 受体阻滞剂"]]},"2026-10-23":{"id":"c-pe","dept":"呼吸·
