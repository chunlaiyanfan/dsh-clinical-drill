抢同一个位点，底物多了就能把抑制剂挤走——所以 Vmax 不变，Km 变大。","x163":"糖酵解是「无氧时快速来点 ATP」：1 个葡萄糖净赚 2 个 ATP，产能少但来得快。","x164":"糖异生是「自己造糖」：四把钥匙（丙酮酸羧化酶、PEPCK、果糖二磷酸酶-1、葡萄糖-6-磷酸酶）逆着糖酵解走。","x165":"糖原分解靠「磷酸化酶」把糖原一个个切下来；糖原合成靠「糖原合酶」一个个接上去。","x166":"长链脂肪酸要进线粒体「烧」，得坐「肉碱」这趟摆渡车——没有肉碱，脂肪酸就进不去、烧不了。","x167":"胆固醇合成的「总开关」是 HMG-CoA 还原酶——他汀类药物就是把它关小一点，胆固醇就降下来了。","x168":"转氨酶是「搬运氨基」的工人，它的工具是维生素 B6 变的「磷酸吡哆醛」。","x169":"急性肝炎「最灵敏」的指标是 ALT——它主要在肝细胞里，肝一受伤就漏出来。","x170":"人类嘌呤代谢的「终点站」是尿酸——它排不出去或产得太多，就会结晶在关节里，那就是痛风。","x171":"DNA 复制前先要「搭个脚手架」——引物酶先合成一小段 RNA 引物，DNA 聚合酶才能接着往下铺。","x172":"真核生物的 mRNA 由「RNA 聚合酶Ⅱ」负责转录——Ⅰ 管 rRNA，Ⅱ 管 mRNA，Ⅲ 管 tRNA。","x173":"真核 mRNA 的「启动开关」是 TATA 盒——它在上游 25～30 个碱基处，RNA 聚合酶Ⅱ 在这里「就位」。","x174":"遗传密码「简并」的意思是：一个氨基酸可以有多个密码子，但一个密码子只认一个氨基酸。","x175":"肽键的形成靠核糖体大亚基里的「肽酰转移酶」——严格说，是 rRNA 在催化，不是蛋白质。","x176":"PCR 三步循环：高温把 DNA「拆开」（变性）、降温让引物「贴上」（退火）、中温让酶「铺砖」（延伸）。","x177":"三种 blot 记一句话：Southern 查 DNA、Northern 查 RNA、Western 查蛋白。","x178":"维生素 B1 的「变身」是 TPP——它是丙酮酸脱氢酶和 α-酮戊二酸脱氢酶的「帮手」，缺了会得脚气病。","x179":"维生素 B2 变身 FAD/FMN——它是氧化还原反应里的「电子接力棒」。","x180":"维生素 PP（烟酸）变身 NAD⁺/NADP⁺——它是脱氢酶最常用的「电子搬运工」。","x181":"叶酸带着「一碳单位」到处跑，但它的「回收再利用」要靠维生素 B12——所以 B12 缺乏也会造成叶酸缺乏。","x182":"血红素合成的「总开关」是 ALA 合酶——铅中毒会把它关掉，血红素就造不出来。","x183":"未结合胆红素是「油性」的：不溶于水、不能从尿排出、还会钻进脑子（核黄疸）。结合胆红素才是「水性」的。","x184":"LDH1 是心肌的「专属款」——心梗时它升高，还超过 LDH2（翻转）。","x185":"CK-MB 是心肌的「专属款」——心肌梗死时它升高最特异，比总 CK 靠得住。","x186":"乳糜微粒是「脂肪快递车」：装着食物里的甘油三酯，密度最低、颗粒最大。","x187":"5-FU 是「假原料」：它冒充尿嘧啶，骗过酶，把胸苷酸合成酶「卡死」，DNA 就合成不下去。","x188":"氨在身体里「坐两趟车」：一趟是丙氨酸（肌肉→肝），一趟是谷氨酰胺（脑/肌肉→肝/肾）。","x189":"细胞水肿就是「水进多了」：细胞能量不够，钠泵罢工，钠和水留在细胞里，细胞就泡大了。最常见的原因就是缺血、缺氧、感染、中毒。","x190":"肌肉不用就会「缩水」：骨折卧床几个月，腿上的肌肉变细，这是废用性萎缩。","x191":"高血压时心脏天天「扛重物」，心肌细胞被练粗了——这是肥大，不是增生（心肌细胞不会分裂）。","x192":"干性坏疽就是「风干了的坏死」：动脉堵了、静脉还通，组织里的水被带走，变得又干又黑，界限清楚。四肢末端最常见。","x193":"湿性坏疽是「泡在污水里的坏死」：内脏与外界相通、含水多，腐败菌大量繁殖，又肿又臭、界限不清。","x194":"肉芽组织是「修理工」：抗感染、填坑、把坏死物和异物包起来，最后变成瘢痕。它不分泌激素。","x195":"一期愈合是「严丝合缝」的愈合：伤口整齐、没感染、直接对合，愈合快、疤小。","x196":"长期淤血，器官会被「泡硬」：实质细胞萎缩、间质纤维化，最后变硬——淤血性硬化。","x197":"体循环的栓子多来自「左心」：左心房/左心室的附壁血栓或主动脉斑块脱落，顺着动脉跑到脑、脾、肾。","x198":"长骨骨折时，骨髓里的脂肪滴被挤进破裂的静脉，跑到肺里——脂肪栓塞。","x199":"潜水员快速上浮，溶解在血里的氮气「冒泡」了——气体栓塞，也叫减压病。","x200":"羊水栓塞是产科最凶险的急症：羊水成分进入母体血液，引起过敏性休克、DIC 和呼吸循环衰竭。","x201":"肺和肠是「双重供血」，血管一堵，另一路血涌进坏死区——出血性（红色）梗死。","x202":"急性炎症时血管「漏水」，最主要的「开关」是组胺：它让内皮细胞一收缩，细胞之间就裂开缝。","x203":"急性炎症最先发生的是血管反应：先短暂收缩，再扩张、血流加快，然后通透性升高、液体渗出。","x204":"结核结节是「慢性肉芽肿」：上皮样细胞 + 朗汉斯巨细胞 + 淋巴细胞，是结核的标志。","x205":"金葡菌会「筑墙」：它产生血浆凝固酶，把纤维蛋白原变成纤维蛋白，把炎症「围」起来——这就是脓肿。","x206":"大叶性肺炎是「纤维素性炎」：肺泡里渗出大量纤维素，把肺「实变」了。","x207":"炭疽是「出血性炎」：血管被破坏得厉害，渗出物里全是红细胞。","x208":"结构异型性看的是「排列」：肿瘤细胞的空间排列、极性和层次乱了；细胞异型性看的是「长相」。","x209":"恶性肿瘤像「树根」：往周围组织里钻，界限不清——浸润性生长。良性肿瘤像「气球」：膨胀着长，有包膜。","x210":"胃癌细胞掉进腹腔，种到卵巢上长成瘤——Krukenberg 瘤，这是种植性转移。","x211":"慢性萎缩性胃炎伴肠上皮化生是胃癌的「前奏」——癌前病变。","x212":"交界性肿瘤是「卡在中间」的肿瘤：形态和生物学行为介于良恶性之间，容易复发但很少转移。","x213":"动脉瘤不是「肿瘤」，是动脉壁被血流「吹」出来的一个包——永久性异常扩张。","x214":"风湿性心脏病的「招牌」是 Aschoff 小体：心肌间质里的风湿小体。","x215":"亚急性感染性心内膜炎最爱「咬」二尖瓣和主动脉瓣，在瓣膜上长带细菌的赘生物，掉下来就栓塞。","x216":"病毒性肝炎时肝细胞「泡起来」——气球样变，是细胞水肿的典型表现。","x217":"门脉高压的「三件套」：脾大、侧支循环、腹水。它不会让红细胞变多。","x218":"我国食管癌以「鳞癌」为主，多长在食管中段。","x219":"O₂ 和 CO₂ 是「油性小分子」，脂溶性的东西能直接穿过细胞膜的脂质双分子层，这叫单纯扩散。","x220":"葡萄糖进红细胞要「搭车」：不耗能，但得靠转运体——这叫易化扩散。","x221":"钠泵是「烧钱」的泵：直接烧 ATP 把自己磷酸化，硬把离子逆着浓度泵出去——原发性主动转运。","x222":"阈强度是「最低门槛的刺激」，阈电位是「膜电位的临界点」——一个是刺激强度，一个是膜电位数值，别混。","x223":"局部电位是「小打小闹」：有大有小、能叠加，但不走全或无。全或无是动作电位的特点。","x224":"肌肉收缩靠横桥「抓」肌动蛋白然后摆动——就像划船，桨抓住水往后划。","x225":"白蛋白是血液里的「海绵」：分子小、数量多，吸住水分，维持血管内的胶体渗透压。","x226":"肾脏是「造血开关」：缺氧时它分泌 EPO，命令骨髓多造红细胞。肾坏了，这个开关就失灵。","x227":"血小板是「止血小分队」：堵伤口、促凝血、养血管、参与炎症。运氧气是红细胞的事。","x228":"维生素 K 是「凝血因子的加工师傅」：Ⅱ、Ⅶ、Ⅸ、Ⅹ 要它帮忙才能变成有活性的样子。","x229":"窦房结是心脏的「总指挥」：自律性最高，正常时它说了算。","x230":"房室交界是「慢速通道」：传导特别慢，故意让心房先收缩完，心室再收缩。","x231":"动脉血压靠两件事撑起来：心脏泵血给动力，外周阻力拦住血不让它跑太快。","x232":"真毛细血管是「交换站」：壁薄、血流慢、通透性大，氧气和养分在这里进出。","x233":"肺活量 = 尽力吸气后再尽力呼气，能呼出的全部气量（潮气 + 补吸气 + 补呼气）。","x234":"肺纤维化让肺变「硬」：弹性阻力大、顺应性低，吸一口气特别费劲。","x235":"CO₂ 在血里主要「变成小苏打」运输——碳酸氢盐，占七成。","x236":"呼吸的「总开关」在延髓腹外侧：它对脑脊液里的 H⁺ 最敏感，是调节呼吸最重要的化学感受器。","x237":"胃排空靠「蠕动挤」：胃一收缩，把食糜往幽门推。","x238":"促胰液素是「碱水开关」：让胰腺分泌水和碳酸氢盐，中和胃酸；缩胆囊素是「酶开关」。","x239":"体温调节的「恒温器」在下丘脑：它接收温度信号，指挥产热和散热。","x240":"肾小球滤过膜有三层筛子，最关键的「主筛」是基膜。","x241":"葡萄糖重吸收是「借钠的东风」：钠泵先把钠泵出去，钠回来时顺带把葡萄糖捎进来——继发性主动转运。","x242":"球-管平衡是「配套调节」：滤过多少，近端小管就固定回收 65%～70%，尿量不会大起大落。","x243":"神经肌接头释放递质靠钙「点火」：动作电位来了，钙内流，囊泡才吐乙酰胆碱。","x244":"牵涉痛是「疼的地方不是病的地方」：心脏缺血，疼的却是左肩和左臂内侧。","x245":"甲状腺激素是「产热激素」：它让全身细胞多烧氧、多产热，所以甲亢的人怕热多汗。","x246":"甲状旁腺激素是「升钙降磷」：把骨头里的钙动员出来、让肾留住钙、把磷排掉。","x247":"糖皮质激素是「抗压激素」：应激时大量分泌，让身体扛得住打击，但代价是升血糖、抑免疫。","x248":"精子生成靠 FSH：它作用于睾丸支持细胞，指挥精子发育；LH 管睾酮。","x249":"心衰的「四大基石」是 ACEI/ARNI、β 受体拮抗剂、醛固酮拮抗剂、SGLT2 抑制剂——它们能延命；洋地黄只让你舒服点，不延命。","x250":"急性肺水肿喘不过气，最快的是「抽水」：静脉打呋塞米，把水排出去。","x251":"房颤要「转回正常节律」，最常用的药是胺碘酮——尤其心脏本身有病的患者。","x252":"心绞痛一发作，舌下含硝酸甘油——它像「快速扩血管」，几分钟就缓解。","x253":"溶栓是「化掉血栓」，但已经出血的人不能化——活动性出血是绝对禁忌。","x254":"高血压分级记数字：1 级 140/90 起，2 级 160/100 起，3 级 180/110 起。","x255":"主动脉夹层是「血管被撕开」，疼得像刀割撕裂，从胸口往后背窜。","x256":"肺炎链球菌肺炎的痰是「铁锈色」——红细胞在肺泡里被破坏，铁锈渗出来。","x257":"肺脓肿的脓「臭」，因为里面是厌氧菌——误吸、醉酒、脑血管病后最容易发生。","x258":"支气管扩张是「咳不完的脓痰 + 反复咯血」，因为支气管被撑大成了「痰池」。","x259":"异烟肼的「脾气」是伤神经：手脚发麻——补维生素 B6 能防。","x260":"肺癌会「乱分泌激素」，引起杵状指、关节痛，甚至低钠、库欣——这叫副肿瘤综合征。","x261":"张力性气胸是「活瓣」：气只进不出，胸膜腔压力越来越高——必须马上扎针放气。","x262":"胃食管反流就是「胃酸倒流上来」，烧心、反酸是招牌。","x263":"幽门螺杆菌现在要「四联」：抑酸药 + 铋剂 + 两种抗生素，才能把它摁住。","x264":"肝硬化腹水用利尿剂讲究「一保一排」：螺内酯保钾，呋塞米排钾，比例 100:40。","x265":"肝性脑病要「通便排氨」：乳果糖让肠道变酸，氨就被「锁」在肠道排出去。","x266":"急性胰腺炎早期「三件事」：禁食、胃肠减压、补液——别急着开刀。","x267":"轻中度溃疡性结肠炎用「美沙拉嗪」这类 5-氨基水杨酸，局部抗炎。","x268":"链球菌感染后肾炎是「感染后 1～3 周」出现血尿、水肿、高血压——肾炎综合征。","x269":"原发性肾病综合征的首选是「激素」：泼尼松足量、足疗程。","x270":"无症状菌尿一般不用治，但孕妇和要做泌尿手术的人必须治——否则容易变成肾盂肾炎。","x271":"慢性肾病要「省着用肾」：低蛋白饮食，减少肾脏负担。","x272":"缺铁性贫血补铁，血红蛋白正常了还得再吃 3～6 个月——把「仓库」补满。","x273":"巨幼贫是「大细胞」贫血：叶酸或 B12 不够，DNA 合成受影响。","x274":"ITP 是「血小板被自己抗体破坏」，一线用糖皮质激素压免疫。","x275":"甲巯咪唑最危险的副作用是「粒细胞缺乏」——用药期间发烧咽痛要立刻查血。","x276":"DKA 治疗第一步是「补液」：先把血容量补回来，胰岛素随后。","x277":"骨质疏松的「主力药」是双膦酸盐：抑制破骨细胞，减慢骨丢失。","x278":"痛风降尿酸，一线是「别嘌醇/非布司他」——抑制尿酸生成。","x279":"失血性休克就是「血不够了」：血容量骤减，血压撑不住——低血容量性休克。","x280":"中心静脉压（CVP）是「右心的压力表」：看血容量够不够、右心泵得动泵不动。","x281":"高钾的「心电图招牌」是 T 波高尖——像帐篷一样尖，再重就 QRS 变宽。","x282":"代谢性酸中毒先「找病因」，别急着补碱；pH 掉到 7.2 以下才补碳酸氢钠。","x283":"营养支持记一句话：「能吃饭就吃饭，吃不够再输液」——肠内优先。","x284":"脓毒症快速筛查用 qSOFA：呼吸快、意识乱、血压低，三项里占两项就要警惕。","x285":"破伤风预防分两种：类毒素是「打疫苗」（主动），抗毒素是「紧急中和」（被动）。","x286":"疖是「一个毛囊」发炎，痈是「一片毛囊」一起发炎——痈大、重、容易扩散。","x287":"急性乳腺炎是「哺乳期 + 金葡菌」：乳汁淤积 + 乳头皲裂，细菌就进去了。","x288":"甲状腺癌最常见的是「乳头状癌」——它长得慢、预后好，被称为「懒癌」。","x289":"甲状腺危象是「激素风暴」：PTU 挡合成、碘剂挡释放、β 阻滞剂压心率、激素兜底——不手术。","x290":"乳腺癌要不要「内分泌治疗」，看 ER/PR：阳性才有效。","x291":"BillrothⅠ式是「胃接十二指肠」，Ⅱ式是「胃接空肠」——记罗马数字对应吻合口。","x292":"胃癌根治不是「切掉就行」：要切够边（≥5 cm）+ 清扫淋巴结（D2）。","x293":"成人肠梗阻最常见的原因是「术后粘连」——以前开过刀的人要警惕。","x294":"右半结肠「腔大粪稀」，所以长瘤子不容易堵，表现为贫血、包块；左半结肠「腔窄粪干」，容易梗阻。","x295":"肛裂的痛是「周期性」的：排便时刀割样痛，便后缓解，过一会又剧痛——还带一点血。","x296":"内痔「不疼但会出血」：无痛性便血 + 痔核脱出；疼的是外痔或嵌顿。","x297":"阿米巴肝脓肿的脓是「巧克力色」——这是它最典型的标志。","x298":"急性胆囊炎的「招牌体征」是 Murphy 征：按右上腹让人深吸气，疼得不敢吸。","x299":"胆管炎「三联征」：痛、烧、黄（腹痛、寒战高热、黄疸）；再加休克和意识障碍就是五联征。","x300":"Ranson 评分看的是「病情重不重」，不是「淀粉酶高不高」——淀粉酶高低和严重程度无关。","x301":"疝嵌顿了就是「卡住了」，肠管血运可能断了——别手法硬推，急诊手术。","x302":"腹部闭合伤最容易破的实质脏器是「脾」——它脆、被膜薄，一撞就裂。","x303":"输尿管上段小结石（<1 cm）首选「体外碎石」——不用开刀。","x304":"膀胱癌的招牌是「无痛性肉眼血尿」——不疼，但尿是红的。","x305":"前列腺癌的「血液指纹」是 PSA——筛查、随访都靠它，确诊要穿刺。","x306":"骨筋膜室综合征最早、最可靠的信号是「疼得不对劲」：与伤情不符的剧痛 + 被动牵拉痛。","x307":"肩关节前脱位的「招牌」是 Dugas 征：手搭对侧肩，肘贴不到胸。","x308":"急性血源性骨髓炎是「金葡菌跑进骨头」：儿童长骨干骺端，高热 + 局部红肿热痛。","x309":"氨基酸之间靠「肽键」手拉手排成队，这个顺序就是一级结构。","x310":"蛋白质变性是「形状乱了」：空间结构被破坏，但氨基酸排的队没变——所以分子量不变，活性没了。","x311":"酶的活性中心是「工作台」：先抓住底物（结合部位），再把它变成产物（催化部位）。","x312":"酶原激活是「剪一刀、开锁」：切掉一段肽，构象一变，活性中心露出来，酶就活了。","x313":"有氧氧化是「彻底燃烧」：1 个葡萄糖烧到底，净赚 30～32 个 ATP。","x314":"糖原合成要用「活性葡萄糖」：UDPG，相当于把葡萄糖先「激活」再往糖原上接。","x315":"磷酸戊糖途径的「特产」是 NADPH（还原力）和核糖（核苷酸原料），不产 ATP。","x316":"体内氨主要来自「拆氨基酸」：氨基酸脱掉氨基，氨就出来了。","x317":"一碳单位是「碳原子的搬运工」，它的车是四氢叶酸。","x318":"甲硫氨酸循环里，真正的「甲基快递员」是 SAM——它把甲基送到 DNA、RNA、蛋白质上。","x319":"嘌呤从头合成从 PRPP 起步：先搭好「核糖骨架」，再往上拼嘌呤环。","x320":"嘧啶从头合成先造「UMP」这个核心，再变 UTP、CTP。","x321":"脱氧核苷酸是「核糖被还原成脱氧核糖」——干这活的酶是核糖核苷酸还原酶。","x322":"DNA 复制是「半保留」：每条新链都带着一条旧链——像复印时一页新一页旧装订。","x323":"着色性干皮病是「修 DNA 的工人罢工」：紫外线伤的 DNA 修不了，容易得皮肤癌。","x324":"原核转录的「刹车」是 ρ 因子：它追上 RNA 聚合酶，让转录停下来。","x325":"起始密码子是 AUG（甲硫氨酸），UAA/UAG/UGA 是终止密码子。","x326":"镰状细胞贫血是「一个字母错了」：β 珠蛋白第 6 位谷氨酸变缬氨酸，红细胞就变成镰刀形。","x327":"基因工程的「分子剪刀」是限制性内切酶——它认准特定序列，一刀切下去。","x328":"看东西靠「11-顺视黄醛」：它与视蛋白结合成视紫红质，光一照就变构、产生视觉信号。","x329":"维生素 C 是「胶原的加工师傅」：没有它，胶原羟化不了，血管变脆——坏血病。","x330":"维生素 D 要「两次激活」：肝 25-羟化、肾 1α-羟化，最后变成 1,25-(OH)₂-D₃ 才干活。","x331":"维生素 E 是「生物膜的保镖」：抗氧化，保护膜上的不饱和脂肪酸不被自由基破坏。","x332":"维生素 K 是「凝血因子的加工师傅」：Ⅱ、Ⅶ、Ⅸ、Ⅹ 要它帮忙才能干活。","x333":"呼吸链的「终点」是氧：电子一路传下去，最后交给氧，氧和氢结合成水。","x334":"ATP 合酶是「分子马达」：质子顺梯度流回来，带动它转动，把 ADP 和 Pi 变成 ATP。","x335":"2,4-二硝基苯酚是「拆桥的」：它让质子直接漏回去，氧化照常进行，但 ATP 合不成，能量全变成热。","x336":"血浆里最多的蛋白是白蛋白——它像「海绵」，维持胶体渗透压，还能运输药物和激素。","x337":"血红素拆完的「垃圾」是胆红素：先变成胆绿素，再还原成胆红素。","x338":"肝是「解毒车间」：把脂溶性的毒物「改造」成水溶性的，方便从尿或胆汁排出去。"},"EXPAND":{"x1":{"why":"运动神经末梢的轴突终末里储存着大量突触囊泡。兴奋传到末梢时 Ca²⁺ 内流，触发囊泡与前膜融合，把乙酰胆碱（ACh）释放进接头间隙；ACh 与终板膜上的 N₂ 型胆碱受体结合，使终板膜对 Na⁺ 通透性增大，产生终板电位，进而引发肌细胞动作电位。所以这里的递质是 ACh。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「骨骼肌神经肌肉接头是运动神经末梢与其所支配的骨骼肌细胞之间的特化结构」）","others":"去甲肾上腺素是大多数交感神经节后纤维释放的；多巴胺主要在中枢参与运动与奖赏调节；5-羟色胺与情绪、睡眠有关；GABA 是中枢最主要的抑制性递质。它们都不在神经-肌接头工作。","trap":"背这一条就够：躯体运动神经→ACh→N₂ 受体。箭毒阻断 N₂ 受体使肌肉松弛；琥珀胆碱也作用于 N₂ 受体，但产生持久去极化，所以叫去极化型肌松药。"},"x2":{"why":"心室开始收缩时，房室瓣已经关闭、主动脉瓣还没打开，心室成为一个封闭腔。心肌强烈收缩但容积不变，压力急剧上升，这一期就是等容收缩期，室内压上升速率最快。（教材依据：《生理学》第10版 第四章 血液循环：「等容收缩期：持续约0.05秒。心室开始收缩后，心室内的压力立即升高，当室内压升高到超过房内压时，即推动房室瓣使之关闭」）","others":"快速射血期压力已达峰值后开始回落；减慢射血期室内压已低于主动脉压，靠血流惯性射血；等容舒张期压力下降最快；快速充盈期是心室舒张、血液涌入，压力最低。","trap":"瓣膜\"全关\"的只有两期：等容收缩期（压力升）和等容舒张期（压力降）。题目问\"上升最快\"选前者，\"下降最快\"选后者。"},"x3":{"why":"正常成人两肾每分钟生成的原尿约 125 ml，这就是肾小球滤过率。一天算下来约 180 L，但 99% 被肾小管重吸收，最终尿量只有 1.5 L 左右。这个数字是评价肾功能的标尺，很多题都以它为基数做换算。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「肾小球滤过是指血液流经肾小球毛细血管时，除蛋白质外，血浆中其余成分均能被滤过进入肾小囊腔内生成超滤液」）","others":"25、50、75 都远低于正常；200 超过正常上限。肾血浆流量约 660 ml/min，滤过分数 = 125/660 ≈ 19%，这是另一组常考数字。","trap":"四个数一起记：GFR 125 ml/min、肾血浆流量 660 ml/min、滤过分数 19%、每天原尿 180 L。"},"x4":{"why":"突触前抑制作用在\"突触前末梢\"上：一个轴突末梢与另一个轴突末梢形成轴-轴突触，使它发生部分去极化，于是到达的动作电位幅度变小，Ca²⁺ 内流减少，释放的递质变少，下一个神经元产生的 EPSP 也就变小。核心是\"作用在突触前、结果是递质少了\"。（教材依据：《生理学》第10版 第十章 神经系统的功能：「GABA_A 受体作为Cl⁻通道……而在前述突触前抑制中，GABA作用于末梢A上的GABA_A受体时却引起去极化」）","others":"突触后膜超极化产生 IPSP，属于突触后抑制；突触后膜去极化是 EPSP，属于兴奋；递质被酶降解、受体下调都不是突触前抑制的机制。","trap":"抑制=递质少，兴奋=递质多。突触前抑制不产生 IPSP，这是最容易绕进去的地方。"},"x5":{"why":"糖酵解有三个关键酶：己糖激酶、磷酸果糖激酶-1、丙酮酸激酶。其中 PFK-1 催化果糖-6-磷酸转变为果糖-1,6-二磷酸，是整条通路最关键的限速步骤：ATP 和柠檬酸抑制它，AMP 和果糖-2,6-二磷酸激活它。细胞的能量状态就是通过它来开关糖酵解的。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢：「己糖激酶……是糖酵解的第一个关键酶」）","others":"己糖激酶也是关键酶，但主要起\"把葡萄糖捕获在细胞内\"的作用；丙酮酸激酶是最后一个关键酶；醛缩酶和乳酸脱氢酶都不限速。","trap":"问\"最重要的限速酶\"一律答 PFK-1；问\"关键酶有几个\"答三个。"},"x6":{"why":"三羧酸循环里只有一步是底物水平磷酸化：琥珀酰 CoA 在琥珀酰 CoA 合成酶催化下变成琥珀酸，同时把高能磷酸基团转给 GDP 生成 GTP。GTP 与 ATP 可互相转化，能量上等同。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢（三羧酸循环·琥珀酰CoA 的底物水平磷酸化））","others":"柠檬酸→异柠檬酸是异构化；异柠檬酸→α-酮戊二酸、α-酮戊二酸→琥珀酰 CoA 都是氧化脱羧并生成 NADH；苹果酸→草酰乙酸是脱氢生成 NADH。","trap":"TCA 里\"唯一直接产高能磷酸键\"的一步就是琥珀酰 CoA→琥珀酸，其余能量先存进 NADH/FADH₂。"},"x7":{"why":"尿素在肝细胞的鸟氨酸循环中合成。第一步是氨与 CO₂ 结合生成氨甲酰磷酸，由氨甲酰磷酸合成酶Ⅰ催化，这是限速步骤，需要 N-乙酰谷氨酸变构激活。肝是唯一能完成整套循环的器官。（教材依据：《生物化学与分子生物学》第10版 第九章 氨基酸代谢：「肝中合成尿素的鸟氨酸循环学说」）","others":"CPS-Ⅱ 位于胞质，参与嘧啶核苷酸合成，与尿素无关；谷氨酰胺酶、转氨酶、谷氨酸脱氢酶只是氨代谢的中间环节，不是尿素合成的限速酶。","trap":"CPS-Ⅰ 在线粒体、管尿素；CPS-Ⅱ 在胞质、管嘧啶。一字之差，考点全变。"},"x8":{"why":"肝细胞有生成酮体的酶，却缺少利用酮体必需的琥珀酰 CoA 转硫酶，所以只能\"造\"不能\"用\"。酮体随血液运到肝外组织（心、肾、脑、骨骼肌），在那里重新转变为乙酰 CoA 进入三羧酸循环供能。长期饥饿时脑组织也改用酮体。（教材依据：《生物化学与分子生物学》第10版 第八章 脂质代谢：「酮体在肝生成……在肝线粒体由酮体合成酶系催化完成」）","others":"\"肝、肝\"错在肝不能利用酮体；\"肝外、肝\"方向正好反了；肾和肌肉都不是主要生成部位。","trap":"肝生酮、肝外用酮。酮体三种：乙酰乙酸、β-羟丁酸、丙酮；丙酮经肺排出，所以酮症者有烂苹果味。"},"x9":{"why":"缺氧、感染、中毒时线粒体氧化磷酸化受损，ATP 生成减少，细胞膜上的 Na⁺-K⁺-ATP 酶（钠泵）运转失灵，细胞内 Na⁺ 排不出去，水随之进入细胞，形成细胞水肿。这是可逆性损伤最早、最常见的形态改变，肉眼见器官肿胀、包膜紧张。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「缺血、缺氧是细胞损伤最常见的原因……去除病因后，细胞水肿、脂肪变等损伤大多数可恢复正常，因此是非致死性、可逆性损伤」）","others":"蛋白质分解、脂肪堆积、溶酶体破裂、细胞骨架断裂分别是其他类型损伤的机制，不能解释\"水肿\"。","trap":"细胞水肿 = 钠泵坏 = ATP 少。看到\"最早的可逆性损伤\"就选它。"},"x10":{"why":"肉芽组织由三样东西构成：新生毛细血管（垂直长入创面）、增生的成纤维细胞、炎细胞（以巨噬细胞为主）。它没有神经末梢，所以创伤早期伤口并不痛；后期血管减少、胶原增多，机化成瘢痕。（教材依据：《病理学》第10版 第二章 损伤的修复：「镜下可见大量由内皮细胞增生形成的实性细胞索及扩张的毛细血管……在此种毛细血管的周围有许多新生的成纤维细胞」）","others":"胶原纤维和成纤维细胞是瘢痕组织的成分；上皮样细胞和朗汉斯巨细胞是结核结节的特征；淋巴细胞和浆细胞是慢性炎症浸润。","trap":"三件套\"血管、纤维、炎细胞\"，没有神经。题干里出现\"无神经\"往往就在考肉芽组织。"},"x11":{"why":"血栓形成的三大条件（Virchow 三要素）是：心血管内膜损伤、血流状态改变、血液凝固性增高。其中内膜损伤最重要也最常见：内皮破损后暴露内皮下胶原，血小板立即黏附聚集，同时启动内外源性凝血，血栓就此生根。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「虽然心血管内膜损伤是血栓形成的最重要和最常见的原因，但在不同的状态下，血流缓慢及血液凝固性的增高也可能是重要的因素」）","others":"血流缓慢和涡流是条件之一，但重要性次之；黏稠度增高、血小板增多属于血液性质改变，是第三要素的分支。","trap":"问\"最重要\"→内膜损伤；问\"三大条件\"→三个都要答全，别只写一个。"},"x12":{"why":"出血性梗死发生在组织疏松、有双重血供的器官，最典型是肺和肠。肺同时接受肺动脉和支气管动脉供血，梗死时支气管动脉的血仍会灌进坏死区，血液渗入疏松组织，形成暗红色的出血性梗死。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「梗死为出血性梗死，如肺淤血。严重淤血是肺梗死形成的重要先决条件」）","others":"心、肾、脾组织致密、侧支循环少，梗死时血液进不去，形成苍白贫血性梗死；肝虽双重供血但极少发生梗死。","trap":"疏松 + 双重血供 = 出血性（肺、肠）；致密 + 终末动脉 = 贫血性（心、肾、脾）。"},"x13":{"why":"COPD 的本质是持续存在的气流受限。判断\"持续\"要靠肺功能：吸入支气管扩张剂后 FEV₁/FVC 仍 <70%，说明气流受限不能完全逆转，这是诊断的必备条件。之后按 FEV₁ 占预计值百分比分 1—4 级，那是分级不是诊断。（教材依据：《内科学》第10版 第二篇 第三章 慢性阻塞性肺疾病：「慢性阻塞性肺疾病（COPD）简称慢阻肺病，是一种异质性的肺部疾病」）","others":"胸片见肺气肿只是形态学提示；PaO₂<60 是呼衰标准；残气量增加和弥散下降可见于 COPD，但都不具诊断特异性。","trap":"诊断看比值（<70%），分级看百分比（FEV₁%pred）。两件事别混。"},"x14":{"why":"哮喘用药分两类。缓解药（SABA，如沙丁胺醇）几分钟起效，用于急性发作；控制药（吸入糖皮质激素）要长期规律吸入才能抑制气道炎症，是长期治疗的首选。题目问\"长期控制\"就选 ICS。（教材依据：《内科学》第10版 第二篇 第四章 支气管哮喘：「哮喘治疗药物分为控制性药物和缓解性药物……后者指按需使用的药物，通过迅速解除支气管痉挛从而缓解哮喘症状」）","others":"口服茶碱起效慢、治疗窗窄；白三烯受体拮抗剂和色甘酸钠都是辅助用药，不能替代 ICS。","trap":"急救=沙丁胺醇；长期控制=吸入激素。看到\"首选控制药\"直接选 ICS。"},"x15":{"why":"心梗后各标志物升高的时间不同。肌红蛋白分子小，2 小时就从坏死心肌释放入血，是最早升高的；但骨骼肌损伤、肾衰时它也会高，特异性差。cTnI/cTnT 3—4 小时升高、持续 7—14 天，特异性最好，是确诊首选。（教材依据：《内科学》第10版 第三篇 第四章 冠心病：「cTnI或cTnT起病3～4小时后升高……CK-MB起病后4小时内增高」）","others":"CK-MB 约 4 小时升高、2—3 天恢复，适合判断有无再梗死；LDH 和 AST 升高更晚、特异性更差，现已少用。","trap":"问\"最早\"选肌红蛋白，问\"最特异/确诊\"选肌钙蛋白，问\"判断再梗死\"选 CK-MB。"},"x16":{"why":"糖尿病合并高血压时，降压药不只是降压，还要保护肾。ACEI/ARB 扩张肾小球出球小动脉、降低肾小球内压，能减少尿蛋白、延缓肾病进展，是这类患者的首选。用药后要监测血钾和肌酐。（教材依据：《内科学》第10版 第三篇 高血压（合并糖尿病者首选 ACEI/ARB 或 CCB））","others":"噻嗪类大剂量会影响糖脂代谢；β 受体阻滞剂可能掩盖低血糖症状；α 受体阻滞剂和中枢性降压药都不是一线选择。","trap":"糖尿病 + 高血压/蛋白尿 → ACEI 或 ARB。双侧肾动脉狭窄、妊娠禁用。"},"x17":{"why":"消化性溃疡的两大病因是幽门螺杆菌感染和 NSAIDs。Hp 通过产生尿素酶、破坏黏液屏障、诱导炎症反应损伤黏膜，是十二指肠溃疡和胃溃疡最主要的病因；根除 Hp 后溃疡复发率从 60%—70% 降到 5% 以下，这是最有力的证据。（教材依据：《内科学》第10版 第四篇 第五章 消化性溃疡：「消化性溃疡指胃、十二指肠黏膜发生的炎性缺损，与胃液的胃蛋白酶消化和胃酸作用有关」）","others":"胃酸是\"没有酸就没有溃疡\"的必要条件，但单纯胃酸高不等于溃疡；NSAIDs 排第二位；吸烟和应激是加重因素而非主因。","trap":"问\"最主要病因\"答 Hp；问\"必要条件\"答胃酸。"},"x18":{"why":"肝硬化门脉高压最凶险的并发症是食管胃底静脉曲张破裂出血，它也是最常见的并发症。而肝性脑病是最常见的死亡原因。两个\"最\"的主语不同，是经典易混点。（教材依据：《内科学》第10版 第四篇 第十五章 肝硬化：「持续门静脉高压，促进肝内外血管增殖」）","others":"自发性细菌性腹膜炎、肝肾综合征、原发性肝癌都是并发症，但发生率和\"最常见\"的定位不同。","trap":"最常见并发症=上消化道出血；最常见死因=肝性脑病。"},"x19":{"why":"肾病综合征的四条标准是：①大量蛋白尿 >3.5 g/d；②低白蛋白血症 <30 g/L；③水肿；④高脂血症。其中①②是诊断必备，③④是\"常有\"。血尿不在其中，出现明显血尿反而提示肾炎综合征或狼疮等。（教材依据：《内科学》第10版 第五篇 第五节 肾病综合征：「以大量蛋白尿（＞3.5g/d）、低白蛋白血症（血清白蛋白＜30g/L）、水肿、高脂血症为基本特征的临床综合征。其中前两项为诊断的必备条件」）","others":"前四项都是标准，只有血尿不是；把血尿当成第五条，是初学者最常见的误会。","trap":"三高一低（大量蛋白尿、水肿、高脂血症、低白蛋白血症），没有血尿。"},"x20":{"why":"甲亢的病因里 Graves 病占 80%—85%，是自身免疫病：TRAb 刺激 TSH 受体，使甲状腺激素合成和分泌增多，同时引起弥漫性甲状腺肿和突眼。所以一提到甲亢，先想 Graves。（教材依据：《内科学》第10版 第七篇 第五章 甲状腺疾病：「甲状腺功能亢进症（hyperthyroidism，简称甲亢）是指甲状腺本身产生甲状腺激素过多而引起的甲状腺毒症」）","others":"毒性多结节性甲状腺肿多见于老年人、有结节；亚急性甲状腺炎是破坏性甲状腺毒症，摄碘率低；TSH 瘤和碘甲亢都少见。","trap":"弥漫性肿 + 血管杂音 + TRAb 阳性 = Graves。"},"x21":{"why":"糖尿病的诊断切点有三个：空腹血糖 ≥7.0 mmol/L（空腹指至少 8 小时未进食）、OGTT 2 小时或随机血糖 ≥11.1 mmol/L、HbA1c ≥6.5%。有典型\"三多一少\"症状加一次异常即可诊断；没有症状则需另日复查确认。（教材依据：《内科学》第10版 第七篇 第八章 糖尿病：「空腹血糖（FPG）≥7.0mmol/L」）","others":"6.1—7.0 是空腹血糖受损，属于糖尿病前期而不是糖尿病；7.8 是 OGTT 2 小时糖耐量受损的切点；11.1 是餐后或随机标准；13.9 是 DKA 治疗中改用含糖液的阈值。","trap":"空腹 7.0、餐后 11.1、糖化 6.5；中间地带 6.1—7.0 和 7.8—11.1 都是\"前期\"。"},"x22":{"why":"铁蛋白反映体内储存铁，缺铁早期它就下降，是最敏感也最可靠的指标（<12—15 μg/L 可诊断缺铁）。骨髓铁染色是金标准，但有创、一般不作为首选检查。（教材依据：《内科学》第10版 第六篇 缺铁性贫血：「血清可溶性转铁蛋白受体（sTfR）测定是迄今反映缺铁性红细胞生成的最佳指标」）","others":"血清铁受日内波动和炎症影响大；总铁结合力在缺铁时升高、慢性病贫血时降低；转铁蛋白饱和度特异性不如铁蛋白；小细胞低色素只是形态学提示，不能定性。","trap":"缺铁看\"储备\"→铁蛋白；金标准→骨髓铁染色。慢性病贫血的铁蛋白是正常或升高的。"},"x23":{"why":"休克微循环变化分三期：①收缩期（代偿，微动脉和前括约肌收缩，保证心脑供血）；②扩张期（淤血，无氧代谢、乳酸堆积，血管扩张、回心血量减少）；③衰竭期（DIC，微血栓广泛形成，细胞坏死、多器官功能衰竭）。晚期就是 DIC。（教材依据：《外科学》第10版 第五章 休克：「微循环内因前括约肌收缩而致'只出不进'，血量减少，组织仍处于低灌注、缺氧状态」）","others":"微动脉收缩、前括约肌收缩属于第一期；动静脉短路开放是代偿表现；毛细血管网缺血也是早期。","trap":"三期口诀\"收缩—扩张—DIC\"，看到\"晚期\"直接选微血栓。"},"x24":{"why":"等渗性缺水时水和钠成比例丢失，细胞外液渗透压正常，所以补等渗液最合适。平衡盐溶液（乳酸钠林格液）的电解质组成接近细胞外液，还能纠正轻度酸中毒，是首选。（教材依据：《外科学》第10版 第一篇 水、电解质代谢紊乱：「任何等渗性液体大量丢失所造成的血容量减少，短时间内均属等渗性脱水」）","others":"5% 和 10% 葡萄糖不含钠，输入后被代谢掉，等于只补水，会把细胞外液稀释成低钠血症；5% 碳酸氢钠用于纠酸；3% 氯化钠是高渗液，用于严重低钠。","trap":"等渗缺水补等渗液；只给糖水会\"越补越稀释\"。"},"x25":{"why":"急性阑尾炎的发病链条是：阑尾腔阻塞（粪石、淋巴滤泡增生、异物）→ 分泌物潴留、腔内压升高 → 压迫管壁血运 → 黏膜坏死 → 细菌侵入繁殖。所以阻塞是起点，细菌是结果而不是起点。（教材依据：《外科学》第10版 第四十章 阑尾疾病：「急性阑尾炎是外科常见病，是最多见的急腹症」）","others":"细菌直接侵入、血运障碍、胃肠功能紊乱都是继发环节或诱因；遗传因素与本病无关。","trap":"先堵后感染，不是先感染后堵。"},"x26":{"why":"癌（上皮来源）主要经淋巴道转移，乳腺癌最先转移到腋窝淋巴结，这也是腋窝淋巴结清扫和分期的基础。肉瘤（间叶来源）主要经血道转移。（教材依据：《外科学》第10版 乳腺癌：「乳腺癌手术，就应了解乳腺癌的淋巴转移途径」）","others":"血道转移在癌的晚期也会出现（肺、肝、骨）；种植转移见于腹腔脏器癌，如胃癌种植到卵巢；直接蔓延是局部行为，不属于转移。","trap":"癌走淋巴、肉瘤走血。\"橘皮样\"是淋巴管被堵，但转移途径仍然是淋巴道。"},"x27":{"why":"甲状腺术后最危急的并发症是呼吸困难和窒息，多发生在术后 48 小时内，最常见原因是切口内出血形成血肿压迫气管。处理是床旁立即拆线、清除血肿，必要时气管切开——慢一步就可能失去病人。（教材依据：《外科学》第10版 甲状腺手术并发症：「术后呼吸困难和窒息：是术后最严重的并发症，多发生在术后48小时内，如不及时发现、处理，可危及生命」）","others":"喉返神经损伤致声嘶，不立即致命；手足抽搐是甲状旁腺被误切，可静脉补钙；甲状腺危象多在术后 12—36 小时出现高热、心动过速；切口感染不会立刻窒息。","trap":"术后 24—48 小时\"喘不上气\"→先想血肿，别先想喉头水肿。"},"x28":{"why":"股骨头的血供主要来自旋股内侧动脉发出的骺外侧动脉。股骨颈骨折尤其是囊内型、移位型，会直接损伤这条血管，导致股骨头缺血坏死和不愈合。所以老年移位型股骨颈骨折常直接做关节置换，而不是内固定。（教材依据：《外科学》第10版 骨折概述：「股骨头缺血性坏死（1）股骨颈血液供给及骨折示意图（2）股骨颈骨折继发股骨头缺血性坏死」）","others":"创伤性关节炎、骨化性肌炎、坐骨神经损伤都可能出现，但发生率和后果都不如股骨头坏死；髋关节脱位是另一个诊断。","trap":"股骨颈骨折三大结局——不愈合、股骨头坏死、创伤性关节炎，最重的是坏死。"},"x29":{"why":"张力性气胸时胸腔内压持续升高，压迫腔静脉回流，几分钟内就能致命。急救原则是\"先救命后诊断\"：立即在患侧锁骨中线第 2 肋间穿刺排气，听到气体冲出、症状缓解后，再放置胸腔闭式引流。（教材依据：《外科学》第10版 胸部损伤：「张力性气胸为气管、支气管或肺损伤处形成活瓣，气体随每次吸气进入胸膜腔并积累增多，导致胸膜腔压力高于大气压」）","others":"闭式引流是确定性处理，但需要准备时间，不能替代紧急穿刺；气管插管、开胸探查、高流量吸氧都不是第一步。","trap":"张力性气胸=先扎针、后引流。位置：锁骨中线第 2 肋间。"},"x30":{"why":"人体实验和实验性治疗的伦理核心是知情同意：必须经伦理委员会批准，向受试者说明目的、方法、风险与获益，取得书面同意，且受试者有权随时退出。这是《赫尔辛基宣言》和我国法规的共同要求。（教材依据：医学伦理学（本机无对应教材，依据通用医学伦理学原则））","others":"科室主任批准、不收费、由高年资医师操作、事后说明都不能替代知情同意；事后告知在法律上更是无效的。","trap":"知情同意三要素：充分告知、自愿、有行为能力。"},"x31":{"why":"再灌注是 STEMI 的核心治疗，关键是时间。指南规定：预计首次医疗接触至 PCI 时间超过 120 分钟，且发病在 12 小时内、无溶栓禁忌，应立即溶栓，而不是继续等待。溶栓后仍要转运到有 PCI 条件的医院。（教材依据：《内科学》第10版 第三篇 第四章 冠心病：「～6小时，最多在12小时内，开通闭塞的冠脉，使得心肌得到再灌注，挽救濒临坏死的心肌或缩小心肌梗死的范围」）","others":"继续等待会牺牲更多心肌；单纯药物保守治疗死亡率明显更高；急诊搭桥用于 PCI 失败或合并机械并发症；IABP 是心源性休克的辅助装置，不是再灌注手段。","trap":"PCI 能 120 分钟内做到就等，做不到就溶。时间就是心肌。"},"x32":{"why":"哮喘的本质是慢性气道炎症，长期控制必须靠抗炎药，也就是吸入糖皮质激素。它需要规律吸入数周才见效，属于\"控制药\"。（教材依据：《内科学》第10版 第二篇 第四章 支气管哮喘：「哮喘治疗药物分为控制性药物和缓解性药物……前者指需要长期使用的药物，主要用于治疗气道慢性炎症而使哮喘维持临床控制」）","others":"沙丁胺醇是缓解药，只在发作时用；口服茶碱副作用大、现已少用；白三烯受体拮抗剂和色甘酸钠是辅助用药，不能替代 ICS。","trap":"控制药=激素（吸入）；缓解药=沙丁胺醇。"},"x33":{"why":"AOSC 是胆道梗阻 + 感染 + 脓性胆汁，形成胆道高压，细菌和毒素不断入血，很快进展为休克。所以治疗核心是解除梗阻、引流胆道（ENBD、PTCD 或手术 T 管引流），抗生素只是辅助。（教材依据：《外科学》第10版 胆道疾病：「急性梗阻性化脓性胆管炎（acute obstructive suppurative cholangitis，AOSC）是急性胆管炎的严重阶段，也称急性重症胆管炎」）","others":"单纯大剂量抗生素进不了梗阻的胆道；解痉止痛只是缓解症状；保肝、输血属于支持治疗。","trap":"Reynolds 五联征=Charcot 三联+休克+意识障碍。处理：先减压，后择期。"},"x34":{"why":"术后 24 小时内出现呼吸困难，最常见是切口内出血形成血肿压迫气管。甲状腺血供丰富、术野渗血多，加之颈部空间狭小，几十毫升血肿就足以造成窒息。处理是立即床旁拆线、清除血肿。（教材依据：《外科学》第10版 甲状腺手术并发症：「常见原因为：①出血及血肿压迫气管，多发生于术后24小时内」）","others":"喉头水肿多与插管有关、起病稍晚；气管塌陷见于巨大甲状腺肿长期压迫致气管软化；双侧喉返神经损伤少见但后果严重；痰液堵塞多见于老年、咳痰无力者。","trap":"先血肿、后水肿，两个都要想到；处理都是先保气道。"},"x35":{"why":"肾小球有效滤过压 = 肾小球毛细血管血压 −（血浆胶体渗透压 + 肾小囊内压）。血浆胶体渗透压主要由白蛋白维持，它升高就把水\"拉\"回血管，滤过减少，GFR 下降。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「肾小球有效滤过压是指促进超滤的动力与对抗超滤的阻力之间的差值」）","others":"升高、不变、先升后降都不符合公式；\"无法判断\"是放弃思考。","trap":"把公式写下来，三个因素谁升谁降一目了然。大量输注白蛋白后 GFR 可一过性下降，就是这个道理。"},"x36":{"why":"判断良恶性靠组织学，而组织学的核心是异型性——细胞核增大、核质比增高、核仁明显、核分裂象增多、出现病理性核分裂。异型性越大越偏恶性。（教材依据：《病理学》第10版 第六章 肿瘤：「肿瘤的细胞异型性……肿瘤细胞体积异常，多表现为细胞体积增大……核大、深染，核质比例增高」）","others":"大小、生长速度、有无包膜都是大体或临床特征，不能作为组织学依据；转移是恶性最可靠的证据，但属于生物学行为，不是\"组织学依据\"。","trap":"问\"组织学依据\"→异型性；问\"最可靠证据\"→转移。"},"x37":{"why":"体内氨的主要去路是在肝内通过鸟氨酸循环合成尿素，经肾排出。这是氨的\"终末处理站\"，也是肝功能的重要体现。（教材依据：《生物化学与分子生物学》第10版 第九章 氨基酸代谢：「氨的主要代谢去路是在肝合成尿素」）","others":"谷氨酰胺是氨的运输形式，也是脑和肌肉的解毒方式，但不是主要终产物；合成非必需氨基酸、生成铵盐、参与嘌呤合成都属次要途径。","trap":"氨的运输靠谷氨酰胺，氨的终解靠尿素。肝衰时血氨升高→肝性脑病。"},"x38":{"why":"2 型糖尿病无禁忌时，二甲双胍是一线首选：它减少肝糖输出、改善外周胰岛素敏感性，不增加体重，单用不引起低血糖，还有心血管获益。（教材依据：《内科学》第10版 第七篇 第八章 糖尿病：「二甲双胍是T2DM的基础用药」）","others":"磺脲类促泌、会低血糖和增重；胰岛素用于口服药控制不佳或急性并发症；α-糖苷酶抑制剂和 DPP-4 抑制剂多作为二线或联合用药。","trap":"一线=二甲双胍；eGFR<30 禁用，造影前后停用。"},"x39":{"why":"肺牵张反射的感受器位于支气管和细支气管平滑肌内，肺扩张时受牵拉而兴奋，冲动沿迷走神经传入延髓，抑制吸气神经元，使吸气转为呼气。（教材依据：《生理学》第10版 第五章 呼吸：「当肺扩张时，牵拉呼吸道使牵张感受器兴奋，冲动增加，经迷走神经传入延髓」）","others":"交感神经是传出神经；膈神经支配膈肌运动；肋间神经支配肋间肌；舌咽神经与颈动脉窦、主动脉体反射有关。","trap":"肺牵张反射=迷走神经传入。切断迷走神经后呼吸会变深变慢。"},"x40":{"why":"斜疝从腹壁下动脉外侧的腹股沟管深环（内环）突出，压迫内环后疝块不再突出；直疝从腹壁下动脉内侧的直疝三角突出，不经过内环，所以压迫内环仍会突出。这是解剖决定的，比年龄、形状、是否入阴囊都可靠。（教材依据：《外科学》第10版 腹外疝：「表35-1 斜疝和直疝的鉴别：突出途径——经腹股沟管突出，可进入阴囊 / 由直疝三角突出，很少进入阴囊」）","others":"年龄只是倾向（斜疝多见儿童青壮年，直疝多见老年）；形状和是否入阴囊都不绝对；是否易嵌顿取决于疝环大小，不能用来鉴别。","trap":"压内环——不突=斜疝，还突=直疝。"},"e1":{"why":"句子结构是 \"is intended to ___ small businesses, not to burden them\"。not to burden 给出了明确的反义对照：政策是想\"帮\"而不是\"压\"。facilitate 意为\"促进、使便利\"，正好对应\"帮\"。","others":"constrain（限制）和 undermine（削弱）与 burden 同向，逻辑自相矛盾；exaggerate（夸大）与\"小企业\"搭配不通。","trap":"看到 not to ... 先去找它的反义词，答案通常就在那个方向。"},"e2":{"why":"but collapses under close examination 是转折：听起来如何，但一细看就垮。plausible 意为\"貌似合理的\"，正好是\"听起来对、经不起推敲\"。","others":"prevalent 是\"普遍的\"，不能修饰论证的可信度；reluctant（不情愿的）修饰人；indifferent（漠不关心的）语义不通。","trap":"plausible 常与 but / however 连用，是考研里高频的\"表面成立\"词。"},"e3":{"why":"后半句 which found the opposite（发现了相反结果）直接说明结论被推翻。undermine 意为\"削弱、动摇\"，常搭配观点、结论、信心。","others":"reinforce（加强）和 sustain（维持）方向反了；facilitate（促进）不能与 conclusions 搭配。","trap":"看到 the opposite / contradict，直接锁定 undermine。"},"e4":{"why":"句子说\"在很多农村地区，清洁水的获取仍然___\"。access 指可及性，搭配 scarce（稀缺）说明供应不足、拿不到。","others":"inevitable（不可避免的）、substantial（大量的）、legitimate（合法的）都不能描述\"获取不到\"这个状态。","trap":"scarce 与 abundant 是一对；access 常与 limited、scarce 搭配。"},"e5":{"why":"be reluctant to do 是固定搭配，意为\"不情愿做某事\"。承认自己当初判断错了，人之常情就是不情愿。","others":"vulnerable 后接 to 时意为\"易受……伤害\"，语义不通；profound 修饰思想、影响；prevalent 修饰现象。","trap":"reluctant / willing / hesitant 三个词放在一起记，都跟\"意愿\"有关。"},"e6":{"why":"后半句 so the police could not determine what had happened 说明两份陈述互相冲突。contradictory 意为\"相互矛盾的\"。","others":"identical（完全相同）会让警察更容易判断，逻辑正好相反；plausible 和 substantial 都不能解释\"无法判断\"。","trap":"contradict = contra（相反）+ dict（说）。"},"e7":{"why":"三个信号叠加：Yet 转折、diminishing returns（收益递减）、can offset（抵消）。作者承认\"有一定道理\"，但明确指出超过阈值后不成立，属于\"有保留的怀疑\"。","others":"enthusiastic endorsement（热情赞同）与 Yet 矛盾；complete indifference（完全漠不关心）与整段论证矛盾；open hostility（公开敌意）程度过强，作者并未全盘否定。","trap":"态度题先找转折词，再看是\"全盘否定\"还是\"部分否定\"。qualified 就是\"有保留的\"。"},"e8":{"why":"offset 在句中作动词，\"疲劳带来的错误会___多干的那部分活\"。逻辑上只能是\"抵消\"，cancel out 最贴近。","others":"increase（增加）方向相反；postpone（推迟）不搭配；expose（暴露）语义不通。","trap":"offset 作动词=抵消/弥补；作名词=补偿、抵消物。"},"e9":{"why":"by the discovery of new evidence 说明新证据改变了原决定，reverse 意为\"推翻、逆转\"。","others":"reinforced（加强）与\"新证据推翻旧结论\"方向相反，是最典型的干扰项；postponed（推迟）和 overlooked（忽视）都不能表示\"推翻\"。","trap":"reverse a decision 是固定搭配；reinforce 常作为反义干扰出现。"},"e10":{"why":"Despite 表让步，前后必须相反：任务\"如何如何\"，她却提前完成。只有 complexity（复杂）能构成这种让步关系。","others":"simplicity（简单）会让让步失去意义；brevity（简短）不修饰 task；clarity（清晰）也不合逻辑。","trap":"Despite / Although 后面一定是\"不利条件\"，先按这个方向筛选项。"},"d0":{"why":"容易和Ⅰ型肺泡上皮细胞混：Ⅰ型只管气体交换，Ⅱ型才分泌表面活性物质，还负责增殖修复。"},"d1":{"why":"三层里最容易记错的是\"足细胞足突\"，它不是一层膜，而是裂孔膜；基膜才是主要屏障。"},"d2":{"why":"血浆和红细胞内的缓冲对要分开记；CO₂ 主要靠血红蛋白运输，所以红细胞内的 Hb/HHb 很关键。"},"d3":{"why":"\"视紫红质=弱光、视紫蓝质=强光和色觉\"，两个名字只差一个字，考场极易看串。"},"d4":{"why":"突触后抑制有两种，突触前抑制只有一种机制（递质释放减少），不要混成一类。"},"d5":{"why":"体温最低在清晨、最高在午后，和\"早上精神好\"的直觉相反，容易记反。"},"d6":{"why":"GFR 和滤过分数变化方向相反，是理解\"出球小动脉收缩\"类题目的关键。"},"d7":{"why":"Tm 与 GC 含量正相关：GC 越多氢键越多，越难解链，Tm 越高。"},"d8":{"why":"竞争性\"抢位点\"→Km 变大；非竞争性\"改构象\"→Vmax 变小。用一句话区分。"},"d9":{"why":"5′ 帽子、3′ 尾巴，方向别记反；帽子还参与翻译起始识别。"},"d10":{"why":"两个氮来源不同：一个来自氨、一个来自天冬氨酸，是生化里最爱考的数字。"},"d11":{"why":"载体是四氢叶酸不是叶酸；缺乏 THF 会导致巨幼细胞性贫血。"},"d12":{"why":"HMG-CoA 还原酶是\"合成\"的限速酶；HMG-CoA 裂解酶是\"生酮\"的，两个别混。"},"d13":{"why":"长期饥饿先消耗脂肪、生成酮体，脑适应后以酮体为主，目的是节省葡萄糖和蛋白质。"},"d14":{"why":"12—18 小时才有肉眼可见的苍白，所以\"心梗后立刻尸检看不到\"是常考陷阱。"},"d15":{"why":"化生是\"一种已分化组织变成另一种\"，不是肿瘤，也一般不叫癌前病变（除少数情况）。"},"d16":{"why":"干酪样坏死属于凝固性坏死的特殊类型，结核的标志；与液化性坏死（脑、脓肿）区分。"},"d17":{"why":"Aschoff 小体的三种成分要能说全：纤维素样坏死、Anitschkow 细胞、淋巴细胞。"},"d18":{"why":"\"心衰细胞\"是巨噬细胞吞噬含铁血黄素，不是心肌细胞，名字具有误导性。"},"d19":{"why":"中央区缺氧最重→脂肪变最明显；这解释了为什么淤血肝的脂肪变在小叶中央。"},"d20":{"why":"LTOT 的指征是\"低氧\"而不是\"气促\"；每天必须 ≥15 小时才有生存获益。"},"d21":{"why":"100:40 这个比例是为了\"保钾+排钾\"平衡，单用呋塞米容易低钾诱发肝性脑病。"},"d22":{"why":"抗凝血酶Ⅲ从尿中丢失是\"蛋白丢失\"的直接后果，解释了为什么肾病综合征容易血栓。"},"d23":{"why":"缺铁时骨髓代偿性造血，血小板可反应性升高，别误判为原发性血小板增多。"},"d24":{"why":"甲亢白细胞总数减少、淋巴比例升高，与细菌感染时的\"中性粒细胞升高\"正好相反。"},"d25":{"why":"DKA 时淀粉酶可升高，容易被误诊为胰腺炎；要结合脂肪酶和影像。"},"d26":{"why":"原发综合征的三件套是\"病灶+淋巴管炎+肺门淋巴结\"，X 线上呈哑铃状。"},"d27":{"why":"休克指数 0.5 正常、1.0 提示失血 1000 ml 左右、2.0 提示严重休克，是快速床旁评估工具。"},"d28":{"why":"九分法数字要能默写：头颈 9、双上肢 18、躯干 27、双下肢 46（含臀 5）。"},"d29":{"why":"喉上神经内支管\"感觉\"（误咽呛咳），外支管\"运动\"（声调降低），一感觉一运动。"},"d30":{"why":"Calot 三角里走的是胆囊动脉，手术时误伤会导致大出血，这是解剖与外科的交叉考点。"},"d31":{"why":"橘皮样是\"淋巴管被堵\"，不是皮肤本身被侵犯；酒窝征才是 Cooper 韧带受牵拉。"},"d32":{"why":"腰大肌试验阳性=盲肠后位；闭孔内肌试验阳性=盆腔位。两个位置试验要配对记。"},"d33":{"why":"畸形、反常活动、骨擦音是\"专有体征\"，有其一即可诊断；疼痛肿胀是普通表现。"},"d34":{"why":"开瓣音代表瓣膜\"还能动\"，是球囊扩张的有利条件；钙化僵硬时开瓣音消失。"},"d35":{"why":"Ewart 征是大量心包积液压迫左下肺所致，属于\"被忽略的体征\"，考的都是细节。"},"d36":{"why":"梨形=二尖瓣狭窄（左房右室大）；靴形=主动脉瓣关闭不全（左室大）。按\"哪个心腔大\"记。"},"d37":{"why":"血小板无细胞核，不能重新合成 COX，所以抑制是不可逆的，需等新血小板生成。"},"d38":{"why":"肝素是\"抗凝血酶\"依赖的，用鱼精蛋白中和；华法林抑制维生素 K 依赖因子，用维生素 K₁。"},"d39":{"why":"穿刺位置是锁骨中线第 2 肋间，不是第 5 肋间（那是闭式引流的常用位置）。"},"x41":{"why":"钠泵就是 Na⁺-K⁺-ATP 酶，每分解 1 分子 ATP，逆着浓度把 3 个 Na⁺ 泵出细胞、2 个 K⁺ 泵进细胞。它维持的是细胞内外钠钾的巨大浓度差——这个浓度差正是静息电位和动作电位的「电池」。3 出 2 进净移出 1 个正电荷，所以它还是生电性泵。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「离子泵的化学本质是ATP酶，可将细胞内的ATP水解为ADP，自身被磷酸化而发生构象改变」）","others":"B 把数字反了（2 出 3 进）；C 方向全反（钠进钾出）；D 是 1:1，E 是 2:2，都不对。钠泵的比例是写死的 3:2，不是任意的。","trap":"口诀「三钠出、二钾进、一票 ATP」。考题爱在数字和方向上做文章。"},"x42":{"why":"安静时膜上主要是 K⁺ 通道开放，通透性最高。K⁺ 顺着浓度差外流，把正电荷带走，膜内变负；同时有少量 Na⁺ 漏进来。两个力拉扯的结果，静息电位停在 -70 mV 左右，接近 K⁺ 平衡电位，比它略高一点（因为 Na⁺ 漏入）。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「测得的静息电位值与计算所得的E_K非常接近，而与E_Na相差较远」）","others":"Na⁺ 平衡电位约 +60 mV，那是兴奋时的方向；Cl⁻ 是跟着电位被动分布的，不主导；Ca²⁺ 跟静息电位关系很小；E 是把两个概念混在一起了。","trap":"记住八个字：「安静钾、兴奋钠」。静息电位≈E_K，动作电位超射≈E_Na。"},"x43":{"why":"阈刺激让电压门控 Na⁺ 通道大量开放，Na⁺ 顺着电化学梯度内流，膜内电位从 -70 mV 一路升到 +30 mV 左右（超射），接近 Na⁺ 平衡电位。随后 Na⁺ 通道失活、K⁺ 通道开放，K⁺ 外流把电位拉回去（复极相）。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「去极化到一定程度，膜电位甚至会变为内正外负的极性倒转状态，称为反极化」）","others":"K⁺ 外流是复极相，不是去极；Cl⁻ 内流主要产生抑制性突触后电位；Ca²⁺ 内流是心肌平台期和骨骼肌兴奋-收缩耦联的环节；钠泵负责事后恢复离子分布，是「善后」不是「冲锋」。","trap":"「去极钠进、复极钾出」——这八个字能解一大半电生理题。"},"x44":{"why":"动作电位沿横管（T 管）传到三联管，触发肌浆网释放 Ca²⁺。Ca²⁺ 与肌钙蛋白 C 结合，把原肌凝蛋白拉开，暴露出肌动蛋白上的结合位点，横桥才能抓住肌动蛋白并摆动，肌肉收缩。舒张时 Ca²⁺ 被泵回肌浆网，横桥松开。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「TnC上有Ca²⁺结合位点」）","others":"Na⁺ 负责产生动作电位（敲门）；K⁺ 负责复极；Cl⁻ 主要产生抑制；Mg²⁺ 参与 ATP 相关反应，但不直接触发收缩。","trap":"收缩三件套：电（T 管）→ 钙（肌浆网）→ 横桥。缺钙就是「敲了门没人开」。"},"x45":{"why":"红细胞表面带负电，互相排斥，所以悬浮稳定、下沉慢。当血浆里纤维蛋白原、球蛋白等增多（炎症、结核、风湿、肿瘤），红细胞被「黏」成一串串缗钱状，下沉就快了。所以血沉是反映炎症活动的老指标。（教材依据：《生理学》第10版 第三章 血液：「红细胞的这一特性称为悬浮稳定性……通常以红细胞在第一小时末下沉的距离来表示红细胞的沉降速度，称为红细胞沉降率」）","others":"红细胞比容是红细胞占血体积的比例；血红蛋白是携氧的；平均红细胞体积（MCV）看贫血类型；网织红细胞反映骨髓造血。它们都不反映悬浮稳定性。","trap":"血沉快 = 炎症活跃。临床上用它随访结核、风湿热、多发性骨髓瘤的病情。"},"x46":{"why":"晶体渗透压由 Na⁺、Cl⁻ 等小分子晶体物质形成，占血浆总渗透压的绝大部分，决定细胞内外水的平衡——细胞膜对水通透、对钠不通透。胶体渗透压只占很小一部分，但决定血管内外水的交换，主要由白蛋白形成。（教材依据：《生理学》第10版 第三章 血液：「细胞外液中的大部分晶体物质不易通过细胞膜，当其浓度发生变化时，可引起细胞外液晶体渗透压及总渗透压的变化」）","others":"白蛋白是胶体渗透压的主角；球蛋白跟免疫有关；葡萄糖、尿素虽也是晶体物质，但浓度低，贡献很小。","trap":"「晶体管细胞，胶体管血管」——低蛋白水肿是胶体渗透压降低，不是晶体。"},"x47":{"why":"平台期（2 期）时 L 型 Ca²⁺ 通道开放、Ca²⁺ 缓慢内流，同时 K⁺ 外流（I_K、I_K1）也在进行，两者幅度相当、相互抵消，膜电位维持在 0 mV 附近。这个「拉锯」让心室肌动作电位特别长，有效不应期也长，所以心肌不会发生强直收缩——这是心脏能一直跳的保障。（教材依据：《生理学》第10版 第四章 血液循环：「心室肌细胞动作电位由五个时期组成：0期（快速去极化期）、1期（快速复极化初期）、2期（平台期）、3期（快速复极化末期）以及4期」）","others":"Na⁺ 内流是 0 期去极；Ca²⁺ 外流发生在舒张期；钠泵在恢复期工作；Cl⁻ 不参与平台期。","trap":"「平台期 = 钙进钾出」。它带来的两个结果：心肌不应期长、不会强直收缩。"},"x48":{"why":"窦房结 P 细胞 4 期自动去极化，主要靠 If（funny current）进行性增强。If 是一种超极化激活的 Na⁺ 内流，安静时慢慢把膜电位往上抬，到 -40 mV 左右触发 T 型 Ca²⁺ 通道，形成动作电位。I_K 衰减、T 型钙通道也参与，但 If 是「主发动机」。（教材依据：《生理学》第10版 第四章 血液循环：「凡能影响4期上述三种电流的因素都可影响到窦房结P细胞的4期自动去极化速率」）","others":"I_K 衰减是辅助；T 型钙通道负责后半段；背景钠电流不是主因；钠泵抑制不参与自动节律。","trap":"三个起搏点记离子：窦房结=If（钠），房室交界=Ca²⁺，浦肯野=Na⁺。"},"x49":{"why":"心率加快时，收缩期和舒张期都缩短，但舒张期缩短得更明显。舒张期是心室充盈和冠脉灌注的时间，所以心率过快时充盈不足、冠脉供血减少，心输出量反而下降。这也是为什么心动过速会「越跳越没劲」。（教材依据：《生理学》第10版 第四章 血液循环：「心动周期长短与心率成反变关系」）","others":"心房收缩期本来就短；收缩期也缩短但幅度小；等容收缩期、快速射血期都属于收缩期，不是缩短最明显的部分。","trap":"「心率快，先缩舒张期」——运动员心率慢，舒张期长，充盈好，所以每搏量大。"},"x50":{"why":"心输出量（CO）= 每搏输出量（SV）× 心率（HR）。健康成人安静时 SV 约 70 ml、HR 约 70 次/分，CO ≈ 5 L/min。运动时两者都增加，CO 可升到 25 L/min 以上。（教材依据：《生理学》第10版 第四章 血液循环：「心输出量等于心率与搏出量的乘积」）","others":"B 是除法；C 每分通气量是呼吸的指标；D 射血分数是比例不是容量；E 舒张末期容积是前负荷，不是输出量。","trap":"CO = SV × HR。心衰时可能靠加快心率代偿，但心率太快反而降低 CO。"},"x51":{"why":"射血分数（EF）= 搏出量 ÷ 心室舒张末期容积，正常 55%～65%。它比单纯看搏出量更能反映心脏泵血效率，因为把「装了多少」也考虑进去了。EF 低于 40% 提示射血分数降低的心衰（HFrEF）。（教材依据：《生理学》第10版 第四章 血液循环：「健康成年人的射血分数为55%～65%」）","others":"35%～45% 已经偏低；45%～55% 处于正常下限；65% 以上偏高；75% 以上更不可能。","trap":"EF 记住「一半多一点」，<40% 就是 HFrEF，这是心衰分型的门槛。"},"x52":{"why":"颈动脉窦和主动脉弓都有压力感受器，参与减压反射（压力感受性反射）。血压升高时感受器被牵张，传入冲动增加，反射性抑制交感、兴奋迷走，心率减慢、血管舒张、血压回落。其中颈动脉窦敏感性更高，是短时血压调节的主角。（教材依据：《生理学》第10版 第四章 血液循环：「颈动脉窦和主动脉弓压力感受性反射……当动脉血压突然升高时，可反射性引起心率减慢、心输出量减少、血管舒张」）","others":"主动脉弓也参与但次要；心肺感受器管容量和心房牵张；肾小球旁器管肾素释放（长期调节）；化学感受器管缺氧和酸碱。","trap":"「颈动脉窦 = 血压刹车」。按摩颈动脉窦能降压，就是这个道理。"},"x53":{"why":"Ⅱ 型肺泡上皮细胞分泌肺泡表面活性物质，主要成分是二棕榈酰卵磷脂（DPPC）。它降低肺泡内表面的液体表面张力：张力小了，回缩力就小，肺泡容易扩张；大小肺泡的张力趋于平衡，小肺泡不会被大肺泡「吸空」。新生儿缺乏它 → 新生儿呼吸窘迫综合征。（教材依据：《生理学》第10版 第五章 呼吸：「肺泡内液-气界面存在肺表面活性物质……降低肺泡表面张力」）","others":"A 正好说反；C 它不是促进扩散；D 不收缩支气管；E 表述混乱，表面活性物质是增加顺应性（不是增加弹性阻力）。","trap":"表面活性物质 = 防塌陷。缺了 → 肺不张 / 新生儿 RDS / ARDS。"},"x54":{"why":"肺泡通气量 =（潮气量 - 无效腔气量）× 呼吸频率。无效腔约 150 ml，是留在气道里不参与换气的部分。所以同样每分钟通气量，浅快呼吸（潮气量小、死腔占比大）的肺泡通气量远低于深慢呼吸。（教材依据：《生理学》第10版 第五章 呼吸：「每次吸入的气体，有一部分留在鼻或口至终末细支气管之间的呼吸道内，不参与肺泡与血液之间的气体交换，这部分传导性呼吸道的容积称为解剖无效腔」）","others":"A 是每分通气量，把死腔也算进去了；C、D、E 公式都不对。","trap":"「浅快不如深慢」——死腔是固定成本，潮气量越小越吃亏。"},"x55":{"why":"通气/血流比值（VA/Q）正常约 0.84。比值增大 = 气多血少 = 无效腔增大（如肺栓塞）；比值减小 = 血多气少 = 功能性分流（如肺不张）。两种极端都会让换气效率下降。（教材依据：《生理学》第10版 第五章 呼吸：「正常成人安静时，V_A/Q约为4.2/5=0.84，此时肺换气效率最高」）","others":"0.48、0.64 偏低，1.24、1.84 偏高，都不是正常静息值。","trap":"0.84 可以记成「气 4、血 5」——气略少于血。"},"x56":{"why":"氧解离曲线右移表示 Hb 对 O₂ 亲和力降低、P50 增大、释氧增多。诱因：PCO₂ 升高、pH 降低（Bohr 效应）、温度升高、2,3-DPG 增加。运动中的肌肉正好制造这些条件（CO₂ 多、酸、热），让血里的氧更容易卸下来。（教材依据：《生理学》第10版 第五章 呼吸：「血液pH降低或PCO₂升高时，Hb对O₂的亲和力降低，P50增大，曲线右移」）","others":"pH 升高、PCO₂ 降低、温度降低都让曲线左移（亲和力高、更抓氧）；Hb 浓度不影响曲线位置，只影响携带总量。","trap":"「右移放氧、左移抓氧」。运动时右移，肺泡里左移——身体很聪明。"},"x57":{"why":"胃泌素由胃窦 G 细胞分泌，经血循环作用于壁细胞的 CCK-B 受体，促进盐酸分泌，同时促进胃蛋白酶原分泌和胃窦收缩。进食（尤其蛋白质）和迷走神经兴奋都促进它释放。（教材依据：《生理学》第10版 第六章 消化和吸收：「促胃液素也能作用于ECL细胞上的CCK_B受体，促进ECL细胞分泌组胺，再通过组胺刺激壁细胞分泌盐酸」）","others":"促胰液素和抑胃肽都抑制胃酸（保护肠道）；缩胆囊素促胰酶和胆囊收缩；血管活性肠肽也抑制胃酸。","trap":"「胃泌素促酸，促胰液素抑酸」——一对相反的激素，考试爱对比。"},"x58":{"why":"胰液含胰淀粉酶、胰脂肪酶、胰蛋白酶原、糜蛋白酶原等，能消化三大营养物质，是消化力最强的消化液。它还含大量碳酸氢盐，中和胃酸、为小肠酶提供合适的 pH。胰液分泌不足 → 脂肪泻、消化不良。（教材依据：《生理学》第10版 第六章 消化和吸收：「胰液中的有机物主要是蛋白质……胰液中的蛋白质主要是多种消化酶」）","others":"胃液只消化蛋白质；胆汁只乳化脂肪（不含消化酶）；小肠液酶量少、作用有限；唾液只有淀粉酶。","trap":"「胰液全能，缺了脂肪泻」。慢性胰腺炎最典型的就是脂肪泻。"},"x59":{"why":"胆盐有乳化作用，把脂肪分散成微滴，增加脂肪酶的作用面积；同时形成混合微胶粒，把脂肪消化产物和脂溶性维生素（A、D、E、K）运到肠黏膜吸收。胆盐还能刺激胆汁分泌（肠肝循环）。（教材依据：《生理学》第10版 第六章 消化和吸收：「胆汁的主要作用是促进脂肪的消化和吸收……胆汁中的胆盐、卵磷脂和胆固醇等均可作为乳化剂」）","others":"胆色素是血红蛋白的代谢废物；胆固醇是胆汁的原料之一；卵磷脂是乳化辅助；黏蛋白起保护作用。","trap":"「胆盐 = 乳化 + 吸收」。回肠切除后胆盐丢失 → 脂肪泻 + 脂溶性维生素缺乏。"},"x60":{"why":"甲状腺激素是调节基础代谢率（BMR）最重要的激素，几乎作用于所有细胞的能量代谢。甲亢时 BMR 可升高 25%～80%，所以甲亢病人怕热、多汗、吃得多还瘦；甲减时降低，怕冷、乏力。（教材依据：《生理学》第10版 第七章 能量代谢与体温：「基础代谢率（basalmetabolismrate，BMR）则是指机体在基础状态下单位时间内的能量消耗量」）","others":"肾上腺皮质功能减退、垂体前叶功能减退都会让 BMR 降低；肾病综合征一般不升高；病态窦房结综合征跟代谢率无关。","trap":"「BMR 升高先想甲亢」——反过来，BMR 降低先想甲减。"},"x61":{"why":"肾糖阈约 180 mg/100 ml（10 mmol/L）。近端小管重吸收葡萄糖是靠载体（SGLT），载体数量有限；血糖超过这个值，载体饱和，多余的糖就从尿里排出去。所以血糖超过 180 mg/dl 才出现尿糖，不是一高就漏。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「SGLT2表达在近端小管S1和S2节段，负责滤过液中90%的葡萄糖重吸收」）","others":"80、100 太低（正常空腹水平）；280、360 太高（已经明显糖尿）。","trap":"「180 = 10 mmol/L = 肾糖阈」。这个数常和糖尿病诊断标准放在一起考。"},"x62":{"why":"近端小管重吸收约 65%～70% 的水和 Na⁺，是重吸收的主要部位。它靠基侧膜的钠泵和管腔膜的多种转运体（Na⁺-葡萄糖、Na⁺-氨基酸同向转运等），属于等渗性重吸收——水跟着溶质一起走。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「小管液中65%～70%的Na⁺、Cl⁻和水在近端小管被重吸收」）","others":"髓袢降支细段只吸水不吸盐；升支粗段吸盐不吸水；远曲小管和集合管受醛固酮、ADH 调节，量少但精细。","trap":"「近端 65-70%、髓袢 20%、远端+集合管 10%」——记住分配，利尿药作用点就清楚了。"},"x63":{"why":"升支粗段管腔膜上有 Na⁺-K⁺-2Cl⁻ 同向转运体，把 NaCl 主动重吸收进间质；同时这段对水不通透。结果间质变高渗、管腔液变低渗，形成外髓渗透梯度，为集合管浓缩尿提供动力。呋塞米（速尿）正是抑制这个转运体，所以利尿最强。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「髓袢升支粗段上皮细胞厚，有很高的代谢活性，对Na⁺、K⁺和Cl⁻……」）","others":"单纯扩散不对；Na⁺-H⁺ 交换在近端小管；Na⁺-葡萄糖同向转运在近端；Cl⁻-HCO₃⁻ 交换在红细胞。","trap":"「呋塞米打在升支粗段」——所以它利尿猛、也容易低钾低钠。"},"x64":{"why":"ADH（抗利尿激素，血管升压素）由下丘脑合成、垂体后叶释放，作用于集合管 V₂ 受体，通过 cAMP 促使水通道 AQP2 插入管腔膜，增加水重吸收，尿量减少、尿渗透压升高。尿崩症就是 ADH 缺乏（中枢性）或 V₂ 受体不敏感（肾性），表现为多尿、烦渴。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「V2受体主要分布在肾集合管主细胞基底侧膜……激活后增加水的重吸收，浓缩尿液」）","others":"近端小管、髓袢、远曲小管不是 ADH 的主要靶点。","trap":"「ADH = 集合管 = 水；醛固酮 = 远曲小管/集合管 = 钠钾」。一句话分清两个激素。"},"x65":{"why":"醛固酮由肾上腺皮质球状带分泌，作用于远曲小管和集合管的主细胞，促进 Na⁺ 重吸收、K⁺ 分泌，同时促进 H⁺ 分泌（保钠排钾）。钠被留下，水也跟着被留住，所以它还间接影响血容量和血压。（教材依据：《生理学》第10版 第十一章 内分泌：「醛固酮的生理作用主要由盐皮质激素受体介导，其主要作用是促进肾远曲小管和集合管上皮细胞重吸收Na⁺和分泌K⁺」）","others":"B 正好反了；C 它其实是减少水排泄（保钠保水）；D 它促进 H⁺ 分泌而不是抑制；E 它升血压而不是降。","trap":"「醛固酮 = 保钠排钾」。原醛症 → 高血压 + 低血钾 + 代谢性碱中毒。"},"x66":{"why":"抑制性中间神经元释放 GABA 或甘氨酸，作用于突触后膜的 Cl⁻ 通道，Cl⁻ 内流使膜超极化，产生抑制性突触后电位（IPSP）。常见两种形式：传入侧支性抑制（交互抑制）和回返性抑制。（教材依据：《生理学》第10版 第十章 神经系统的功能：「抑制性递质作用于突触后膜，使后膜上的氯通道开放，Cl⁻内流」）","others":"突触前末梢去极化是突触前抑制；递质释放增加是兴奋；Na⁺ 通道开放是兴奋性突触；突触前膜的 Cl⁻ 通道不参与。","trap":"「突触前抑制 = 前膜去极化（递质变少）；突触后抑制 = 后膜超极化（IPSP）」。别搞反。"},"x67":{"why":"反射弧由感受器、传入神经、神经中枢、传出神经、效应器五个部分组成。突触是神经元之间的连接结构，负责信号传递，但它不是反射弧的独立组成部分。（教材依据：《生理学》第10版 第一章 绪论：「反射弧（reflexarc），它由五个基本成分组成，即感受器、传入神经、中枢、传出神经和效应器」）","others":"A 感受器、B 传入神经、C 神经中枢、D 效应器，这四个都是反射弧的组成部分。","trap":"「五站路，突触是换乘」——这个坑每年都有人踩。"},"x68":{"why":"生长激素（GH）由垂体前叶分泌，主要通过肝脏产生的胰岛素样生长因子-1（IGF-1）促进骨骺软骨细胞增殖和骨生长。幼年 GH 缺乏 → 侏儒症（身材矮小但智力正常）；过多 → 巨人症；成年后过多 → 肢端肥大症。（教材依据：《生理学》第10版 第十一章 内分泌：「GH对几乎所有组织和器官的生长都有促进作用，尤其是对骨骼、肌肉和内脏器官的作用最为显著」）","others":"甲状腺激素也参与生长发育（幼年缺乏 → 呆小症，智力也受影响）；性激素促青春期突增；胰岛素、糖皮质激素不是促进长骨的主因。","trap":"「GH 缺 = 侏儒（智力正常），甲状腺激素缺 = 呆小（智力低下）」——这是必考的对比。"},"x69":{"why":"胰岛素是唯一降低血糖的激素，作用在「合成与储存」这一侧：促进葡萄糖摄取和利用、促进糖原合成、抑制糖异生、促进脂肪合成、促进蛋白质合成并抑制蛋白质分解。一句话：存糖、存脂、存蛋白。（教材依据：《生理学》第10版 第十一章 内分泌：「胰岛素是促进物质合成代谢，维持血糖浓度稳定的关键激素」）","others":"A、B、C、D 都是胰岛素的真实作用；E 说反了——胰岛素是抑制蛋白质分解，不是促进分解。","trap":"「胰岛素 = 合成 + 储存；胰高血糖素 = 分解 + 释放」。一对反向激素。"},"x70":{"why":"排卵后残余卵泡形成黄体，分泌孕激素和雌激素，以孕激素为主。孕激素让子宫内膜从增生期转为分泌期（腺体分泌、血管丰富），为受精卵着床做准备；若未受孕，黄体萎缩，激素撤退，月经来潮。（教材依据：《生理学》第10版 第十二章 生殖：「排卵后没有受精、着床，黄体退化，导致血中雌、孕激素水平骤降」）","others":"雌激素在排卵前由卵泡分泌为主；雄激素少量；FSH 由垂体分泌；催乳素管泌乳。","trap":"「排卵前雌激素当家，排卵后孕激素当家」。黄体期就是孕激素期。"},"x71":{"why":"肝是脂肪代谢的核心器官：合成、转运、氧化都在这。当脂肪合成过多、脂蛋白输出障碍或脂肪酸氧化不足时，脂滴就在肝细胞质里堆积，形成脂肪变（脂肪肝）。镜下见大小不等的脂滴空泡，重度时肝大、色黄、油腻。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「甘油三酯蓄积于非脂肪细胞的细胞质中，称为脂肪变……多发生于肝细胞、心肌细胞、肾小管上皮细胞和骨骼肌细胞」）","others":"心、脾、肺、脑都可能发生脂肪变（心肌的「虎斑心」、肾的脂肪变），但发生率和程度都远不如肝。","trap":"「脂肪肝最常见」——顺带记两个词：心肌脂肪变叫「虎斑心」，肾脂肪变叫「脂性肾病」样外观。"},"x72":{"why":"良性高血压时，全身细动脉持续痉挛、内皮受损，血浆蛋白渗入内膜下并凝固，形成均质红染的玻璃样物质，管壁增厚、腔窄、弹性下降。这种血管壁玻璃样变是良性高血压最基本的病变，也是肾、脑等靶器官损伤的基础。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「细动脉硬化是高血壓病的主要病变特征，表现为细动脉玻璃样变」）","others":"细胞内玻璃样变（如肾小管上皮的蛋白滴、浆细胞的 Russell 小体）在细胞里；结缔组织玻璃样变（瘢痕、动脉粥样斑块）在纤维组织；淀粉样变、黏液样变是别的物质。","trap":"「血管壁玻璃样变 = 高血压细动脉」。三个玻璃样变记清楚：细胞内、血管壁、结缔组织。"},"x73":{"why":"心肌梗死属凝固性坏死：缺血使细胞蛋白变性凝固，坏死组织干燥、灰白或灰黄、质实。镜下细胞核消失，但心肌纤维的轮廓还能保留一段时间（这是凝固性坏死的标志）。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「实质器官如心、脾、肾的梗死为凝固性坏死」）","others":"液化性坏死见于脑梗死和脓肿；干酪样坏死是结核；纤维素样坏死见于风湿和急进性高血压；脂肪坏死见于急性胰腺炎和乳腺创伤。","trap":"「心肝脾肾梗死 = 凝固性坏死；脑梗死 = 液化性坏死」。一句话分清。"},"x74":{"why":"脑组织含脂质多、蛋白质少，坏死后激活的溶酶体酶把组织溶解液化，形成软化灶。脓肿也是液化性坏死（中性粒细胞释放的酶把组织溶解成脓液）。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「脑梗死为液化性坏死，新鲜时质软疏松，日久后逐渐液化成囊状」）","others":"凝固性坏死见于心、肝、脾、肾的缺血性梗死；干酪样坏死是结核；纤维素样坏死见于结缔组织病；脂肪坏死见于胰腺。","trap":"「脑 + 脓肿 = 液化」。脑软化灶、脑脓肿都是这个道理。"},"x75":{"why":"干酪样坏死是结核病的特征性病变：坏死组织呈淡黄色、均匀细腻、质地似奶酪。镜下为红染、无结构的颗粒状物，看不到组织轮廓（与凝固性坏死不同）。坏死灶周围常有上皮样细胞和朗汉斯巨细胞，构成结核结节。（教材依据：《病理学》第10版 第十八章 传染病：「结核坏死灶由于含脂质较多呈淡黄色、均匀细腻，质地较实，状似奶酪，故称干酪样坏死」）","others":"凝固性坏死保留组织轮廓；液化性坏死被溶解成液体；纤维素样坏死见于结缔组织病；脂肪坏死见于胰腺。","trap":"「奶酪 = 结核」。看到「干酪样坏死」直接想结核分枝杆菌。"},"x76":{"why":"纤维素样坏死常见于结缔组织病（风湿病、类风湿关节炎、SLE、结节性多动脉炎）和急进性高血压。免疫复合物沉积、血管壁损伤，胶原纤维崩解成细丝状、颗粒状红染物，似纤维素。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤（纤维素样坏死：风湿病、结节性多动脉炎的典型坏死类型））","others":"凝固性坏死是缺血；液化性坏死是脑和脓肿；干酪样坏死是结核；脂肪坏死是胰腺。","trap":"「风湿 + 狼疮 + 急进性高血压 = 纤维素样坏死」。这是免疫性损伤的标志。"},"x77":{"why":"凋亡是程序性细胞死亡：细胞皱缩、染色质凝聚、核碎裂，形成膜包裹的凋亡小体，被巨噬细胞吞噬清除，不引起炎症。它是生理性（胚胎发育、细胞更新）和病理性（肿瘤化疗后）都存在的主动过程。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「①细胞皱缩……③凋亡小体形成：细胞膜内陷或胞质生出芽突并脱落」）","others":"A、C、D、E 都是坏死的特征：细胞肿胀破裂、膜破裂、引发炎症。","trap":"「凋亡安静、坏死爆炸」——一个不引发炎症，一个一定引发炎症。"},"x78":{"why":"化生是一种分化成熟的组织转变为另一种分化成熟的组织。长期吸烟刺激，支气管的假复层纤毛柱状上皮被鳞状上皮取代（鳞状化生），更能耐受刺激，但失去了纤毛的清洁功能，且是鳞癌的基础。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「吸烟者支气管假复层纤毛柱状上皮易发生鳞状上皮化生」）","others":"增生是细胞数量增多但类型不变；肥大是细胞体积增大；异型增生是细胞形态异常（癌前病变）；萎缩是细胞变小。","trap":"「化生 = 换工种，不是加人」——类型变了才是化生，数量变了是增生。"},"x79":{"why":"慢性肝淤血时，肝小叶中央区淤血呈暗红色，周边区肝细胞因缺氧发生脂肪变呈黄色，切面红黄相间，状如槟榔切面，称槟榔肝。长期淤血可发展为淤血性肝硬化（心源性肝硬化）。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「慢性肝淤血时，肝小叶中央区因严重淤血呈暗红色……状似槟榔切面的条纹，称为槟榔肝」）","others":"脂肪肝是均匀黄色；肝硬化是弥漫结节；淤血性脾肿大是脾；肝癌是肿块。","trap":"「槟榔肝 = 慢性肝淤血」。右心衰的病人容易出现。"},"x80":{"why":"慢性肺淤血（左心衰竭）时，肺泡壁毛细血管压力升高，红细胞漏入肺泡腔，被巨噬细胞吞噬。血红蛋白分解后铁以含铁血黄素形式沉积在巨噬细胞胞质内，这种细胞称心衰细胞。它提示肺淤血和慢性出血。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「出血灶中的红细胞碎片被吞噬细胞吞噬，血红蛋白被溶酶体酶分解，析出含铁血黄素并堆积在吞噬细胞胞质内」）","others":"中性粒细胞是急性炎症；淋巴细胞是慢性炎症和免疫；嗜酸性粒细胞与过敏和寄生虫；浆细胞产生抗体。","trap":"「心衰细胞 = 吃了红细胞的巨噬细胞」。左心衰 → 肺淤血 → 心衰细胞。"},"x81":{"why":"混合血栓由血小板小梁（白色部分）与红细胞（红色部分）交替构成，常见于静脉内延续性血栓的体部。它是在血流缓慢、涡流形成的条件下，血小板反复聚集、红细胞交替沉积的结果。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「混合血栓……在血小板小梁间则由有大量红细胞的纤维蛋白网填充」）","others":"单纯血小板是白色血栓（心瓣膜、动脉）；单纯红细胞是红色血栓（静脉）；纤维蛋白与白细胞是透明血栓（DIC）；脂肪与钙盐是脂肪栓塞/钙化。","trap":"「白血栓（血小板）→ 混合血栓（头体尾）→ 红血栓（红细胞）」。静脉血栓就是这三段。"},"x82":{"why":"肺动脉栓塞 95% 以上来自下肢深静脉（股静脉、髂静脉、腘静脉），尤其是长期卧床、术后、骨折后形成的血栓。血栓脱落后经下腔静脉→右心→肺动脉，造成肺栓塞。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「造成肺动脉栓塞的栓子95%以上来自膝以上的下肢深部静脉，特别是腘静脉、股静脉和髂总静脉」）","others":"左心房栓子造成体循环栓塞（脑、脾、肾）；主动脉粥样斑块造成动脉栓塞；肠系膜静脉和门静脉的栓子造成门静脉系统栓塞。","trap":"「下肢深静脉 → 右心 → 肺动脉」。记住这条路，肺栓塞的来源就清楚了。"},"x83":{"why":"贫血性梗死发生在组织结构致密、侧支循环不丰富的器官（心、肾、脾），梗死灶灰白、边界清楚。肺和肠有双重血供（肺动脉+支气管动脉、肠系膜上动脉+下动脉），梗死时血液从侧支涌入坏死区，形成出血性梗死（红色）。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「含血量少时颜色灰白，称为贫血性梗死（anemic infarction）或白色梗死」）","others":"肺、肠、脑都不是典型的贫血性梗死器官；脑梗死虽也贫血性，但常归液化性坏死。","trap":"「心肾脾 = 白梗，肺肠 = 红梗」。一句话记住。"},"x84":{"why":"炎症的基本病理变化是变质、渗出、增生。变质是损伤；渗出是血管反应、液体和白细胞进入组织；增生是修复。三者按不同比例组合，决定炎症的类型和结局。钙化属于病理性钙盐沉积，不是炎症的基本环节。（教材依据：《病理学》第10版 第四章 炎症：「变质可以由致病因子直接作用所致，也可以由血液循环障碍及炎症反应产物的间接作用引起……2. 渗出：炎症局部组织血管内的液体成分、纤维蛋白等蛋白质和各种炎症细胞通过血管壁进入组织间隙、体腔、体表和黏膜表面的过程」）","others":"变质、渗出、增生、血管反应都是炎症过程的一部分。","trap":"「变质、渗出、增生」——炎症三要素，钙化是「事后」的事。"},"x85":{"why":"渗出液是炎症时血管通透性增加、富含蛋白的液体漏出，蛋白 >30 g/L、比重 >1.018、细胞多、易凝固、Rivalta 试验阳性。漏出液是静水压升高或胶体渗透压降低导致的，蛋白 <25 g/L、比重 <1.015、细胞少、不易凝固。（教材依据：《病理学》第10版 第四章 炎症（渗出液与漏出液的鉴别：蛋白含量与比重））","others":"外观、pH、细胞数可辅助，但不如蛋白含量和比重可靠；凝固性也受蛋白影响。","trap":"「渗出 = 蛋白高、比重大；漏出 = 清水」。胸水鉴别先看蛋白和比重。"},"x86":{"why":"急性炎症早期以中性粒细胞为主，它渗出快、吞噬和杀菌能力强，是抗感染的第一道细胞防线。6～24 小时达高峰，24～48 小时后巨噬细胞逐渐接替。慢性炎症则以淋巴细胞、浆细胞、巨噬细胞为主。（教材依据：《病理学》第10版 第四章 炎症：「白细胞穿过血管壁进入周围组织的过程，称为白细胞游出」）","others":"淋巴细胞和浆细胞是慢性炎症；嗜酸性粒细胞与过敏、寄生虫；巨噬细胞是后期主力。","trap":"「急性 = 中性粒，慢性 = 淋巴/浆细胞」。看细胞就能判病程。"},"x87":{"why":"结核结节中的朗汉斯巨细胞由多个巨噬细胞融合而成，胞质丰富，核排列在胞质周边呈马蹄形或环状，是结核性肉芽肿的特征。它和上皮样细胞一起构成结核结节。（教材依据：《病理学》第10版 第四章 炎症：「IFN-γ可使巨噬细胞转变成上皮样细胞和多核巨细胞」）","others":"B 淋巴细胞产生抗体；T 淋巴细胞参与细胞免疫（结核的免疫主力，但不融合成巨细胞）；成纤维细胞产生胶原；内皮细胞形成血管。","trap":"「朗汉斯 = 巨噬细胞融合」。看到马蹄形核排列，就是它。"},"x88":{"why":"蜂窝织炎多由溶血性链球菌引起，它分泌透明质酸酶，分解组织基质，使炎症沿组织间隙弥漫扩散，累及皮下、肌肉、阑尾等，与正常组织分界不清。脓肿则是局限性化脓，形成脓腔。（教材依据：《病理学》第10版 第四章 炎症：「蜂窝织炎是指疏松结缔组织的弥漫性化脓性炎，常发生于皮肤、肌肉和阑尾……主要由溶血性链球菌引起」）","others":"局限性脓腔是脓肿；肉芽肿是慢性肉芽肿性炎；纤维素性炎是白喉、大叶性肺炎；出血性炎是炭疽、鼠疫。","trap":"「蜂窝织炎弥漫、脓肿局限」。链球菌 → 蜂窝织炎，金葡菌 → 脓肿。"},"x89":{"why":"肿瘤的组织学类型由细胞的分化方向决定：腺上皮 → 腺癌，鳞状上皮 → 鳞癌，肝细胞 → 肝细胞癌。而良恶性主要看异型性，分级看分化程度，分期看大小和转移。（教材依据：《病理学》第10版 第六章 肿瘤：「肿瘤细胞构成肿瘤实质，其细胞形态、形成的结构或其产物是判断肿瘤的分化方向、进行肿瘤组织学分类的主要依据」）","others":"大小、生长速度、异型性、包膜都用于判断良恶性和预后，不是定组织学类型的依据。","trap":"「类型看方向，良恶看异型，分级看分化，分期看转移」。四句话理清肿瘤病理。"},"x90":{"why":"癌起源于上皮组织，多经淋巴道转移，常见于淋巴结；肉瘤起源于间叶组织（骨、肌肉、脂肪、血管），多经血道转移，常见于肺、肝、骨。当然晚期两者都可多途径转移，但这是最典型的倾向。（教材依据：《病理学》第10版 第六章 肿瘤：「肉瘤细胞大多不成巢，弥漫生长……故肉瘤多先发生血行转移」）","others":"B 正好反了；C、D 都过于绝对；E 错，癌当然会转移。","trap":"「癌走淋巴、肉瘤走血」——这一条能解很多鉴别题。"},"x91":{"why":"癌前病变指具有癌变潜在可能性的病变，常见的有黏膜白斑、结肠腺瘤性息肉、慢性萎缩性胃炎伴肠上皮化生、子宫颈上皮内瘤变（CIN）、乳腺导管上皮不典型增生等。及时发现并处理可阻断癌变。（教材依据：《病理学》第10版 第六章 肿瘤：「家族性腺瘤性息肉病（FAP），几乎均会发生癌变」）","others":"急性阑尾炎、心肌梗死、肺气肿、肾小球肾炎都不是癌前病变。","trap":"「息肉、白斑、萎缩性胃炎、CIN」——癌前病变四件套。"},"x92":{"why":"原位癌指癌细胞累及上皮全层，但未突破基底膜、未浸润间质，因此没有淋巴道和血道转移的机会。它属于早期癌，手术切除后预后很好。一旦突破基底膜就是浸润癌。（教材依据：《病理学》第10版 第六章 肿瘤：「原位癌（carcinomainsitu，CIS）指异型增生的细胞在形态和生物学特性上与癌细胞相同，常累及上皮的全层，但没有突破基底膜向下浸润」）","others":"A 是浸润癌；C 是转移癌；D 是大小标准，与定义无关；E 是分化程度，不是原位癌的定义。","trap":"「原位癌 = 没破基底膜 = 不会转移」。破了就是浸润癌。"},"x93":{"why":"动脉粥样硬化的基本病变是脂纹、纤维斑块、粥样斑块，以及斑块继发改变（出血、溃疡、钙化、血栓形成）。细小动脉纤维素样坏死见于急进性（恶性）高血压，是另一种病。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「主动脉内膜表面可见隆起的脂纹、纤维斑块」）","others":"脂纹、纤维斑块、粥样斑块、斑块内出血都是动脉粥样硬化的病变。","trap":"「粥样硬化 = 大中动脉；纤维素样坏死 = 急进性高血压细动脉」。别混。"},"x94":{"why":"良性高血压的基本病变是全身细动脉玻璃样变（细小动脉硬化）：血浆蛋白渗入内膜下凝固，管壁增厚、腔窄。由此引起心（左室肥大）、脑（出血、梗死）、肾（颗粒性固缩肾）等靶器官损伤。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「细动脉硬化是高血压病的主要病变特征，表现为细动脉玻璃样变」）","others":"大动脉粥样硬化是动脉粥样硬化；心肌肥大、脑出血、肾小球硬化都是高血压的后果，不是最基本的病变。","trap":"「良性高血压 = 细动脉玻璃样变；恶性高血压 = 纤维素样坏死」。"},"x95":{"why":"大叶性肺炎多由肺炎链球菌引起，病变累及肺段或肺叶，分四期：①充血水肿期；②红色肝样变期（肺泡内充满红细胞和纤维蛋白，痰呈铁锈色）；③灰色肝样变期（红细胞溶解，中性粒细胞增多）；④溶解消散期。（教材依据：《病理学》第10版 第十章 呼吸系统疾病：「典型的自然发展过程大致可分为以下四期：（1）充血水肿期……（2）红色肝样变期……」）","others":"B 把红灰顺序颠倒了；C、D、E 是别的疾病的描述。","trap":"「红肝 → 灰肝」顺序不能反。铁锈色痰在红色肝样变期。"},"x96":{"why":"小细胞癌属神经内分泌肿瘤，细胞小、胞质少、核染色深，生长迅速、早期即发生淋巴道和血道转移，恶性程度最高。它对化疗和放疗敏感，但容易复发，总体预后差。多位于肺门中央，与吸烟密切相关。（教材依据：《病理学》第10版 第十章 呼吸系统疾病（肺癌·小细胞癌：神经内分泌肿瘤，恶性程度最高））","others":"鳞癌生长较慢、转移较晚；腺癌多见于女性、不吸烟者；大细胞癌恶性度也高但不如小细胞；类癌恶性度低。","trap":"「小细胞 = 恶性最高、转移最早」。副肿瘤综合征（SIADH、Cushing）也常见于它。"},"x97":{"why":"假小叶是肝硬化的特征性病变：纤维组织增生、分割包绕肝细胞团，形成圆形或椭圆形的结节。假小叶内中央静脉缺如、偏位或有两个以上，肝细胞索排列紊乱，可有变性坏死。这是正常肝小叶结构被破坏的结果。（教材依据：《病理学》第10版 第十一章 消化系统疾病：「假小叶内的肝细胞排列紊乱……中央静脉常缺如、偏位或两个以上」）","others":"A、C、D、E 都与肝硬化相反——肝小叶结构破坏、汇管区纤维化、肝细胞可有异型。","trap":"「假小叶 = 中央静脉缺如/偏位」。这是肝硬化的病理标志。"},"x98":{"why":"急进性肾小球肾炎（新月体性肾炎）的特征是肾小球囊壁上皮细胞（壁层上皮）增生，形成新月状结构，压迫毛细血管丛，导致肾功能在数周至数月内快速恶化。多由抗 GBM 抗体或免疫复合物引起。（教材依据：《病理学》第10版 第十三章 泌尿系统疾病：「图13-10 急进性肾小球肾炎 示新月体形成」）","others":"系膜增生是 IgA 肾病；基底膜增厚是膜性肾病；肾小管萎缩和间质纤维化是慢性病变。","trap":"「新月体 = 急进性肾炎 = 快速肾衰」。看到新月体就想到急进性。"},"x99":{"why":"慢性支气管炎时细支气管不完全阻塞，呼气时气体排出困难，肺泡内压升高，肺泡壁受压变薄、弹性下降，进而破裂融合成肺大泡，形成肺气肿。患者呈桶状胸、呼吸困难。（教材依据：《病理学》第10版 第十章 呼吸系统疾病：「镜下见肺泡扩张，肺泡间隔变窄并断裂，相邻肺泡融合成较大的囊腔」）","others":"肺泡壁增厚是炎症或纤维化；肺泡内渗出是肺炎；纤维化是间质性肺病；上皮增生是修复或肿瘤。","trap":"「肺气肿 = 壁薄腔大」。桶状胸、呼气性呼吸困难是它的招牌。"},"x100":{"why":"急性炎症时组胺、缓激肽、白三烯等使血管内皮细胞收缩，细胞间隙增宽，血管通透性升高，富含蛋白的液体渗出到组织，形成渗出液（水肿）。这是急性炎症最早、最重要的血管反应。（教材依据：《病理学》第10版 第四章 炎症：「内皮细胞损伤：烧伤和化脓菌感染等严重损伤刺激可直接损伤内皮细胞……这种损伤引起的血管通透性增加明显并且发生迅速」）","others":"血管收缩是短暂的（随后扩张）；淋巴回流受阻、胶体渗透压升高、静水压下降是水肿的其他机制，不是急性炎症通透性升高的直接原因。","trap":"「内皮收缩 → 缝隙变大 → 蛋白漏出」。这是渗出液形成的核心机制。"},"x101":{"why":"肉芽肿性炎以肉芽肿形成为特征，主要细胞成分是巨噬细胞及其演化的上皮样细胞和多核巨细胞（朗汉斯巨细胞、异物巨细胞）。常见于结核、结节病、异物反应、真菌感染等。（教材依据：《病理学》第10版 第四章 炎症：「肉芽肿的主要细胞成分是上皮样细胞和多核巨细胞，具有诊断意义」）","others":"中性粒细胞是急性炎症；浆细胞是慢性炎症；嗜酸性粒细胞与过敏；肥大细胞与过敏反应。","trap":"「肉芽肿 = 上皮样细胞 + 多核巨细胞」。结核结节就是典型代表。"},"x102":{"why":"BNP 和 NT-proBNP 由心室肌细胞在室壁张力增高时合成释放。心室扩张、压力负荷过重（心衰、心梗、肺栓塞）都会使其升高。它们是心衰诊断、分级、疗效监测和预后判断的重要指标，NT-proBNP 半衰期更长、更稳定。（教材依据：《内科学》第10版 第三篇 循环系统疾病（心力衰竭·脑钠肽 BNP/NT-proBNP 与心室壁张力））","others":"肌钙蛋白是心肌损伤（心梗）的标志；D-二聚体反映血栓形成和纤溶；CRP 是炎症；降钙素原是细菌感染。它们都不反映室壁张力。","trap":"「BNP 高 = 心衰（室壁张力高）」。呼吸困难病人查 BNP，阴性基本可排除心衰。"},"x103":{"why":"房颤时心房失去有效收缩，血液淤滞易形成血栓，脱落后造成脑栓塞。非瓣膜性房颤首选新型口服抗凝药（DOAC，如利伐沙班、达比加群），它们不用监测 INR、颅内出血风险低于华法林。机械瓣或中重度二尖瓣狭窄仍需华法林。（教材依据：《内科学》第10版 第三篇 循环系统疾病：「合并房颤病人需要抗凝治疗，其中，中至重度二尖瓣狭窄病人应使用维生素K拮抗剂」）","others":"阿司匹林、氯吡格雷抗血小板，对房颤血栓预防不够；华法林仍是机械瓣的首选；低分子肝素是围手术期桥接用。","trap":"「非瓣膜性房颤 = DOAC；机械瓣/中重度二尖瓣狭窄 = 华法林」。这题每年考。"},"x104":{"why":"社区获得性肺炎（CAP）最常见的病原体是肺炎链球菌。其他常见的有肺炎支原体、流感嗜血杆菌、肺炎衣原体、呼吸道病毒等。医院获得性肺炎（HAP）则以革兰阴性杆菌（铜绿假单胞菌、克雷伯菌）和金黄色葡萄球菌为主。（教材依据：《内科学》第10版 第二篇 第六章 肺部感染性疾病（社区获得性肺炎最常见病原体为肺炎链球菌））","others":"金黄色葡萄球菌、铜绿假单胞菌、肺炎克雷伯菌更多见于医院获得性肺炎或有基础病者；军团菌是特殊病原体。","trap":"「社区 = 肺炎链球菌；医院 = 革兰阴性杆菌」。一句话分清 CAP 和 HAP。"},"x105":{"why":"结核分枝杆菌生长慢、易耐药，治疗必须「早期、联合、适量、规律、全程」。标准初治方案为 2HRZE/4HR（异烟肼、利福平、吡嗪酰胺、乙胺丁醇强化 2 个月，异烟肼+利福平巩固 4 个月）。自行停药是耐药的主要原因。（教材依据：《内科学》第10版 第二篇 第八章 肺结核：「6个月2HRZE/4HR方案仍是比较稳妥保守的选择」）","others":"单药、短程、症状缓解即停药都会导致治疗失败和耐药。","trap":"「十字方针：早期、联合、适量、规律、全程」。考试爱考这五个词。"},"x106":{"why":"Ⅱ 型呼吸衰竭（PaO₂ <60 mmHg 且 PaCO₂ >50 mmHg）时，呼吸中枢对 CO₂ 的敏感性下降，主要靠低氧刺激外周化学感受器维持呼吸。高浓度吸氧会解除低氧刺激，导致呼吸抑制、CO₂ 潴留加重（甚至肺性脑病）。因此应低浓度（<35%）、低流量持续吸氧，使 PaO₂ 维持在 60 mmHg 左右。（教材依据：《内科学》第10版 第二篇 第十六章 呼吸衰竭：「慢阻肺病是导致慢性呼吸衰竭的常见呼吸系统疾病，病人常伴有CO₂潴留」）","others":"高浓度、间断高浓度、纯氧都会加重 CO₂ 潴留；不吸氧则缺氧无法纠正。","trap":"「Ⅱ 型呼衰 = 低流量持续吸氧」。Ⅰ 型呼衰可以高浓度。"},"x107":{"why":"D-二聚体是交联纤维蛋白降解产物，反映凝血和纤溶激活。它对肺栓塞有很高的阴性预测价值：D-二聚体正常基本可排除急性肺栓塞（低中度临床可能性者）。但特异性低，感染、肿瘤、手术、妊娠都可升高，阳性需进一步行 CTPA 确诊。（教材依据：《内科学》第10版 第二篇 第十一章 肺血栓栓塞症（D-二聚体对急性肺栓塞的排除价值））","others":"肌钙蛋白反映心肌损伤（肺栓塞时可升高提示右心受累）；BNP 反映右心负荷；降钙素原提示感染；乳酸反映组织灌注。","trap":"「D-二聚体阴性 = 排除肺栓塞」。注意是「排除」，不是「确诊」。"},"x108":{"why":"上消化道出血最常见的病因是消化性溃疡（约占 50%），其中十二指肠球部溃疡多于胃溃疡。其次为食管胃底静脉曲张破裂（肝硬化门脉高压）、急性糜烂出血性胃炎、胃癌、食管贲门黏膜撕裂（Mallory-Weiss 综合征）。（教材依据：《内科学》第10版 第四篇 第二十五章 消化道出血：「上消化道出血……其中以上消化道出血最常见」）","others":"食管胃底静脉曲张破裂出血量大、凶险，但发生率低于溃疡；其他几项更少见。","trap":"「溃疡第一、静脉曲张第二」。出血量大、呕鲜血要想到静脉曲张。"},"x109":{"why":"急性胰腺炎时胰酶异常激活、胰腺自身消化，淀粉酶和脂肪酶释放入血。血清淀粉酶在起病后 6～12 小时开始升高，脂肪酶 24～72 小时达峰且特异性更高、持续时间更长。但淀粉酶升高的幅度与病情严重程度不平行。（教材依据：《内科学》第10版 第四篇 第二十章 胰腺炎（血清淀粉酶与脂肪酶：诊断急性胰腺炎的常用酶学指标））","others":"碱性磷酸酶提示胆道；转氨酶提示肝细胞；肌酸激酶提示肌肉；乳酸脱氢酶特异性差。","trap":"「淀粉酶 + 脂肪酶 = 胰腺炎」。脂肪酶更特异，淀粉酶更常用。"},"x110":{"why":"克罗恩病为节段性、透壁性（全层）炎症，好发于回肠末端和右半结肠，可有非干酪性肉芽肿、裂隙状溃疡、鹅卵石样改变、瘘管形成。溃疡性结肠炎病变连续、自直肠向近端蔓延、局限于黏膜层，表现为弥漫性溃疡、假息肉。（教材依据：《内科学》第10版 第四篇 第八章 炎症性肠病：「克罗恩病……呈节段性分布……累及肠壁全层，肠壁增厚变硬，肠腔狭窄」）","others":"连续性分布、仅累及直肠、黏膜弥漫性溃疡都是溃疡性结肠炎的特点。","trap":"「克罗恩跳跃、全层；溃结连续、黏膜」。记住这八个字。"},"x111":{"why":"上消化道出血是肝性脑病最常见的诱因：血液在肠道被细菌分解产生大量氨，吸收入血；同时出血导致低血容量、肾前性氮质血症、缺氧，进一步加重肝损害和氨中毒。其他诱因包括高蛋白饮食、感染、便秘、低钾性碱中毒、大量放腹水。（教材依据：《内科学》第10版 第四篇 第十五章 肝硬化：「1. 肝性脑病 是肝癌终末期最严重的并发症」）","others":"高蛋白饮食、感染、便秘、低钾碱中毒都是诱因，但发生率低于出血。","trap":"「出血 → 产氨 → 肝性脑病」。肝硬化病人止血的同时要清肠、降氨。"},"x112":{"why":"急性肾损伤（AKI）按病因分肾前性、肾性、肾后性，其中肾性最常见的是急性肾小管坏死（ATN），多由缺血（休克、脱水）或肾毒性物质（氨基糖苷类、造影剂、肌红蛋白）引起。表现为少尿、肌酐快速升高、尿钠增高、尿比重降低。（教材依据：《内科学》第10版 第五篇 第九章 急性肾损伤：「急性肾损伤（AKI）是由各种病因引起短时间内肾功能快速减退而导致的临床综合征」）","others":"急进性肾小球肾炎、急性间质性肾炎、肾动脉栓塞、肾皮质坏死都较少见。","trap":"「AKI 最常见 = 急性肾小管坏死」。缺血和肾毒性是两个主因。"},"x113":{"why":"肾脏是促红细胞生成素（EPO）的主要产生器官。慢性肾脏病时肾间质纤维化、EPO 生成减少，导致红细胞生成不足；同时还有铁利用障碍、毒素抑制骨髓、红细胞寿命缩短等因素。治疗用重组人 EPO 联合铁剂。（教材依据：《内科学》第10版 第五篇 第十章 慢性肾衰竭（肾性贫血：促红细胞生成素减少））","others":"铁摄入不足、叶酸缺乏是营养性贫血的原因；溶血和失血是另外的机制。","trap":"「肾性贫血 = EPO 少」。看到 CKD + 贫血，先想 EPO。"},"x114":{"why":"急性单纯性下尿路感染最常见的病原是大肠埃希菌，首选喹诺酮类（如左氧氟沙星）或第三代头孢菌素，疗程 3～7 天。复杂尿路感染、上尿路感染（肾盂肾炎）需根据药敏、延长疗程。（教材依据：《内科学》第10版 第五篇 第五章 尿路感染：「急性膀胱炎：治疗目的在于杀灭致病菌，缓解症状并防止感染扩散」）","others":"万古霉素用于耐药革兰阳性菌；甲硝唑抗厌氧菌；阿昔洛韦抗病毒；异烟肼抗结核。都不对。","trap":"「单纯膀胱炎 = 喹诺酮/三代头孢」。上尿路感染要更长疗程。"},"x115":{"why":"再生障碍性贫血是骨髓造血功能衰竭，表现为全血细胞减少（贫血、感染、出血），网织红细胞绝对值降低，骨髓增生低下、脂肪化。分为重型和非重型，治疗用免疫抑制（ATG+环孢素）或造血干细胞移植。（教材依据：《内科学》第10版 第六篇 第五章 再生障碍性贫血（全血细胞减少、网织红细胞绝对值降低、骨髓增生低下））","others":"红细胞增多、白细胞增多、血小板增多都不是再障；仅贫血不符合全血细胞减少。","trap":"「再障 = 全血细胞减少 + 网织红低 + 骨髓空虚」。三句话记牢。"},"x116":{"why":"急性早幼粒细胞白血病（APL，M3 型）具有 t(15;17) 易位，形成 PML-RARA 融合基因。全反式维甲酸（ATRA）和砷剂（三氧化二砷）可诱导白血病细胞分化成熟，使 APL 成为治愈率最高的急性白血病之一。（教材依据：《内科学》第10版 第六篇 第九章 白血病（急性早幼粒细胞白血病·PML-RARA 融合基因））","others":"BCR-ABL 是慢性髓系白血病（CML）；AML1-ETO 是 M2b；MLL-AF9 是 M5；NPM1 突变见于正常核型 AML。","trap":"「APL = PML-RARA = 维甲酸 + 砷剂」。这是血液科最经典的「靶向治疗」故事。"},"x117":{"why":"R-S 细胞（Reed-Sternberg 细胞）是霍奇金淋巴瘤的特征性肿瘤细胞，体积大、双核或多核，核仁明显，呈镜影状（猫头鹰眼），CD15、CD30 阳性。背景中常有淋巴细胞、嗜酸性粒细胞等炎症细胞。（教材依据：《内科学》第10版 第六篇 第十章 淋巴瘤（霍奇金淋巴瘤·R-S 细胞））","others":"小淋巴细胞、浆细胞、中性粒细胞、嗜酸性粒细胞是背景细胞，不是特征性肿瘤细胞。","trap":"「R-S 细胞 = 霍奇金」。看到「镜影细胞」就选它。"},"x118":{"why":"多发性骨髓瘤的典型表现是 CRAB：高钙血症（C）、肾功能不全（R）、贫血（A）、骨病变（B）。骨髓被克隆性浆细胞浸润，正常造血受抑，所以是贫血而不是红细胞增多。（教材依据：《内科学》第10版 第六篇 第十一章 多发性骨髓瘤：「浆细胞病是克隆性浆细胞或产生免疫球蛋白的B淋巴细胞过度增殖所引起的一组疾病」）","others":"骨痛、贫血、肾损害、高钙都是典型表现；红细胞增多不是。","trap":"「CRAB = 钙、肾、贫血、骨」。再加一个 M 蛋白。"},"x119":{"why":"原发性甲减用左甲状腺素（L-T4）替代治疗，从小剂量开始、逐渐加量，老年和冠心病患者加量更慢，定期监测 TSH 调整剂量。需长期甚至终身服药。（教材依据：《内科学》第10版 第七篇 第五章 甲状腺疾病：「甲状腺激素替代治疗 首选左甲状腺素（L-T₄）单药治疗」）","others":"抗甲状腺药物、放射性碘、甲状腺次全切除都是治甲亢的；碘剂用于甲亢术前。","trap":"「甲减 = 补 L-T4；甲亢 = 抗甲状腺药/碘/手术」。方向别搞反。"},"x120":{"why":"库欣综合征的诊断分两步：①定性：血皮质醇节律消失、24 小时尿游离皮质醇升高、小剂量地塞米松抑制试验不被抑制；②定位：肾上腺 CT/MRI 查肾上腺腺瘤或增生，垂体 MRI 查垂体 ACTH 瘤（库欣病）。（教材依据：《内科学》第10版 第七篇 第七章 肾上腺疾病：「小剂量地塞米松抑制试验……可排除库欣综合征」）","others":"甲状腺超声、胸片、骨扫描、PET-CT 都不是常规定位手段。","trap":"「先定性、再定位」。库欣病（垂体）vs 库欣综合征（肾上腺）要分清。"},"x121":{"why":"原醛症因肾上腺腺瘤或增生导致醛固酮分泌过多，作用于远曲小管和集合管，保钠排钾。表现为高血压伴低血钾（肌无力、周期性麻痹、多尿），血浆醛固酮升高、肾素降低，醛固酮/肾素比值（ARR）升高。（教材依据：《内科学》第10版 第七篇 第七章 肾上腺疾病：「原醛症……表现为高血压和低血钾的临床综合征」）","others":"低血压、高血钾的方向都反了。","trap":"「高血压 + 低血钾 = 想原醛」。查 ARR。"},"x122":{"why":"DKA 时因渗透性利尿、呕吐、摄入不足，总体钾是缺乏的；但酸中毒和胰岛素缺乏使钾从细胞内移到细胞外，血钾可正常甚至偏高。治疗开始后，补液稀释、胰岛素促钾内移，血钾会迅速下降，可能诱发致命性心律失常。因此：尿量恢复（>40 ml/h）、血钾 <5.5 mmol/L 时开始补钾；血钾 <3.3 mmol/L 时先补钾、暂缓胰岛素。（教材依据：《内科学》第10版 第七篇 第八章 糖尿病（酮症酸中毒·补钾时机：尿量恢复、血钾 <5.5 mmol/L））","others":"立即补钾可能造成高钾；全程不补钾会低钾；仅口服不够快；血钾高于 5.5 时补钾是反的。","trap":"「见尿补钾」——DKA 补钾的铁律，和外科补钾一个道理。"},"x123":{"why":"Whipple 三联征：①低血糖症状（心慌、出汗、饥饿、意识模糊）；②发作时血糖 <2.8 mmol/L；③供糖后症状迅速缓解。三条同时满足才能确诊低血糖症。空腹血糖 >7.0 mmol/L 是糖尿病标准，与低血糖无关。（教材依据：《内科学》第10版 第七篇 第九章 低血糖症：「Whipple三联征包括：①与低血糖相一致的症状；②症状存在时通过精确方法（通常是静脉血糖）测得血糖浓度偏低；③血糖水平升高后上述症状缓解」）","others":"A、B、C 都是三联征的内容；E 是补充说明。","trap":"「症状 + 血糖低 + 吃糖好 = Whipple 三联征」。"},"x124":{"why":"急性痛风性关节炎首选秋水仙碱或 NSAIDs（如依托考昔、双氯芬酸），也可用糖皮质激素。降尿酸药（别嘌醇、非布司他、苯溴马隆）不在急性期开始，应在急性缓解后 2～4 周启动，否则血尿酸波动可诱发或加重发作。（教材依据：《内科学》第10版 第八篇 第九章 痛风：「痛风防治原则：①控制高尿酸血症，预防尿酸盐沉积；②迅速控制急性关节炎发作」）","others":"别嘌醇、非布司他、苯溴马隆都是降尿酸药，急性期不用；长期口服激素不是首选。","trap":"「急性期灭火，缓解期降酸」。两条线别弄混。"},"x125":{"why":"抗环瓜氨酸肽（抗 CCP）抗体对类风湿关节炎特异性约 95%，可在关节破坏前出现，利于早期诊断和预后判断。类风湿因子（RF）敏感性高但特异性低。（教材依据：《内科学》第10版 第八篇 第八章 类风湿关节炎：「抗环瓜氨酸肽抗体（anti-CCP）是诊断RA的血清学标准之一，亦可更好地预测RA疾病进展和关节影像学改变」）","others":"抗 dsDNA、抗 Sm 是 SLE；ANCA 是血管炎；抗线粒体抗体是原发性胆汁性胆管炎。","trap":"「抗 CCP = 类风湿；抗 dsDNA/抗 Sm = 狼疮」。"},"x126":{"why":"抗 Sm 抗体是系统性红斑狼疮的标志性抗体，特异性高（约 99%）但敏感性低（20%～30%）。抗 dsDNA 抗体与疾病活动度相关（尤其狼疮肾炎）。两者都是 SLE 的特异性抗体。（教材依据：《内科学》第10版 第八篇 第三章 系统性红斑狼疮：「抗Sm抗体：是诊断SLE的标记抗体。特异度99%，但灵敏度仅25%」）","others":"抗 CCP 是类风湿；ANCA 是血管炎；抗 SSA 见于干燥综合征和 SLE；抗 Jo-1 是皮肌炎。","trap":"「抗 Sm = 特异；抗 dsDNA = 活动度」。两个 SLE 抗体分开记。"},"x127":{"why":"有机磷抑制胆碱酯酶，使乙酰胆碱堆积，出现毒蕈碱样（M）、烟碱样（N）和中枢症状。阿托品阻断 M 受体，缓解毒蕈碱样症状（治标）；碘解磷定等肟类复能剂使磷酰化胆碱酯酶脱磷酰化、恢复活性（治本）。两者联合使用。（教材依据：《内科学》第10版 第九篇 第二章 中毒：「OPI进入人体后，迅速与ChE结合形成稳定的磷酰化胆碱酶，失去分解乙酰胆碱能力」）","others":"纳洛酮是阿片拮抗剂；亚甲蓝治高铁血红蛋白血症；氟马西尼是苯二氮䓬拮抗剂。","trap":"「阿托品治标、解磷定治本」。两药合用才完整。"},"x128":{"why":"CO 与血红蛋白的亲和力约为 O₂ 的 240 倍，形成碳氧血红蛋白（COHb），使血红蛋白失去携氧能力；同时 CO 抑制细胞色素氧化酶，阻碍细胞利用氧。结果是组织缺氧，脑和心肌最敏感，可出现头痛、意识障碍、心肌损害。（教材依据：《内科学》第10版 第九篇 第二章 中毒：「吸入过量CO引起的中毒称急性CO中毒，俗称煤气中毒」）","others":"红细胞破坏、血小板减少、白细胞减少、凝血障碍都不是 CO 中毒的主要危害。","trap":"「CO 抢座位 → 缺氧」。皮肤樱桃红是特征，但脑损伤才是致命点。"},"x129":{"why":"成人高质量 CPR：胸外按压深度 5～6 cm，频率 100～120 次/分，按压与通气比 30:2，每次按压后让胸廓充分回弹，尽量减少按压中断。深度不够或频率不对都会显著降低复苏成功率。（教材依据：《内科学》第10版 第三篇 第十一章 心脏骤停与心脏性猝死（高质量心肺复苏：按压深度 5～6 cm、频率 100～120 次/分））","others":"其他组合深度或频率都不达标。","trap":"「5～6 cm、100～120 次」。这两个数字每年都考。"},"x130":{"why":"感染性休克早期属分布性休克：炎症介质使外周血管扩张、阻力降低，心输出量代偿性增加，病人皮肤温暖、脉压增大（暖休克）。若未及时纠正，可进展为低动力型（冷休克），心输出量下降、外周阻力升高、组织灌注恶化。（教材依据：《内科学》第10版 第三篇 循环系统疾病：「分布性休克（distributive shock）是休克中最为常见」）","others":"心输出量降低、外周阻力升高是冷休克或心源性休克；两者均低或均高都不符合暖休克。","trap":"「暖休克 = 高排低阻；冷休克 = 低排高阻」。"},"x131":{"why":"低钾血症时心肌复极延长，心电图表现为 T 波低平、ST 段下移、U 波明显（>0.1 mV），严重时出现心律失常。高钾则相反：T 波高尖、QRS 增宽、P 波消失。（教材依据：《外科学》第10版 第一篇 水、电解质代谢紊乱：「血清钾浓度低于3.5mmol/L称为低钾血症」）","others":"T 波高尖是髙钾；P 波消失、QRS 增宽是严重高钾；ST 段抬高是心梗或心包炎。","trap":"「低钾看 U 波，高钾看 T 波高尖」。两个方向别记反。"},"x132":{"why":"高钾血症危及生命时，首要处理是静注 10% 葡萄糖酸钙稳定心肌细胞膜电位、对抗心律失常（起效快但不降钾）。随后用胰岛素+葡萄糖、碳酸氢钠促进钾向细胞内转移，用呋塞米或透析排钾。（教材依据：《外科学》第10版 第一篇 水、电解质代谢紊乱：「10%葡萄糖酸钙溶液10～20ml稀释后缓慢静脉注射，该方法起效快但持续时间短」）","others":"口服钾剂、补钠、单纯利尿都不能立即对抗高钾的心脏毒性。","trap":"「高钾急救三步：稳心（钙）→ 转移（胰岛素+糖）→ 排钾（利尿/透析）」。"},"x133":{"why":"溶血反应是最严重的输血并发症，多因 ABO 血型不合（配错血）。受者体内抗体与供者红细胞结合，红细胞大量破坏，表现为寒战、高热、腰背痛、血红蛋白尿、低血压、急性肾衰竭，甚至死亡。应立即停止输血、抗休克、保护肾功能。（教材依据：《外科学》第10版 输血：「溶血反应是最严重的输血不良反应，发生率低但病死率高」）","others":"发热反应、过敏反应、循环超负荷、枸橼酸中毒都可发生，但严重程度不如溶血。","trap":"「最严重 = 溶血反应」。输血前双人核对是保命的关键。"},"x134":{"why":"破伤风由破伤风梭菌产生的外毒素（痉挛毒素）引起，表现为牙关紧闭、苦笑面容、角弓反张、肌肉强直痉挛。治疗包括：彻底清创（清除厌氧环境）、注射破伤风抗毒素（TAT）中和游离毒素、大剂量青霉素杀灭病原菌、镇静解痉、防治并发症。（教材依据：《外科学》第10版 破伤风：「在缺氧环境中，破伤风梭菌的芽胞发育为增殖体，迅速繁殖并产生大量外毒素」）","others":"清创、TAT、青霉素、解痉都是正确的治疗措施；糖皮质激素不是破伤风的常规治疗。","trap":"「破伤风 = 毒素病，清创 + TAT + 解痉」。"},"x135":{"why":"气性坏疽由产气荚膜梭菌等厌氧菌引起，多见于深部肌肉损伤、污染重、缺血缺氧的伤口。表现为伤肢剧痛、进行性肿胀、皮肤变紫、捻发音（皮下气肿）、恶臭、全身中毒症状重。治疗：急诊彻底清创（必要时截肢）+ 大剂量青霉素 + 高压氧。（教材依据：《外科学》第10版 外科感染：「气性坏疽是厌氧菌感染的一种，即梭状芽胞杆菌所致的肌坏死或肌炎」）","others":"金黄色葡萄球菌、链球菌、铜绿假单胞菌、大肠埃希菌都不是气性坏疽的主要病原。","trap":"「捻发音 + 恶臭 + 进展快 = 产气荚膜梭菌」。"},"x136":{"why":"中国九分法：头颈部 9%，双上肢 18%（每个上肢 9%），躯干 27%（前 13%、后 13%、会阴 1%），双下肢含臀部 46%（每个下肢 23%），总计 100%。儿童头大下肢短，比例不同。（教材依据：《外科学》第10版 烧伤：「双下肢加臀部占5个9%加1%，共为100%」）","others":"18% 是双上肢；27% 是躯干；9% 是头颈。","trap":"「头 9、臂 18、躯干 27、腿 46、会阴 1」。"},"x137":{"why":"国内常用烧伤补液公式：第一个 24 小时补液量 = 烧伤面积（%）× 体重（kg）× 1.5 ml（晶胶体）+ 基础水分 2000 ml。前 8 小时输入总量的一半，后 16 小时输入另一半。补液速度以尿量（成人 30～50 ml/h）为监测指标。（教材依据：《外科学》第10版 烧伤：「再加上基础水分2000ml……伤后8小时内补入计算失液量的一半，后16小时补入另一半」）","others":"0.5、2.5、3.5、5 都不是国内常用系数。","trap":"「1.5 × 面积 × 体重 + 2000」。前 8 小时先补一半，这是补液的速度题。"},"x138":{"why":"碘剂（复方碘化钾）抑制甲状腺激素释放（抑制蛋白水解酶），使甲状腺缩小、变硬、血供减少，减少术中出血。术前常用 2 周。但碘剂不能单独治疗甲亢，因为停用后激素释放会「反跳」。（教材依据：《外科学》第10版 甲状腺功能亢进的外科治疗：「碘剂：甲亢病人均应在术前服用抗甲状腺药物（过敏或不能耐受者除外），待甲亢症状得到基本控制后，改服2周碘剂，再进行手术」）","others":"抑制合成是抗甲状腺药物；增强麻醉、预防甲减、促进合成都不是碘剂的目的。","trap":"「碘剂 = 抑制释放、减少血供」。术前用，不单独治甲亢。"},"x139":{"why":"甲状腺大部切除时甲状旁腺可能被误切、损伤或血供受影响，导致甲状旁腺激素减少、低钙血症，表现为手足抽搐、Chvostek 征、Trousseau 征阳性，严重时喉痉挛窒息。治疗补充钙剂和维生素 D。（教材依据：《外科学》第10版 水、电解质代谢紊乱：「低钙血症时神经肌肉兴奋性升高，出现口周和指（趾）尖麻木及针刺感、手足抽搐」）","others":"喉返神经损伤致声音嘶哑；喉上神经损伤致饮水呛咳、音调降低；气管损伤致呼吸困难。","trap":"「术后手足抽搐 = 甲状旁腺损伤 = 低钙」。"},"x140":{"why":"癌细胞阻塞皮下淋巴管，淋巴回流障碍，真皮水肿；毛囊处皮肤被韧带牵拉而凹陷，形成「橘皮样」改变。若癌细胞侵犯 Cooper 韧带，使其缩短，则形成「酒窝征」。两者都是乳腺癌的典型体征。（教材依据：《外科学》第10版 乳腺癌：「'橘皮样'改变、酒窝征、静脉怒张等」）","others":"皮肤坏死、肿瘤内出血、脂肪坏死都不是橘皮样的原因。","trap":"「橘皮 = 淋巴管堵；酒窝 = Cooper 韧带牵拉」。两个体征分开记。"},"x141":{"why":"诊断性腹腔穿刺简便、快速、可在床旁进行。腹部闭合性损伤怀疑脾破裂时，穿刺抽出不凝血（因腹膜去纤维化作用，血不凝固）提示腹腔内出血。血流动力学稳定者可进一步行 CT 明确。（教材依据：《外科学》第10版 腹部损伤：「如果抽到不凝血，提示脏器破裂所致内出血，因腹膜的去纤维作用而使血液不凝固」）","others":"CT 准确但需搬动、费时；X 线、B 超、淀粉酶都不是首选。","trap":"「腹穿抽到不凝血 = 腹腔内出血」。这是急诊外科的基本功。"},"x142":{"why":"机械性肠梗阻的共同表现是腹痛、呕吐、腹胀、停止排气排便。关键是判断有无绞窄：出现持续性剧烈腹痛、腹膜刺激征、血性腹水、发热、白细胞升高、休克，提示肠管血运障碍，需急诊手术。（教材依据：《外科学》第10版 肠梗阻：「如果腹痛的间歇期不断缩短，以致成为剧烈的持续性腹痛，则应该警惕可能是绞窄性肠梗阻的表现」）","others":"有无腹痛、呕吐、腹胀都是共性表现，不能区分绞窄。","trap":"「持续剧痛 + 腹膜刺激征 = 绞窄 = 急诊手术」。"},"x143":{"why":"胃癌以淋巴道转移为主，可转移至胃周围淋巴结、腹腔淋巴结，晚期可经胸导管转移至左锁骨上淋巴结（Virchow 淋巴结），有诊断意义。血道转移常见于肝，腹腔种植可形成 Krukenberg 瘤（卵巢）。（教材依据：《外科学》第10版 胃癌：「一般情况下按淋巴流向转移，少数情况也有跳跃式转移」）","others":"直接蔓延、血道、腹腔种植都可发生，但淋巴道是最主要途径。","trap":"「胃癌 = 淋巴道；左锁骨上淋巴结 = Virchow」。"},"x144":{"why":"CEA（癌胚抗原）对结直肠癌的辅助诊断、疗效监测和复发判断有价值，但特异性不高（吸烟、炎症、其他肿瘤也可升高）。术前 CEA 升高、术后下降提示有效；术后再升高提示复发。（教材依据：《外科学》第10版 结肠癌：「血清癌胚抗原（CEA）和糖类抗原19-9（CA19-9）分别在约45%和30%的结肠癌病人中升高」）","others":"AFP 是肝癌；CA19-9 是胰腺癌；PSA 是前列腺癌；CA125 是卵巢癌。","trap":"「结直肠癌 = CEA；肝癌 = AFP；胰腺癌 = CA19-9；前列腺 = PSA」。"},"x145":{"why":"胆囊结石引起胆绞痛多在饱餐（尤其油腻）后或夜间发作：胆囊收缩，结石嵌顿于胆囊管，胆囊内压升高，表现为右上腹阵发性绞痛、向右肩背部放射，伴恶心呕吐。合并感染时出现发热、黄疸（Charcot 三联征）。（教材依据：《外科学》第10版 胆囊结石：「胆囊结石的典型症状为胆绞痛……典型发作是在饱餐、进食油腻食物后或睡眠中体位改变时」）","others":"持续剧痛伴发热黄疸是急性胆管炎；全腹压痛反跳痛是腹膜炎；转移性右下腹痛是阑尾炎；束带样痛是胰腺炎。","trap":"「胆绞痛 = 右上腹 + 右肩背放射 + 油腻诱发」。"},"x146":{"why":"AFP > 400 μg/L 持续 4 周，或 >200 μg/L 持续 8 周，结合肝炎病史和影像学（肝占位、增强扫描快进快出）可临床诊断原发性肝癌。AFP 阴性者约占 30%，需靠影像和活检。（教材依据：《外科学》第10版 肿瘤：「甲胎蛋白（AFP）是动物胎儿期由卵黄囊、肝、胃肠道产生的一种球蛋白，肝癌及恶性畸胎瘤者均可增高」）","others":"CEA 是结直肠癌；CA19-9 是胰腺癌；PSA 是前列腺癌；CA125 是卵巢癌。","trap":"「肝癌 = AFP」。记住「400 持续 4 周、200 持续 8 周」这个门槛。"},"x147":{"why":"胰头癌压迫胆总管下端，导致胆汁排出受阻，出现无痛性、进行性黄疸，伴皮肤瘙痒、陶土样便、浓茶样尿。查体可触及肿大的胆囊而无压痛（Courvoisier 征）。常伴消瘦、腹痛、糖尿病。（教材依据：《外科学》第10版 胰腺癌：「黄疸是胰头癌最突出的临床表现，通常呈进行性加重……胆囊显著肿大，但无压痛，称为库瓦西耶（Courvoisier）征」）","others":"转移性右下腹痛是阑尾炎；呕血是上消化道出血；腹泻、低血糖不是胰头癌的典型表现。","trap":"「无痛性进行性黄疸 + 胆囊肿大 = 胰头癌（Courvoisier 征）」。"},"x148":{"why":"输尿管结石急性发作表现为肾绞痛：腰部或上腹部绞痛，向下腹、腹股沟、会阴部放射，伴恶心呕吐、镜下或肉眼血尿。结石在输尿管狭窄处嵌顿时疼痛最剧。（教材依据：《外科学》第10版 上尿路结石：「输尿管结石可引起肾绞痛或输尿管绞痛……沿输尿管行径放射至同侧腹股沟」）","others":"无痛性肉眼血尿提示泌尿系肿瘤；尿频尿急尿痛是膀胱炎；排尿困难是前列腺增生；发热寒战提示感染。","trap":"「肾绞痛 + 血尿 = 输尿管结石」。"},"x149":{"why":"良性前列腺增生最早出现的症状是尿频，尤其是夜间尿频（夜尿增多），随后出现进行性排尿困难、尿线变细、尿后滴沥、尿潴留。直肠指检可触及增大的前列腺，PSA 用于排除前列腺癌。（教材依据：《外科学》第10版 泌尿、男生殖系统外科疾病：「良性前列腺增生最常见的早期症状是尿频，以夜尿更明显」）","others":"尿潴留是晚期表现；血尿、尿失禁、肾功能不全都是并发症。","trap":"「前列腺增生 = 先尿频（夜尿多），后排尿困难」。"},"x150":{"why":"肾癌典型三联征为血尿、腰痛、腹部肿块，但三者同时出现多属晚期。肾癌还可分泌 EPO、PTHrP、肾素等，引起副肿瘤综合征（红细胞增多、高钙血症、高血压）。（教材依据：《外科学》第10版 泌尿、男生殖系统肿瘤（肾癌：血尿、腰痛、肿块三联征））","others":"发热、消瘦、贫血是全身表现；高血压、低血钾、肥胖是原醛/库欣；尿频尿急尿痛是感染；水肿蛋白尿高血压是肾炎。","trap":"「肾癌三联征 = 血尿 + 腰痛 + 肿块」。副肿瘤综合征也别忘。"},"x151":{"why":"骨折愈合分三期：①血肿炎症机化期（2～3 周）；②原始骨痂形成期（纤维骨痂→骨性骨痂，约 4～8 周）；③骨痂改造塑形期（数月到数年）。最终恢复骨的连续性和力学强度。（教材依据：《外科学》第10版 骨折愈合：「血肿机化形成肉芽组织……纤维连接过程，约在骨折后2周完成」）","others":"血肿、瘢痕、软骨、脂肪都不是连接骨折端的主要组织。","trap":"「血肿 → 纤维骨痂 → 骨性骨痂 → 塑形」。四步走。"},"x152":{"why":"直腿抬高试验：患者仰卧、伸膝、被动抬高患肢，<60° 出现沿坐骨神经分布的放射痛为阳性；加强试验（缓慢放低至疼痛消失，再背屈踝关节又痛）阳性，提示神经根受压。是腰椎间盘突出症的典型体征。（教材依据：《外科学》第10版 腰椎间盘突出症：「直腿抬高试验及加强试验」）","others":"巴宾斯基征、膝反射亢进、病理征阳性是上运动神经元损害；足下垂是腓总神经损伤。","trap":"「直腿抬高 <60° 放射痛 = 腰突」。"},"x153":{"why":"骨肉瘤好发于青少年长骨干骺端（股骨远端、胫骨近端），X 线表现为骨质破坏、Codman 三角（骨膜反应）、日光射线征、软组织肿块，易发生肺转移。治疗以新辅助化疗+手术为主。（教材依据：《外科学》第10版 骨肿瘤：「Codman三角或呈'日光射线'形态」）","others":"骨折线、骨质增生、关节间隙狭窄、骨囊肿都不是骨肉瘤的特征。","trap":"「Codman 三角 + 日光射线 = 骨肉瘤」。青少年 + 膝关节痛要警惕。"},"x154":{"why":"超急性排斥反应由受者体内预存的抗体（ABO 血型抗体、抗 HLA 抗体）介导，移植后数分钟至 24 小时内发生：抗体结合移植物血管内皮，激活补体，血栓形成、组织坏死，移植器官迅速无功能。无法逆转，只能切除。（教材依据：《外科学》第10版 移植排斥反应：「超急性排斥反应……发生于移植物在受体体内恢复血流后数分钟至数小时……由于受体预先存在抗供体抗原的抗体」）","others":"急性排斥多在 1 周至数月；慢性排斥在数月至数年。","trap":"「超急性 = 分钟到小时；急性 = 周到月；慢性 = 月到年」。"},"x155":{"why":"腰麻后头痛（低颅压性头痛）最常见，因穿刺针孔脑脊液漏出、颅内压降低所致。表现为坐起或站立时加重、平卧缓解。预防：用细针、术后去枕平卧 6 小时、多饮水。（教材依据：《外科学》第10版 椎管内麻醉（腰麻后头痛：最常见的并发症））","others":"截瘫、感染、硬膜外血肿、全脊髓麻醉都是严重但少见的并发症。","trap":"「腰麻后头痛 = 低颅压 = 平卧缓解」。"},"x156":{"why":"麻醉后贲门松弛、吞咽反射消失，胃内容物易反流误吸，导致吸入性肺炎（Mendelson 综合征）甚至窒息。成人择期手术前禁食 8 小时、禁饮 2 小时（清饮料）。（教材依据：《外科学》第10版 麻醉：「吸入酸性胃液可导致支气管痉挛和哮喘样发作，并引发吸入性肺炎……称为Mendelson综合征」）","others":"减轻疼痛、降血压、预防感染、促进愈合都不是禁食的主要目的。","trap":"「禁食 8 小时、禁饮 2 小时 = 防误吸」。"},"x157":{"why":"Ⅰ 类清洁切口：手术未进入感染炎症区，未进入呼吸道、消化道、泌尿道（如甲状腺、乳腺、疝）。Ⅱ 类清洁-污染切口：进入上述腔道但无明显污染（如胃、肠道、胆道手术）。Ⅲ 类污染切口：有感染或明显污染（如阑尾穿孔、脓肿切开、开放性外伤）。（教材依据：《外科学》第10版 围手术期处理：「清洁切口（Ⅰ类切口）：指缝合的无菌切口，如甲状腺大部切除术等」）","others":"B 是 Ⅱ 类；C、D、E 描述的是污染或感染切口。","trap":"「Ⅰ 清洁、Ⅱ 清洁-污染、Ⅲ 污染」。切口分类决定是否预防用抗生素。"},"x158":{"why":"深静脉血栓（DVT）预防：早期下床活动、间歇充气加压装置（IPC）、梯度压力弹力袜，机械性地促进静脉回流。高危患者联合低分子肝素抗凝。（教材依据：《外科学》第10版 围手术期处理：「深静脉血栓形成，根据危险因素及出血风险，给予药物或者物理预防」）","others":"卧床休息、抬高患肢、冷敷、按摩都不能预防，按摩反而可能使血栓脱落。","trap":"「早活动 + 气压泵 = 防 DVT」。按摩下肢是禁忌。"},"x159":{"why":"急性化脓性阑尾炎确诊后应尽早行阑尾切除术。若已形成阑尾周围脓肿，先抗感染治疗，3 个月后择期手术。保守治疗仅适用于不能耐受手术或早期单纯性阑尾炎。（教材依据：《外科学》第10版 急性阑尾炎：「急性化脓性阑尾炎……常由单纯性阑尾炎发展而来」）","others":"保守治疗、仅引流、肠切除吻合、单纯抗生素都不是化脓性阑尾炎的标准治疗。","trap":"「化脓性阑尾炎 = 手术」。阑尾周围脓肿 = 先保守、3 个月后择期。"},"x160":{"why":"α-螺旋是蛋白质的二级结构，多肽链主链盘绕成右手螺旋，每个氨基酸残基的 N-H 与前面第 4 个残基的 C=O 形成氢键，维持螺旋稳定。三级结构才靠疏水作用、二硫键等。（教材依据：《生物化学与分子生物学》第10版 第一章 蛋白质的结构与功能：「α-螺旋是常见的蛋白质二级结构」）","others":"肽键是一级结构；二硫键、疏水作用、离子键维持三级结构。","trap":"「二级靠氢键，三级靠疏水/二硫键」。"},"x161":{"why":"米氏常数 Km 是反应速度达最大速度一半时的底物浓度，单位是浓度。Km 越小，表示酶与底物的亲和力越大，达到半数最大速度所需的底物越少。Km 是酶的特征常数，与酶浓度无关。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应：「当k3远远小于k2时，Km≈k2/k1……此时，Km代表酶对底物的亲和力」）","others":"Vmax 是最大反应速度；Km 不是酶浓度、分子量、激活剂浓度。","trap":"「Km 小 = 亲和力大」。记「Km 是半速时的底物浓度」。"},"x162":{"why":"竞争性抑制剂与底物结构相似，竞争酶的活性中心。增加底物浓度可竞争性地解除抑制，故最大速度 Vmax 不变，但达到半速所需的底物浓度增大（Km 增大）。非竞争性抑制 Vmax 降低、Km 不变。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应：「磺胺类药物与对氨基苯甲酸的化学结构相似，竞争性地与二氢蝶酸合酶结合」）","others":"B、C、D、E 的变化方向都不对。","trap":"「竞争性：Km↑、Vmax 不变；非竞争性：Km 不变、Vmax↓」。"},"x163":{"why":"糖酵解在胞质中进行，1 分子葡萄糖消耗 2 ATP（己糖激酶、磷酸果糖激酶-1），生成 4 ATP（两次底物水平磷酸化），净生成 2 ATP。无氧时丙酮酸还原为乳酸，使 NAD⁺ 再生、糖酵解持续。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢：「1分子葡萄糖通过底物水平磷酸化净生成2分子ATP」）","others":"0 是错的（净赚 2）；4 是总生成不是净生成；6、8 不对。","trap":"「糖酵解净 2、有氧氧化净 30～32」。注意「净」字。"},"x164":{"why":"糖异生由乳酸、氨基酸、甘油等非糖物质合成葡萄糖，主要在肝（其次肾）。关键酶：丙酮酸羧化酶、磷酸烯醇式丙酮酸羧激酶（PEPCK）、果糖二磷酸酶-1、葡萄糖-6-磷酸酶。这四个酶绕过糖酵解的三个不可逆反应。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢：「糖酵解中3个不可逆的限速步骤，其逆反应需要由糖异生特有的关键酶催化」）","others":"磷酸果糖激酶-1 是糖酵解的关键酶，方向相反。","trap":"「糖异生四酶：丙酮酸羧化酶、PEPCK、F-1,6-BPase、G-6-Pase」。"},"x165":{"why":"糖原分解的关键酶是糖原磷酸化酶，催化糖原非还原端葡萄糖残基磷酸解，生成葡萄糖-1-磷酸。糖原合成的关键酶是糖原合酶，催化 UDP-葡萄糖加到糖原引物上。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢：「糖原磷酸化酶是糖原分解的关键酶，它只能作用于α-1，4-糖苷键」）","others":"己糖激酶、丙酮酸激酶、葡萄糖激酶都不是糖原分解的限速酶。","trap":"「分解看磷酸化酶，合成看合酶」。一对反向酶。"},"x166":{"why":"长链脂肪酸在胞质活化生成脂酰 CoA，不能直接穿过线粒体内膜，需与肉碱结合，由肉碱-脂酰转移酶Ⅰ（CPT-Ⅰ）转运进入线粒体，再进行 β 氧化。CPT-Ⅰ 是脂肪酸氧化的限速步骤。（教材依据：《生物化学与分子生物学》第10版 第八章 脂质代谢：「脂肪酸被氧化前必须先活化，由脂肪酰CoA合成酶催化生成脂肪酰CoA」）","others":"简单扩散、钠泵、钙通道、葡萄糖转运体都不对。","trap":"「肉碱是脂肪酸进线粒体的摆渡车」。CPT-Ⅰ 缺乏→低酮性低血糖。"},"x167":{"why":"HMG-CoA 还原酶是胆固醇合成的限速酶，催化 HMG-CoA 还原为甲羟戊酸。他汀类降脂药即抑制此酶，减少胆固醇合成，同时上调肝细胞 LDL 受体、降低血 LDL。（教材依据：《生物化学与分子生物学》第10版 第八章 脂质代谢：「胆固醇及其氧化产物……可以通过别构调节对HMG-CoA还原酶活性产生较强抑制作用」）","others":"HMG-CoA 合酶不是限速酶；AST、ALT 是转氨酶；脂蛋白脂肪酶水解甘油三酯。","trap":"「他汀 = 抑制 HMG-CoA 还原酶」。"},"x168":{"why":"ALT（丙氨酸氨基转移酶）和 AST（天冬氨酸氨基转移酶）以磷酸吡哆醛（维生素 B6 的活性形式）为辅酶，催化氨基酸与 α-酮酸之间的氨基转移，是氨基酸代谢的核心反应。（教材依据：《生物化学与分子生物学》第10版 第九章 氨基酸代谢：「氨基转移酶的辅基是维生素B6的磷酸酯，即磷酸吡哆醛」）","others":"TPP 是维生素 B1；FAD 是 B2；NAD⁺ 是 PP；生物素是 B7。","trap":"「转氨酶 = 磷酸吡哆醛 = 维生素 B6」。"},"x169":{"why":"ALT 主要分布于肝细胞胞质，急性肝炎时肝细胞损伤、膜通透性增加，ALT 大量释放入血，升高幅度常大于 AST。AST 在线粒体较多，心肌梗死、肝炎、肌病均可升高。ALP、GGT 升高提示胆道梗阻。（教材依据：《生物化学与分子生物学》第10版 第九章 氨基酸代谢：「谷丙转氨酶（GPT）亦称丙氨酸转氨酶」）","others":"AST 特异性不如 ALT；ALP、GGT 是胆道；CK 是肌肉。","trap":"「ALT 看肝、AST 看心肝、ALP/GGT 看胆」。"},"x170":{"why":"人类缺乏尿酸酶，嘌呤分解代谢的终产物是尿酸。尿酸生成过多（高嘌呤饮食、细胞破坏、酶缺陷）或排泄减少（肾功能不全、药物）导致高尿酸血症，尿酸盐结晶沉积在关节、肾脏，引起痛风。（教材依据：《生物化学与分子生物学》第10版 第十一章 核苷酸代谢：「嘌呤在人体内分解代谢的终产物是尿酸，黄嘌呤氧化酶是这个代谢过程的关键酶」）","others":"尿素是氨的终产物；氨来自氨基酸脱氨；肌酐来自肌酸；胆红素来自血红素。","trap":"「嘌呤 → 尿酸；氨 → 尿素；血红素 → 胆红素」。三条代谢终点别混。"},"x171":{"why":"DNA 聚合酶不能从头起始合成，只能把核苷酸加到已有的 3'-OH 端。因此复制起始时，引物酶先合成一段 RNA 引物，DNA 聚合酶Ⅲ 再在引物 3'-OH 端延伸 DNA 链。复制方向始终 5'→3'。（教材依据：《生物化学与分子生物学》第10版 第十四章 DNA的合成：「引发酶属于RNA聚合酶，故复制起始部位合成的短链引物RNA为DNA的合成提供3′-OH末端」）","others":"DNA 聚合酶Ⅲ是延伸；解旋酶解链；连接酶连接片段；拓扑异构酶解超螺旋。","trap":"「先引物（RNA）、后延伸（DNA）」。"},"x172":{"why":"真核生物有三种 RNA 聚合酶：Ⅰ 合成 rRNA（45S 前体），Ⅱ 合成 mRNA（hnRNA）和部分 snRNA，Ⅲ 合成 tRNA 和 5S rRNA。RNA 聚合酶Ⅱ 需要转录因子和 TATA 盒。（教材依据：《生物化学与分子生物学》第10版 第十五章 RNA的生物合成：「RNA pol Ⅱ催化基因转录的过程」）","others":"聚合酶Ⅰ、Ⅲ 的产物不对；逆转录酶、端粒酶不是转录 mRNA 的酶。","trap":"「Ⅰ-rRNA、Ⅱ-mRNA、Ⅲ-tRNA」。"},"x173":{"why":"TATA 盒位于转录起始点上游约 -25～-30 bp，是 RNA 聚合酶Ⅱ 转录起始的核心启动元件，与 TBP（TATA 结合蛋白）结合，招募转录因子和聚合酶Ⅱ。（教材依据：《生物化学与分子生物学》第10版 第十五章 RNA的生物合成：「转录起始点至上游-37bp的启动子区域是核心启动子区」）","others":"CCAAT 盒、GC 盒是上游激活元件；增强子、沉默子是远距离调控元件。","trap":"「TATA 盒 = 真核 mRNA 启动子核心」。"},"x174":{"why":"简并性指一种氨基酸可由两个或更多密码子编码（如亮氨酸有 6 个、甲硫氨酸只有 1 个），可减少基因突变的有害影响。密码子的通用性、连续性、不重叠性都是其他特征。（教材依据：《生物化学与分子生物学》第10版 第十六章 蛋白质的合成：「遗传密码的简并性可减少基因突变所带来的生物学效应」）","others":"A 反了；C、D、E 是其他特性，不是简并性。","trap":"「简并 = 多对一（多个密码子→一个氨基酸）」。"},"x175":{"why":"蛋白质合成中，核糖体大亚基的 rRNA 具有肽酰转移酶活性（核酶），催化 P 位肽酰基转移到 A 位氨基酰-tRNA 的氨基上，形成肽键。这一过程不需要额外的蛋白酶的参与。（教材依据：《生物化学与分子生物学》第10版 第十六章 蛋白质的合成：「氯霉素、林可霉素、红霉素……抑制肽酰转移酶」）","others":"tRNA 搬运氨基酸；起始因子、延伸因子辅助；氨酰-tRNA 合成酶负责活化氨基酸。","trap":"「肽键由 rRNA 催化」。这是「RNA 世界」的证据之一。"},"x176":{"why":"PCR 每轮循环：①变性（94～95℃，双链解开）；②退火（50～60℃，引物与模板互补结合）；③延伸（72℃，Taq DNA 聚合酶沿引物 3'-OH 合成新链）。反复循环使目标 DNA 呈指数扩增。（教材依据：《生物化学与分子生物学》第10版 第十八章 常用的分子生物学技术：「组成PCR反应体系的基本成分包括模板DNA、特异引物、耐热的DNA聚合酶」）","others":"其他顺序都不符合 PCR 原理。","trap":"「变性 → 退火 → 延伸」。三步循环，每轮翻倍。"},"x177":{"why":"Southern blot 用 DNA 探针检测 DNA；Northern blot 检测 RNA 表达；Western blot 用抗体检测蛋白质。三者分别对应 DNA、RNA、蛋白三个层次。（教材依据：《生物化学与分子生物学》第10版 第十八章 常用的分子生物学技术：「探针序列如果与NC膜上的核酸存在碱基序列互补，就可以结合到膜上的相应DNA或RNA区带」）","others":"PCR-SSCP 是突变筛查；ELISA 是抗原抗体检测。","trap":"「S-D、N-R、W-P」（Southern-DNA、Northern-RNA、Western-Protein）。"},"x178":{"why":"维生素 B1（硫胺素）在体内转变为焦磷酸硫胺素（TPP），是 α-酮酸氧化脱羧酶（丙酮酸脱氢酶、α-酮戊二酸脱氢酶）和转酮醇酶的辅酶。缺乏时糖代谢受阻，神经和心肌受累，表现为脚气病、Wernicke 脑病。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素：「维生素B1的活性形式是焦磷酸硫胺素」）","others":"FAD 是 B2；NAD⁺ 是 PP；磷酸吡哆醛是 B6；辅酶 A 是泛酸。","trap":"「B1 = TPP = 脱羧酶帮手」。"},"x179":{"why":"维生素 B2（核黄素）形成 FAD 和 FMN，是多种氧化还原酶（琥珀酸脱氢酶、黄素蛋白、NADH 脱氢酶等）的辅酶，参与呼吸链电子传递。缺乏可致口角炎、舌炎、脂溢性皮炎。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素：「FMN和FAD是维生素B2与核苷酸形成的有机化合物」）","others":"TPP 是 B1；NAD⁺ 是 PP；磷酸吡哆醛是 B6；四氢叶酸是叶酸。","trap":"「B2 = FAD/FMN = 电子传递」。"},"x180":{"why":"维生素 PP（烟酸、烟酰胺）形成 NAD⁺ 和 NADP⁺，是多种脱氢酶（乳酸脱氢酶、异柠檬酸脱氢酶、苹果酸脱氢酶等）的辅酶，在氧化还原反应中传递电子。缺乏可致癞皮病（三 D：皮炎、腹泻、痴呆）。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素：「维生素PP的活性形式为NAD+和NADP+，两者是不需氧脱氢酶的辅因子」）","others":"FAD 是 B2；TPP 是 B1；辅酶 A 是泛酸；生物素是 B7。","trap":"「PP = NAD⁺/NADP⁺ = 脱氢酶」。"},"x181":{"why":"叶酸以四氢叶酸（THF）形式携带一碳单位，参与嘌呤、嘧啶合成和氨基酸代谢。维生素 B12 参与甲基转移，使甲基四氢叶酸再生成四氢叶酸。B12 缺乏时，叶酸被「锁」在甲基形式，导致巨幼细胞贫血。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素：「FH4是体内一碳单位转移酶的辅因子，分子中N5、N10是一碳单位的结合位点」）","others":"维生素 C、D、E、K 不参与一碳单位代谢。","trap":"「B12 帮叶酸回收」——所以 B12 缺乏也会巨幼贫。"},"x182":{"why":"ALA（δ-氨基-γ-酮戊酸）合酶是血红素合成的限速酶，受血红素反馈抑制。铅可抑制 ALA 合酶和亚铁螯合酶，导致血红素合成障碍，表现为铅中毒性贫血和卟啉代谢异常。（教材依据：《生物化学与分子生物学》第10版 第二十六章 血液的生物化学：「血红素还可以阻抑ALA合酶的合成。由于磷酸吡哆醛是该酶的辅酶，维生素B6缺乏将影响血红素的合成」）","others":"胆色素原脱氨酶、亚铁螯合酶、血红素加氧酶都不是限速酶。","trap":"「血红素 = ALA 合酶；铅中毒 = 抑制它」。"},"x183":{"why":"未结合胆红素（间接胆红素）脂溶性、与白蛋白结合运输、不能经肾排出、可透过血脑屏障（新生儿核黄疸）。结合胆红素（直接胆红素）水溶性、可经尿排出、不能透过血脑屏障。（教材依据：《生物化学与分子生物学》第10版 第二十五章 肝的生物化学：「过多的游离胆红素因脂溶性质易穿透细胞膜进入细胞」）","others":"A、B、C、D 都是未结合胆红素的特点；E 是结合胆红素的特点。","trap":"「未结合 = 脂溶、不排、进脑；结合 = 水溶、可排」。"},"x184":{"why":"乳酸脱氢酶有五种同工酶，LDH1（H₄）主要存在于心肌和红细胞，LDH5（M₄）主要存在于肝和骨骼肌。心肌梗死时 LDH1 升高，且 LDH1/LDH2 > 1（翻转），有诊断价值。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应：「LDH由骨骼肌型（M型）和心肌型（H型）两种类型的亚基……组成5种同工酶，即LDH1（H4）」）","others":"LDH2 在心肌也有但不如 LDH1；LDH3 在肺、脾；LDH4 在肝、骨骼肌；LDH5 主要在肝。","trap":"「心梗 = LDH1 升高 + LDH1/LDH2 > 1」。"},"x185":{"why":"肌酸激酶（CK）有三种同工酶：CK-MM（骨骼肌）、CK-MB（心肌）、CK-BB（脑）。CK-MB 主要存在于心肌，心肌梗死 4～6 小时升高、24 小时达峰，特异性高于总 CK。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应（同工酶·CK-MB 主要存在于心肌））","others":"CK-MM 在骨骼肌；CK-BB 在脑；两者联合也不能替代 CK-MB 对心肌的特异性。","trap":"「心梗 = CK-MB 升高」。4～6 小时升高、24 小时达峰。"},"x186":{"why":"乳糜微粒（CM）含甘油三酯约 90%，密度最低，由小肠黏膜合成，经淋巴入血，运输外源性甘油三酯。VLDL 运输内源性甘油三酯，LDL 运输胆固醇，HDL 逆向转运胆固醇。（教材依据：《生物化学与分子生物学》第10版 第八章 脂质代谢：「乳糜微粒含脂最多，密度最小，易上浮」）","others":"VLDL、LDL、HDL 的甘油三酯含量和密度都不如 CM。","trap":"「CM = 外源甘油三酯，密度最低」。"},"x187":{"why":"5-氟尿嘧啶（5-FU）在体内转化为 FdUMP，抑制胸苷酸合酶，阻断 dTMP 合成，从而抑制 DNA 合成。甲氨蝶呤抑制二氢叶酸还原酶；6-巯基嘌呤抑制嘌呤合成；羟基脲抑制核糖核苷酸还原酶。（教材依据：《生物化学与分子生物学》第10版 第十一章 核苷酸代谢：「5-FU本身并无生物学活性，必须在体内转变成脱氧氟尿嘧啶核苷一磷酸（FdUMP）」）","others":"B 是甲氨蝶呤；C 是 6-MP；D 是羟基脲；E 不是 5-FU 的直接机制。","trap":"「5-FU → 胸苷酸合酶；MTX → 二氢叶酸还原酶」。"},"x188":{"why":"氨以两种无毒形式运输：①丙氨酸-葡萄糖循环：肌肉将氨转给丙酮酸生成丙氨酸，运至肝；②谷氨酰胺：脑和肌肉将氨合成谷氨酰胺，运至肝、肾，再分解成氨和谷氨酸。尿素是氨的终产物。（教材依据：《生物化学与分子生物学》第10版 第九章 氨基酸代谢：「谷氨酰胺是另一种转运氨的形式，它主要从脑和骨骼肌等组织向肝或肾运氨」）","others":"尿素是终产物不是运输形式；游离氨毒性大不能直接运输；谷氨酸、天冬氨酸是中间产物。","trap":"「氨运输 = 丙氨酸 + 谷氨酰胺；氨终产物 = 尿素」。"},"x189":{"why":"缺血缺氧使 ATP 生成减少，钠泵（Na⁺-K⁺-ATP 酶）能量不足，细胞内钠离子不能被泵出，渗透压升高，水随之进入细胞，导致细胞水肿（水样变性）。这是最常见、最轻的可逆性损伤。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「缺血、缺氧是细胞损伤最常见的原因……去除病因后，细胞水肿、脂肪变等损伤大多数可恢复正常」）","others":"遗传性酶缺陷引起的是代谢性疾病；维生素缺乏、放射线、免疫损伤也可引起损伤，但不是细胞水肿最常见的病因。","trap":"「缺氧→ATP 少→钠泵停→水进来」——这是可逆性损伤的经典链条。"},"x190":{"why":"废用性萎缩指器官或组织长期功能活动减少、神经内分泌刺激不足，导致实质细胞体积缩小、数量减少。骨折固定、长期卧床、太空失重都属于此类。（教材依据：《病理学》第10版 第二章 损伤的修复：「局部长期固定不动也会引起骨及肌肉的失用性萎缩」）","others":"肥大是体积增大；增生是数量增多；化生是类型转变；变性是细胞内物质蓄积，不是体积缩小。","trap":"「不用就缩」——废用性萎缩。"},"x191":{"why":"高血压使左心室压力负荷长期增加，心肌细胞体积增大（肥大），心室壁增厚、心腔相对变小，称为向心性肥大。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「主要为左心室肥大，是对持续性血压升高，心肌工作负荷增加的一种适应性反应」）","others":"增生是细胞数量增多（心肌细胞是终末分化细胞，不能增生）；化生、萎缩、变性都不符。","trap":"「心肌只会变大、不会变多」——所以是肥大。"},"x192":{"why":"干性坏疽多发生于四肢末端，动脉阻塞而静脉回流仍通畅，坏死组织水分蒸发、干燥皱缩、呈黑褐色，与健康组织分界清楚，腐败菌感染较轻。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「（1）干性坏疽（drygangrene）：常见于动脉阻塞但静脉回流尚通畅的四肢末端，因水分散失较多，故坏死区干燥皱缩呈黑色」）","others":"肺、肠、子宫因与外界相通、含水多，易发生湿性坏疽；阑尾、脑不是干性坏疽的典型部位。","trap":"「四肢末端 + 干 + 界限清 = 干性坏疽」。"},"x193":{"why":"湿性坏疽多见于肺、肠、子宫等与外界相通的内脏，坏死组织含水多、腐败菌感染重，呈污黑色或暗绿色、肿胀恶臭，与健康组织分界不清，易引起全身中毒。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤（湿性坏疽：多见于肺、肠、子宫等与外界相通的内脏））","others":"四肢末端是干性坏疽；皮肤表面、骨骼、脑不是湿性坏疽的典型部位。","trap":"「内脏 + 湿 + 臭 + 界限不清 = 湿性坏疽」。"},"x194":{"why":"肉芽组织由新生毛细血管、成纤维细胞和炎症细胞构成，功能包括：抗感染保护创面、填补缺损、机化或包裹坏死组织/血栓/异物、最终形成瘢痕组织。（教材依据：《病理学》第10版 第一章 细胞和组织的适应与损伤：「肉芽组织长入并取代坏死组织、血栓、脓液、异物等的过程，称为机化」）","others":"抗感染、填补、机化、形成瘢痕都是肉芽组织的真实功能；分泌激素是内分泌器官的功能。","trap":"「修理工四件套：抗感染、填坑、机化、变瘢痕」。"},"x195":{"why":"一期愈合见于组织缺损少、创缘整齐、无感染、经粘合或缝合后对合严密的伤口，炎症反应轻，肉芽组织少，愈合时间短、瘢痕小。（教材依据：《病理学》第10版 第二章 损伤的修复：「一期愈合（healingbyfirstintention）见于组织缺损少、创缘整齐、无感染、经黏合或缝合后创面对合严密的伤口」）","others":"创缘不整、有感染、需大量肉芽填充、瘢痕大都是二期愈合的特点。","trap":"「整齐无感染 = 一期；缺损大感染 = 二期」。"},"x196":{"why":"长期慢性淤血使局部缺氧、代谢产物堆积，实质细胞萎缩、变性甚至死亡，间质纤维组织增生、网状纤维胶原化，器官逐渐变硬，称为淤血性硬化（如心源性肝硬化、肺褐色硬化）。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「长时间的淤血……间质纤维组织增生……出现淤血性硬化」）","others":"萎缩性硬化、代偿性肥大、坏死后钙化、淀粉样变都是其他病理过程。","trap":"「慢性淤血 → 淤血性硬化」（槟榔肝、肺褐色硬化）。"},"x197":{"why":"体循环动脉栓塞的栓子约 80% 来自左心腔（房颤、心梗附壁血栓、感染性心内膜炎赘生物）和主动脉粥样斑块，随血流栓塞脑、脾、肾、下肢等。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「约80%体循环动脉栓塞的栓子来自左心腔」）","others":"右心房和下肢深静脉的栓子引起肺栓塞；门静脉、肠系膜静脉栓子引起门静脉系统栓塞。","trap":"「左心 → 体循环；右心/静脉 → 肺循环」。"},"x198":{"why":"长骨（股骨、胫骨）骨折或骨科手术时，骨髓脂肪滴进入破裂的静脉窦，随血流至肺，造成肺脂肪栓塞，表现为呼吸困难、意识障碍、皮肤瘀点（ triad）。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「发生脂肪栓塞的患者在损伤后1～3天内可出现突发性的呼吸急促、呼吸困难和心动过速」）","others":"血栓栓塞来自血管内血栓；气体栓塞见于减压病或静脉损伤；羊水栓塞发生于分娩；细菌栓塞见于感染性心内膜炎。","trap":"「长骨骨折 → 脂肪栓塞 → 呼吸困难 + 瘀点」。"},"x199":{"why":"深水作业时高压使大量氮气溶解于血液和组织；快速上浮时压力骤降，氮气迅速游离形成气泡，阻塞血管引起气体栓塞（减压病），表现为关节痛、胸痛、呼吸困难甚至昏迷。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「减压病」）","others":"脂肪栓塞见于骨折；血栓栓塞来自血栓；羊水栓塞见于分娩；瘤细胞栓塞见于肿瘤。","trap":"「深水快速上浮 → 氮气气泡 → 减压病」。"},"x200":{"why":"分娩过程中子宫强烈收缩、胎盘剥离或宫颈裂伤，使羊水（含胎儿上皮、胎脂、胎粪）进入母体血循环，引起过敏性休克、DIC、急性肺栓塞和肾衰竭，死亡率高。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「患者常在分娩过程中或分娩后突然出现呼吸困难、发绀、抽搐、休克、昏迷，甚至死亡」）","others":"血栓、脂肪、气体、细菌栓塞的病因和表现都不同。","trap":"「分娩中突发休克 + DIC = 羊水栓塞」。"},"x201":{"why":"肺有肺动脉和支气管动脉双重供血，肠有肠系膜上、下动脉吻合支；梗死时侧支血管血液涌入坏死区，形成出血性（红色）梗死。（教材依据：《病理学》第10版 第三章 局部血液循环障碍：「梗死灶呈凝固性坏死，可见肺泡轮廓，肺泡腔、小支气管腔及肺间质充满红细胞」）","others":"贫血性（白色）梗死见于心、肾、脾等组织致密、侧支少的器官；液化性坏死、干酪样坏死、脂肪坏死是坏死类型，不是梗死类型。","trap":"「肺肠红梗，心肾脾白梗」。"},"x202":{"why":"组胺由肥大细胞、嗜碱性粒细胞和血小板释放，作用于血管内皮细胞 H1 受体，使内皮细胞收缩、间隙增宽，血管通透性迅速升高，是急性炎症早期渗出的主要介质。（教材依据：《病理学》第10版 第四章 炎症：「组胺主要存在于肥大细胞和嗜碱性粒细胞的颗粒中，也存在于血小板内」）","others":"前列腺素、白三烯主要参与血管扩张和白细胞趋化；缓激肽也增加通透性但作用较慢；C5a 是趋化因子。","trap":"「组胺 = 急性炎症早期通透性升高的头号介质」。"},"x203":{"why":"急性炎症的血管反应顺序：①细动脉短暂收缩（几秒）；②细动脉扩张、毛细血管床开放、血流加速（充血、发红发热）；③血管通透性升高、富含蛋白的液体渗出；④血流减慢、白细胞附壁和游出。（教材依据：《病理学》第10版 第四章 炎症：「细动脉短暂收缩……血管扩张和血流加速」）","others":"纤维组织增生是慢性炎症和修复；肉芽肿是慢性肉芽肿性炎；钙化是后期改变。","trap":"「收缩 → 扩张 → 渗出 → 白细胞游出」——四步曲。"},"x204":{"why":"结核结节由上皮样细胞、朗汉斯多核巨细胞和外围淋巴细胞构成，属于慢性肉芽肿性炎，是结核病的特征性病变。（教材依据：《病理学》第10版 第四章 炎症：「肉芽肿的主要细胞成分是上皮样细胞和多核巨细胞，具有诊断意义」）","others":"急性化脓性炎以中性粒细胞为主；纤维素性炎以纤维素渗出为主；出血性炎以红细胞渗出为主；浆液性炎以浆液渗出为主。","trap":"「结核结节 = 肉芽肿性炎 = 上皮样细胞 + 朗汉斯巨细胞」。"},"x205":{"why":"金黄色葡萄球菌产生血浆凝固酶，使渗出物中的纤维蛋白原转变为纤维素，病灶局限化形成脓肿（局限性化脓性炎，有脓腔）。（教材依据：《病理学》第10版 第四章 炎症：「由葡萄球菌引起的脓液较为浓稠，由链球菌引起的脓液较为稀薄」）","others":"蜂窝织炎由溶血性链球菌引起（透明质酸酶使炎症弥漫）；肉芽肿性炎、纤维素性炎、浆液性炎都不是金葡菌的典型表现。","trap":"「金葡 → 脓肿（局限）；链球菌 → 蜂窝织炎（弥漫）」。"},"x206":{"why":"大叶性肺炎主要由肺炎链球菌引起，肺泡内弥漫性纤维素渗出，病变累及肺段或肺叶，属于纤维素性炎。（教材依据：《病理学》第10版 第十章 呼吸系统疾病：「按病变的性质又可分为浆液性、纤维蛋白性、化脓性、出血性、干酪性及肉芽肿性肺炎」）","others":"浆液性炎见于感冒、烧伤水疱；化脓性炎见于脓肿、蜂窝织炎；出血性炎见于炭疽；肉芽肿性炎见于结核。","trap":"「大叶性肺炎 = 纤维素性炎；小叶性肺炎 = 化脓性炎」。"},"x207":{"why":"炭疽、鼠疫等烈性传染病引起出血性炎，血管损伤严重，渗出物中含大量红细胞，病情凶险。（教材依据：《病理学》第10版 第四章 炎症：「出血性炎（hemorrhagicinflammation）是指炎症病灶的血管损伤严重，渗出物中含有大量红细胞」）","others":"浆液性、纤维素性、化脓性、肉芽肿性炎都不是炭疽的典型类型。","trap":"「炭疽、鼠疫 = 出血性炎」。"},"x208":{"why":"结构异型性指肿瘤组织在空间排列方式（极性紊乱、层次不清、失去器官样结构）上与正常组织的差异；细胞异型性指细胞大小、形态、核的异型性。（教材依据：《病理学》第10版 第六章 肿瘤：「肿瘤细胞构成肿瘤实质，其细胞形态、形成的结构或其产物是判断肿瘤的分化方向、进行肿瘤组织学分类的主要依据」）","others":"肿瘤大小、生长速度、有无包膜都不是「结构异型性」的定义。","trap":"「结构看排列，细胞看长相」。"},"x209":{"why":"恶性肿瘤多呈浸润性生长，癌细胞侵入周围组织、破坏正常结构、界限不清；良性肿瘤多呈膨胀性生长，有包膜、界限清楚、可推动。（教材依据：《病理学》第10版 第六章 肿瘤：「膨胀性生长：实质器官的良性肿瘤多呈膨胀性生长，其生长速度较慢，随着体积增大，肿瘤推挤但不侵犯周围组织」）","others":"膨胀性、外生性、囊性、推移性生长都不是恶性肿瘤的主要方式。","trap":"「恶性 = 浸润；良性 = 膨胀」。"},"x210":{"why":"胃癌侵透浆膜后，癌细胞脱落种植在腹腔器官表面，常见于卵巢（双侧、实性，Krukenberg 瘤）和直肠子宫陷凹。（教材依据：《病理学》第10版 第六章 肿瘤：「种植性转移：发生于胸腹腔等体腔内器官的恶性肿瘤，侵及器官表面时，瘤细胞可以脱落，像播种一样种植在体腔其他器官的表面」）","others":"Virchow 淋巴结是淋巴道转移；Aschoff 小体是风湿病；R-S 细胞是霍奇金淋巴瘤；印戒细胞是胃癌的细胞类型。","trap":"「胃癌 → 卵巢 = Krukenberg 瘤（种植转移）」。"},"x211":{"why":"慢性萎缩性胃炎伴肠上皮化生、胃腺瘤性息肉、残胃炎等属于胃癌的癌前病变，需定期随访。（教材依据：《病理学》第10版 第十一章 消化系统疾病：「在肠上皮化生中，可出现细胞不典型性增生」）","others":"急性胃炎、胃溃疡愈合、胃平滑肌瘤、胃憩室都不是癌前病变。","trap":"「萎缩性胃炎 + 肠化 = 癌前」。"},"x212":{"why":"交界性肿瘤的组织形态和生物学行为介于良性肿瘤与恶性肿瘤之间，如卵巢交界性浆液性囊腺瘤，易复发但很少发生转移。（教材依据：《病理学》第10版 第六章 肿瘤：「交界瘤典型的特征是见逐级分支的乳头形成，细胞有异型性，核分裂象增加」）","others":"良性肿瘤恶变、转移性肿瘤、原位癌、早期癌都不是交界性肿瘤的定义。","trap":"「交界性 = 介于良恶性之间」。"},"x213":{"why":"动脉瘤是动脉壁局部薄弱，在血流压力作用下形成的永久性异常扩张，常见于动脉粥样硬化、梅毒、创伤等，破裂可致大出血。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「动脉瘤破裂可致大出血……腹主动脉壁局部向外明显扩张」）","others":"动脉壁的肿瘤、脂质沉积、血栓形成、动脉痉挛都不是动脉瘤。","trap":"「动脉瘤 = 扩张，不是肿瘤」。"},"x214":{"why":"风湿性心脏病时心肌间质内出现 Aschoff 小体（风湿小体），由纤维素样坏死、成团的风湿细胞（Aschoff 细胞）和淋巴细胞构成，是风湿病的特征性病变。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「风湿性心脏病」）","others":"R-S 细胞是霍奇金淋巴瘤；Krukenberg 瘤是胃癌卵巢转移；新月体是急进性肾炎；假小叶是肝硬化。","trap":"「风湿 = Aschoff 小体」。"},"x215":{"why":"亚急性感染性心内膜炎多由草绿色链球菌引起，最常累及二尖瓣和主动脉瓣，形成含细菌的赘生物，质脆易脱落，造成栓塞和转移性脓肿。（教材依据：《病理学》第10版 第九章 心血管系统疾病：「亚急性感染性心内膜炎仍以甲型溶血性链球菌最多见，肠球菌次之」）","others":"三尖瓣多见于静脉药瘾者；肺动脉瓣、心内膜壁、心包都不是最常见部位。","trap":"「亚急性 IE = 二尖瓣/主动脉瓣 + 赘生物」。"},"x216":{"why":"病毒性肝炎时肝细胞发生水样变性，细胞肿大、胞质疏松呈气球样（气球样变），严重时发生溶解性坏死。（教材依据：《病理学》第10版 第十一章 消化系统疾病：「细胞水肿……也称为水变性或水样变性……称气球样变」）","others":"脂肪变见于酒精性肝病、肥胖；玻璃样变见于酒精性肝病的 Mallory 小体；黏液样变、淀粉样变少见。","trap":"「病毒性肝炎 → 气球样变（水样变性）」。"},"x217":{"why":"肝硬化门脉高压表现为：①脾大、脾功能亢进；②侧支循环形成（食管胃底静脉曲张、腹壁静脉曲张、痔静脉曲张）；③腹水。不会引起红细胞增多。（教材依据：《病理学》第10版 第十一章 消化系统疾病：「侧支循环形成：门静脉压力升高时」）","others":"脾大、侧支循环、腹水、食管胃底静脉曲张都是门脉高压的表现。","trap":"「门脉高压 = 脾大 + 侧支 + 腹水」。"},"x218":{"why":"我国食管癌最常见的组织学类型是鳞状细胞癌，好发于食管中段；腺癌多见于食管下段，与 Barrett 食管有关。（教材依据：《病理学》第10版 第十章 呼吸系统疾病：「中国人最常见的为鳞状细胞癌（约占90%以上），腺癌次之」）","others":"腺癌、小细胞癌、未分化癌、类癌都不是我国食管癌的最常见类型。","trap":"「我国食管癌 = 鳞癌（中段）」。"},"x219":{"why":"单纯扩散是脂溶性小分子（O₂、CO₂、N₂、乙醇、类固醇激素）顺浓度梯度直接穿过细胞膜脂质双分子层的过程，不需要载体、不耗能。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「经单纯扩散转运的物质都是脂溶性（非极性）物质或少数不带电荷的极性小分子物质，如O₂、CO₂、N₂、类固醇激素、乙醇、尿素、甘油、水等」）","others":"易化扩散需要载体或通道；原发性、继发性主动转运都要耗能；出胞入胞是膜泡运输。","trap":"「脂溶性小分子 = 单纯扩散」。"},"x220":{"why":"葡萄糖进入红细胞通过 GLUT1 顺浓度梯度转运，属于经载体的易化扩散，不需要 ATP，但有饱和现象和竞争性抑制。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「葡萄糖转运体（GLUT）可将胞外的葡萄糖顺浓度梯度转运到细胞内」）","others":"单纯扩散不需要载体；主动转运耗能；出胞是大分子运输。","trap":"「顺梯度 + 要载体 + 不耗能 = 易化扩散」。"},"x221":{"why":"钠泵（Na⁺-K⁺-ATP 酶）直接分解 ATP 供能、自身磷酸化发生构象改变，逆浓度梯度转运 Na⁺ 和 K⁺，属于原发性主动转运。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「离子泵的化学本质是ATP酶，可将细胞内的ATP水解为ADP，自身被磷酸化而发生构象改变」）","others":"单纯扩散、易化扩散都不耗能；继发性主动转运间接利用钠泵建立的梯度（如葡萄糖、氨基酸重吸收）；出胞是膜泡运输。","trap":"「直接烧 ATP = 原发性；借钠的势能 = 继发性」。"},"x222":{"why":"阈强度（阈值）指能引起组织兴奋的最小刺激强度；阈电位指能触发动作电位的膜电位临界值（如 -55 mV），膜去极化到阈电位时 Na⁺ 通道大量开放，爆发动作电位。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「能使细胞产生动作电位的最小刺激强度，称为阈强度」）","others":"基强度、时值都是强度-时间曲线的参数；最大刺激是引起最大反应的最小刺激。","trap":"「阈值是刺激，阈电位是膜电位」。"},"x223":{"why":"局部电位（如终板电位、突触后电位）呈等级性、可时间/空间总和、可电紧张扩布、无不应期；动作电位才具有“全或无”和“不衰减传导”的特点。（教材依据：《生理学》第10版 第二章 细胞的基本功能（局部电位：等级性、可总和、电紧张扩布、无不应期））","others":"等级性、时间总和、空间总和、电紧张扩布都是局部电位的特点。","trap":"「局部电位 = 等级性；动作电位 = 全或无」。"},"x224":{"why":"Ca²⁺ 与肌钙蛋白 C 结合后，原肌球蛋白移位、暴露肌动蛋白上的结合位点，横桥与肌动蛋白结合，分解 ATP 获得能量后摆动，拉动细肌丝向 M 线滑行，肌肉收缩。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「原肌球蛋白所在的位臵恰好能掩盖肌动蛋白分子上的横桥结合位点」）","others":"肌钙蛋白是 Ca²⁺ 受体；原肌球蛋白是“挡板”；肌浆网储存 Ca²⁺；ATP 酶在横桥头部。","trap":"「横桥抓肌动蛋白，像划船」。"},"x225":{"why":"白蛋白分子量小、分子数量多，血浆胶体渗透压的 75%～80% 由白蛋白形成，对维持血管内外水的平衡至关重要；白蛋白降低可致水肿。（教材依据：《生理学》第10版 第三章 血液：「血浆胶体渗透压的75%～80%来自白蛋白」）","others":"运输氧气是血红蛋白；凝血是凝血因子；免疫防御是球蛋白；体温调节是体温中枢。","trap":"「白蛋白 = 胶体渗透压 = 抗水肿」。"},"x226":{"why":"促红细胞生成素（EPO）主要由肾间质细胞产生，缺氧是最强调节因素；EPO 促进红系祖细胞增殖分化，慢性肾病时 EPO 减少导致肾性贫血。（教材依据：《生理学》第10版 第三章 血液：「EPO是机体红细胞生成的主要调节物」）","others":"睾酮、甲状腺激素、生长激素、糖皮质激素对红细胞生成有辅助作用，但主激素是 EPO。","trap":"「缺氧 → 肾产 EPO → 骨髓造血」。"},"x227":{"why":"血小板参与生理性止血（黏附、聚集、释放）、促进凝血（提供磷脂表面）、维持血管内皮完整性、参与炎症反应；运输氧气是红细胞的功能。（教材依据：《生理学》第10版 第三章 血液：「一期止血主要依赖于血管收缩及血小板止血栓的形成」）","others":"止血、凝血、维持内皮、炎症反应都是血小板的功能。","trap":"「血小板管止血凝血，红细胞管运氧」。"},"x228":{"why":"凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ 在肝合成时需要维生素 K 参与 γ-羧化，才能与 Ca²⁺ 结合发挥凝血活性；缺乏维生素 K 可致出血。（教材依据：《生理学》第10版 第三章 血液：「维生素K的参与，故它们又称为依赖维生素K的凝血因子」）","others":"维生素 A 管视觉；B12 管造血和神经；C 管胶原合成；D 管钙磷。","trap":"「凝血四因子：Ⅱ、Ⅶ、Ⅸ、Ⅹ，都要维生素 K」。"},"x229":{"why":"窦房结自律性最高（约 100 次/分），是正常起搏点；房室结（约 50 次/分）和浦肯野纤维（约 25 次/分）自律性低，为潜在起搏点。（教材依据：《生理学》第10版 第四章 血液循环：「窦房结是心脏活动的正常起搏点」）","others":"房室结、房室束、浦肯野纤维、心房肌的自律性都低于窦房结。","trap":"「窦房结当家（100），房室结备胎（50），浦肯野垫底（25）」。"},"x230":{"why":"房室交界传导速度最慢（约 0.02 m/s），形成房室延搁，保证心房收缩完毕后心室才开始收缩，有利于心室充盈和射血。（教材依据：《生理学》第10版 第四章 血液循环：「兴奋在房室结区的传导非常缓慢……传导速度仅0.02m/s」）","others":"使心室收缩更有力、增加心率、加快心房收缩、促进静脉回流都不是房室延搁的生理意义。","trap":"「房室延搁 = 心房先、心室后」。"},"x231":{"why":"动脉血压形成的基本条件：①心脏射血提供动能；②外周阻力使血液不能过快流出动脉；③大动脉弹性回缩维持舒张压；④循环血量和血管容量的匹配。（教材依据：《生理学》第10版 第四章 血液循环：「心脏射血：这是动脉血压形成的必要条件」）","others":"血管长度、血液黏度、血管弹性、静脉回流都是影响因素，但形成血压的两个基本因素是射血和外周阻力。","trap":"「射血给动力，外周阻力撑压力」。"},"x232":{"why":"真毛细血管壁仅由单层内皮细胞构成，血流慢、通透性大，是血液与组织液进行物质交换的主要部位；微动脉、微静脉起调节作用。（教材依据：《生理学》第10版 第四章 血液循环：「真毛细血管壁没有平滑肌，由单层内皮细胞构成……毛细血管壁的通透性较大」）","others":"微动脉调节血流；后微动脉和毛细血管前括约肌调节毛细血管开放；微静脉收集血液。","trap":"「交换看真毛细血管」。"},"x233":{"why":"肺活量 = 潮气量 + 补吸气量 + 补呼气量，反映一次呼吸的最大通气能力；但肺活量不包含残气量，不能完全反映通气功能。（教材依据：《生理学》第10版 第五章 呼吸：「它是潮气量、补吸气量与补呼气量之和」）","others":"潮气量 + 补吸气量 = 深吸气量；肺活量 + 残气量 = 肺总容量。","trap":"「肺活量 = 潮气 + 补吸 + 补呼」。"},"x234":{"why":"肺顺应性指肺在外力作用下扩张的难易程度。肺纤维化时肺组织弹性阻力增大、顺应性降低，患者吸气费力；肺气肿时弹性纤维破坏、顺应性升高。（教材依据：《生理学》第10版 第五章 呼吸（肺顺应性：肺纤维化时弹性阻力增大、顺应性降低））","others":"肺气肿顺应性升高；肺充血、运动、深呼吸不是顺应性降低的典型原因。","trap":"「纤维化 = 硬 = 顺应性低；肺气肿 = 松 = 顺应性高」。"},"x235":{"why":"CO₂ 的运输形式：碳酸氢盐（约 70%）、氨基甲酰血红蛋白（约 20%）、物理溶解（约 7%）。碳酸氢盐由碳酸酐酶催化 CO₂ 与水生成 H₂CO₃ 再解离形成。（教材依据：《生理学》第10版 第五章 呼吸：「化学结合的形式主要是碳酸氢盐（bicarbonate，HCO₃⁻）和氨基甲酰血红蛋白」）","others":"物理溶解比例小；碳氧血红蛋白是 CO 与 Hb 结合；氨基甲酰血红蛋白次之；碳酸是中间产物。","trap":"「CO₂ 主运输 = 碳酸氢盐」。"},"x236":{"why":"延髓腹外侧的中枢化学感受器对脑脊液中 H⁺ 浓度变化敏感（CO₂ 通过血脑屏障后生成 H⁺），是调节呼吸最重要的化学感受器；缺氧主要刺激外周化学感受器（颈动脉体、主动脉体）。（教材依据：《生理学》第10版 第五章 呼吸：「刺激中枢化学感受器，引起呼吸中枢兴奋，使呼吸运动加深、加快」）","others":"颈动脉体、主动脉体是外周化学感受器，主要感受低氧；脑桥、下丘脑不承担主要呼吸化学感受功能。","trap":"「中枢感受 H⁺，外周感受 O₂」。"},"x237":{"why":"胃排空的原动力是胃蠕动，胃蠕动使胃内压升高，推动食糜通过幽门进入十二指肠；幽门括约肌和十二指肠的反馈调节限制排空速度。（教材依据：《生理学》第10版 第六章 消化和吸收：「胃排空及其控制」）","others":"胃内压是蠕动产生的；幽门括约肌限制排空；十二指肠负压、胃液分泌不是原动力。","trap":"「胃排空 = 胃蠕动」。"},"x238":{"why":"促胰液素由小肠 S 细胞分泌，作用于胰腺导管细胞，促进水和碳酸氢盐分泌；缩胆囊素由 I 细胞分泌，促进胰酶分泌和胆囊收缩。（教材依据：《生理学》第10版 第六章 消化和吸收：「调节胰液分泌的体液因素主要有促胰液素和缩胆囊素」）","others":"促胃液素促胃酸；抑胃肽抑制胃酸；胃动素促进胃肠运动。","trap":"「促胰液素管水盐，缩胆囊素管酶」。"},"x239":{"why":"下丘脑视前区-下丘脑前部（PO/AH）是体温调节的基本中枢，整合外周和中枢温度信息，通过调节产热（战栗、代谢）和散热（血管、汗腺）维持体温恒定。（教材依据：《生理学》第10版 第一章 绪论：「体温调节中枢，提前发动产热反应，无须等待跳入冰水后因散热增加而体温降低后再通过前述的负反馈调节启动产热反应」）","others":"大脑皮质、延髓、中脑、脊髓参与但非基本中枢。","trap":"「体温中枢 = 下丘脑」。"},"x240":{"why":"滤过膜由毛细血管内皮细胞（窗孔）、基膜、足细胞裂孔膜构成。基膜是主要的机械屏障，能阻挡大分子蛋白质；内皮和裂孔膜也参与屏障。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「滤过膜由三层结构组成：①内层是毛细血管内皮细胞，细胞上有许多直径为70～90nm的小孔，称为窗孔」）","others":"内皮细胞、足细胞裂孔膜、系膜细胞、肾小囊上皮都不是主要机械屏障。","trap":"「滤过膜主屏障 = 基膜」。"},"x241":{"why":"近端小管通过 Na⁺-葡萄糖耦联转运体（SGLT）重吸收葡萄糖，动力来自钠泵建立的 Na⁺ 浓度梯度，属于继发性主动转运；葡萄糖再经基底侧膜 GLUT2 易化扩散入血。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「通过近端小管上皮细胞顶端膜中的Na⁺-葡萄糖耦联转运体……以继发性主动转运的方式被转入细胞」）","others":"单纯扩散、易化扩散不耗能；原发性主动转运直接分解 ATP；入胞是大分子运输。","trap":"「SGLT 借钠势能 = 继发性主动转运」。"},"x242":{"why":"球-管平衡指近端小管对滤过液的重吸收率始终占肾小球滤过率的 65%～70%，称为定比重吸收，使尿量不随肾小球滤过率波动而剧烈变化。（教材依据：《生理学》第10版 第八章 尿的生成和排出：「球-管平衡：近端小管对溶质（特别是Na+）和水的重吸收随肾小球滤过率的变化而改变」）","others":"肾小球滤过率恒定、肾小管分泌率恒定、集合管重吸收恒定、肾血流量恒定都不是球-管平衡。","trap":"「球-管平衡 = 近端小管定比重吸收 65%～70%」。"},"x243":{"why":"动作电位传到接头前膜，电压门控 Ca²⁺ 通道开放，Ca²⁺ 内流触发突触囊泡与前膜融合，释放乙酰胆碱；ACh 与终板膜 N₂ 受体结合产生终板电位。（教材依据：《生理学》第10版 第二章 细胞的基本功能：「骨骼肌神经肌肉接头的结构特征」）","others":"Na⁺ 是产生动作电位的；K⁺ 参与复极；Cl⁻ 与抑制有关；Mg²⁺ 抑制递质释放。","trap":"「递质释放靠钙内流」。"},"x244":{"why":"牵涉痛指内脏疾病引起体表特定部位发生疼痛或痛觉过敏，机制是内脏和体表的传入纤维在脊髓同一节段汇聚。典型例子：心绞痛放射至左肩、左臂内侧；胆囊炎放射至右肩。（教材依据：《生理学》第10版 第十章 神经系统的功能：「牵涉痛（referredpain）是指由某些内脏疾病引起的特殊远隔体表部位发生疼痛或痛觉过敏的现象」）","others":"放射痛是沿神经干走行的疼痛；幻肢痛是截肢后 phantom 痛；丘脑痛是中枢性疼痛；灼性神经痛是神经损伤后烧灼样痛。","trap":"「心绞痛 → 左肩左臂；胆囊炎 → 右肩」。"},"x245":{"why":"甲状腺激素提高组织耗氧量和产热，使基础代谢率升高；甲亢时怕热、多汗、食欲亢进但体重下降，甲减时相反。（教材依据：《生理学》第10版 第十一章 内分泌：「当甲状腺功能亢进时，产热量增加，BMR可升高25%～80%，患者喜凉怕热、多汗、体重下降」）","others":"降低基础代谢率、促进糖原合成、抑制蛋白质合成、降低血糖都不是甲状腺激素的主要代谢作用。","trap":"「甲状腺激素 = 产热 = 升 BMR」。"},"x246":{"why":"甲状旁腺激素（PTH）促进骨钙释放、促进肾小管重吸收钙、抑制肾小管重吸收磷、促进 1,25-(OH)₂-D₃ 生成，最终升高血钙、降低血磷。（教材依据：《生理学》第10版 第十一章 内分泌（甲状旁腺激素：升血钙、降血磷））","others":"降钙素降低血钙；维生素 D 升高血钙和血磷；PTH 不升高血磷。","trap":"「PTH：升钙、降磷」。"},"x247":{"why":"应激时下丘脑-垂体-肾上腺轴激活，糖皮质激素大量分泌，提高机体对有害刺激的耐受力；同时升高血糖、促进蛋白质分解、抑制免疫和炎症反应。（教材依据：《生理学》第10版 第十一章 内分泌：「参与应激反应：当机体遭受到来自内、外环境的伤害性刺激时」）","others":"降低血糖、抑制蛋白质分解、减少红细胞、抑制胃酸分泌都不是糖皮质激素在应激中的主要作用。","trap":"「应激 = 糖皮质激素升高 = 抗压但抑免疫」。"},"x248":{"why":"FSH 作用于睾丸支持细胞，促进精子生成；LH 作用于间质细胞，促进睾酮分泌。两者共同维持生精功能。（教材依据：《生理学》第10版 第十一章 内分泌：「FSH作用于支持细胞膜上的FSH受体……促进支持细胞合成、分泌促精子生成所需的物质」）","others":"LH 主要促睾酮；催乳素与泌乳有关；雌二醇、孕激素是女性激素。","trap":"「FSH 管生精，LH 管睾酮」。"},"x249":{"why":"慢性心衰改善预后的药物：ACEI/ARB/ARNI（抑制 RAAS、逆转重构）、β 受体拮抗剂（抑制交感、降低猝死）、醛固酮受体拮抗剂（抗纤维化）、SGLT2 抑制剂（新四联之一）。洋地黄（地高辛）改善症状和住院率，但不改善生存率。（教材依据：《内科学》第10版 第三篇 循环系统疾病：「ACEI：通过抑制ACE减少ATⅡ生成而抑制RAAS，通过降低病人神经-体液代偿机制的不利影响，改善心室重塑」）","others":"ACEI/ARB/ARNI、β 受体拮抗剂、醛固酮受体拮抗剂、SGLT2 抑制剂都是改善预后的基石药物。","trap":"「四大基石延命，洋地黄只管舒服」。"},"x250":{"why":"急性心衰肺水肿时静脉袢利尿剂（呋塞米）快速减轻容量负荷、降低肺毛细血管压，缓解肺淤血；同时可联合血管扩张剂、吗啡、无创通气。（教材依据：《内科学》第10版 第三篇 循环系统疾病：「呋塞米（速尿）为代表，作用于髓袢升支粗段，排钠排钾，为强效利尿剂」）","others":"氢氯噻嗪是噻嗪类（弱）；螺内酯是保钾利尿剂（慢）；乙酰唑胺是碳酸酐酶抑制剂；甘露醇是渗透性利尿（用于脑水肿）。","trap":"「急性肺水肿 → 静脉呋塞米」。"},"x251":{"why":"房颤药物复律常用胺碘酮（Ⅲ类抗心律失常药，广谱、对器质性心脏病相对安全）；普罗帕酮适用于无器质性心脏病者。β 受体拮抗剂、地高辛、维拉帕米用于控制心室率，不是复律。（教材依据：《内科学》第10版 第三篇 循环系统疾病（心房颤动·胺碘酮用于药物复律））","others":"美托洛尔、地高辛、维拉帕米控制心室率；阿司匹林抗血小板，不转律。","trap":"「复律用胺碘酮，控率用β阻滞剂/地高辛」。"},"x252":{"why":"硝酸甘油舌下含服经口腔黏膜快速吸收，扩张静脉（降低前负荷）和冠脉（改善心肌供血），降低心肌耗氧，是心绞痛发作时的首选缓解药。β 受体拮抗剂用于长期预防，阿司匹林、他汀是二级预防。（教材依据：《内科学》第10版 第三篇 循环系统疾病：「硝酸甘油等快速起效的硝酸酯类药物舌下含服或喷吸也能在几分钟内使之缓解」）","others":"阿司匹林、美托洛尔、阿托伐他汀都是长期用药，不能急性缓解；硝苯地平口服起效慢。","trap":"「发作含硝酸甘油，预防用β阻滞剂」。"},"x253":{"why":"溶栓治疗的绝对禁忌证包括：活动性内出血、近期（3 个月）缺血性卒中或脑血管事件、颅内肿瘤、可疑主动脉夹层、严重未控制的高血压等。年龄 >65 岁、既往心梗、糖尿病不是绝对禁忌。（教材依据：《内科学》第10版 第三篇 循环系统疾病（心肌梗死·溶栓治疗的禁忌证））","others":"年龄 >65 岁、高血压控制良好、既往心梗、糖尿病都不是溶栓的绝对禁忌。","trap":"「出血、卒中、夹层 = 溶栓禁忌」。"},"x254":{"why":"我国高血压分级：1 级 140～159/90～99 mmHg；2 级 160～179/100～109 mmHg；3 级 ≥180/≥110 mmHg。（教材依据：《内科学》第10版 第三篇 循环系统疾病高血压（分级：2 级 160～179/100～109 mmHg））","others":"140～159/90～99 是 1 级；≥180/≥110 是 3 级；<120/80 是正常血压。","trap":"「1 级 140，2 级 160，3 级 180」。"},"x255":{"why":"主动脉夹层典型表现为突发撕裂样、刀割样剧烈胸背痛，可向腹部、下肢放射，伴双侧血压不对称、脉搏短绌；常与高血压、马方综合征相关。（教材依据：《内科学》第10版 第三篇 循环系统疾病（主动脉夹层：撕裂样胸背痛、血压不对称））","others":"压榨性胸骨后痛是心绞痛/心梗；转移性右下腹痛是阑尾炎；夜间阵发性呼吸困难是左心衰；咯血见于肺结核、肺癌、支扩。","trap":"「撕裂样痛 +
