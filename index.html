 个月（活动期 >1 个月 + 总体 ≥6 个月）：满足病程标准，短于此要考虑急性短暂性精神病性障碍。","无自知力：治疗依从性是最大障碍，也是必须让家属参与的理由。"]},"diff":[["妄想性障碍","妄想系统固定、人格与情感相对保留、无幻觉；社会功能损害较轻"],["双相障碍伴精神病性症状","有明确的心境发作，精神病性症状与心境同步"],["器质性精神障碍","头颅影像异常、神经系统体征、认知下降"],["物质所致","尿毒物筛查阳性，停药后症状消退"]],"exam":[["系统精神检查","重点是感知觉、思维内容、情感协调性、意志行为四项"],["PANSS","基线严重度和疗效评估，后续调药靠它"],["甲功、头颅 MRI、毒物筛查","排除器质性和物质所致，首次发病尤其不能省"],["风险评估","冲动、自伤、外走；有无命令性幻听是住院指征之一"]],"tx":[["第二代抗精神病药","奥氮平 / 利培酮 / 阿立哌唑，足量起始，急性期 4—6 周评估疗效"],["依从性","反复复发者优选长效针剂，比口服更能防复发"],["心理社会干预","家庭宣教（降低高情感表达）、社交技能训练、职业康复"],["维持治疗","首发需维持 1—2 年，反复发作者考虑终身；自行停药复发率 >70%"]]},{"id":"ahf_edema","dept":"内科·循环","stem":"男，68 岁，陈旧性前壁心梗 5 年。夜间熟睡时突发极度呼吸困难，被迫端坐，咳粉红色泡沫痰。查体：BP 180/100 mmHg，R 32 次/分，双肺满布湿啰音及哮鸣音，心尖区闻及 S3 奔马律，双下肢轻度凹陷性水肿。","dx":{"answer":"急性左心衰竭（急性肺水肿）","why":["夜间阵发性呼吸困难 + 端坐呼吸 + 粉红色泡沫痰：三个典型表现指向肺毛细血管压急剧升高、液体渗入肺泡，是急性左心衰的\"三联\"。","双肺满布湿啰音和哮鸣音：湿啰音来自肺泡渗出，哮鸣音来自小气道黏膜水肿（\"心源性哮喘\"），不要误判为支气管哮喘。","S3 奔马律 + 陈旧心梗史：提示左室扩大、舒张期负荷过重，是收缩性心衰的体征依据。","BP 180/100：高血压使后负荷骤增，是本次失代偿的诱因；同时说明不是心源性休克，仍可耐受血管扩张剂。","教材原文：《内科学》第10版——急性左心衰以肺水肿为主要表现，严重时出现粉红色泡沫痰、双肺满布湿啰音。"]},"diff":[["支气管哮喘急性发作","多有哮喘史、呼气相延长为主、湿啰音少见、对支气管扩张剂反应好；心源性哮喘有心脏病史、S3、粉红色泡沫痰"],["急性呼吸窘迫综合征（ARDS）","多有脓毒症、创伤、误吸等诱因，肺水肿为渗透性（非心源性），BNP 不高、对利尿剂反应差"],["肺栓塞","突发呼吸困难伴胸痛、低氧，右心负荷表现（颈静脉怒张、右室扩大），双肺湿啰音不明显"],["自发性气胸","突发一侧胸痛 + 呼吸困难，患侧呼吸音消失、叩诊鼓音，无泡沫痰"]],"exam":[["BNP/NT-proBNP","升高支持心源性；显著升高程度与心衰严重度相关"],["床旁超声心动图","评估左室射血分数、室壁运动、有无机械并发症（乳头肌断裂、室间隔穿孔）"],["心电图 + 肌钙蛋白","排除急性心梗作为诱因——这是最常见的可逆病因"],["胸部 X 线","肺门\"蝴蝶影\"、Kerley B 线提示肺淤血"]],"tx":[["体位与氧疗","端坐位、双腿下垂减少回心血量；高流量吸氧，必要时无创通气（CPAP/BiPAP）"],["静脉袢利尿剂","呋塞米 20～40 mg 静推，快速减轻容量负荷——这是急性肺水肿的核心用药"],["血管扩张剂","血压高者用硝酸甘油/硝普钠降低前后负荷；血压偏低者慎用"],["吗啡","小剂量静注可减轻焦虑和呼吸困难，但低血压、意识障碍者禁用"],["陷阱：不要一味「强心」","急性肺水肿合并快速房颤时才用洋地黄；窦性心律者洋地黄不是首选，反而增加耗氧"]]},{"id":"lobar_pneumonia","dept":"内科·呼吸","stem":"男，42 岁，淋雨后高热寒战 2 天，体温 39.8℃，咳嗽、咳铁锈色痰，右侧胸痛，深呼吸时加重。查体：右下肺语颤增强、叩诊浊音、可闻及支气管呼吸音。WBC 18×10⁹/L，中性粒细胞 88%。胸片示右下肺大片致密影，可见支气管充气征。","dx":{"answer":"右下肺大叶性肺炎（肺炎链球菌肺炎，红色/灰色肝样变期）","why":["青年男性 + 淋雨后急性起病 + 高热寒战 + 铁锈色痰：\"受凉—高热—铁锈色痰\"是肺炎链球菌肺炎的经典组合。","铁锈色痰的机制：肺泡内红细胞被渗出物破坏，血红蛋白分解后含铁血黄素混入痰中——教材原文（《病理学》：「肺泡腔、小支气管腔及肺间质充满红细胞」）。","右下肺语颤增强 + 叩诊浊音 + 支气管呼吸音：肺实变的三大体征，说明病变已到肝样变期，而非充血水肿期。","胸片大片致密影 + 支气管充气征：实变的影像学特征，且不伴空洞——支持大叶性肺炎，不支持肺脓肿。","教材原文：《内科学》第10版——肺炎链球菌肺炎典型表现为铁锈色痰、肺实变体征，X 线示肺叶或肺段实变。"]},"diff":[["肺脓肿","咳大量脓臭痰、X 线见空洞和液平、病程较长；本例无脓臭痰、无空洞"],["肺结核","起病缓、低热盗汗、痰中带血，病变多在肺尖或锁骨上下，抗酸染色/结核菌素试验可鉴别"],["肺癌伴阻塞性肺炎","年龄大、吸烟史、咳嗽性质改变，抗感染后病灶不吸收，需支气管镜"],["肺栓塞","突发胸痛 + 呼吸困难、低氧，D-二聚体升高，无高热和铁锈色痰"]],"exam":[["痰涂片革兰染色 + 痰培养","找革兰阳性双球菌，指导抗生素选择"],["血培养","重症肺炎需在抗菌药物前抽血培养"],["C 反应蛋白、降钙素原","辅助判断细菌感染和严重程度"],["动脉血气","评估氧合，判断是否达到重症肺炎标准"]],"tx":[["抗感染","肺炎链球菌首选青霉素类（青霉素 G 或阿莫西林）；过敏者用呼吸喹诺酮类或大环内酯类"],["支持治疗","退热、补液、氧疗，监测生命体征"],["疗程与评估","一般 7～14 天，48～72 小时评估疗效；若 72 小时无改善，需重新排查病原或其他疾病"],["陷阱：重症判断","出现呼吸频率 ≥30、氧合指数 ≤250、多肺叶浸润、低血压等需按重症肺炎处理，必要时 ICU"]]},{"id":"cirrhosis_evb","dept":"内科·消化","stem":"男，52 岁，乙肝病史 20 年。近 3 天呕血 2 次，柏油样便 3 次，伴头晕、心慌。查体：BP 88/56 mmHg，心率 112 次/分，面色苍白，巩膜轻度黄染，腹壁静脉曲张，脾肋下 3 cm，移动性浊音阳性。Hb 70 g/L，血小板 62×10⁹/L，白蛋白 28 g/L。","dx":{"answer":"肝硬化门静脉高压致食管胃底静脉曲张破裂出血（失血性休克）","why":["乙肝 + 脾大 + 腹壁静脉曲张 + 腹水：门静脉高压的\"四联\"已经齐了，呕血首先要想到食管胃底静脉曲张破裂。","呕鲜血 + 柏油便 + 血压 88/56 + 心率 112：急性大量失血，已进入失血性休克，处理顺序是先稳定循环。","血小板 62、白蛋白 28：肝硬化脾功能亢进和合成功能下降的证据，同时提示凝血功能差、止血困难。","教材原文：《内科学》第10版——门静脉高压侧支循环中，食管胃底静脉曲张破裂是肝硬化最常见的死亡原因之一。","关键判断：这是\"静脉曲张性出血\"而非\"溃疡出血\"，药物选择（生长抑素/特利加压素）和操作（套扎/硬化）都不同。"]},"diff":[["消化性溃疡出血","有慢性上腹痛史、出血前疼痛加重，无门脉高压体征（脾大、腹水、静脉曲张）；内镜可鉴别"],["急性胃黏膜病变","多有应激、NSAIDs、酒精诱因，出血量一般较小，内镜下弥漫糜烂"],["胃癌出血","年龄大、消瘦、贫血、上腹包块，内镜见溃疡型肿物，病理确诊"],["Mallory-Weiss 综合征","剧烈呕吐后呕血，为贲门黏膜撕裂，出血量相对少，内镜见纵行撕裂"]],"exam":[["血常规、凝血、肝肾功能、血型","评估失血量、凝血状态和肝功能储备，立即备血"],["急诊胃镜（24 小时内）","明确出血部位和病因，同时可行套扎或硬化治疗"],["腹部超声/CT","评估肝硬化、脾大、腹水、门静脉血栓"],["Child-Pugh 分级","决定治疗策略和预后，C 级手术风险极高"]],"tx":[["液体复苏与输血","先补晶体，Hb <70 g/L 或休克时输血，目标 Hb 70～80 g/L（避免过度输血升高门脉压）"],["血管活性药物","生长抑素/奥曲肽或特利加压素降低门脉压，是静脉曲张出血的一线药物"],["预防性抗生素","肝硬化出血常规使用头孢类，降低感染和再出血率"],["内镜治疗","24 小时内急诊胃镜，套扎（EVL）或硬化剂注射"],["陷阱：三腔二囊管","仅用于药物和内镜无效的挽救，压迫时间过长可致食管黏膜坏死"]]},{"id":"acute_pancreatitis","dept":"内科·消化","stem":"男，45 岁，暴饮暴食后 8 小时突发上腹持续性剧痛，向腰背部放射，弯腰抱膝位可稍缓解，伴恶心呕吐，呕吐后腹痛不缓解。查体：上腹压痛，无肌紧张，肠鸣音减弱。血淀粉酶 1200 U/L（正常 <100），脂肪酶 900 U/L。腹部 CT 示胰腺肿胀、胰周渗出。","dx":{"answer":"急性胰腺炎（轻症，水肿型）","why":["暴饮暴食后突发上腹剧痛、向腰背放射、弯腰可缓解：这是胰腺炎疼痛的典型\"体位性\"特征（弯腰使腹膜后间隙张力下降）。","呕吐后腹痛不缓解：区别于急性胃炎（呕吐后常缓解），提示病变在腹膜后、与胃无关。","血淀粉酶 >3 倍正常上限 + 脂肪酶升高：满足急性胰腺炎的酶学诊断标准，脂肪酶特异性更高。","CT 示胰腺肿胀、胰周渗出但无坏死：支持水肿型（轻症），尚未进展为坏死性胰腺炎。","教材原文：《内科学》第10版——急性胰腺炎诊断需符合以下 3 项中的 2 项：典型腹痛、血淀粉酶/脂肪酶 >3 倍上限、影像学改变。"]},"diff":[["消化性溃疡穿孔","突发刀割样上腹痛、板状腹、肝浊音界消失、膈下游离气体；本例无肌紧张、无游离气体"],["急性胆囊炎","右上腹痛、Murphy 征阳性、放射至右肩背，超声见胆囊壁增厚和结石"],["急性肠梗阻","阵发性绞痛、呕吐、腹胀、停止排气排便，立位腹平片见液气平面"],["急性心肌梗死（下壁）","可有上腹痛，但伴心电图 ST 改变和肌钙蛋白升高；本例心电图正常"]],"exam":[["血淀粉酶/脂肪酶动态","脂肪酶持续升高时间更长，特异性更高"],["腹部增强 CT","起病 72 小时后评估胰腺坏死范围和并发症"],["腹部超声","筛查胆源性病因（胆囊结石、胆管扩张）"],["血钙、血糖、LDH、CRP","评估严重程度（Ranson 评分、CRP 升高提示重症）"]],"tx":[["禁食与液体复苏","早期积极补液（乳酸林格液）是核心，禁食、胃肠减压减轻腹胀"],["镇痛","哌替啶或 NSAIDs，避免吗啡（可能加重 Oddi 括约肌痉挛）"],["抑制胰酶分泌","生长抑素/奥曲肽，质子泵抑制剂预防应激性溃疡"],["不推荐预防性抗生素","仅用于感染性坏死（CT 见气泡、穿刺培养阳性）"],["陷阱：早期手术","急性胰腺炎早期手术死亡率高，仅在感染性坏死或胆道梗阻无法解除时手术"]]},{"id":"thyroid_storm","dept":"内科·内分泌","stem":"女，35 岁，甲亢 2 年，自行停用甲巯咪唑 1 个月。3 天前上呼吸道感染后出现高热 40℃、烦躁、大汗、心悸、呕吐、腹泻。查体：BP 150/80 mmHg，心率 160 次/分，房颤律，甲状腺Ⅱ度肿大，可闻及血管杂音，双手细颤，巩膜轻度黄染。","dx":{"answer":"甲状腺危象（甲亢危象）","why":["甲亢病史 + 自行停药 + 感染诱因：这是甲状腺危象最典型的三要素（基础病、停药反跳、应激诱因）。","高热 40℃ + 心率 160 + 房颤：高热和心动过速是危象的核心表现，心率常 >140 次/分。","烦躁、呕吐、腹泻、黄疸：提示多系统受累（中枢、消化、肝），是危象而非单纯甲亢加重。","教材原文：《外科学》第10版——甲状腺危象是甲亢术后的严重并发症，是甲状腺素过量释放引起的暴发性肾上腺素能兴奋现象。","诊断是临床诊断：Burch-Wartofsky 评分 ≥45 分即可诊断，不等甲状腺功能结果，立即开始治疗。"]},"diff":[["恶性高热","有麻醉药（琥珀胆碱、吸入麻醉）接触史，体温骤升伴肌肉强直，无甲亢病史"],["脓毒症","有感染灶、寒战、白细胞显著升高，甲状腺功能正常；两者可并存，需同时排查"],["嗜铬细胞瘤危象","阵发性高血压、头痛心悸出汗三联征，血/尿儿茶酚胺升高"],["急性心肌梗死","胸痛、心电图 ST 改变、肌钙蛋白升高；甲亢可诱发心梗，需同时评估"]],"exam":[["甲状腺功能（FT3、FT4、TSH）","支持诊断，但结果未回也应按危象处理"],["血常规、CRP、血培养","寻找感染诱因"],["心电图","评估房颤、心动过速和心肌缺血"],["肝功能、电解质","评估多器官受累和脱水程度"]],"tx":[["抑制合成：丙硫氧嘧啶（PTU）","首剂 600 mg 口服/鼻饲，之后 200 mg q6h——PTU 还能抑制外周 T4 转 T3"],["抑制释放：碘剂","在 PTU 后 1 小时给复方碘溶液，抑制甲状腺激素释放（顺序不能反）"],["控制心率：β 受体阻滞剂","普萘洛尔 20～40 mg q6h 或静脉艾司洛尔，禁忌者用胍乙啶"],["糖皮质激素","氢化可的松 100 mg q8h，抑制外周 T4 转 T3、防治肾上腺皮质功能相对不足"],["支持治疗与陷阱","降温（禁用阿司匹林，它置换结合型甲状腺激素）、补液、纠正电解质；诱因（感染）必须同时处理"]]},{"id":"acute_cholecystitis","dept":"外科·肝胆","stem":"女，48 岁，肥胖，反复右上腹隐痛 2 年，进食油腻后加重。3 天前进食火锅后右上腹持续疼痛，向右肩背放射，伴发热 38.5℃、恶心。查体：右上腹压痛，Murphy 征阳性。WBC 14×10⁹/L，超声示胆囊增大、壁厚 5 mm、胆囊内强回声伴声影。","dx":{"answer":"急性结石性胆囊炎","why":["中年女性 + 肥胖 + 反复油腻后右上腹痛：符合胆囊结石的经典人群和诱因（\"4F\"：female、fat、forty、fertile）。","疼痛向右肩背放射：胆囊的内脏传入神经与右肩部皮节重叠，是胆道病变的特征性放射痛。","Murphy 征阳性：按压右上腹嘱深吸气时疼痛屏气，是急性胆囊炎最有价值的体征。","超声见胆囊肿大、壁厚 5 mm、结石伴声影：壁厚 >3 mm 提示炎症，结石是病因。","教材原文：《外科学》第10版——胆囊结石的典型症状为胆绞痛，典型发作是在饱餐、进食油腻食物后或睡眠中体位改变时。"]},"diff":[["急性胰腺炎","上腹剧痛向腰背放射、血淀粉酶/脂肪酶升高、CT 胰腺肿胀；本例淀粉酶正常"],["消化性溃疡穿孔","突发刀割样痛、板状腹、膈下游离气体；本例无肌紧张"],["急性胆管炎","Charcot 三联征（腹痛、寒战高热、黄疸）+ 胆管扩张；本例无黄疸、胆管不扩张"],["右肾结石","腰部绞痛向会阴放射、血尿，超声见肾盂积水/结石"]],"exam":[["腹部超声（首选）","胆囊壁厚度、结石、胆管扩张、胆囊周围积液，是首选影像"],["肝功能 + 胆红素","明显升高提示合并胆总管结石或胆管炎"],["血常规、CRP","评估炎症程度"],["MRCP","怀疑胆总管结石时评估胆道树"]],"tx":[["禁食、解痉、抗感染","禁食减少胆囊收缩，山莨菪碱解痉，二代/三代头孢 + 甲硝唑覆盖肠道菌群"],["镇痛","NSAIDs 或哌替啶，避免单独使用吗啡（加重 Oddi 括约肌痉挛）"],["手术时机","发病 72 小时内首选腹腔镜胆囊切除术（LC）；超过 72 小时先抗感染，6～8 周后择期"],["陷阱：胆囊穿孔","若出现弥漫性腹膜炎、高热不退，警惕胆囊坏疽穿孔，需急诊手术"]]},{"id":"aosc","dept":"外科·肝胆","stem":"女，70 岁，胆囊结石 10 年。突发右上腹痛 1 天，伴寒战高热 39.5℃、皮肤巩膜黄染。查体：BP 80/50 mmHg，神志淡漠，右上腹压痛、肌紧张。WBC 22×10⁹/L，总胆红素 120 μmol/L，超声示胆总管扩张 1.5 cm、内见强回声。","dx":{"answer":"急性梗阻性化脓性胆管炎（AOSC，Reynolds 五联征）","why":["腹痛 + 寒战高热 + 黄疸：Charcot 三联征齐备，提示急性胆管炎。","再加休克（BP 80/50）和神志淡漠：构成 Reynolds 五联征，即 AOSC，是胆道感染的危重阶段。","胆总管扩张 1.5 cm + 强回声：胆总管结石梗阻，是 AOSC 最常见的原因。","胆红素 120 μmol/L：梗阻性黄疸，与结石嵌顿一致。","教材原文：《外科学》第10版——AOSC 是急性胆管炎的严重阶段，也称急性重症胆管炎；Charcot 三联征外还有休克、中枢神经系统受抑制表现，称为 Reynolds 五联征。"]},"diff":[["急性胆囊炎","右上腹痛、Murphy 征阳性、无黄疸或轻度黄疸，无休克和神志改变"],["急性胰腺炎","上腹痛向腰背放射、淀粉酶/脂肪酶升高，胆管不扩张"],["肝脓肿","高热、肝区叩痛，超声/CT 见肝内液性暗区"],["急性梗阻性化脓性胆管炎 vs 胆管癌","后者黄疸进行性加重、无高热寒战，影像见胆管占位"]],"exam":[["血常规、CRP、降钙素原","评估感染严重程度"],["肝功能、胆红素、凝血","评估梗阻和肝功能"],["腹部超声","胆管扩张、结石、胆囊肿大"],["MRCP 或 CT","明确梗阻部位和原因"],["血培养","抗菌药物使用前抽血"]],"tx":[["抗休克与抗感染（首要）","快速补液、血管活性药物维持血压，广谱抗生素覆盖革兰阴性杆菌和厌氧菌"],["紧急胆道减压","原则：\"解除梗阻、引流胆道\"——ERCP 鼻胆管引流（ENBD）或 PTCD，或急诊手术胆总管切开取石+T 管引流"],["时机","诊断明确后尽快（数小时 65 岁，高血压 10 年、房颤 3 年（未抗凝）。晨起突发右侧肢体无力、言语不清 1.5 小时。查体：神清，运动性失语，右侧鼻唇沟变浅，右上肢肌力 2 级、右下肢 3 级，右侧巴宾斯基征阳性。头颅 CT 未见出血。","dx":{"answer":"急性左侧大脑中动脉供血区脑梗死（心源性栓塞可能），在静脉溶栓时间窗内","why":["突发局灶性神经功能缺损（偏瘫 + 失语）+ CT 无出血：首先考虑急性缺血性卒中，而不是脑出血。","运动性失语 + 右侧偏瘫：定位在左侧大脑半球（优势半球）大脑中动脉供血区——失语定位于优势半球皮质。","房颤未抗凝：心源性栓塞是最可能的病因，房颤时左心房附壁血栓脱落。","发病 1.5 小时，在 4.5 小时溶栓窗内：这是决定治疗的关键时间点，需立即评估溶栓适应证和禁忌证。","教材原文：《神经病学》第9版——目前认为有效抢救缺血半暗带的时间窗为发病 4.5 小时内（rtPA）或 6 小时内（尿激酶）。"]},"diff":[["脑出血","多在活动中起病、头痛呕吐、血压显著升高，CT 见高密度血肿；本例 CT 无出血"],["低血糖","可有偏瘫样表现，但血糖 <2.8 mmol/L，补糖后迅速恢复；溶栓前必须查血糖"],["癫痫后 Todd 麻痹","有癫痫发作史，瘫痪多在数小时内自行恢复"],["颅内占位","起病缓慢、进行性加重，CT/MRI 见占位效应"]],"exam":[["急诊头颅 CT（首选）","排除出血，是溶栓前的必需检查"],["血糖、凝血、血常规","血糖 <2.8 或 >22.2 mmol/L、INR >1.7 是溶栓禁忌"],["NIHSS 评分","评估神经功能缺损程度，指导溶栓决策"],["头颅 CTA/MRA、心电图、心超","明确血管闭塞部位和心源性栓子来源"]],"tx":[["静脉溶栓（时间窗内首选）","rtPA 0.9 mg/kg（最大 90 mg）静脉溶栓，发病 4.5 小时内；或尿激酶 6 小时内"],["血管内取栓","大血管闭塞（如大脑中动脉 M1 段）在时间窗内可行机械取栓"],["抗血小板与抗凝","溶栓 24 小时后复查 CT 无出血，启动抗血小板；房颤患者后续抗凝"],["二级预防","控制血压、房颤抗凝（华法林或 DOAC）、他汀"],["陷阱：溶栓禁忌","血压 ≥180/100 mmHg、3 个月内卒中史、活动性出血、INR >1.7 都不能溶栓"]]},{"id":"ich","dept":"神经内科","stem":"男，58 岁，高血压 15 年，服药不规律。情绪激动时突发剧烈头痛、呕吐，随即意识不清。查体：BP 210/120 mmHg，浅昏迷，双侧瞳孔等大，左侧肢体偏瘫，左侧巴宾斯基征阳性。头颅 CT 示右侧基底节区高密度影，量约 30 ml，中线轻度移位。","dx":{"answer":"右侧基底节区高血压性脑出血","why":["长期高血压 + 情绪激动时突发剧烈头痛呕吐 + 意识障碍：高血压性脑出血的典型起病方式。","BP 210/120：极度升高的血压是出血的直接诱因，也是继续出血的危险因素。","左侧偏瘫：右侧基底节区（内囊）出血累及皮质脊髓束，造成对侧偏瘫。","CT 示右侧基底节区高密度影 30 ml：高密度=新鲜血肿，基底节是最常见部位（豆纹动脉破裂）。","教材原文：《神经病学》第9版——高血压性脑出血最常见部位为基底节区，豆纹动脉破裂是主要机制。"]},"diff":[["脑梗死","多在安静时起病、症状逐渐进展，CT 早期多无异常，24 小时后见低密度灶"],["蛛网膜下腔出血","突发剧烈头痛（\"一生中最剧烈的头痛\"）、脑膜刺激征阳性、CT 见脑池高密度"],["脑肿瘤出血","起病前有进行性局灶症状，CT/MRI 见占位和水肿"],["淀粉样血管病出血","老年、无高血压、多脑叶出血，反复发作"]],"exam":[["急诊头颅 CT","首选，明确出血部位和量，判断有无脑疝"],["血压、凝血、血小板","评估继续出血风险（抗凝药、血小板减少）"],["GCS 评分、瞳孔","评估意识水平和脑疝风险"],["CTA（必要时）","怀疑动脉瘤或血管畸形时"]],"tx":[["控制血压","收缩压 >220 时静脉降压（乌拉地尔/硝普钠），目标 140～160 mmHg，避免降压过快"],["降低颅内压","甘露醇、呋塞米，头高位 30°，避免颈部受压"],["停用抗凝/抗血小板","立即停用，必要时用鱼精蛋白、维生素 K 等拮抗"],["手术指征","基底节出血 >30 ml、意识恶化、脑疝早期可考虑微创血肿清除或开颅"],["陷阱：止血药","高血压脑出血不常规用止血药（氨甲环酸证据有限），重点是控压和降颅压"]]},{"id":"status_epilepticus","dept":"神经内科","stem":"男，30 岁，癫痫病史 5 年，自行停药 1 周。今晨起反复全身强直-阵挛发作，间歇期意识不恢复，已持续约 40 分钟。查体：昏迷，双侧瞳孔散大，口唇发绀，四肢肌张力增高。","dx":{"answer":"全面性惊厥性癫痫持续状态","why":["癫痫病史 + 自行停药：最常见的诱因是突然停用抗癫痫药。","反复强直-阵挛发作、间歇期意识不恢复、持续 >5 分钟：符合癫痫持续状态的定义（传统定义 30 分钟，现主张 >5 分钟即按持续状态处理）。","昏迷 + 瞳孔散大 + 发绀：提示脑缺氧、脑水肿，是危及生命的征象。","教材原文：《神经病学》第9版——癫痫持续状态是神经科急症，需立即终止发作，否则可致脑损伤甚至死亡。","关键判断：这是惊厥性持续状态，不是\"频繁发作\"，处理级别是急诊抢救。"]},"diff":[["低血糖性脑病","血糖 <2.8 mmol/L，补糖后意识恢复；癫痫持续状态需先查血糖排除"],["中毒（如异烟肼、三环类）","有服药史，可表现为难治性抽搐"],["中枢神经系统感染","发热、脑膜刺激征、脑脊液异常"],["假性发作（心因性）","无发绀、瞳孔正常、无尿失禁和舌咬伤，脑电图无癫痫样放电"]],"exam":[["血糖、电解质、血气","低血糖、低钠、酸中毒都可诱发或加重"],["抗癫痫药血药浓度","评估是否因停药或剂量不足"],["头颅 CT/MRI","排除新发病灶（肿瘤、出血、卒中）"],["脑电图","评估发作和亚临床放电，指导治疗"]],"tx":[["气道与生命支持","保持气道通畅、吸氧、监测，必要时气管插管"],["一线：苯二氮䓬类","地西泮 10 mg 静推（或咪达唑仑肌注），5 分钟后可重复"],["二线：抗癫痫药负荷","苯妥英钠 20 mg/kg 静滴（监测血压心律），或丙戊酸钠、左乙拉西坦"],["难治性持续状态","气管插管 + 丙泊酚/咪达唑仑持续泵入，脑电图监测"],["陷阱：不要用短效药维持","地西泮半衰期短，控制后必须用长效抗癫痫药维持，否则易复发"]]},{"id":"neonatal_jaundice","dept":"儿科","stem":"男婴，生后 36 小时出现皮肤黄染，进行性加重，生后第 3 天查血清总胆红素 320 μmol/L，以间接胆红素为主。足月顺产，出生体重 3.2 kg，母乳喂养，吃奶尚可。母亲血型 O 型，患儿 A 型。","dx":{"answer":"新生儿病理性黄疸（ABO 血型不合溶血可能）","why":["生后 36 小时出现黄疸：早于 24～48 小时的\"生理性黄疸\"窗口，属于病理性黄疸的时间特征。","第 3 天总胆红素 320 μmol/L：超过足月儿同日龄的干预阈值（Bhutani 曲线第 95 百分位附近），需光疗。","母亲 O 型、患儿 A 型：ABO 血型不合是新生儿溶血病最常见的原因，抗体通过胎盘破坏胎儿红细胞。","以间接胆红素为主：溶血性黄疸的特点，需警惕胆红素脑病（核黄疸）风险。","教材原文：《儿科学》第10版——新生儿黄疸的高危因素包括新生儿溶血、头颅血肿、窒息、缺氧、酸中毒、脓毒症、低蛋白血症、低血糖等。"]},"diff":[["生理性黄疸","足月儿生后 2～3 天出现、4～5 天达峰、2 周内消退，胆红素峰值不超过同日龄阈值"],["母乳性黄疸","一般情况好、吃奶正常，黄疸可持续数周，停母乳 48～72 小时明显下降"],["G6PD 缺乏症","南方地区、家族史、溶血性贫血，G6PD 活性降低"],["胆道闭锁","直接胆红素升高为主、大便颜色变浅、肝大，需早期手术"]],"exam":[["血清总胆红素和直接胆红素","区分间接/直接胆红素升高，评估光疗和换血指征"],["血型（母子 ABO/Rh）","ABO 或 Rh 血型不合的诊断依据"],["血常规、网织红细胞、Coombs 试验","评估溶血程度，Coombs 试验阳性支持免疫性溶血"],["G6PD 活性、肝功能、腹部超声","排除 G6PD 缺乏、胆道闭锁"]],"tx":[["光疗（首选）","蓝光照射使间接胆红素转化为水溶性异构体排出，是病理性黄疸的一线治疗"],["换血疗法","严重高胆红素血症（接近换血阈值）或已出现神经系统症状时换血"],["纠正诱因","停用可能加重溶血的药物、保证喂养和排便、纠正酸中毒和低蛋白"],["监测","每 6～12 小时监测胆红素，直至降至安全范围"],["陷阱：生理性 vs 病理性","24 小时内出现、进展快、>2 周不退、直接胆红素升高、有高危因素——任一条件即按病理性处理"]]},{"id":"pediatric_pneumonia","dept":"儿科","stem":"男，2 岁，发热 3 天，咳嗽、气促 1 天。查体：T 39.2℃，R 52 次/分，鼻翼扇动，三凹征阳性，双肺可闻及中细湿啰音。胸片示双下肺片状阴影。WBC 15×10⁹/L，CRP 25 mg/L。","dx":{"answer":"小儿支气管肺炎（细菌性可能）","why":["2 岁幼儿 + 发热咳嗽气促：支气管肺炎是婴幼儿最常见的肺炎类型。","R 52 次/分 + 鼻翼扇动 + 三凹征：呼吸困难的表现，提示肺通气/换气功能受损。","双肺中细湿啰音：肺泡渗出物的体征，是支气管肺炎的典型听诊特点。","胸片双下肺片状阴影：符合支气管肺炎（小叶性肺炎）沿支气管分布的斑片影。","教材原文：《儿科学》第10版——支气管肺炎是小儿最常见的肺炎类型，以发热、咳嗽、气促、肺部固定湿啰音为特征。"]},"diff":[["急性支气管炎","以咳嗽为主、呼吸音粗、无固定湿啰音，胸片多无片状阴影"],["支气管哮喘","反复发作的喘息、呼气相延长、过敏史，无发热和固定湿啰音"],["肺结核","低热盗汗、结核接触史、PPD 阳性，病变多在肺尖"],["异物吸入","突发呛咳、单侧呼吸音减低，有异物接触史"]],"exam":[["血常规、CRP、病原学","区分细菌/病毒/支原体，指导抗生素"],["胸片","明确病变范围和有无并发症（胸腔积液、肺脓肿）"],["血气分析","评估呼吸衰竭（SpO₂ <92%、PaO₂ <60 mmHg）"],["血培养","重症或治疗无效时"]],"tx":[["抗感染","细菌性首选青霉素/阿莫西林（肺炎链球菌），支原体用大环内酯类"],["氧疗","SpO₂ <92% 时吸氧，必要时无创通气"],["对症支持","退热、雾化、补液、保证营养"],["重症处理","出现呼吸衰竭、心力衰竭、中毒性脑病时按重症肺炎处理"],["陷阱：小儿肺炎的「危险信号」","呼吸增快、三凹征、发绀、拒食、嗜睡是重症预警，需住院"]]},{"id":"febrile_seizure","dept":"儿科","stem":"男，2 岁 6 个月，发热 1 天（体温 39.5℃），突发全身抽搐 1 次，持续约 2 分钟，双眼上翻、四肢强直抖动、口吐白沫，自行缓解后神志恢复。既往无抽搐史，无神经系统异常。","dx":{"answer":"单纯性热性惊厥","why":["2 岁 6 个月幼儿 + 发热初期（体温骤升时）+ 全面性发作：热性惊厥的高发年龄和典型诱因。","发作持续 2 分钟、24 小时内仅 1 次、发作后神志恢复：符合单纯性热性惊厥（简单型）的标准。","无神经系统异常、无既往抽搐史：不支持癫痫或中枢感染。","教材原文：《儿科学》第10版——热性惊厥多发生于 6 个月至 5 岁儿童，单纯性表现为全面性发作、持续时间 <15 分钟、24 小时内仅发作 1 次。","关键判断：单纯性热性惊厥预后良好，不需长期抗癫痫治疗；但需排除中枢感染。"]},"diff":[["中枢神经系统感染","有脑膜刺激征、意识障碍持续不恢复、脑脊液异常；必要时腰穿"],["癫痫","无热惊厥、反复发作、脑电图见癫痫样放电"],["低血糖/电解质紊乱","血糖、血钠异常，纠正后不再发作"],["复杂性热性惊厥","发作 >15 分钟、24 小时内多次、局灶性发作，需进一步评估"]],"exam":[["体温、生命体征","评估发热程度和全身状态"],["血糖、电解质","排除低血糖、低钠等可逆原因"],["脑电图（必要时）","单纯性热性惊厥不常规做，复杂性或反复发作时做"],["腰穿（必要时）","有脑膜刺激征或 <12 个月婴儿需排除中枢感染"]],"tx":[["急性发作处理","侧卧防误吸、保持气道通畅，超过 5 分钟用地西泮静推或咪达唑仑"],["退热","对乙酰氨基酚或布洛芬，退热不能预防惊厥复发但可缓解不适"],["家长教育","大多数单纯性热性惊厥预后良好，不需长期抗癫痫药"],["预防复发","反复发作（>2 次/年）或复杂型可考虑间歇性预防（地西泮）"],["陷阱：不要过度治疗","单纯性热性惊厥不需要长期抗癫痫治疗，过度用药反而有害"]]},{"id":"ectopic_pregnancy","dept":"妇产科","stem":"女，28 岁，停经 7 周，下腹隐痛 3 天，今晨突发左下腹撕裂样剧痛伴晕厥。查体：BP 80/50 mmHg，心率 120 次/分，面色苍白，下腹压痛、反跳痛，宫颈举痛，后穹窿饱满。尿 HCG 阳性，Hb 78 g/L。","dx":{"answer":"左侧输卵管妊娠破裂（异位妊娠，失血性休克）","why":["停经 7 周 + 尿 HCG 阳性：妊娠成立，但停经时间短、尚无宫内孕证据。","突发下腹撕裂样剧痛 + 晕厥 + 休克：腹腔内大出血的典型表现，异位妊娠破裂是育龄女性猝死的常见原因。","宫颈举痛 + 后穹窿饱满：腹腔内出血刺激腹膜和子宫直肠陷凹积血的体征。","Hb 78 g/L：急性失血性贫血，与休克一致。","教材原文：《妇产科学》第10版——异位妊娠破裂是妇产科最常见的急腹症之一，典型表现为停经、腹痛、阴道流血三联征。"]},"diff":[["急性阑尾炎","转移性右下腹痛、麦氏点压痛、发热，无停经和 HCG 阳性"],["黄体破裂","多发生在月经周期后半期，HCG 阴性，出血量一般较少"],["卵巢囊肿蒂扭转","突发一侧下腹痛、可触及包块，HCG 阴性"],["盆腔炎","发热、脓性分泌物、宫颈举痛，但无休克和 HCG 阳性"]],"exam":[["血 HCG + 孕酮","HCG 阳性支持妊娠，孕酮低提示异常妊娠"],["经阴道超声","宫腔内无孕囊、附件区包块或盆腔积液，是诊断关键"],["后穹窿穿刺","抽出不凝血提示腹腔内出血，快速确诊"],["血常规、血型、凝血","评估失血量和备血"]],"tx":[["抗休克（首要）","快速补液、输血、备血，同时准备手术"],["急诊手术","腹腔镜或开腹输卵管切除术（或开窗取胚，视生育要求）"],["药物保守治疗","仅适用于早期、未破裂、HCG 较低且稳定的患者（甲氨蝶呤）"],["后续随访","监测 HCG 降至正常，评估输卵管功能和再次妊娠风险"],["陷阱：不要盲目保胎","确诊异位妊娠后禁止保胎，破裂出血可致命"]]},{"id":"preeclampsia","dept":"妇产科","stem":"女，32 岁，孕 34 周，头痛、视物模糊 2 天。查体：BP 165/110 mmHg，双下肢水肿，宫高腹围与孕周相符。尿蛋白（+++），血小板 90×10⁹/L，ALT 80 U/L。","dx":{"answer":"子痫前期（重度）","why":["孕 34 周 + 血压 165/110 mmHg + 尿蛋白（+++）：妊娠期高血压疾病中，血压 ≥160/110 且蛋白尿，符合重度子痫前期。","头痛、视物模糊：中枢神经系统受累的表现，提示病情严重、有子痫风险。","血小板 90×10⁹/L + ALT 80 U/L：血小板减少和肝酶升高，提示多器官受累（HELLP 综合征前期）。","教材原文：《妇产科学》第10版——子痫前期指妊娠 20 周后出现收缩压 ≥140 mmHg 和/或舒张压 ≥90 mmHg，伴蛋白尿或器官功能损害。","关键判断：这是重度子痫前期，需住院、解痉、降压，并评估终止妊娠时机。"]},"diff":[["慢性高血压合并妊娠","孕前或孕 20 周前已有高血压，无蛋白尿或蛋白尿轻微"],["妊娠期高血压","仅有血压升高、无蛋白尿和器官损害"],["急性脂肪肝","肝功能衰竭、低血糖、凝血障碍，超声见\"亮肝\""],["狼疮性肾炎","有 SLE 病史、抗 dsDNA 阳性、补体降低"]],"exam":[["血压监测、尿蛋白定量","评估病情严重程度"],["血常规、肝肾功能、凝血","评估 HELLP 综合征"],["胎儿超声、胎心监护","评估胎儿生长、羊水、胎盘功能"],["眼底检查","评估视网膜病变"]],"tx":[["解痉（首选硫酸镁）","预防和控制子痫发作，监测膝反射、呼吸、尿量"],["降压","拉贝洛尔、硝苯地平，目标血压 130～150/80～100 mmHg"],["终止妊娠（根本治疗）","重度子痫前期孕 ≥34 周建议终止；<34 周在母胎稳定下促胎肺成熟后终止"],["监测与支持","卧床、镇静、监测母胎状况"],["陷阱：硫酸镁中毒","膝反射消失、呼吸 <16 次/分、尿量 <25 ml/h 提示中毒，用葡萄糖酸钙拮抗"]]},{"id":"organophosphate","dept":"急诊科","stem":"女，45 岁，因家庭矛盾自服\"敌敌畏\"约 30 ml，1 小时后被家人发现，呕吐、大汗、流涎、呼吸困难。查体：神志模糊，瞳孔针尖样缩小，双肺满布湿啰音，心率 50 次/分，肌束震颤。","dx":{"answer":"急性有机磷农药中毒（重度，胆碱能危象）","why":["明确服毒史 + 呕吐大汗流涎 + 瞳孔针尖样缩小：有机磷中毒的毒蕈碱样（M 样）症状三件套。","双肺湿啰音 + 呼吸困难：气道分泌物增多和支气管痉挛，是中毒致死的主要原因（呼吸衰竭）。","心率 50 + 肌束震颤：烟碱样（N 样）症状和中枢症状，提示重度中毒。","教材原文：《内科学》第10版——有机磷进入人体后迅速与胆碱酯酶结合形成磷酰化胆碱酯酶，失去分解乙酰胆碱的能力。","关键判断：瞳孔缩小 + 大汗 + 分泌物增多 + 肌束震颤 = 胆碱能危象，立即解毒。"]},"diff":[["急性胃肠炎","有进食不洁史、腹泻为主，无瞳孔缩小和肌束震颤"],["中暑","高温环境、高热无汗，瞳孔正常"],["阿片类中毒","瞳孔缩小但无大汗、流涎和肌束震颤，有药物接触史"],["急性左心衰","粉红色泡沫痰、端坐呼吸，无服毒史和瞳孔缩小"]],"exam":[["全血胆碱酯酶活性","诊断和分级的关键指标，重度 <30%"],["血气分析","评估呼吸衰竭和酸中毒"],["心电图","有机磷可致 QT 延长、心律失常"],["毒物检测（必要时）","血液或胃内容物检测"]],"tx":[["脱离毒物、洗胃导泻","脱去污染衣物、清水冲洗皮肤，口服者用清水或 2% 碳酸氢钠洗胃（敌敌畏禁用碱性液）"],["阿托品（治标）","快速达\"阿托品化\"（口干、皮肤干燥、瞳孔散大、心率加快），阻断 M 受体"],["胆碱酯酶复能剂（治本）","碘解磷定/氯解磷定，恢复胆碱酯酶活性，与阿托品联用"],["呼吸支持","吸氧、吸痰，必要时气管插管机械通气"],["陷阱：阿托品过量","阿托品中毒表现为高热、谵妄、瞳孔散大、尿潴留，需与中毒加重鉴别"]]},{"id":"co_poisoning","dept":"急诊科","stem":"男，35 岁，冬季在密闭房间用煤炉取暖，次晨被家人发现昏迷、口唇呈樱桃红色。查体：深昏迷，瞳孔等大，呼吸 24 次/分，心率 110 次/分，四肢肌张力增高。血碳氧血红蛋白（COHb）35%。","dx":{"answer":"急性一氧化碳中毒（重度）","why":["密闭房间煤炉取暖 + 晨起昏迷：CO 中毒的典型场景（冬季、通风不良）。","口唇樱桃红色：COHb 的特征性颜色，是 CO 中毒的经典体征。","深昏迷 + 四肢肌张力增高：重度中毒（意识障碍、去皮质强直），提示脑缺氧严重。","COHb 35%：血中碳氧血红蛋白显著升高，支持诊断（>30% 为重度）。","教材原文：《内科学》第10版——吸入过量 CO 引起的中毒称急性 CO 中毒，俗称煤气中毒；CO 与 Hb 亲和力约为 O₂ 的 240 倍。"]},"diff":[["脑血管意外","有高血压/房颤史、局灶体征，CT 见出血或梗死"],["有机磷中毒","瞳孔缩小、大汗、肌束震颤，胆碱酯酶降低"],["低血糖昏迷","血糖 <2.8 mmol/L，补糖后迅速清醒"],["安眠药中毒","有服药史、瞳孔缩小、呼吸抑制，血药浓度升高"]],"exam":[["血 COHb 测定","诊断的关键，>10% 有诊断意义，>30% 为重度"],["血气分析","PaO₂ 可正常但氧含量下降，代谢性酸中毒"],["头颅 CT/MRI","评估脑水肿和迟发性脑病"],["心电图、心肌酶","CO 中毒可致心肌损伤"]],"tx":[["立即脱离现场、高浓度吸氧","移至通风处，100% 氧气吸入，加速 CO 解离"],["高压氧治疗","重度中毒或意识障碍者的关键治疗，减轻脑水肿、预防迟发性脑病"],["防治脑水肿","甘露醇、糖皮质激素，头部降温"],["对症支持","纠正酸中毒、防治感染、营养支持"],["陷阱：迟发性脑病","部分患者清醒后 2～60 天出现迟发性脑病（痴呆、帕金森样表现），需随访"]]},{"id":"perforated_appendicitis","dept":"外科·普外","stem":"男，28 岁，转移性右下腹痛 3 天，加重伴发热 1 天。查体：T 39℃，BP 100/60 mmHg，全腹压痛、反跳痛、肌紧张，以右下腹为著，肠鸣音消失。WBC 20×10⁹/L，腹部立位平片见膈下游离气体。","dx":{"answer":"急性阑尾炎穿孔并弥漫性腹膜炎","why":["转移性右下腹痛 3 天：阑尾炎的典型病史，病程已 3 天，穿孔风险高。","全腹压痛、反跳痛、肌紧张 + 肠鸣音消失：弥漫性腹膜炎的体征，提示感染已扩散至全腹。","膈下游离气体：消化道穿孔的直接证据，阑尾穿孔是常见原因。","T 39℃ + WBC 20×10⁹/L + 血压偏低：感染中毒表现，有脓毒症风险。","教材原文：《外科学》第10版——急性化脓性阑尾炎穿孔可引起弥漫性腹膜炎，需急诊手术。"]},"diff":[["消化性溃疡穿孔","突发刀割样上腹痛、板状腹，多有溃疡病史；本例疼痛始于右下腹"],[ 吸道感染后出现吞咽困难、构音障碍、呼吸困难。查体：双眼睑下垂，四肢肌力 3 级，疲劳试验阳性，呼吸浅快，血气示 PaCO₂ 55 mmHg。","dx":{"answer":"重症肌无力危象（肌无力危象，呼吸衰竭）","why":["重症肌无力病史 + 感染诱因：感染是肌无力危象最常见的诱因。","吞咽困难、构音障碍、呼吸困难：延髓肌和呼吸肌受累，是危象的核心表现。","疲劳试验阳性、眼睑下垂：重症肌无力的特征性体征（波动性、晨轻暮重）。","PaCO₂ 55 mmHg：Ⅱ 型呼吸衰竭，提示呼吸肌麻痹，需紧急处理。","教材原文：《神经病学》第9版——重症肌无力危象指肌无力累及呼吸肌导致呼吸衰竭，需立即抢救。"]},"diff":[["胆碱能危象","由抗胆碱酯酶药过量引起，伴瞳孔缩小、大汗、流涎、肌束震颤"],["吉兰-巴雷综合征","进行性对称性瘫痪、腱反射消失、脑脊液蛋白-细胞分离"],["Lambert-Eaton 综合征","下肢近端无力为主、短暂用力后肌力反而增强，与小细胞肺癌相关"],["急性呼吸窘迫综合征","严重低氧血症、双肺浸润，无波动性肌无力"]],"exam":[["动脉血气","评估呼吸衰竭类型和程度"],["肺活量、最大吸气压","评估呼吸肌力量，<20～25 ml/kg 提示需插管"],["新斯的明试验","鉴别肌无力危象和胆碱能危象"],["胸部 CT","筛查胸腺瘤（重症肌无力约 10%～15% 合并胸腺瘤）"]],"tx":[["呼吸支持（首要）","气管插管、机械通气，保持气道通畅"],["停用抗胆碱酯酶药","插管后暂缓溴吡斯的明，减少气道分泌物"],["IVIG 或血浆置换","快速清除自身抗体，是危象的关键治疗"],["免疫抑制","糖皮质激素（注意初期可能加重）、硫唑嘌呤等"],["陷阱：激素初期加重","大剂量激素初期可能使肌无力加重，需在监护下使用"]]},{"id":"bacterial_meningitis","dept":"神经内科","stem":"男，18 岁，发热、头痛、呕吐 2 天，意识模糊半天。查体：T 39.5℃，颈抵抗，Kernig 征阳性，Brudzinski 征阳性，皮肤散在瘀点。脑脊液：压力 280 mmH₂O，外观混浊，WBC 5000×10⁶/L（中性粒细胞 90%），蛋白 2.5 g/L，糖 1.0 mmol/L。","dx":{"answer":"化脓性脑膜炎（脑膜炎球菌感染可能）","why":["发热、头痛、呕吐 + 意识障碍：颅内感染的三联征，提示细菌性脑膜炎。","颈抵抗、Kernig 征、Brudzinski 征阳性：脑膜刺激征，是脑膜炎的体征。","皮肤瘀点：脑膜炎球菌败血症的特征性表现。","脑脊液：外观混浊、中性粒细胞为主（90%）、蛋白高、糖低——典型的化脓性脑膜炎改变。","教材原文：《神经病学》第9版——化脓性脑膜炎脑脊液呈化脓性改变：压力增高、外观混浊、白细胞显著增多以中性粒细胞为主、蛋白升高、糖降低。"]},"diff":[["病毒性脑膜炎","脑脊液清亮、淋巴细胞为主、糖正常、蛋白轻度升高"],["结核性脑膜炎","亚急性起病、脑脊液淋巴细胞为主、糖低、蛋白高，薄膜试验阳性"],["蛛网膜下腔出血","突发剧烈头痛、脑膜刺激征阳性，脑脊液均匀血性"],["脑脓肿","有感染灶、局灶体征，影像见环形强化占位"]],"exam":[["腰椎穿刺 + 脑脊液检查","确诊关键，包括压力、常规、生化、涂片、培养"],["血培养","抗菌药物使用前抽血，脑膜炎球菌败血症阳性率高"],["头颅 CT（腰穿前）","有颅内压增高或局灶体征时先做 CT，防脑疝"],["脑脊液 PCR/抗原检测","快速病原学诊断"]],"tx":[["经验性抗生素（立即）","三代头孢（头孢曲松/头孢噻肟）+ 万古霉素，覆盖肺炎链球菌和脑膜炎球菌"],["地塞米松","在抗生素前或同时使用，减轻脑膜炎症和听力损害"],["降颅压","甘露醇，防治脑疝"],["隔离","脑膜炎球菌性需呼吸道隔离"],["陷阱：腰穿时机","有颅内压增高、局灶体征、血小板 <50×10⁹/L 时先做影像，腰穿需谨慎"]]},{"id":"hand_foot_mouth","dept":"儿科","stem":"男，3 岁，发热 2 天，口腔疼痛、拒食 1 天。查体：T 38.5℃，口腔黏膜散在疱疹和溃疡，手掌、足底见斑丘疹和疱疹，臀部也有散在皮疹。精神尚可，无颈抵抗。","dx":{"answer":"手足口病（普通型）","why":["3 岁幼儿 + 发热 + 口腔疱疹 + 手足斑丘疹/疱疹：手足口病的典型\"四部\"表现（口、手、足、臀）。","口腔疼痛、拒食：
