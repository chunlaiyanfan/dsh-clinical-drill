血压不对称 = 主动脉夹层」。"},"x256":{"why":"肺炎链球菌肺炎红色肝样变期肺泡内充满红细胞和纤维蛋白，红细胞破坏后血红蛋白分解，痰呈铁锈色。（教材依据：《内科学》第10版 第二篇 第六章 肺部感染性疾病：「铁锈色痰而无大量脓臭痰，X线胸片示肺叶或肺段实变」）","others":"粉红色泡沫痰是急性肺水肿；砖红色胶冻样痰是肺炎克雷伯菌；大量脓臭痰是肺脓肿；白色黏液痰无特异性。","trap":"「铁锈色痰 = 肺炎链球菌」。"},"x257":{"why":"吸入性肺脓肿多因误吸口腔内容物，病原体以厌氧菌为主（消化链球菌、梭形杆菌、脆弱拟杆菌等），脓液恶臭；血源性肺脓肿多为金黄色葡萄球菌。（教材依据：《内科学》第10版 第二篇 第六章 肺部感染性疾病：「脓痰有腐臭味提示可能有厌氧菌感染」）","others":"肺炎链球菌、金黄色葡萄球菌、铜绿假单胞菌、军团菌都不是吸入性肺脓肿的主要病原。","trap":"「臭痰 + 误吸 = 厌氧菌肺脓肿」。"},"x258":{"why":"支气管扩张表现为慢性咳嗽、大量脓痰（晨起、体位改变时增多）和反复咯血，可伴杵状指；高分辨率 CT 是确诊手段。（教材依据：《内科学》第10版 第二篇 第四章 支气管扩张（慢性咳嗽、大量脓痰、反复咯血））","others":"进行性呼吸困难是间质性肺病/COPD；干咳低热是结核/支原体；胸痛咯血是肺癌/肺栓塞；夜间阵发性呼吸困难是左心衰。","trap":"「大量脓痰 + 咯血 + 杵状指 = 支扩」。"},"x259":{"why":"异烟肼常见不良反应为周围神经炎（与维生素 B6 缺乏有关，可预防性补充）、肝损害；乙胺丁醇致视神经炎（视力下降、红绿色盲）；链霉素致耳毒性。（教材依据：《内科学》第10版 第二篇 第八章 肺结核（异烟肼不良反应：周围神经炎，补充维生素 B6 可预防））","others":"视神经炎是乙胺丁醇；耳毒性是链霉素；肾损害是氨基糖苷类；骨髓抑制是利福平/其他药。","trap":"「异烟肼伤神经（补 B6），乙胺丁醇伤眼，链霉素伤耳」。"},"x260":{"why":"肺癌（尤其小细胞癌、鳞癌）能分泌异位激素或细胞因子，引起副肿瘤综合征：杵状指、肥大性骨关节病、SIADH（低钠血症）、异位 ACTH（库欣综合征）、高钙血症（鳞癌）等。（教材依据：《内科学》第10版 第二篇 第九章 肺癌：「副肿瘤综合征以SCLC多见，可以表现为先发症状或复发的首发征象」）","others":"骨转移有骨破坏和局部痛；类风湿关节炎是自身免疫；感染性关节炎有红肿热；痛风有尿酸结晶。","trap":"「杵状指 + 关节痛 + 肺癌 = 副肿瘤综合征」。"},"x261":{"why":"张力性气胸时胸膜腔压力持续升高，压迫肺和纵隔、影响静脉回流，可迅速致死。紧急处理是立即胸腔穿刺排气（锁骨中线第二肋间），随后闭式引流。（教材依据：《内科学》第10版 第二篇 第十七章 气胸：「张力性气胸时胸膜腔内压骤然升高，肺被压缩，纵隔移位，迅速出现严重呼吸循环障碍」）","others":"吸氧观察会延误；抗生素、镇咳无效；闭式引流是第二步，紧急减压优先。","trap":"「张力性气胸 = 先穿刺放气，再闭式引流」。"},"x262":{"why":"胃食管反流病典型症状为烧心（胸骨后烧灼感）和反流，餐后、平卧、弯腰时加重；可伴慢性咳嗽、咽喉炎等食管外表现。（教材依据：《内科学》第10版 第四篇 胃食管反流病（典型症状：烧心、反流））","others":"上腹痛提示消化性溃疡；呕血是出血；吞咽困难提示狭窄或肿瘤；腹泻不是典型表现。","trap":"「烧心 + 反酸 = GERD」。"},"x263":{"why":"目前推荐含铋剂四联疗法：PPI + 铋剂 + 两种抗生素（如阿莫西林 + 克拉霉素/甲硝唑/呋喃唑酮），疗程 10～14 天。因耐药率上升，传统三联已少用。（教材依据：《内科学》第10版 第四篇 第五章 消化性溃疡（幽门螺杆菌根除：含铋剂四联疗法））","others":"单用 PPI、单用阿莫西林、铋剂单用都不能根除；三联疗法已不作为首选。","trap":"「铋剂四联 10～14 天」。"},"x264":{"why":"肝硬化腹水首选螺内酯（拮抗醛固酮、保钾）联合呋塞米（袢利尿、排钾），常用比例 100:40；监测体重（每日 <0.5 kg）、电解质和肾功能。（教材依据：《内科学》第10版 第四篇 第十五章 肝硬化（腹水利尿：螺内酯联合呋塞米））","others":"氢氯噻嗪作用弱；甘露醇是渗透性利尿；乙酰唑胺用于青光眼/碱中毒；托拉塞米单用不作为首选。","trap":"「螺内酯 + 呋塞米 = 100:40」。"},"x265":{"why":"乳果糖不被吸收，在结肠被细菌分解为乳酸和乙酸，酸化肠道，使 NH₃ 转为不吸收的 NH₄⁺，减少氨吸收；同时导泻减少含氮物质吸收。是肝性脑病的一线治疗。（教材依据：《内科学》第10版 第四篇 第十五章 肝硬化：「乳果糖，以保证每日排软便1～2次」）","others":"谷氨酸钠、精氨酸降氨作用有限；左旋多巴用于帕金森；氟马西尼是苯二氮䓬拮抗剂。","trap":"「乳果糖 = 酸化肠道排氨」。"},"x266":{"why":"急性胰腺炎早期治疗：禁食、胃肠减压（减轻腹胀、减少胰液分泌）、积极液体复苏、镇痛、抑制胰酶（生长抑素）；抗生素仅用于感染证据；坏死感染才需手术。（教材依据：《内科学》第10版 第四篇 第二十章 胰腺炎（急性胰腺炎早期治疗：禁食、胃肠减压、液体复苏））","others":"立即手术仅用于感染性坏死；预防性抗生素不推荐；生长抑素是辅助；镇痛是辅助。","trap":"「早期禁食补液，感染才开刀」。"},"x267":{"why":"轻中度溃疡性结肠炎首选 5-氨基水杨酸（柳氮磺吡啶或美沙拉嗪），可口服或局部灌肠；中重度或急性发作加用糖皮质激素；激素依赖者用免疫抑制剂或生物制剂。（教材依据：《内科学》第10版 第四篇 第八章 炎症性肠病：「溃疡性结肠炎（UC）主要表现为慢性腹痛、腹泻及黏液脓血便，主要累及结直肠，呈连续性病变」）","others":"糖皮质激素用于中重度；硫唑嘌呤、英夫利西单抗、环孢素是二线/重症用药。","trap":"「轻中度 = 5-ASA；中重度 = 激素」。"},"x268":{"why":"急性链球菌感染后肾小球肾炎多在咽部或皮肤链球菌感染后 1～3 周发病，表现为血尿、蛋白尿、水肿、高血压（肾炎综合征），补体 C3 下降，多数预后良好。（教材依据：《内科学》第10版 第五篇 肾小球肾炎（急性链球菌感染后肾小球肾炎））","others":"大量蛋白尿 + 低蛋白血症是肾病综合征；少尿无尿 + 氮质血症是急进性肾炎/肾衰；发热腰痛尿频是尿路感染；肉眼血尿 + 肾绞痛是结石。","trap":"「感染后 1～3 周 + 肾炎综合征 = 链球菌感染后肾炎」。"},"x269":{"why":"原发性肾病综合征（尤其微小病变型）首选糖皮质激素（泼尼松 1 mg/kg·d），足量 8～12 周后缓慢减量；激素依赖或抵抗者加用免疫抑制剂（环磷酰胺、他克莫司等）。（教材依据：《内科学》第10版 第五篇 第五节 肾病综合征（首选糖皮质激素治疗））","others":"环磷酰胺、他克莫司是二线；ACEI 降蛋白尿是辅助；利尿剂对症。","trap":"「肾病综合征首选激素」。"},"x270":{"why":"无症状性菌尿在健康人群多不需治疗；但孕妇（易发展为肾盂肾炎、早产）和拟行泌尿外科手术者（易致术后感染）需治疗。（教材依据：《内科学》第10版 第五篇 第五章 尿路感染（无症状性菌尿：孕妇与泌尿外科手术前需治疗））","others":"老年女性、糖尿病患者、留置导尿管者、儿童都不是常规治疗指征。","trap":"「孕妇 + 泌尿手术 = 治无症状菌尿」。"},"x271":{"why":"CKD 非透析患者推荐低蛋白饮食（0.6～0.8 g/kg·d），减少含氮废物产生和肾小球高滤过，延缓肾功能恶化；同时保证足够热量。（教材依据：《内科学》第10版 第五篇 第十章 慢性肾衰竭：「低蛋白饮食［0.6～1.0g/（kg·d）］，同时控制饮食中磷的摄入」）","others":"高蛋白饮食加重肾负担；正常饮食不限制不利于延缓进展；极低蛋白需配合复方α-酮酸。","trap":"「CKD = 低蛋白饮食」。"},"x272":{"why":"缺铁性贫血补铁后血红蛋白先恢复正常，但贮存铁（铁蛋白）仍低，需继续服用 3～6 个月或至铁蛋白恢复正常，否则容易复发。（教材依据：《内科学》第10版 第六篇 缺铁性贫血（补铁至血红蛋白正常后继续 3～6 个月补足贮存铁））","others":"立即停药会复发；1 周、1 个月太短；终身服用无必要。","trap":"「血红蛋白正常后再补 3～6 个月」。"},"x273":{"why":"巨幼细胞贫血由叶酸或维生素 B12 缺乏引起 DNA 合成障碍，表现为大细胞性贫血（MCV >100 fl）、中性粒细胞分叶过多、骨髓巨幼变。（教材依据：《内科学》第10版 第六篇 巨幼细胞贫血：「巨幼细胞贫血时，补充叶酸和/或维生素B12」）","others":"铁缺乏是小细胞低色素；慢性失血是缺铁；骨髓衰竭是全血细胞减少；溶血是网织红细胞升高。","trap":"「大细胞 + 分叶过多 = 巨幼贫（叶酸/B12）」。"},"x274":{"why":"免疫性血小板减少症（ITP）由抗血小板抗体介导破坏，一线治疗为糖皮质激素（或 IVIG），二线包括促血小板生成药（TPO 受体激动剂）、利妥昔单抗、脾切除。（教材依据：《内科学》第10版 第六篇 免疫性血小板减少症（ITP 一线治疗：糖皮质激素））","others":"脾切除是二线；利妥昔单抗二线；血小板输注仅用于严重出血；环孢素不是一线。","trap":"「ITP 一线 = 激素」。"},"x275":{"why":"抗甲状腺药物（甲巯咪唑、丙硫氧嘧啶）最严重的不良反应是粒细胞缺乏，可致严重感染；用药期间出现发热、咽痛应立即查血常规并停药。其他不良反应有皮疹、肝损害、血管炎（PTU）。（教材依据：《内科学》第10版 第六篇 白细胞减少与粒细胞缺乏症（抗甲状腺药物最严重不良反应：粒细胞缺乏））","others":"皮疹、肝功能异常、关节痛、脱发都可发生，但严重程度不如粒细胞缺乏。","trap":"「ATD + 发热咽痛 = 查血常规（粒细胞缺乏）」。"},"x276":{"why":"DKA 治疗首要措施是快速补液（生理盐水），恢复血容量和组织灌注、稀释血糖；随后小剂量胰岛素静脉滴注、补钾（见尿补钾）、必要时补碱（pH <7.1）。（教材依据：《内科学》第10版 第七篇 第八章 糖尿病（酮症酸中毒：首先补液，随后小剂量胰岛素、补钾））","others":"大剂量胰岛素可能致低血糖和脑水肿；补碱仅在严重酸中毒；补钾需见尿；利尿会加重脱水。","trap":"「DKA：补液 → 胰岛素 → 补钾 → 必要时补碱」。"},"x277":{"why":"骨质疏松一线抗骨吸收药物为双膦酸盐（阿仑膦酸钠、唑来膦酸等），抑制破骨细胞活性；需同时补充钙剂和维生素 D。（教材依据：《内科学》第10版 第七篇 骨质疏松症（一线抗骨吸收药物：双膦酸盐））","others":"钙剂、维生素 D 单用是基础补充，不足以治疗；雌激素有风险；降钙素作用弱。","trap":"「骨质疏松 = 双膦酸盐 + 钙 + 维生素 D」。"},"x278":{"why":"痛风降尿酸一线为抑制尿酸生成的别嘌醇（需查 HLA-B*5801）或非布司他；苯溴马隆促尿酸排泄，用于尿酸排泄减少型；急性期不用降尿酸药。（教材依据：《内科学》第10版 第八篇 第九章 痛风：「别嘌醇，每次100mg，每日3次，以抑制尿酸合成」）","others":"秋水仙碱、NSAIDs、糖皮质激素用于急性发作；苯溴马隆是促排药，不是一线通用。","trap":"「降尿酸 = 别嘌醇/非布司他；急性期 = 秋水仙碱/NSAIDs」。"},"x279":{"why":"失血性休克因大量失血导致有效循环血量急剧减少，属于低血容量性休克。治疗关键是迅速止血、快速补充血容量（晶体、胶体、血制品）。（教材依据：《外科学》第10版 第五章 休克：「失血性休克（hemorrhagicshock）在外科休克中很常见」）","others":"心源性是心脏泵血衰竭；分布性是血管扩张；梗阻性是血流受阻；感染性属分布性。","trap":"「失血 = 低血容量性休克」。"},"x280":{"why":"CVP 反映右心房及胸腔内大静脉的压力，正常 5～12 cmH₂O；低于正常提示血容量不足，高于正常提示容量过多或右心功能不全。（教材依据：《外科学》第10版 第五章 休克：「中心静脉压代表右心房或者胸腔段腔静脉内压力的变化，可反映全身血容量与右心功能之间的关系」）","others":"平均动脉压反映灌注；心率、尿量是间接指标；血乳酸反映组织灌注和氧代谢。","trap":"「CVP 看右心前负荷」。"},"x281":{"why":"高钾血症早期 T 波高尖、基底变窄，血钾继续升高时 QRS 增宽、P 波低平甚至消失，可致室颤；低钾则 T 波低平、U 波明显。（教材依据：《外科学》第10版 第一篇 水、电解质代谢紊乱：「血清钾浓度高于5.5mmol/L称为高钾血症（hyperkalemia）」）","others":"U 波是低钾；ST 抬高是心梗/心包炎；P 波增高是肺心病；T 波低平是低钾。","trap":"「高钾 T 波高尖，低钾 U 波明显」。"},"x282":{"why":"代谢性酸中毒治疗以去除病因为主，仅在 pH <7.2 或 HCO₃⁻ 显著降低时补充碳酸氢钠；过度纠酸可致代谢性碱中毒、低钾、组织缺氧加重。（教材依据：《外科学》第10版 第一篇 酸碱平衡失调：「代谢性酸中毒（metabolicacidosis）是指细胞外液H+增加和/或HCO3-丢失引起的pH下降，以血浆原发性HCO3-减少为特征」）","others":"所有酸中毒都补碱是错的；轻度酸中毒先病因治疗；呼吸性酸中毒靠改善通气；碱中毒不补碱。","trap":"「pH <7.2 才补碱」。"},"x283":{"why":"营养支持原则：只要肠道有功能就优先肠内营养，保护肠黏膜屏障、减少感染并发症；肠内不足时联合肠外营养。（教材依据：《外科学》第10版 营养治疗：「肠内营养（enteralnutrition，EN）是指通过胃肠道途径提供营养的方式……因而是营养治疗的首选方法」）","others":"全肠外营养仅用于肠道不能利用时；禁食不是首选；肠外并不优于肠内。","trap":"「肠内优先，不足加肠外」。"},"x284":{"why":"qSOFA 包括：呼吸频率 ≥22 次/分、意识改变（GCS <15）、收缩压 ≤100 mmHg，符合 2 项提示预后不良，用于快速床旁筛查。（教材依据：《外科学》第10版 外科感染（脓毒症：qSOFA 快速筛查））","others":"APACHE II 用于 ICU 病情评估；GCS 评估意识；Child-Pugh 评估肝硬化；MELD 评估肝病严重度。","trap":"「qSOFA：呼吸、意识、血压」。"},"x285":{"why":"破伤风类毒素是主动免疫制剂（疫苗），刺激机体产生抗体，用于计划免疫和加强；破伤风抗毒素（TAT）和免疫球蛋白是被动免疫，用于伤口污染后的紧急预防。（教材依据：《外科学》第10版 外科感染：「破伤风类毒素抗原注射，使人体产生抗体以达到免疫目的」）","others":"TAT、免疫球蛋白是被动免疫；抗生素、激素不是免疫制剂。","trap":"「类毒素主动，抗毒素被动」。"},"x286":{"why":"疖是单个毛囊及其周围组织的急性化脓性感染（多由金葡菌）；痈是多个相邻毛囊及其周围组织同时发生的化脓性感染，范围大、症状重，可致脓毒症。（教材依据：《外科学》第10版 外科感染（疖与痈：痈为多个相邻毛囊及其周围组织的化脓性感染））","others":"单个毛囊是疖；多个毛囊是痈；两者都是细菌感染。","trap":"「疖单个，痈多个」。"},"x287":{"why":"急性乳腺炎多发生于产后哺乳期，金黄色葡萄球菌为主要致病菌，乳汁淤积和乳头皲裂是诱因，表现为乳房红肿热痛、发热。（教材依据：《外科学》第10版 乳腺疾病：「急性乳腺炎（acutemastitis）是乳腺的急性化脓性感染，多发生于产后哺乳期的妇女，尤以初产妇更为多见」）","others":"链球菌少见；大肠埃希菌、铜绿假单胞菌、厌氧菌都不是主要病原。","trap":"「哺乳期乳腺炎 = 金葡菌」。"},"x288":{"why":"甲状腺癌以乳头状癌最常见（约 60%～70%），恶性程度低、预后好；滤泡状癌次之；髓样癌来自滤泡旁 C 细胞（分泌降钙素）；未分化癌恶性度最高。（教材依据：《外科学》第10版 甲状腺疾病：「乳头状癌是成人及儿童甲状腺癌最常见的病理类型，多见于30～50岁女性」）","others":"滤泡状癌次之；髓样癌、未分化癌、淋巴瘤都少见。","trap":"「乳头状最常见、预后最好；未分化最恶」。"},"x289":{"why":"甲状腺危象治疗：①PTU 抑制激素合成；②碘剂抑制激素释放（在 PTU 后 1 小时用）；③β 受体阻滞剂控制心率；④糖皮质激素抑制外周 T4 转 T3、抗休克；⑤降温、补液、镇静、去除诱因。不再次手术。（教材依据：《外科学》第10版 甲状腺疾病：「甲状腺危象：是甲亢术后的严重并发症，是甲状腺素过量释放引起的暴发性肾上腺素能兴奋现象」）","others":"PTU、碘剂、β 阻滞剂、激素、降温补液都是危象处理措施。","trap":"「危象：PTU + 碘 + β 阻滞剂 + 激素，不手术」。"},"x290":{"why":"ER/PR 阳性提示肿瘤激素依赖性，适合内分泌治疗（他莫昔芬、芳香化酶抑制剂）；HER-2 阳性适合曲妥珠单抗等靶向治疗。（教材依据：《外科学》第10版 乳腺癌：「雌激素受体（ER）、孕激素受体（PR）、人表皮生长因子受体2（HER2）和细胞核增殖抗原（Ki-67）来进行乳腺癌分子分型」）","others":"HER-2 是靶向治疗指标；Ki-67 反映增殖活性；肿瘤大小、淋巴结转移是分期和预后因素。","trap":"「ER/PR 管内分泌，HER-2 管靶向」。"},"x291":{"why":"BillrothⅠ式：胃残端与十二指肠直接吻合（胃十二指肠吻合）；BillrothⅡ式：胃残端与空肠吻合（胃空肠吻合），十二指肠残端关闭。（教材依据：《外科学》第10版 胃十二指肠疾病：「Billroth Ⅰ式胃十二指肠吻合或Billroth Ⅱ式胃空肠吻合」）","others":"胃与食管是食管胃吻合；胃与结肠极少；仅切除不吻合不叫 Billroth。","trap":"「Ⅰ式接十二指肠，Ⅱ式接空肠」。"},"x292":{"why":"胃癌根治术要求整块切除肿瘤及足够切缘（距肿瘤边缘 ≥5 cm），并清扫相应区域淋巴结，进展期标准为 D2 清扫。（教材依据：《外科学》第10版 胃癌（根治性切除：足够切缘 + 区域淋巴结清扫））","others":"仅切肿瘤、仅切胃大部、仅清扫淋巴结都不符合根治要求。","trap":"「胃癌根治 = 足够切缘 + D2 淋巴结清扫」。"},"x293":{"why":"成人肠梗阻最常见病因为腹部手术后肠粘连；儿童以肠套叠多见；其他原因包括肿瘤、疝嵌顿、肠扭转。（教材依据：《外科学》第10版 肠梗阻：「粘连性肠梗阻是肠梗阻最常见的一种类型，其发生率约占肠梗阻的40%～60%」）","others":"肿瘤、疝嵌顿、肠扭转、肠套叠都可引起，但发生率低于粘连。","trap":"「成人肠梗阻 = 粘连；儿童 = 肠套叠」。"},"x294":{"why":"右半结肠腔大、粪便稀，肿瘤多呈肿块型，表现为贫血、腹部肿块、乏力消瘦；左半结肠腔窄、粪便干硬，肿瘤多呈浸润型，表现为肠梗阻、便血、排便习惯改变。（教材依据：《外科学》第10版 结肠癌（右半结肠癌以贫血、腹部肿块、全身症状为主））","others":"肠梗阻、便血、排便习惯改变是左半结肠更常见；里急后重是直肠癌表现。","trap":"「右半贫血包块，左半梗阻便血」。"},"x295":{"why":"肛裂典型表现为排便时肛门剧痛（周期性疼痛）、便后少量滴血和便秘；因怕痛而憋便，便秘又加重肛裂，形成恶性循环。（教材依据：《外科学》第10版 肛管直肠疾病（肛裂：周期性疼痛、便后滴血、便秘））","others":"无痛性便血是内痔；肛门肿物脱出是痔/直肠脱垂；排便习惯改变、里急后重是直肠癌。","trap":"「排便剧痛 + 便后滴血 + 便秘 = 肛裂」。"},"x296":{"why":"内痔位于齿状线以上（无躯体神经支配），主要症状为无痛性便血和痔核脱出；血栓性外痔或嵌顿痔才有剧痛。（教材依据：《外科学》第10版 肛管直肠疾病（内痔：无痛性便血和痔核脱出））","others":"剧痛是外痔/嵌顿；发热、排便困难、里急后重不是内痔典型表现。","trap":"「内痔无痛出血，外痔剧痛」。"},"x297":{"why":"阿米巴肝脓肿由溶组织内阿米巴滋养体溶解肝组织所致，脓液呈棕褐色（巧克力色），由坏死肝组织和陈旧性出血混合而成；细菌性肝脓肿为黄白色脓液。（教材依据：《外科学》第10版 肝脓肿（阿米巴肝脓肿：巧克力色脓液））","others":"黄色脓液是细菌性肝脓肿；血性、脓臭、清亮液体都不典型。","trap":"「巧克力色脓 = 阿米巴肝脓肿」。"},"x298":{"why":"急性胆囊炎表现为右上腹压痛、Murphy 征阳性（检查者按压右上腹，嘱病人深吸气，胆囊下移触碰按压手而剧痛、突然屏气）。（教材依据：《外科学》第10版 胆道疾病：「Murphy征阳性时，应及时作进一步检查」）","others":"麦氏点压痛是阑尾炎；移动性浊音是腹水；板状腹是弥漫性腹膜炎；肝浊音界消失是消化道穿孔。","trap":"「Murphy 征 = 急性胆囊炎」。"},"x299":{"why":"Charcot 三联征为腹痛、寒战高热、黄疸，提示急性胆管炎；若合并休克和意识障碍（Reynolds 五联征），提示急性梗阻性化脓性胆管炎，需紧急胆道减压。（教材依据：《外科学》第10版 胆道疾病：「Charcot三联征：腹痛、寒战高热和黄疸」）","others":"腹痛呕吐腹胀是肠梗阻；黄疸腹水脾大是肝硬化；发热贫血出血是血液病；腹痛血尿黄疸不是典型三联征。","trap":"「Charcot 三联征 + 休克 + 意识障碍 = Reynolds 五联征」。"},"x300":{"why":"Ranson 评分包括入院时年龄、白细胞计数、血糖、LDH、AST，以及 48 小时内血钙、PaO₂、碱缺失、液体丢失量、BUN 等；血淀粉酶水平与病情严重程度不平行。（教材依据：《外科学》第10版 胰腺炎（Ranson 评分：评估急性胰腺炎严重程度））","others":"年龄、白细胞、血糖、血钙、LDH、AST、液体丢失都是 Ranson 项目。","trap":"「淀粉酶不反映严重度，Ranson 才反映」。"},"x301":{"why":"腹外疝嵌顿后若不能手法复位或已出现血运障碍（绞窄），应急诊手术，防止肠坏死、穿孔和腹膜炎。（教材依据：《外科学》第10版 腹外疝（嵌顿性疝与绞窄性疝：急诊手术））","others":"手法复位后观察仅适用于嵌顿时间短、无绞窄征象者；热敷、抗生素、止痛都不能解决嵌顿。","trap":"「嵌顿疝：能复位则复位，不能或绞窄则急诊手术」。"},"x302":{"why":"闭合性腹部损伤中脾破裂最常见，因脾质地脆、被膜薄、血供丰富；其次为肝破裂。表现为腹腔内出血、失血性休克、腹膜炎。（教材依据：《外科学》第10版 腹部损伤（脾破裂：最常见的闭合性腹部实质脏器损伤））","others":"肝破裂次之；肾、胰、肾上腺相对少见。","trap":"「闭合性腹部损伤 = 脾破裂最常见」。"},"x303":{"why":"输尿管上段结石直径 <1 cm 首选体外冲击波碎石（ESWL）；结石较大、嵌顿时间长或碎石失败者，可选输尿管镜碎石取石。（教材依据：《外科学》第10版 尿路结石：「体外冲击波碎石（extracorporealshockwavelithotripsy，ESWL）治疗泌尿系统结石获得成功」）","others":"开放手术、输尿管切开取石用于复杂病例；肾切除不用于结石；药物排石适用于小结石辅助。","trap":"「输尿管上段 <1 cm = 体外碎石」。"},"x304":{"why":"膀胱癌典型表现为无痛性、间歇性肉眼血尿，可伴血块；晚期可出现尿频尿急尿痛、排尿困难。（教材依据：《外科学》第10版 泌尿、男生殖系统肿瘤（膀胱癌：无痛性肉眼血尿））","others":"尿频尿急尿痛是膀胱炎；排尿困难是前列腺增生；腰痛是上尿路病变；发热是感染。","trap":"「无痛性血尿 = 泌尿系肿瘤（膀胱癌最常见）」。"},"x305":{"why":"PSA（前列腺特异性抗原）是前列腺癌筛查、疗效监测和复发判断的常用指标；PSA 升高不等于癌（前列腺增生、炎症也可升高），确诊需前列腺穿刺活检。（教材依据：《外科学》第10版 泌尿、男生殖系统肿瘤：「PSA……具有前列腺组织特异性，是前列腺癌的生物学指标……可用于前列腺癌的筛查、早期诊断、分期、疗效评价和随访观察」）","others":"CEA 是结直肠癌；AFP 是肝癌；CA19-9 是胰腺癌；CA125 是卵巢癌。","trap":"「前列腺癌 = PSA；确诊靠穿刺」。"},"x306":{"why":"骨筋膜室综合征早期表现为与损伤程度不符的剧烈疼痛、被动牵拉痛（被动伸直手指或足趾时剧痛）、患肢肿胀紧张；晚期才出现苍白、麻木、无脉、瘫痪（5P）。早期诊断、尽早切开减压是关键，否则致缺血性肌挛缩。（教材依据：《外科学》第10版 骨折并发症（骨筋膜室综合征：早期剧痛与被动牵拉痛））","others":"麻木、苍白、脉搏消失、瘫痪都是晚期表现。","trap":"「早期看疼痛和被动牵拉痛，晚期看 5P」。"},"x307":{"why":"肩关节前脱位表现为方肩畸形、关节盂空虚、Dugas 征阳性（患侧手掌搭在对侧肩部时，肘部不能贴近胸壁）。（教材依据：《外科学》第10版 关节脱位：「Dugas征检查，应由阳性转为阴性」）","others":"Thomas 征是髋关节屈曲挛缩；浮髌试验是膝关节积液；直腿抬高是腰突；Hoffmann 征是上运动神经元损害。","trap":"「Dugas 征 = 肩关节前脱位」。"},"x308":{"why":"急性血源性骨髓炎多由金黄色葡萄球菌经血行播散引起，好发于儿童长骨干骺端（股骨远端、胫骨近端），表现为高热、患肢剧痛、局部红肿热痛、拒动。（教材依据：《外科学》第10版 骨与关节化脓性感染（急性血源性骨髓炎：金黄色葡萄球菌最常见））","others":"链球菌、铜绿假单胞菌、大肠埃希菌、结核分枝杆菌都不是最常见病原。","trap":"「儿童长骨干骺端 + 高热 + 金葡菌 = 急性血源性骨髓炎」。"},"x309":{"why":"蛋白质一级结构指多肽链中氨基酸的排列顺序，氨基酸之间通过肽键（酰胺键）连接。肽键由前一个氨基酸的羧基与后一个氨基酸的氨基脱水缩合形成。（教材依据：《生物化学与分子生物学》第10版 第一章 蛋白质的结构与功能（肽键：氨基酸之间通过肽键连接形成多肽链））","others":"氢键维持二级结构（α-螺旋、β-折叠）；二硫键、离子键、疏水作用维持三级结构。","trap":"「一级看肽键，二级看氢键」。"},"x310":{"why":"蛋白质变性指在某些理化因素（加热、强酸强碱、重金属、乙醇）作用下，空间结构（二、三、四级）被破坏，但一级结构（肽键、氨基酸序列）不受影响，因此分子量、氨基酸组成不变，生物学活性丧失。（教材依据：《生物化学与分子生物学》第10版 第一章 蛋白质的结构与功能：「蛋白质变性（denaturation）」）","others":"一级结构、肽键、氨基酸组成、分子量都不变。","trap":"「变性只破坏空间结构，不破坏一级结构」。"},"x311":{"why":"酶活性中心由结合部位和催化部位组成，结合部位识别并固定底物，催化部位提供催化基团完成反应。活性中心外的结构维持酶的整体构象。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应：「酶分子中能与底物特异结合并催化底物转变为产物的区域称为酶的活性中心（activecenter）或活性部位」）","others":"维持空间结构是活性中心外的结构；分子量、合成、储能都不是活性中心的功能。","trap":"「活性中心 = 结合 + 催化」。"},"x312":{"why":"酶原激活通过特定位点的肽键断裂，使酶原构象改变、形成或暴露活性中心，从而转变为有活性的酶。如胰蛋白酶原被肠激酶激活、胃蛋白酶原被盐酸激活。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应：「酶原激活的实质是酶的活性中心形成或暴露」）","others":"磷酸化、甲基化、结合辅酶、降解都不是酶原激活的本质。","trap":"「酶原激活 = 肽键断裂 + 构象改变」。"},"x313":{"why":"1 分子葡萄糖有氧氧化净生成约 30～32 ATP（脑和肌肉的 NADH 穿梭方式不同，产生 2 或 2.5 ATP/NADH）；糖酵解净生成 2 ATP，是远不能比的。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢（糖有氧氧化净生成约 30～32 ATP））","others":"2 ATP 是糖酵解；12、18 偏低；38 是旧版教材数字。","trap":"「有氧 30～32，无氧 2」。"},"x314":{"why":"糖原合成以 UDPG（尿苷二磷酸葡萄糖）为活性供体，在糖原合酶催化下把葡萄糖基转移到糖原引物的非还原端，形成 α-1,4-糖苷键。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢：「UDPG可看作'活性葡萄糖'，在体内充当葡萄糖供体」）","others":"GDP-葡萄糖、ADP-葡萄糖不是糖原合成的供体；葡萄糖-1-磷酸、葡萄糖-6-磷酸是中间产物。","trap":"「糖原合成供体 = UDPG」。"},"x315":{"why":"磷酸戊糖途径在胞质进行，生成 NADPH（用于脂肪酸合成、谷胱甘肽还原、抗氧化）和核糖-5-磷酸（核苷酸合成原料），不生成 ATP。（教材依据：《生物化学与分子生物学》第10版 第七章 糖代谢：「磷酸戊糖途径中的G6PD以NADP+作为受氢体进而生成NADPH+H+，NADPH+H+又可作为供氢体参与脂肪酸、胆固醇等物质的合成」）","others":"生成 ATP 是糖酵解和有氧氧化；生成乳酸是无氧酵解；合成糖原、分解脂肪酸是其他途径。","trap":"「磷酸戊糖途径 = NADPH + 核糖」。"},"x316":{"why":"体内氨的主要来源是氨基酸脱氨基作用（氧化脱氨基、转氨基、联合脱氨基），其次为肠道吸收（细菌分解）和肾小管泌氨。（教材依据：《生物化学与分子生物学》第10版 第九章 氨基酸代谢（体内氨的主要来源：氨基酸脱氨基作用））","others":"肠道吸收、肾泌氨、肌肉分解、嘌呤分解都是次要来源。","trap":"「氨主要来自氨基酸脱氨基」。"},"x317":{"why":"一碳单位（甲基、亚甲基、甲酰基等）由四氢叶酸（THF）携带和转运，参与嘌呤、嘧啶合成和氨基酸代谢；S-腺苷甲硫氨酸是甲基的直接供体。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素（一碳单位代谢与叶酸/四氢叶酸））","others":"SAM 是甲基供体；生物素是羧化酶辅酶；辅酶 A 运酰基；NAD⁺ 递电子。","trap":"「一碳单位载体 = 四氢叶酸」。"},"x318":{"why":"S-腺苷甲硫氨酸（SAM）是体内最重要的甲基直接供体，参与 DNA、RNA、蛋白质、磷脂的甲基化；转甲基后生成 S-腺苷同型半胱氨酸，再水解为同型半胱氨酸。（教材依据：《生物化学与分子生物学》第10版 第八章 脂质代谢：「S-腺苷甲硫氨酸提供甲基，使PE甲基化」）","others":"四氢叶酸运输一碳单位；维生素 B12 参与甲基转移；叶酸是 THF 前体；同型半胱氨酸是甲基受体。","trap":"「SAM = 甲基直接供体」。"},"x319":{"why":"嘌呤核苷酸从头合成以 PRPP（磷酸核糖焦磷酸）为起始物，经多步反应生成 IMP（次黄嘌呤核苷酸），再转变为 AMP 和 GMP；限速酶是 PRPP 酰胺转移酶。（教材依据：《生物化学与分子生物学》第10版 第十一章 核苷酸代谢：「PRPP上的焦磷酸，形成5-磷酸核糖胺（PRA），此反应由磷酸核糖酰胺转移酶催化」）","others":"尿酸是分解终产物；IMP 是中间产物；AMP、GMP 是终产物。","trap":"「嘌呤从头合成 = PRPP 起步 → IMP」。"},"x320":{"why":"嘧啶核苷酸从头合成先形成 UMP（尿苷酸），再经磷酸化生成 UTP，UTP 转化为 CTP；关键酶是氨甲酰磷酸合成酶Ⅱ（CPS-Ⅱ）。（教材依据：《生物化学与分子生物学》第10版 第十一章 核苷酸代谢（嘧啶核苷酸从头合成先形成 UMP））","others":"IMP、AMP、GMP 是嘌呤核苷酸；PRPP 是共同起始物。","trap":"「嘧啶 = UMP 起步」。"},"x321":{"why":"核糖核苷酸还原酶催化 NDP（二磷酸核苷）还原为 dNDP（脱氧二磷酸核苷），是脱氧核苷酸生成的限速酶；其活性受 ATP/dATP 调节。（教材依据：《生物化学与分子生物学》第10版 第十一章 核苷酸代谢：「核糖核苷酸还原酶（ribonucleotidereductase）催化」）","others":"胸苷酸合酶合成 dTMP；二氢叶酸还原酶参与叶酸代谢；磷酸核糖转移酶参与补救合成。","trap":"「脱氧 = 核糖核苷酸还原酶」。"},"x322":{"why":"DNA 复制是半保留复制（每条子链含一条亲代链）、双向复制、半不连续复制（前导链连续、后随链形成冈崎片段）。（教材依据：《生物化学与分子生物学》第10版 第十四章 DNA的合成：「半保留复制规律是遗传信息传递机制的重要发现之一」）","others":"全保留、单向、无引物都不是 DNA 复制的特点；不连续只针对后随链。","trap":"「半保留 + 双向 + 半不连续」。"},"x323":{"why":"着色性干皮病由 DNA 损伤修复（核苷酸切除修复）缺陷引起，紫外线造成的嘧啶二聚体不能修复，皮肤对光敏感、易发生皮肤癌。（教材依据：《生物化学与分子生物学》第10版 第十七章 DNA损伤与修复：「着色性干皮病（xerodermapigmentosum，XP）的发病，就是由于DNA损伤核苷酸切除修复系统基因缺陷所致」）","others":"DNA 复制错误、RNA 转录异常、蛋白质合成障碍、维生素缺乏都不是其机制。","trap":"「XP = DNA 修复缺陷」。"},"x324":{"why":"原核生物转录终止分依赖 ρ 因子（ρ 因子结合 RNA 并解旋）和不依赖 ρ 因子（发夹结构 + 寡聚 U）两种；σ 因子参与起始。（教材依据：《生物化学与分子生物学》第10版 第十五章 RNA的生物合成：「ρ因子依赖和ρ因子非依赖两种方式」）","others":"σ 因子参与起始；TFⅡD、TBP 是真核转录因子；CAP 是分解代谢基因激活蛋白。","trap":"「ρ 因子 = 原核转录终止」。"},"x325":{"why":"AUG 是起始密码子并编码甲硫氨酸；UAA、UAG、UGA 是三种终止密码子，不编码氨基酸。（教材依据：《生物化学与分子生物学》第10版 第十六章 蛋白质的合成：「起始密码子AUG，最后三个核苷酸序列是终止密码子」）","others":"UAA、UAG、UGA 都是终止密码子；GUA 是缬氨酸密码子。","trap":"「起始 AUG，终止 UAA/UAG/UGA」。"},"x326":{"why":"镰状细胞贫血由 β 珠蛋白基因第 6 位密码子点突变（GAG→GTG），谷氨酸被缬氨酸取代，HbS 在低氧时聚合成镰刀状，导致溶血和血管阻塞。属于分子病。（教材依据：《生物化学与分子生物学》第10版 第一章 蛋白质的结构与功能：「镰状细胞贫血发病机制的阐明，使人们第一次认识到一种疾病由特定分子的改变引起」）","others":"染色体缺失、基因扩增、RNA 剪接异常、蛋白质降解都不是其分子基础。","trap":"「镰状细胞 = 点突变（Glu→Val）」。"},"x327":{"why":"限制性核酸内切酶识别特定 DNA 序列并在特定位点切割，产生黏性末端或平末端，是基因工程中切割 DNA 的工具；DNA 连接酶负责把片段连起来。（教材依据：《生物化学与分子生物学》第10版 第十八章 常用的分子生物学技术：「限制性核酸内切酶的酶切位点的核酸序列具有回文结构，识别长度为4～8bp」）","others":"DNA 连接酶是「胶水」；DNA 聚合酶合成 DNA；逆转录酶以 RNA 为模板合成 cDNA；Taq 酶用于 PCR。","trap":"「内切酶 = 剪刀，连接酶 = 胶水」。"},"x328":{"why":"11-顺视黄醛与视蛋白结合形成视紫红质，光照后 11-顺视黄醛异构为全反视黄醛，引发视神经冲动；缺乏维生素 A 可致夜盲症、干眼病。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素（视黄醛与视觉））","others":"视黄醇、视黄酸、β-胡萝卜素、视黄酯是维生素 A 的不同形式，但直接参与视觉的是 11-顺视黄醛。","trap":"「视觉 = 11-顺视黄醛 + 视蛋白」。"},"x329":{"why":"维生素 C 是脯氨酸羟化酶、赖氨酸羟化酶的辅因子，参与胶原蛋白的羟化。缺乏时胶原合成障碍，血管壁脆性增加，出现牙龈出血、皮下瘀斑、伤口不愈（坏血病）。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素（维生素 C 缺乏与坏血病））","others":"钙吸收靠维生素 D；凝血因子靠维生素 K；髓鞘合成靠 B12；DNA 合成靠叶酸/B12。","trap":"「维 C 缺 = 坏血病 = 胶原羟化障碍」。"},"x330":{"why":"维生素 D 经肝 25-羟化生成 25-(OH)-D₃，再经肾 1α-羟化酶生成 1,25-(OH)₂-D₃（骨化三醇），促进肠钙吸收、骨钙动员和肾小管钙重吸收。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素（维生素 D 的活性形式 1,25-(OH)₂-D₃））","others":"25-(OH)-D₃ 是储存形式；维生素 D₂/D₃ 是原料；7-脱氢胆固醇是前体。","trap":"「活性维生素 D = 1,25-(OH)₂-D₃」。"},"x331":{"why":"维生素 E 是脂溶性抗氧化剂，能清除自由基、保护生物膜中的多不饱和脂肪酸，维持膜结构完整；缺乏可致红细胞膜脆性增加、溶血性贫血。（教材依据：《生物化学与分子生物学》第10版 第六章 维生素：「维生素E是苯骈二氢吡喃的衍生物」）","others":"促钙吸收是维生素 D；凝血是维生素 K；视觉是维生素 A；胶原合成是维生素 C。","trap":"「维 E = 抗氧化、护膜」。"},"x332":{"why":"维生素 K 参与凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ 的 γ-羧化，使其分子中的谷氨酸残基转化为 γ-羧基谷氨酸，从而能与 Ca²⁺ 和磷脂结合，发挥凝血活性。（教材依据：《生物化学与分子生物学》第10版 第二章 酶与酶促反应：「维生素K缺乏时，凝血因子Ⅱ、Ⅶ、Ⅸ、Ⅹ的前体不能在肝内进一步羧化生成成熟的凝血因子」）","others":"Ⅰ、Ⅲ、Ⅷ、Ⅴ、Ⅺ 不依赖维生素 K；Ⅻ 也不依赖。","trap":"「依赖维生素 K 的凝血因子：Ⅱ、Ⅶ、Ⅸ、Ⅹ」。"},"x333":{"why":"呼吸链中 NADH 和 FADH₂ 的电子经一系列递电子体（复合体Ⅰ～Ⅳ、CoQ、Cyt c）传递，最终传给氧，氧与质子结合生成水，同时释放能量驱动 ATP 合成。（教材依据：《生物化学与分子生物学》第10版 第五章 生物氧化（呼吸链：电子最终传给氧生成水））","others":"NAD⁺、FAD、Cyt c、CoQ 都是中间递电子体，不是最终受氢体。","trap":"「呼吸链终点 = 氧」。"},"x334":{"why":"ATP 合酶（复合体Ⅴ）利用呼吸链建立的质子电化学梯度，质子回流驱动 F₁ 部分旋转催化 ADP + Pi → ATP，是氧化磷酸化的关键酶。（教材依据：《生物化学与分子生物学》第10版 第五章 生物氧化：「ATP合酶又称复合体Ⅴ（complexⅤ），位于线粒体内膜上」）","others":"细胞色素氧化酶、NADH 脱氢酶、琥珀酸脱氢酶是呼吸链的复合体，不是 ATP 合成酶；腺苷酸激酶催化 ADP 互变。","trap":"「ATP 合酶 = 复合体Ⅴ = 分子马达」。"},"x335":{"why":"DNP 是解偶联剂，能携带质子穿过线粒体内膜，使质子不经过 ATP 合酶而直接漏回基质，破坏了质子梯度。结果电子传递（氧化）仍进行，但 ATP 不能合成，能量以热形式释放。（教材依据：《生物化学与分子生物学》第10版 第五章 生物氧化：「解偶联剂（uncoupler）可使氧化与磷酸化的偶联分离，电子可沿呼吸链正常传递，但建立的质子电化学梯度被破坏，不能驱动ATP合酶来合成ATP」）","others":"呼吸链抑制剂（如氰化物）阻断电子传递；ATP 合酶抑制剂（如寡霉素）阻断 ATP 合成；DNP 不是激活剂或促进剂。","trap":"「解偶联 = 氧化照常、ATP 停产、产热」。"},"x336":{"why":"白蛋白占血浆总蛋白的 50%～60%，由肝合成，维持血浆胶体渗透压，并运输脂肪酸、胆红素、药物、激素等；肝硬化时白蛋白合成减少，出现水肿和腹水。（教材依据：《生物化学与分子生物学》第10版 第二十五章 肝的生物化学（血浆蛋白：白蛋白含量最多））","others":"球蛋白参与免疫；纤维蛋白原参与凝血；载脂蛋白运输脂质；凝血酶原是凝血因子。","trap":"「白蛋白最多，肝合成，维持胶渗压」。"},"x337":{"why":"血红素在血红素加氧酶作用下生成胆绿素，再经胆绿素还原酶还原为胆红素（游离胆红素），这是血红素分解代谢的终产物；胆红素再经肝处理排泄。（教材依据：《生物化学与分子生物学》第10版 第二十六章 血液的生物化学（血红素分解生成胆红素））","others":"胆绿素是中间产物；尿胆原、粪胆原、胆素是肠道细菌作用后的产物。","trap":"「血红素 → 胆绿素 → 胆红素」。"},"x338":{"why":"肝生物转化通过氧化、还原、水解和结合反应（如葡萄糖醛酸结合），使脂溶性非营养物质极性增强、便于随胆汁或尿排出，起到解毒作用；但少数物质转化后毒性反而增强。（教材依据：《生物化学与分子生物学》第10版 第二十五章 肝的生物化学：「生物转化（biotransformation）相关的羟化反应」）","others":"合成蛋白质、合成尿素、储存糖原、分泌胆汁都是肝的其他功能，不是生物转化。","trap":"「生物转化 = 增极性 + 易排出」。"}},"CH":{"x1":"第二章 细胞的基本功能","x2":"第四章 血液循环","x3":"第八章 尿的生成和排出","x4":"第十章 神经系统的功能","x5":"第七章 糖代谢","x6":"第七章 糖代谢","x7":"第九章 氨基酸代谢","x8":"第八章 脂质代谢","x9":"第一章 细胞和组织的适应与损伤","x10":"第二章 损伤的修复","x11":"第三章 局部血液循环障碍","x12":"第三章 局部血液循环障碍","x13":"第二篇 第三章 慢性阻塞性肺疾病","x14":"第二篇 第四章 支气管哮喘","x15":"第三篇 第四章 冠心病","x16":"第三篇 高血压","x17":"第四篇 第五章 消化性溃疡","x18":"第四篇 第十五章 肝硬化","x19":"第五篇 第五节 肾病综合征","x20":"第七篇 第五章 甲状腺疾病","x21":"第七篇 第八章 糖尿病","x22":"第六篇 缺铁性贫血","x23":"第五章 休克","x24":"第一篇 水、电解质代谢紊乱","x25":"第四十章 阑尾疾病","x26":"乳腺癌","x27":"甲状腺手术并发症","x28":"骨折概述","x29":"胸部损伤","x30":"其他","x31":"第三篇 第四章 冠心病","x32":"第二篇 第四章 支气管哮喘","x33":"胆道疾病","x34":"甲状腺手术并发症","x35":"第八章 尿的生成和排出","x36":"第六章 肿瘤","x37":"第九章 氨基酸代谢","x38":"第七篇 第八章 糖尿病","x39":"第五章 呼吸","x40":"腹外疝","x41":"第二章 细胞的基本功能","x42":"第二章 细胞的基本功能","x43":"第二章 细胞的基本功能","x44":"第二章 细胞的基本功能","x45":"第三章 血液","x46":"第三章 血液","x47":"第四章 血液循环","x48":"第四章 血液循环","x49":"第四章 血液循环","x50":"第四章 血液循环","x51":"第四章 血液循环","x52":"第四章 血液循环","x53":"第五章 呼吸","x54":"第五章 呼吸","x55":"第五章 呼吸","x56":"第五章 呼吸","x57":"第六章 消化和吸收","x58":"第六章 消化和吸收","x59":"第六章 消化和吸收","x60":"第七章 能量代谢与体温","x61":"第八章 尿的生成和排出","x62":"第八章 尿的生成和排出","x63":"第八章 尿的生成和排出","x64":"第八章 尿的生成和排出","x65":"第十一章 内分泌","x66":"第十章 神经系统的功能","x67":"第一章 绪论","x68":"第十一章 内分泌","x69":"第十一章 内分泌","x70":"第十二章 生殖","x71":"第一章 细胞和组织的适应与损伤","x72":"第九章 心血管系统疾病","x73":"第三章 局部血液循环障碍","x74":"第三章 局部血液循环障碍","x75":"第十八章 传染病","x76":"第一章 细胞和组织的适应与损伤","x77":"第一章 细胞和组织的适应与损伤","x78":"第一章 细胞和组织的适应与损伤","x79":"第三章 局部血液循环障碍","x80":"第三章 局部血     return mseHTML();
  }

  /* ------------------------------------------------------------------- week */

  function weekHTML() {
    var day = D.WEEKDAYS[ui.dayIdx] || D.WEEKDAYS[0];
    var items = D.WEEKQ.filter(function (q) { return q.day === day.day; });
    var answered = items.filter(function (q) { return P.quiz[q.id] !== undefined; }).length;

    var days = D.WEEKDAYS.map(function (d, i) {
      return '<button class="tab' + (i === ui.dayIdx ? ' on' : '') + '" data-act="day" data-v="' + i + '">' +
        d.date + '</button>';
    }).join('');

    var cards = items.map(function (q) {
      var picked = P.quiz[q.id];
      var opts = q.o.map(function (text, i) {
        var cls = 'opt';
        if (picked !== undefined) {
          if (i === q.a) cls += ' correct';
          else if (i === picked) cls += ' wrong';
        }
        return '<button class="' + cls + '" data-act="pick" data-q="' + q.id + '" data-v="' + i + '">' +
          String.fromCharCode(65 + i) + '. ' + esc(text) + '</button>';
      }).join('');

      var cite = q.cite || (D.CITE && D.CITE[q.id]);
      var fb = '';
      if (picked !== undefined) {
        fb = '<div class="verdict ' + (picked === q.a ? 'ok' : 'bad') + '">' +
          (picked === q.a ? '答对' : '答错') + '</div>' +
          '<div class="ansline">答案：' + String.fromCharCode(65 + q.a) + '</div>' +
          '<div class="plain"><b>大白话</b><p>' + esc(q.plain) + '</p></div>' +
          '<div class="sec"><h4>为什么选它</h4><p>' + esc(q.why) + '</p></div>' +
          (cite
            ? '<div class="sec"><h4>教材原文 · ' + esc(cite.book + cite.ed + ' ' + cite.page) + '</h4>' +
              '<p class="quote">' + esc(cite.quote) + '</p></div>'
            : '') +
          '<div class="sec"><h4>其他选项错在哪</h4><p>' + esc(q.others) + '</p></div>' +
          '<div class="sec"><h4>陷阱与记法</h4><p>' + esc(q.trap) + '</p></div>';
      }

      return '<div class="card"><div class="meta"><span class="chip">' + esc(q.k) + '</span></div>' +
        '<p class="q">' + esc(q.q) + '</p>' + opts + fb + '</div>';
    }).join('');

    var keys = D.WEEKKEY[day.day] || [];
    var keysCard = '<div class="card"><div class="sec"><h4>今日必背（' + keys.length + ' 条）</h4></div>' +
      keys.map(function (line, i) {
        return '<p style="margin:0 0 6px">' + (i + 1) + '. ' + esc(line) + '</p>';
      }).join('') + '</div>';

    var kase = D.WEEKCASE[day.day];
    var caseCard = '';
    if (kase) {
      var open = !!P.caseRevealed[kase.id];
      caseCard = '<div class="card"><div class="sec"><h4>当天病例 · ' + esc(kase.dept) + '</h4></div>' +
        '<p class="stem">' + esc(kase.stem) + '</p>' +
        (open
          ? '<div class="sec"><h4>诊断</h4><p style="font-weight:600">' + esc(kase.dx.answer) + '</p>' +
            '<h4 style="margin-top:8px">推导</h4>' +
            kase.dx.why.map(function (l, i) { return '<p>' + (i + 1) + '. ' + esc(l) + '</p>'; }).join('') + '</div>' +
            pairBlock('鉴别 · 靠什么分开', kase.diff) +
            pairBlock('进一步检查 · 查它干什么', kase.exam) +
            pairBlock('治疗 · 分层与陷阱', kase.tx)
          : '') +
        '<div class="bar"><button class="btn primary" data-act="wcase" data-v="' + kase.id + '">' +
        (open ? '收起解析' : '看解析') + '</button></div></div>';
    }

    var asg = D.WEEKASSIGN[day.day] || { words: [], sents: [], vocab: [] };
    var tasks = [
      ['西综', items.length, D.WEEK_TARGET.xz, null],
      ['高频词', asg.words.length, D.WEEK_TARGET.words, ['en', 'words']],
      ['长难句', asg.sents.length, D.WEEK_TARGET.sents, ['en', 'sent']],
      ['词汇题', asg.vocab.length, D.WEEK_TARGET.vocab, ['en', 'quiz']],
      ['病例', kase ? 1 : 0, D.WEEK_TARGET.cases, ['case', null]],
    ];

    var board = '<div class="card"><div class="sec"><h4>今日任务板</h4></div>' +
      tasks.map(function (task, i) {
        var done = task[1] >= task[2];
        var btn = task[3]
          ? '<button class="btn ghost" data-act="tab" data-v="' + task[3][0] + '"' +
            (task[3][1] ? ' data-sub="' + task[3][1] + '"' : '') +
            (task[3][0] === 'en' ? ' data-day="' + ui.dayIdx + '"' : '') + '>去练 ›</button>'
          : '<span class="count">见下方</span>';
        return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0' +
          (i ? ';border-top:1px dashed var(--line)' : '') + '">' +
          '<span style="min-width:56px;font-weight:600">' + task[0] + '</span>' +
          '<span style="color:' + (done ? 'var(--ok)' : 'var(--fg-2)') + ';font-variant-numeric:tabular-nums">' +
          task[1] + ' / ' + task[2] + '</span>' +
          '<span style="flex:1 1 auto"></span>' + btn + '</div>';
      }).join('') +
      '<p class="hint" style="margin:8px 0 0">未满的格子在补内容，补齐后这一页会自动填满。</p></div>';

    return '<div class="bar" style="margin:0 0 10px">' + days + '</div>' +
      '<div class="card"><div class="sec"><h4>' + day.label + '｜' + esc(day.theme) + '</h4></div>' +
      '<p class="hint" style="margin:0">题 ' + answered + ' / ' + items.length + '｜必背 ' + keys.length + ' 条｜病例 1 例</p></div>' +
      board + keysCard + cards + caseCard;
  }

  /* ------------------------------------------------------------------- plan */

  function planHTML() {
    var t = today();
    var left = daysBetween(t, EXAM);
    var wk = currentWeek(t);
    if (!wk) {
      return '<div class="card"><div class="big">D-' + left + '</div><p class="hint">' +
        (t < D.WEEKS[0].s ? '计划 10/21 开始。' : '计划已走完，按考试节奏调整作息。') + '</p></div>';
    }
    var ticks = P.plan[t] || {};
    var done = D.TASK_KEYS.reduce(function (n, k) { return n + (ticks[k] ? 1 : 0); }, 0);
    var labels = { main: '西综主线', sub: '西综副线', eng: '英语', pol: '政治' };
    var rows = D.TASK_KEYS.map(function (k) {
      var on = !!ticks[k];
      return '<button class="row" data-act="plan" data-v="' + k + '">' +
        '<span class="box' + (on ? ' on' : '') + '">✓</span>' +
        '<span class="name">' + labels[k] + '</span>' +
        '<span class="ask">' + esc(wk[k]) + '</span></button>';
    }).join('');

    var n = Math.floor((Date.parse(t + 'T00:00:00') - Date.parse(START + 'T00:00:00')) / 86400000);
    var base = wrap(n * 2, D.DAILY.length);
    var daily = [base, (base + 1) % D.DAILY.length].map(function (di, i) {
      var item = D.DAILY[di];
      var key = t + '#' + i;
      var open = !!P.daily[key];
      var tip = D.EXPAND['d' + di];
      return '<div style="margin-bottom:14px">' +
        '<p class="q" style="font-size:15.5px">' + (i + 1) + '. ' + esc(item.q) + '</p>' +
        (open
          ? '<p style="margin:0 0 4px">' + esc(item.a) + '</p>' +
            (tip ? '<p class="hint" style="margin:0">解析：' + esc(tip.why) + '</p>' : '') +
            '<p class="hint" style="margin:0">出处：' + esc(item.s) + '</p>'
          : '<button class="btn" data-act="daily" data-v="' + key + '">看答案</button>') +
        '</div>';
    }).join('');

    return '<div class="card"><div class="big">D-' + left + '</div>' +
      '<div class="kv"><span class="k">距初试</span><span class="v">' + t + '｜' + wk.id + '</span></div>' +
      '<div class="kv"><span class="k">主线</span><span class="v">' + esc(wk.main) + '</span></div>' +
      '<div class="kv"><span class="k">副线</span><span class="v">' + esc(wk.sub) + '</span></div></div>' +
      '<div class="card"><div class="sec"><h4>今天四件事（' + done + '/4）</h4></div>' + rows + '</div>' +
      '<div class="card"><div class="sec"><h4>本周节点</h4></div><p style="margin:0">' + esc(wk.node) + '</p></div>' +
      '<div class="card"><div class="sec"><h4>今日两题 · 教材偏难怪</h4></div>' + daily + '</div>' +
      '<div class="bar"><button class="btn ghost" data-act="reset">清空全部进度</button></div>' +
      '<p class="foot">数据只存在这台设备的浏览器里，不上传。</p>';
  }

  /* ------------------------------------------------------------------ quiz */

  function fmtWhy(text) {
    var html = esc(text);
    html = html.replace(/（教材依据：([\s\S]*?)）/g, '<span class="cite">（教材依据：$1）</span>');
    html = html.replace(/「([^」]*)」/g, '<span class="quote">「$1」</span>');
    return html;
  }

  function quizHTML(items, idx, key, onlyReal) {
    var base = items;
    if (ui.xfK && ui.xfK !== '全部') base = base.filter(function (q) { return q.k === ui.xfK; });
    if (ui.xfCh && ui.xfCh !== '全部') base = base.filter(function (q) { return (D.CH[q.id] || '其他') === ui.xfCh; });
    var pool = onlyReal ? base.filter(function (q) { return !!q.src; }) : base;
    if (!pool.length) pool = base.length ? base : items;
    var xfBar = '<div class="bar" style="margin:0 0 6px;flex-wrap:wrap">' +
      ['全部','生理','病理','内科','外科','生化','人文'].map(function (k) {
        return '<button class="tab' + ((ui.xfK || '全部') === k ? ' on' : '') + '" data-act="xf" data-v="' + k + '">' + k + '</button>';
      }).join('') + '</div>';
    if (ui.xfK && ui.xfK !== '全部' && base.length) {
      var chs = ['全部'];
      base.forEach(function (q) { var c = D.CH[q.id] || '其他'; if (chs.indexOf(c) < 0) chs.push(c); });
      xfBar += '<div class="bar" style="margin:0 0 10px;flex-wrap:wrap">' +
        chs.map(function (c) {
          return '<button class="tab' + ((ui.xfCh || '全部') === c ? ' on' : '') + '" data-act="xfc" data-v="' + c + '">' + (c === '全部' ? '全部章节' : c) + '</button>';
        }).join('') + '</div>';
    }
    var cur = pool[wrap(idx, pool.length)];
    var picked = P.quiz[cur.id];
    var hasReal = items.some(function (q) { return !!q.src; });
    var realTotal = items.filter(function (q) { return !!q.src; }).length;
    var answered = items.filter(function (q) { return P.quiz[q.id] !== undefined; }).length;
    var right = items.filter(function (q) { return P.quiz[q.id] === q.a; }).length;

    var opts = cur.o.map(function (text, i) {
      var cls = 'opt';
      if (picked !== undefined) {
        if (i === cur.a) cls += ' correct';
        else if (i === picked) cls += ' wrong';
      }
      return '<button class="' + cls + '" data-act="pick" data-q="' + cur.id + '" data-v="' + i + '">' +
        String.fromCharCode(65 + i) + '. ' + esc(text) + '</button>';
    }).join('');

    var fb = '';
    if (picked !== undefined) {
      var ex = D.EXPAND[cur.id];
      var plain = D.PLAIN[cur.id];
      fb = '<div class="verdict ' + (picked === cur.a ? 'ok' : 'bad') + '">' +
        (picked === cur.a ? '答对' : '答错') + '</div>' +
        '<div class="ansline">答案：' + String.fromCharCode(65 + cur.a) + '</div>' +
        (plain ? '<div class="plain"><b>大白话</b><p>' + esc(plain) + '</p></div>' : '') +
        (ex
          ? '<div class="sec"><h4>为什么选它</h4><p>' + fmtWhy(ex.why) + '</p></div>' +
            (ex.others ? '<div class="sec"><h4>其他选项错在哪</h4><p>' + esc(ex.others) + '</p></div>' : '') +
            (ex.trap ? '<div class="sec"><h4>陷阱与记法</h4><p>' + esc(ex.trap) + '</p></div>' : '')
          : '<div class="sec"><p>' + esc(cur.e) + '</p></div>');
    }

    var filter = hasReal
      ? '<div class="bar" style="margin:0 0 10px">' +
        '<button class="tab' + (!onlyReal ? ' on' : '') + '" data-act="filter" data-v="0">全部 ' + answered + '/' + items.length + '</button>' +
        '<button class="tab' + (onlyReal ? ' on' : '') + '" data-act="filter" data-v="1">只看还原 ' + realTotal + '</button></div>'
      : '';

    return xfBar + '<p class="hint">共 ' + pool.length + ' 题，考点还原 ' + realTotal + ' 题（' +
      Math.round(realTotal / items.length * 100) + '%），已答 ' + answered + '，对 ' + right + '</p>' + filter +
      '<div class="card"><div class="meta"><span class="chip">' + esc(cur.k) + '</span>' +
      (cur.src ? '<span class="badge">考点还原</span>' : '') + '</div>' +
      '<p class="q">' + esc(cur.q) + '</p>' + opts + fb + '</div>' +
      '<div class="bar">' +
      '<button class="btn" data-act="' + key + ':prev">上一题</button>' +
      '<button class="btn" data-act="' + key + ':next">下一题</button>' +
      '<span class="grow"></span><span class="count">' + (wrap(idx, pool.length) + 1) + ' / ' + pool.length + '</span></div>';
  }

  function xzHTML() { return quizHTML(D.XZ, ui.xzIdx, 'xz', ui.xzReal); }

  /* --------------------------------------------------------------- english */

  function engAssign() {
    if (ui.focusDay === null || ui.focusDay === undefined) return null;
    var day = D.WEEKDAYS[ui.focusDay];
    if (!day) return null;
    return { day: day, a: D.WEEKASSIGN[day.day] || { words: [], sents: [], vocab: [] } };
  }
  function engWords() {
    var e = engAssign();
    return e ? e.a.words.map(function (i) { return D.WORDS[i]; }) : D.WORDS;
  }
  function engSents() {
    var e = engAssign();
    return e ? e.a.sents.map(function (i) { return D.SENTS[i]; }) : D.SENTS;
  }
  function engVocab() {
    var e = engAssign();
    return e ? D.ENQ.filter(function (q) { return e.a.vocab.indexOf(q.id) !== -1; }) : D.ENQ;
  }

  function enHTML() {
    var e = engAssign();
    var head = e
      ? '<div class="card"><div class="sec"><h4>' + e.day.label + '｜' + e.day.date + '｜' + esc(e.day.theme) + '</h4></div>' +
        '<p class="hint" style="margin:0">词 ' + e.a.words.length + '/' + D.WEEK_TARGET.words +
        '｜句 ' + e.a.sents.length + '/' + D.WEEK_TARGET.sents +
        '｜题 ' + e.a.vocab.length + '/' + D.WEEK_TARGET.vocab + '</p>' +
        '<div class="bar" style="margin:8px 0 0"><button class="btn ghost" data-act="alleng">看全部（不分天）</button></div></div>'
      : '';

    var sub = '<div class="bar" style="margin:0 0 10px">' +
      ['words', 'sent', 'quiz'].map(function (s) {
        var label = {
          words: '高频词 ' + engWords().length,
          sent: '长难句 ' + engSents().length,
          quiz: '词汇题 ' + engVocab().length,
        }[s];
        return '<button class="tab' + (ui.sub === s ? ' on' : '') + '" data-act="sub" data-v="' + s + '">' + label + '</button>';
      }).join('') + '</div>';

    return head + sub +
      (ui.sub === 'words' ? wordsHTML() : ui.sub === 'sent' ? sentHTML() : quizSectionHTML());
  }

  function quizSectionHTML() {
    var list = engVocab();
    if (!list.length) return blankCard('这一天的词汇题还没排（目标 ' + D.WEEK_TARGET.vocab + ' 道）。');
    return quizHTML(list, ui.enIdx, 'en', false);
  }

  function blankCard(text) {
    return '<div class="card"><p class="hint" style="margin:0">' + text + '</p></div>';
  }

  function wordsHTML() {
    var list = engWords();
    if (!list.length) return blankCard('这一天的词还没排（目标 ' + D.WEEK_TARGET.words + ' 个）。补内容后自动出现。');
    var w = list[wrap(ui.wi, list.length)];
    var open = !!P.word[w[0]];
    return '<p class="hint">点一下翻面，看音标、释义和常用搭配。</p>' +
      '<div class="card flipcard" data-act="flip" data-v="' + esc(w[0]) + '">' +
      '<div class="wordline"><span class="word">' + esc(w[0]) + '</span>' +
      '<button class="btn ghost" data-act="speak" data-v="' + esc(w[0]) + '">🔊 发音</button></div>' +
      (open
        ? '<div class="ipa">' + esc(w[1]) + '</div><div class="zh">' + esc(w[2]) + '</div>' +
          '<div class="colloc"><b>常用搭配</b>' + esc(w[3]) + '</div>'
        : '<p class="hint" style="margin:8px 0 0">点击卡片翻面</p>') +
      '</div>' +
      '<div class="bar"><button class="btn" data-act="word:prev">上一词</button>' +
      '<button class="btn" data-act="word:next">下一词</button>' +
      '<span class="grow"></span><span class="count">' + (wrap(ui.wi, list.length) + 1) + ' / ' + list.length + '</span></div>';
  }

  function sentHTML() {
    var list = engSents();
    if (!list.length) return blankCard('这一天的长难句还没排（目标 ' + D.WEEK_TARGET.sents + ' 句）。');
    var s = list[wrap(ui.si, list.length)];
    var open = !!P.quiz['s' + ui.si];
    return '<p class="hint">先自己找主谓宾，再看拆解。</p>' +
      '<div class="card"><p class="stem">' + esc(s[0]) + '</p>' +
      (open ? '<div class="sec"><h4>主干</h4><p>' + esc(s[1]) + '</p></div>' +
        '<div class="sec"><h4>难点</h4><p>' + esc(s[2]) + '</p></div>' : '') + '</div>' +
      '<div class="bar"><button class="btn" data-act="sent:reveal">' + (open ? '收起' : '看解析') + '</button>' +
      '<button class="btn" data-act="sent:prev">上一句</button>' +
      '<button class="btn" data-act="sent:next">下一句</button>' +
      '<span class="grow"></span><span class="count">' + (wrap(ui.si, list.length) + 1) + ' / ' + list.length + '</span></div>';
  }

  /* ------------------------------------------------------------------ case */

  function caseList() {
    var all = D.CASES;
    if (ui.caseDept && ui.caseDept !== '全部') {
      var f = all.filter(function (c) { return c.dept === ui.caseDept; });
      if (f.length) return f;
    }
    return all;
  }

  function caseHTML() {
    var all = D.CASES;
    var list = caseList();
    var depts = ['全部'];
    all.forEach(function (c) { if (depts.indexOf(c.dept) < 0) depts.push(c.dept); });
    var deptBar = '<div class="bar" style="margin:0 0 10px;flex-wrap:wrap">' + depts.map(function (d) {
      return '<button class="tab' + ((ui.caseDept || '全部') === d ? ' on' : '') + '" data-act="cdept" data-v="' + d + '">' + d + '</button>';
    }).join('') + '</div>';
    var i = wrap(P.caseIdx, list.length);
    var c = list[i];
    var open = !!P.caseRevealed[c.id];
    var body = '';
    if (open) {
      body = '<div class="sec"><h4>诊断</h4><p style="font-weight:600">' + esc(c.dx.answer) + '</p>' +
        '<h4 style="margin-top:8px">推导</h4>' +
        c.dx.why.map(function (line, k) { return '<p>' + (k + 1) + '. ' + esc(line) + '</p>'; }).join('') + '</div>' +
        pairBlock('鉴别 · 靠什么分开', c.diff) +
        pairBlock('进一步检查 · 查它干什么', c.exam) +
        pairBlock('治疗 · 分层与陷阱', c.tx);
    }
    return deptBar + '<div class="card"><div class="meta"><span class="chip">' + esc(c.dept) + '</span></div>' +
      '<p class="stem">' + esc(c.stem) + '</p>' + body + '</div>' +
      '<div class="bar"><button class="btn primary" data-act="case:reveal">' + (open ? '收起解析' : '看解析') + '</button>' +
      '<button class="btn" data-act="case:prev">上一题</button>' +
      '<button class="btn" data-act="case:next">下一题</button>' +
      '<span class="grow"></span><span class="count">' + (i + 1) + ' / ' + list.length + '</span></div>';
  }

  function pairBlock(title, items) {
    return '<div class="sec"><h4>' + title + '</h4>' + items.map(function (p) {
      return '<p style="margin:0 0 6px"><b>' + esc(p[0]) + '</b> —— ' + esc(p[1]) + '</p>';
    }).join('') + '</div>';
  }

  /* ------------------------------------------------------------------- mse */

  function mseHTML() {
    var done = D.MSE.filter(function (m) { return P.mse[m.id]; }).length;
    var rows = D.MSE.map(function (m) {
      var on = !!P.mse[m.id];
      return '<button class="row" data-act="mse" data-v="' + m.id + '">' +
        '<span class="box' + (on ? ' on' : '') + '">✓</span>' +
        '<span class="name">' + esc(m.name) + '</span>' +
        '<span class="ask">' + esc(m.ask) + '</span></button>';
    }).join('');
    return '<p class="hint">打勾之前，先在床边把对应那句问一遍。</p>' +
      '<div class="card">' + rows + '</div>' +
      '<div class="bar"><span class="count">' + done + ' / ' + D.MSE.length + '</span></div>';
  }

  /* ---------------------------------------------------------------- events */

  document.addEventListener('click', function (event) {
    var node = event.target.closest('[data-act]');
    if (!node) return;
    var act = node.getAttribute('data-act');
    var v = node.getAttribute('data-v');
    var i;

    if (act === 'cdept') { ui.caseDept = v; P.caseIdx = 0; save(); return render(); }
    if (act === 'xf') { ui.xfK = v; ui.xfCh = '全部'; return render(); }
    if (act === 'xfc') { ui.xfCh = v; return render(); }
    if (act === 'tab') {
      if (node.getAttribute('data-sub')) ui.sub = node.getAttribute('data-sub');
      var dayAttr = node.getAttribute('data-day');
      ui.focusDay = dayAttr === null ? null : Number(dayAttr);
      ui.tab = v;
      window.scrollTo(0, 0);
      return render();
    }
    if (act === 'alleng') { ui.focusDay = null; return render(); }
    if (act === 'day') { ui.dayIdx = Number(v); window.scrollTo(0, 0); return render(); }
    if (act === 'wcase') { P.caseRevealed[v] = !P.caseRevealed[v]; save(); return render(); }
    if (act === 'sub') { ui.sub = v; return render(); }

    if (act === 'plan') {
      var t = today();
      var day = Object.assign({}, P.plan[t] || {});
      day[v] = !day[v];
      P.plan[t] = day;
      save(); return render();
    }
    if (act === 'daily') { P.daily[v] = !P.daily[v]; save(); return render(); }

    if (act === 'pick') {
      var qid = node.getAttribute('data-q');
      if (P.quiz[qid] !== undefined) return;
      P.quiz[qid] = Number(v);
      save(); return render();
    }
    if (act === 'filter') { ui.xzReal = v === '1'; ui.xzIdx = 0; return render(); }

    if (act === 'xz:prev') { ui.xzIdx -= 1; return render(); }
    if (act === 'xz:next') { ui.xzIdx += 1; return render(); }
    if (act === 'en:prev') { ui.enIdx -= 1; return render(); }
    if (act === 'en:next') { ui.enIdx += 1; return render(); }

    if (act === 'flip') { P.word[v] = !P.word[v]; save(); return render(); }
    if (act === 'speak') { speak(v); return; }
    if (act === 'word:prev') { ui.wi -= 1; ui.sub = 'words'; return render(); }
    if (act === 'word:next') { ui.wi += 1; ui.sub = 'words'; return render(); }

    if (act === 'sent:reveal') { P.quiz['s' + ui.si] = !P.quiz['s' + ui.si]; save(); return render(); }
    if (act === 'sent:prev') { ui.si -= 1; return render(); }
    if (act === 'sent:next') { ui.si += 1; return render(); }

    if (act === 'case:reveal') {
      var cl = caseList();
      var c = cl[wrap(P.caseIdx, cl.length)];
      P.caseRevealed[c.id] = !P.caseRevealed[c.id];
      save(); return render();
    }
    if (act === 'case:prev') { P.caseIdx = wrap(P.caseIdx - 1, caseList().length); save(); return render(); }
    if (act === 'case:next') { P.caseIdx = wrap(P.caseIdx + 1, caseList().length); save(); return render(); }

    if (act === 'mse') { P.mse[v] = !P.mse[v]; save(); return render(); }

    if (act === 'reset') {
      if (window.confirm('清空全部进度？')) { P = blank(); save(); render(); }
      return;
    }
  });

  render();
})();

</script>
